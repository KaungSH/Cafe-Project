<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Register - Luft Cafe</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome (Icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --coffee-dark: #1b0b05;
  --coffee-deep: #2b1209;
  --coffee: #5a2d19;
  --coffee-mid: #7b4425;
  --caramel: #e59a55;
  --cream: #fff1e3;
  --muted: #dbc4b3;
}
* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {

font-family: 'Poppins', sans-serif;

margin: 0;

min-height: 100vh;

display: flex;

align-items: center;

/* ညာဘက်သို့ ပို့ရန် justify-content ကို flex-end သို့ပြောင်းပြီး margin ချိန်ပါ */

justify-content: flex-end;

padding: 34px 60px; /* ညာဘက်မှ ကွာဟချက်ကို ချိန်ညှိရန် */

overflow-x: hidden;

color: var(--cream);

background:

linear-gradient(180deg, rgba(10,5,3,.42), rgba(10,5,3,.74)),

url('/images/Open.png') no-repeat center center fixed;

background-size: cover;

}

.register-glass-card {
  width: 100%;
  max-width: 500px;
  /* နောက်ခံအရောင်ကို လုံးဝအကြည် (သို့မဟုတ်) အလွန်ဖျော့သော အကြည်ရောင်သို့ ပြောင်းခြင်း */
  background: rgba(27, 11, 5, 0.25); 
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(229, 154, 85, 0.3);
  border-radius: 24px;
  padding: 35px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
  color: var(--cream);
  /* ညာဘက်သို့ အနည်းငယ်ပိုရောက်စေရန် margin-right ထည့်ပေးနိုင်သည် */
  margin-right: 40px; 
}
.register-logo-icon {
  width: 65px;
  height: 65px;
  background: radial-gradient(circle, var(--coffee) 0%, var(--coffee-deep) 100%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 15px auto;
  font-size: 26px;
  color: var(--cream);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  border: 2px solid rgba(229, 154, 85, 0.3);
}

.register-title {
  text-align: center;
  font-weight: 700;
  font-size: 26px;
  margin-bottom: 5px;
  color: var(--cream);
}

.register-subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 25px;
}

.register-info-group {
  background: rgba(255, 241, 227, 0.04);
  border: 1px solid rgba(229, 154, 85, 0.15);
  border-radius: 12px;
  padding: 12px 18px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.register-info-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.register-info-value {
  font-size: 14px;
  color: var(--cream);
  font-weight: 600;
}

.btn-caramel-custom {
  width: 100%;
  background: var(--caramel);
  border: none;
  padding: 12px;
  border-radius: 12px;
  color: var(--coffee-dark);
  font-weight: 700;
  font-size: 15px;
  transition: all 0.3s ease;
  margin-top: 15px;
  box-shadow: 0 4px 15px rgba(229, 154, 85, 0.3);
}

.btn-caramel-custom:hover {
  background: #f0a762;
  color: var(--coffee-deep);
}
</style>
</head>

<body>

    <div class="register-glass-card">
        <!-- Logo Icon -->
        <div class="register-logo-icon">
            <i class="fa-solid fa-cash-register"></i>
        </div>

        <h3 class="register-title">Open Daily Register</h3>
        <p class="register-subtitle">Manage your daily shift and operations securely</p>

        <form th:action="@{/openshift}" th:object="${registerDto}" method="post" novalidate>
            
            <!-- Branch -->
            <div class="register-info-group">
                <span class="register-info-label"><i class="fa-solid fa-store me-2"></i>Branch</span>
                <span class="register-info-value" th:text="${branch}">Branch Name</span>
                <input type="hidden" th:field="*{branch_id}">
            </div>

            <!-- Employee -->
            <div class="register-info-group">
                <span class="register-info-label"><i class="fa-solid fa-user-tie me-2"></i>Employee</span>
                <span class="register-info-value" th:text="${employee}">Employee Name</span>
                <input type="hidden" th:field="*{employee_id}">
            </div>

            <!-- Status -->
            <div class="register-info-group">
                <span class="register-info-label"><i class="fa-solid fa-circle-info me-2"></i>Status</span>
                <span class="register-info-value text-warning" th:text="${status}">Status Name</span>
                <input type="hidden" th:field="*{register_status_id}">
            </div>

            <!-- Date -->
            <div class="register-info-group">
                <span class="register-info-label"><i class="fa-solid fa-calendar-days me-2"></i>Date</span>
                <span class="register-info-value" th:text="${registerDto.date}">Date</span>
                <input type="hidden" th:field="*{date}">
            </div>

            <!-- Open Time -->
            <div class="register-info-group">
                <span class="register-info-label"><i class="fa-solid fa-clock me-2"></i>Open time</span>
                <span class="register-info-value" th:text="${registerDto.opened_at}">Time</span>
                <input type="hidden" th:field="*{opened_at}">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-caramel-custom">
                <i class="fa-solid fa-floppy-disk me-2"></i>Save Register And Start Shift
            </button>

        </form>
    </div>

</body>
</html>
