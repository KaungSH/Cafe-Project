<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Registers - Luft Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #5C3D2E;
      --accent-warm: #E0A96D;
      --bg-main: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-color: #2D2422;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-color);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .main-card {
      background-color: var(--card-bg);
      border: 1px solid #EAE3DC;
      border-radius: 12px;
      padding: 32px 40px;
      box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
      margin-top: 30px;
    }

    .btn-create {
      background-color: var(--primary-color);
      color: #FFF;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 18px;
      text-decoration: none;
    }

    .btn-create:hover {
      background-color: #4A3024;
      color: #FFF;
    }

    /* ================= Restore & Delete Buttons Style (From Categories) ================= */
    .action-pill-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .btn-pill-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 86px;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    /* Restore Pill Button (Matching Edit Pill Style) */
    .btn-pill-edit {
      background-color: #FBF6EE;
      color: #8C5332 !important;
      border: 1px solid #E8D9C8;
    }

    .btn-pill-edit:hover {
      background-color: #F2E7D5;
      color: #5C3218 !important;
      border-color: #D9C3A8;
    }

    /* Delete Pill Button */
    .btn-pill-delete {
      background-color: #FFF5F4;
      color: #A3281D !important;
      border: 1px solid transparent;
    }

    .btn-pill-delete:hover {
      background-color: #FFE6E4;
      color: #7A1910 !important;
    }

    .btn-pill-action i {
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

<div layout:fragment="content">
  <div class="main-card">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold" style="color: var(--primary-color);">
        <i class="fa-solid fa-list me-2"></i>Daily Register Bin
      </h3>
      <a th:href="@{/manager-only/daily-registers/timedHardDelete}" class="btn btn-create" onclick="return confirm('This will permanently delete registers that are more than 60 days old.');">
        <i class="fa-solid fa-trash me-1"></i> Clear Old Registers
      </a>
      <a th:href="@{/manager-only/daily-registers/all}" class="btn btn-create">
        <i class="fa-solid fa-plus me-1"></i> Go Back to Normal List
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle border">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Branch</th>
            <th>Employee</th>
            <th>Status</th>
            <th>Open time</th>
            <th>Closed time</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reg : ${registers}">
            <td th:text="${reg.date}">2026-09-16</td>
            <td th:text="${reg.branch_name}">Main Branch</td>
            <td th:text="${reg.employee_name}">John Doe</td>
            <td>
              <span class="badge bg-secondary" th:text="${reg.status_name}">Open</span>
            </td>
            <td th:text="${reg.opened_at}">08:00:00</td>
            <td th:text="${reg.status_name == 'CLOSED' ? reg.closed_at : 'Not Closed Yet'}">17:00:00</td>
            <td class="text-end">
              <div class="action-pill-group">
                <a th:href="@{/manager-only/daily-registers/recover/{register_id}(register_id=${reg.register_id})}" 
                   class="btn-pill-action btn-pill-edit"
                   onclick="return confirm('Are you sure you want to recover this record?');">
                  <i class="fa-solid fa-rotate-left"></i> Restore
                </a>
                
                <a th:href="@{/manager-only/daily-registers/hardDelete/{register_id}(register_id=${reg.register_id})}" 
                   class="btn-pill-action btn-pill-delete"
                   onclick="return confirm('Are you sure you want to delete this record?');">
                  <i class="fa-solid fa-trash-can"></i> Delete
                </a>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(registers)}">
            <td colspan="7" class="text-center text-muted py-4">No daily register records found.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

</body>
</html>
