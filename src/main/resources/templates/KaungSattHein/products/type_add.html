<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Post - BlogApp</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>

        #coverPreview {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<div layout:fragment = "content">
<div class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card shadow-sm">
                
                    <div class="card-header bg-secondary text-white">
                        <h2 class="mb-0">Add Product Type</h2>
                    </div>

                    <div class="card-body p-4">

                        <form method="post" th:action="@{/manager/products/type/add}" th:object="${product_type}" enctype="multipart/form-data">

                            <!-- Name -->
                            <div class="mb-4">
                                <label for="name" class="form-label fw-semibold">
                                    Name
                                </label>
                                <input type="text" id="name" class="form-control" th:field="*{name}" placeholder="Enter Product Type Name" required>
                            </div>


                            <!-- Description -->
                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">
                                    Description
                                </label>
                                <textarea id="description" class="form-control" th:field="*{description}" rows="8"  placeholder="Write your description here..."></textarea>
                            </div>


                            <!-- Cover Image -->
                            <div class="mb-4">

                                <label for="coverImg" class="form-label fw-semibold">
                                    Cover Image
                                </label>
                                
                                <input type="file" id="coverImg" name="coverImgPart" class="form-control" accept="image/*">
                                <div class="form-text">
                                    Select an image to use as the cover of your post.
                                </div>

                                <div class="mt-3">
                                    <img id="coverPreview" class="img-fluid" style="display: none;" alt="Cover image Error">
                                </div>

                            </div>


                            <!-- Category -->
                            <div class="mb-4">

                                <label for="category" class="form-label fw-semibold">
                                    Category
                                </label>

                                <select id="category" class="form-select" th:field="*{category_id}">
                                    <option value="0" disabled>
                                        --- Select One ---
                                    </option>
                                    <option th:each="c : ${categories}" th:value="${c.category_id}" th:text="${c.name}"></option>
                                </select>
                            </div>



                            <!-- Price -->
							<div class="mb-4">

							    <label for="priceDisplay" class="form-label fw-semibold">
							        Default Price
							    </label>

							    <!-- What the user sees -->
							    <input type="text"
							           id="priceDisplay"
							           class="form-control"
							           placeholder="Enter Default Price"
							           required>
							
							    <!-- What Spring receives -->
							    <input type="hidden"
							           id="price"
							           th:field="*{price}">
							
							</div>


                            <!-- Buttons -->
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">

                                <a th:href="@{/}" class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                                <button type="submit"
                                        class="btn btn-secondary">
                                    Create Product Type
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap JavaScript -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>


    <!-- Image Preview -->
    <script>
        document.getElementById("coverImg").addEventListener("change", function(event) {

            const file = event.target.files[0];
            const preview = document.getElementById("coverPreview");

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        });
    </script>
    <script>
    const priceDisplay = document.getElementById("priceDisplay");
    const price = document.getElementById("price");

    priceDisplay.addEventListener("input", function () {

        // Remove everything except numbers and decimal point
        let value = this.value.replace(/[^0-9.]/g, "");

        // Prevent multiple decimal points
        const parts = value.split(".");
        if (parts.length > 2) {
            value = parts[0] + "." + parts.slice(1).join("");
        }

        // Update what the user sees
        if (value) {
            const number = parseFloat(value);

            this.value = number.toLocaleString("en-US");

            // Update the hidden field with the raw number
            price.value = number.toFixed(2);
        } else {
            this.value = "";
            price.value = "";
        }
    });
</script>

</div>
</div>
</html>
