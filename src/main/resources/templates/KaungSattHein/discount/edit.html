 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Discount</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-warning text-dark py-3">
                    <h5 class="card-title mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Discount Details</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/manager/discounts/save}" th:object="${discountForm}" method="post">
                        
                        
                        <input type="hidden" th:field="*{discount_id}">
                        <input type="hidden" th:field="*{employee_id}">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label fw-bold">Discount Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" id="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="discountValue" class="form-label fw-bold">Discount Value <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" th:field="*{discount_value}" class="form-control" id="discount_value" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                          
                            <div class="col-md-6">
                                <label for="promo_type_id" class="form-label fw-bold">Promo Type <span class="text-danger">*</span></label>
                                <select th:field="*{promo_type_id}" class="form-select" id="promo_type_id" required>
                                    <option th:each="promo : ${promoTypes}" 
                                            th:value="${promo.id}" 
                                            th:text="${promo.typeName}"
                                            th:selected="${promo.id == discountForm.promo_type_id}">Percentage</option>
                                </select>
                            </div>

                            <
                            <div class="col-md-6">
                                <label for="audience_type_id" class="form-label fw-bold">Audience Type <span class="text-danger">*</span></label>
                                <select th:field="*{audience_type_id}" class="form-select" id="audience_type_id" required>
                                    <option th:each="audience : ${audienceTypes}" 
                                            th:value="${audience.id}" 
                                            th:text="${audience.typeName}"
                                            th:selected="${audience.id == discountForm.audience_type_id}">All Customers</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="startdate" class="form-label fw-bold">Start Date <span class="text-danger">*</span></label>
                                <input type="date" th:field="*{startdate}" class="form-control" id="startdate" required>
                            </div>
                            <div class="col-md-6">
                             <label for="enddate" class="form-label fw-bold">End Date <span class="text-danger">*</span></label>
                                <input type="date" th:field="*{enddate}" class="form-control" id="enddate" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Description</label>
                            <textarea th:field="*{description}" class="form-control" id="description" rows="3"></textarea>
                        </div>

                        <div class="mb-4 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="is_active" th:field="*{is_active}" th:value="1" th:checked="${discountForm.is_active == 1}">
                            <label class="form-check-label fw-bold" for="is_active">Active Promotion Status</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/manager/discounts}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning fw-bold"><i class="bi bi-arrow-repeat me-1"></i> Update Discount</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
