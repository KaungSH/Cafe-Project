<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Order</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f8f9fa;
}

.container {
	max-width: 1200px;
}

.card {
	border-radius: 8px;
}

.card-header {
	font-size: 22px;
	font-weight: bold;
}

.form-label {
	font-weight: 500;
}

.table th, .table td {
	vertical-align: middle;
}
</style>

</head>


<body>


	<div class="container mt-5 mb-5">

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h1>Edit Order</h1>

			<a th:href="@{/order-with-details}" class="btn btn-secondary">

				Back </a>

		</div>

		<form th:action="@{/order-with-details/update}" method="post">

			<input type="hidden" name="order_id" th:value="${order.order_id}">

			<div class="card shadow-sm mb-4">


				<div class="card-header bg-primary text-white">Order
					Information</div>


				<div class="card-body">

					<div class="row">


						<div class="col-md-6 mb-3">

							<label class="form-label"> Order ID </label> <input type="text"
								class="form-control" th:value="${order.order_id}" readonly>

						</div>

						<div class="col-md-6 mb-3">

							<label class="form-label"> Employee </label> <input type="text"
								class="form-control" th:value="${order.employee_name}" readonly>

						</div>

						<div class="col-md-6 mb-3">

							<label class="form-label"> Branch </label> <input type="text"
								class="form-control" th:value="${order.branch_name}" readonly>

						</div>

						<div class="col-md-6 mb-3">

							<label class="form-label"> Received Time </label> <input
								type="datetime-local" name="received_time" class="form-control"
								th:value="${order.received_time != null ? #temporals.format(order.received_time, 'yyyy-MM-dd''T''HH:mm') : ''}">

						</div>

						<div class="col-md-6 mb-3">

							<label class="form-label"> Total Amount </label> <input
								type="number" name="total_amount" class="form-control"
								step="0.01" min="0" th:value="${order.total_amount}">

						</div>

						<div class="col-md-6 mb-3">

							<label class="form-label"> Token Number </label> <input
								type="number" name="token_number" class="form-control"
								th:value="${order.token_number}">

						</div>


					</div>

				</div>

			</div>


			<div class="card shadow-sm mb-4">


				<div class="card-header bg-success text-white">Order Details</div>


				<div class="card-body">


					<div class="table-responsive">


						<table class="table table-bordered">

							<thead class="table-light">

								<tr>

									<th style="width: 5%;">No.</th>

									<th style="width: 30%;">Product</th>

									<th style="width: 20%;">Quantity</th>

									<th style="width: 30%;">Remark</th>

									<th style="width: 15%;">Action</th>

								</tr>

							</thead>

							<tbody id="orderDetailsTable">

								<tr th:each="detail, stat : ${orderDetailsDto.orderDetails}">

									<td class="text-center"><span th:text="${stat.count}">
											1 </span></td>

									<input type="hidden"
										th:name="'orderDetails[' + ${stat.index} + '].order_detail_id'"
										th:value="${detail.order_detail_id}">

									<td><select
										th:name="'orderDetails[' + ${stat.index} + '].product_id'"
										class="form-select product-select" required>

											<option value="">-- Select Product --</option>


											<option th:each="product : ${products}"
												th:value="${product.product_id}"
												th:text="${product.type_name}"
												th:selected="${product.product_id == detail.product_id}">

											</option>

									</select></td>

									<td><input type="number"
										th:name="'orderDetails[' + ${stat.index} + '].quantity'"
										class="form-control" min="1" th:value="${detail.quantity}"
										required></td>

									<td><input type="text"
										th:name="'orderDetails[' + ${stat.index} + '].remark'"
										class="form-control" th:value="${detail.remark}"></td>

									<td class="text-center">

										<button type="button" class="btn btn-danger btn-sm"
											onclick="removeProduct(this)">Remove</button>

									</td>


								</tr>
								
								<tr th:if="${#lists.isEmpty(orderDetailsDto.orderDetails)}">

									<td colspan="5" class="text-center text-muted">No order
										details found.</td>

								</tr>


							</tbody>

						</table>


					</div>
					
					<button type="button" class="btn btn-success"
						onclick="addProduct()">+ Add Product</button>


				</div>

			</div>

			<div class="d-flex justify-content-end gap-2 mb-5">


				<a th:href="@{/order-with-details}" class="btn btn-secondary">

					Cancel </a>


				<button type="submit" class="btn btn-primary">Update Order

				</button>


			</div>


		</form>

	</div>

	<script>

		function addProduct() {

			const table = document.getElementById("orderDetailsTable");

			const firstSelect = document.querySelector(".product-select");

			const row = document.createElement("tr");

			const numberCell = document.createElement("td");

			numberCell.className = "text-center";

			const productCell = document.createElement("td");

			const productSelect = firstSelect.cloneNode(true);

			productSelect.value = "";

			productCell.appendChild(productSelect);

			const quantityCell = document.createElement("td");

			const quantityInput = document.createElement("input");

			quantityInput.type = "number";

			quantityInput.className = "form-control";

			quantityInput.min = "1";

			quantityInput.required = true;

			quantityCell.appendChild(quantityInput);


			const remarkCell = document.createElement("td");

			const remarkInput = document.createElement("input");

			remarkInput.type = "text";

			remarkInput.className = "form-control";

			remarkInput.placeholder = "Remark";

			remarkCell.appendChild(remarkInput);

			const actionCell = document.createElement("td");

			actionCell.className = "text-center";

			const removeButton = document.createElement("button");

			removeButton.type = "button";

			removeButton.className = "btn btn-danger btn-sm";

			removeButton.innerText = "Remove";

			removeButton.onclick = function() {

				removeProduct(this);

			};

			actionCell.appendChild(removeButton);

			row.appendChild(numberCell);

			row.appendChild(productCell);

			row.appendChild(quantityCell);

			row.appendChild(remarkCell);

			row.appendChild(actionCell);

			table.appendChild(row);

			updateIndexes();

		}


		function removeProduct(button) {

			const row = button.closest("tr");

			row.remove();

			updateIndexes();

		}


		function updateIndexes() {

			const rows = document.querySelectorAll("#orderDetailsTable tr");

			rows.forEach(function(row, index) {

				row.cells[0].innerText = index + 1;

				
				const product = row.querySelector("select");

				if (product) {

					product.name = "orderDetails[" + index + "].product_id";

				}


				const quantity = row.querySelector("input[type='number']");

				if (quantity) {

					quantity.name = "orderDetails[" + index + "].quantity";

				}


				const remark = row.querySelector("input[type='text']");

				if (remark) {

					remark.name = "orderDetails[" + index + "].remark";

				}


				const detailId = row.querySelector("input[type='hidden']");

				if (detailId) {

					detailId.name = "orderDetails[" + index
							+ "].order_detail_id";

				}

			});

		}
	</script>


	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>


</body>

</html>
