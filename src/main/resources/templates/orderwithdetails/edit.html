<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Order - Café Луфт</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-luxury: 0 10px 30px -5px rgba(92, 61, 46, 0.08), 0 4px 12px -2px rgba(92, 61, 46, 0.03);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .order-container {
            max-width: 1440px;
            margin: 35px auto 60px;
            padding: 0 25px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin: 0;
        }

        .page-subtitle {
            color: var(--cafe-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .btn-luxury-outline {
            background: #ffffff;
            color: var(--cafe-primary-dark);
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            padding: 9px 18px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-luxury-outline:hover {
            background: var(--cafe-gold-light);
            border-color: var(--cafe-gold);
            color: var(--cafe-primary-dark);
        }

        .order-grid {
            display: grid;
            grid-template-columns: 1.45fr 0.75fr;
            gap: 25px;
            align-items: start;
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow-luxury);
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--cafe-muted);
            margin-bottom: 20px;
        }

        .details-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .details-table thead th {
            background: #FAF8F5;
            color: var(--cafe-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid var(--cafe-border);
            white-space: nowrap;
        }
        .details-table tbody td {
            padding: 14px 12px;
            border-bottom: 1px solid #F5EFEB;
            vertical-align: middle;
        }

        .form-select, .form-control {
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            padding: 8px 12px;
            font-size: 0.9rem;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .row-number {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-add-item {
            margin-top: 18px;
            border-radius: 10px;
            padding: 9px 18px;
            font-weight: 600;
            border: 1px dashed var(--cafe-primary);
            color: var(--cafe-primary-dark);
            background: #FAF8F5;
            transition: all 0.25s ease;
        }
        .btn-add-item:hover {
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
        }

        .summary-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            padding: 24px;
            position: sticky;
            top: 20px;
            box-shadow: var(--shadow-luxury);
        }

        .summary-product {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #F5EFEB;
        }
        .summary-product:last-child {
            border-bottom: none;
        }
        .summary-product-discount {
            font-size: 12px;
            color: #DC2626;
            font-weight: 600;
        }
        .summary-product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--cafe-dark);
        }
        .summary-product-quantity {
            color: var(--cafe-muted);
            font-size: 13px;
        }
        .summary-product-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }

        .summary-divider {
            border-top: 1px solid var(--cafe-border);
            margin: 18px 0;
        }

        .total-label {
            font-size: 18px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }
        .total-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }

        .btn-luxury-update {
            background: linear-gradient(135deg, var(--cafe-primary) 0%, var(--cafe-primary-dark) 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 11px 22px;
            font-weight: 600;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 14px rgba(92, 61, 46, 0.2);
            transition: all 0.25s ease;
        }
        .btn-luxury-update:hover {
            opacity: 0.93;
            transform: translateY(-1px);
            color: #ffffff;
        }

        #totalAmountDisplay {
            display: none;
        }

        @media (max-width: 1000px) {
            .order-grid {
                grid-template-columns: 1fr;
            }
            .summary-card {
                position: static;
            }
        }
    </style>
</head>

<body>

    <div class="order-container">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="page-title">Edit Order</h1>
                <div class="page-subtitle">Update products, alter quantities and manage active line items.</div>
            </div>
            <a th:href="@{/order-with-details}" class="btn btn-luxury-outline">
                <i class="bi bi-arrow-left me-1"></i> Back to Orders
            </a>
        </div>

        <form th:action="@{/order-with-details/update}" method="post">
            <input type="hidden" name="order_id" th:value="${order.order_id}">

            <div class="order-grid">

                <!-- Left Column: Editable Details -->
                <div class="luxury-card">
                    <div class="card-header-title">Order Details</div>
                    <div class="card-subtitle">Adjust existing items or add more to the ticket.</div>

                    <div class="table-responsive">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th style="width: 8%;">No.</th>
                                    <th style="width: 40%;">Product</th>
                                    <th style="width: 18%;">Quantity</th>
                                    <th style="width: 24%;">Remark</th>
                                    <th style="width: 10%; text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="orderDetailsTable">
                                <tr th:each="detail, stat : ${orderDetailsDto.orderDetails}">
                                    <td>
                                        <div class="row-number">
                                            <span th:text="${stat.count}">1</span>
                                        </div>
                                    </td>
                                    <td>
                                        <select th:name="'orderDetails[' + ${stat.index} + '].product_id'"
                                                class="form-select product-select" required>
                                            <option value="">-- Select Product --</option>
                                            <option th:each="product : ${products}"
                                                    th:value="${product.product_id}"
                                                    th:text="${product.type_name + ' - ' + product.size_code + ' - ' + product.price + ' Ks'}"
                                                    th:selected="${product.product_id == detail.product_id}"
                                                    th:disabled="${!product.available}"
                                                    th:attr="data-price=${product.price},
                                                             data-product-name=${product.type_name + ' - ' + product.size_code},
                                                             data-discount=${product.discount_values != null and !#lists.isEmpty(product.discount_values) ? product.discount_values[0] : 0}">
                                            </option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number"
                                               th:name="'orderDetails[' + ${stat.index} + '].quantity'"
                                               class="form-control quantity-input" min="1"
                                               th:value="${detail.quantity}" required>
                                    </td>
                                    <td>
                                        <input type="text"
                                               th:name="'orderDetails[' + ${stat.index} + '].remark'"
                                               class="form-control remark-input" placeholder="Remark"
                                               th:value="${detail.remark}">
                                    </td>
                                    <td class="text-end">
                                        <input type="hidden"
                                               class="detail-id"
                                               th:name="'orderDetails[' + ${stat.index} + '].order_detail_id'"
                                               th:value="${detail.order_detail_id}">
                                        <button type="button"
                                                class="btn btn-outline-danger remove-button btn-sm rounded-3"
                                                onclick="removeProduct(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <button type="button" class="btn btn-add-item w-100" onclick="addProduct()">
                        <i class="bi bi-plus-lg me-1"></i> Add Another Product
                    </button>
                </div>

                <!-- Right Column: Summary Card -->
                <div>
                    <div class="summary-card">
                        <div class="card-header-title mb-3">Order Summary</div>

                        <div id="summaryProducts">
                            <div class="text-muted text-center py-4 small">No product selected.</div>
                        </div>

                        <div class="summary-divider"></div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="total-label">Total Amount</span>
                            <span class="total-value">
                                <span id="summaryTotal">0.00</span> <span style="font-size: 15px;">Ks</span>
                            </span>
                        </div>

                        <input type="hidden" name="total_amount" id="totalAmount" th:value="${order.total_amount}">
                        <input type="text" id="totalAmountDisplay" th:value="${order.total_amount}" readonly>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/order-with-details}" class="btn btn-luxury-outline">Cancel</a>
                            <button type="submit" class="btn btn-luxury-update">
                                <i class="bi bi-check2-circle me-1"></i> Update Order
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </form>

    </div>

    <script>
        function calculateTotal() {
            let total = 0;
            const rows = document.querySelectorAll("#orderDetailsTable tr");

            rows.forEach(function(row) {
                const product = row.querySelector(".product-select");
                const quantity = row.querySelector(".quantity-input");

                if (!product || !quantity) return;

                const selectedOption = product.options[product.selectedIndex];
                if (!selectedOption || selectedOption.value === "") return;

                const price = parseFloat(selectedOption.getAttribute("data-price")) || 0;
                const discount = parseFloat(selectedOption.getAttribute("data-discount")) || 0;
                const qty = parseInt(quantity.value) || 0;

                const subtotal = price * qty;
                let discountAmount = 0;
                if (discount > 0) {
                    discountAmount = subtotal * discount / 100;
                }
                const finalAmount = subtotal - discountAmount;
                total += finalAmount;
            });

            document.getElementById("summaryTotal").innerText = total.toFixed(2);
            document.getElementById("totalAmount").value = total.toFixed(2);
            document.getElementById("totalAmountDisplay").value = total.toFixed(2);

            updateSummary();
        }

        function updateSummary() {
            const summary = document.getElementById("summaryProducts");
            const rows = document.querySelectorAll("#orderDetailsTable tr");
            summary.innerHTML = "";
            let hasProduct = false;

            rows.forEach(function(row) {
                const product = row.querySelector(".product-select");
                const quantity = row.querySelector(".quantity-input");

                if (!product || !quantity) return;

                const selectedOption = product.options[product.selectedIndex];
                if (!selectedOption || selectedOption.value === "") return;

                hasProduct = true;
                const productName = selectedOption.getAttribute("data-product-name");
                const price = parseFloat(selectedOption.getAttribute("data-price")) || 0;
                const discount = parseFloat(selectedOption.getAttribute("data-discount")) || 0;
                const qty = parseInt(quantity.value) || 0;

                const subtotal = price * qty;
                let discountAmount = 0;
                if (discount > 0) {
                    discountAmount = subtotal * discount / 100;
                }
                const finalAmount = subtotal - discountAmount;

                const summaryRow = document.createElement("div");
                summaryRow.className = "summary-product";

                const productInfo = document.createElement("div");

                if (discount > 0) {
                    const discountElement = document.createElement("div");
                    discountElement.className = "summary-product-discount";
                    discountElement.innerText = discount + "% off";
                    productInfo.appendChild(discountElement);
                }

                const nameElement = document.createElement("div");
                nameElement.className = "summary-product-name";
                nameElement.innerText = productName;
                productInfo.appendChild(nameElement);

                const quantityElement = document.createElement("div");
                quantityElement.className = "summary-product-quantity";
                quantityElement.innerText = "Qty × " + qty;
                productInfo.appendChild(quantityElement);

                const priceElement = document.createElement("div");
                priceElement.className = "summary-product-price";
                priceElement.innerText = finalAmount.toFixed(2) + " Ks";

                summaryRow.appendChild(productInfo);
                summaryRow.appendChild(priceElement);
                summary.appendChild(summaryRow);
            });

            if (!hasProduct) {
                summary.innerHTML = '<div class="text-muted text-center py-4 small">No product selected.</div>';
            }
        }

        document.addEventListener("change", function(event) {
            if (event.target.classList.contains("product-select")) {
                calculateTotal();
            }
        });

        document.addEventListener("input", function(event) {
            if (event.target.classList.contains("quantity-input")) {
                calculateTotal();
            }
        });

        function addProduct() {
            const table = document.getElementById("orderDetailsTable");
            const firstSelect = document.querySelector(".product-select");
            if (!firstSelect) return;

            const row = document.createElement("tr");

            const numberCell = document.createElement("td");
            const number = document.createElement("div");
            number.className = "row-number";
            number.innerText = table.rows.length + 1;
            numberCell.appendChild(number);

            const productCell = document.createElement("td");
            const productSelect = firstSelect.cloneNode(true);
            productSelect.value = "";
            productCell.appendChild(productSelect);

            const quantityCell = document.createElement("td");
            const quantityInput = document.createElement("input");
            quantityInput.type = "number";
            quantityInput.className = "form-control quantity-input";
            quantityInput.min = "1";
            quantityInput.value = "1";
            quantityInput.required = true;
            quantityCell.appendChild(quantityInput);

            const remarkCell = document.createElement("td");
            const remarkInput = document.createElement("input");
            remarkInput.type = "text";
            remarkInput.className = "form-control remark-input";
            remarkInput.placeholder = "Remark";
            remarkCell.appendChild(remarkInput);

            const actionCell = document.createElement("td");
            actionCell.className = "text-end";
            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "btn btn-outline-danger remove-button btn-sm rounded-3";
            removeButton.innerHTML = '<i class="bi bi-trash"></i>';
            removeButton.onclick = function() { removeProduct(this); };
            actionCell.appendChild(removeButton);

            row.appendChild(numberCell);
            row.appendChild(productCell);
            row.appendChild(quantityCell);
            row.appendChild(remarkCell);
            row.appendChild(actionCell);

            table.appendChild(row);
            updateIndexes();
            calculateTotal();
        }

        function removeProduct(button) {
            const row = button.closest("tr");
            if (!row) return;
            row.remove();
            updateIndexes();
            calculateTotal();
        }

        function updateIndexes() {
            const rows = document.querySelectorAll("#orderDetailsTable tr");
            rows.forEach(function(row, index) {
                const number = row.querySelector(".row-number span, .row-number");
                if (number) number.innerText = index + 1;

                const detailId = row.querySelector(".detail-id");
                if (detailId) detailId.name = "orderDetails[" + index + "].order_detail_id";

                const product = row.querySelector(".product-select");
                if (product) product.name = "orderDetails[" + index + "].product_id";

                const quantity = row.querySelector(".quantity-input");
                if (quantity) quantity.name = "orderDetails[" + index + "].quantity";

                const remark = row.querySelector(".remark-input");
                if (remark) remark.name = "orderDetails[" + index + "].remark";
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateIndexes();
            calculateTotal();
        });
    </script>
</body>
</html>
