<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleted Orders - Café Луфт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-subtle: 0 4px 20px rgba(92, 61, 46, 0.05);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .container-fluid {
            max-width: 1440px;
        }

        .page-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            box-shadow: var(--shadow-subtle);
        }

        .btn-luxury-outline {
            background: #fff;
            color: var(--cafe-primary-dark);
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-luxury-outline:hover {
            background: var(--cafe-gold-light);
            border-color: var(--cafe-gold);
            color: var(--cafe-primary-dark);
        }

        .search-box-wrap {
            position: relative;
        }
        .search-box-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cafe-muted);
        }
        .search-box-wrap input, .filter-date {
            height: 44px;
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            font-size: 0.9rem;
        }
        .search-box-wrap input {
            padding-left: 42px;
        }
        .search-box-wrap input:focus, .filter-date:focus {
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .table-luxury {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-luxury thead th {
            background: #FAF8F5;
            color: var(--cafe-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            padding: 14px 18px;
            border-bottom: 1px solid var(--cafe-border);
            white-space: nowrap;
        }
        .table-luxury tbody td {
            padding: 16px 18px;
            border-bottom: 1px solid #F5EFEB;
            vertical-align: middle;
            font-size: 0.88rem;
        }

        .token-tag {
            font-weight: 700;
            color: var(--cafe-primary-dark);
            background: var(--cafe-gold-light);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            display: inline-block;
        }

        .badge-cancelled {
            background: #FEE2E2;
            color: #DC2626;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--cafe-muted);
            opacity: 0.4;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

<div class="container-fluid px-lg-5 py-4">

    <!-- Top Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-brand mb-1">Deleted Orders</h2>
            <p class="text-muted small mb-0">Review cancelled orders or restore to queue</p>
        </div>
        <a th:href="@{/order-with-details}" class="btn btn-luxury-outline">
            <i class="bi bi-arrow-left me-1"></i> Back to Orders
        </a>
    </div>

    <!-- Toolbar -->
    <div class="luxury-card p-3 mb-4">
        <div class="row g-2 align-items-center">
            <div class="col-md-5">
                <div class="search-box-wrap">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchOrder" class="form-control" placeholder="Search token, employee, branch, product...">
                </div>
            </div>
            <div class="col-md-3">
                <input type="date" id="searchDate" class="form-control filter-date">
            </div>
            <div class="col-md-auto ms-auto">
                <button type="button" class="btn btn-luxury-outline px-3" onclick="clearSearch()">
                    <i class="bi bi-x-lg me-1"></i> Clear Filter
                </button>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(orders)}" class="luxury-card empty-state">
        <i class="bi bi-trash3 d-block"></i>
        <h5 class="fw-bold mb-1" style="color: var(--cafe-primary-dark);">No Deleted Orders</h5>
        <p class="text-muted small mb-0">Trash is completely clean.</p>
    </div>

    <!-- Table -->
    <div th:unless="${#lists.isEmpty(orders)}" class="luxury-card overflow-hidden">
        <div class="table-responsive">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 9%;">Token No.</th>
                        <th style="width: 15%;">Employee & Branch</th>
                        <th style="width: 15%;">Created Time</th>
                        <th style="width: 25%;">Products</th>
                        <th style="width: 12%;">Total Amount</th>
                        <th style="width: 10%;">Status</th>
                        <th style="width: 14%; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}"
                        th:attr="data-created-date=${order.created_time != null ? #temporals.format(order.created_time, 'yyyy-MM-dd') : ''}">
                        <td><span class="token-tag" th:text="${order.token_number}">#001</span></td>
                        <td>
                            <div class="fw-semibold" th:text="${order.employee_name}">Staff</div>
                            <div class="text-muted small" th:text="${order.branch_name}">Branch</div>
                        </td>
                        <td>
                            <span class="text-muted small" th:text="${order.created_time != null ? #temporals.format(order.created_time, 'dd-MM-yyyy HH:mm:ss') : '—'}">03-10-2026 17:00</span>
                        </td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <th:block th:each="detail : ${orderDetails}">
                                    <div th:if="${detail.order_id == order.order_id}" class="d-flex align-items-center gap-1">
                                        <span class="fw-semibold" th:text="${detail.product_name}">Product</span>
                                        <span class="text-muted small">× <span th:text="${detail.quantity}">1</span></span>
                                        <span th:if="${detail.remark != null and detail.remark != ''}" class="badge bg-light text-muted border ms-1" style="font-size: 0.7rem;" th:text="${detail.remark}">Note</span>
                                    </div>
                                </th:block>
                            </div>
                        </td>
                        <td>
                            <span class="fw-bold" style="color: var(--cafe-primary-dark);" th:text="${order.total_amount} + ' Ks'">0.00 Ks</span>
                        </td>
                        <td>
                            <span class="badge-cancelled"><i class="bi bi-x-circle-fill"></i> Cancelled</span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <form th:action="@{/order-with-details/restore/{id}(id=${order.order_id})}" method="post"
                                      onsubmit="return confirm('Restore this order?');">
                                    <button type="submit" class="btn btn-sm btn-outline-success rounded-pill px-3">
                                        <i class="bi bi-arrow-counterclockwise me-1"></i> Restore
                                    </button>
                                </form>
                                <form th:action="@{/order-with-details/permanent-delete/{id}(id=${order.order_id})}" method="post"
                                      onsubmit="return confirm('This will permanently delete this record. Continue?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    document.getElementById("searchOrder").addEventListener("input", filterOrders);
    document.getElementById("searchDate").addEventListener("change", filterOrders);

    function filterOrders() {
        let searchValue = document.getElementById("searchOrder").value.toLowerCase().trim();
        let selectedDate = document.getElementById("searchDate").value;
        let rows = document.querySelectorAll(".table-luxury tbody tr[data-created-date]");

        rows.forEach(function(row) {
            let rowText = row.innerText.toLowerCase();
            let createdDate = row.getAttribute("data-created-date");
            let matchesSearch = rowText.includes(searchValue);
            let matchesDate = selectedDate === "" || createdDate === selectedDate;
            row.style.display = (matchesSearch && matchesDate) ? "" : "none";
        });
    }

    function clearSearch() {
        document.getElementById("searchOrder").value = "";
        document.getElementById("searchDate").value = "";
        document.querySelectorAll(".table-luxury tbody tr[data-created-date]").forEach(r => r.style.display = "");
    }
</script>
</body>
</html>
