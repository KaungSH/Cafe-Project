<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deleted Orders</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>

body {
	background-color: #ffffff;
	font-family: Arial, Helvetica, sans-serif;
	color: #111827;
}

.page-container {
	max-width: 1500px;
	margin: 0 auto;
	padding: 25px 20px 50px;
}

.page-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

.page-title {
	margin: 0;
	font-size: 32px;
	font-weight: 700;
	color: #111827;
}

.header-buttons {
	display: flex;
	gap: 10px;
}

.header-btn {
	border-radius: 9px;
	padding: 10px 18px;
	font-weight: 600;
}

.filter-box {
	background: #ffffff;
	border: 1px solid #e5e7eb;
	border-radius: 14px;
	padding: 20px;
	margin-bottom: 28px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.search-wrapper {
	position: relative;
}

.search-wrapper i {
	position: absolute;
	left: 17px;
	top: 50%;
	transform: translateY(-50%);
	color: #64748b;
	font-size: 20px;
	z-index: 2;
}

.search-input {
	height: 56px;
	border: 1px solid #cbd5e1;
	border-radius: 10px;
	padding-left: 52px;
	font-size: 18px;
	color: #334155;
}

.search-input:focus {
	border-color: #94a3b8;
	box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.15);
}

.date-input {
	height: 56px;
	border: 1px solid #cbd5e1;
	border-radius: 10px;
	font-size: 17px;
}

.clear-btn {
	height: 56px;
	border: 1px solid #94a3b8;
	border-radius: 10px;
	padding: 0 20px;
	color: #475569;
	background: #ffffff;
	font-size: 16px;
}

.clear-btn:hover {
	background: #f8fafc;
}

.table-card {
	background: #ffffff;
	border: 1px solid #e2e8f0;
	border-radius: 14px;
	overflow: hidden;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.table-responsive {
	overflow-x: auto;
}

.orders-table {
	width: 100%;
	min-width: 1100px;
	border-collapse: collapse;
}

.orders-table thead {
	background-color: #f8fafc;
}

.orders-table thead th {
	padding: 18px 22px;
	color: #64748b;
	font-size: 14px;
	font-weight: 700;
	text-align: left;
	border-bottom: 1px solid #e2e8f0;
	white-space: nowrap;
}

.orders-table tbody td {
	padding: 20px 22px;
	border-bottom: 1px solid #edf0f3;
	font-size: 14px;
	color: #475569;
	vertical-align: middle;
}

.orders-table tbody tr {
	transition: background-color 0.15s ease;
}

.orders-table tbody tr:hover {
	background-color: #f8fafc;
}

.orders-table tbody tr:last-child td {
	border-bottom: none;
}

.token-number {
	font-size: 16px;
	font-weight: 700;
	color: #111827;
}

.employee-name {
	font-weight: 600;
	color: #111827;
}

.branch-name {
	color: #475569;
}

.created-time {
	color: #64748b;
	white-space: nowrap;
	font-size: 13px;
}

.product-list {
	min-width: 280px;
}

.product-item {
	margin-bottom: 7px;
	color: #111827;
	font-weight: 600;
	line-height: 1.5;
}

.product-item:last-child {
	margin-bottom: 0;
}

.product-quantity {
	color: #64748b;
	font-weight: 400;
	margin-left: 5px;
}

.product-remark {
	color: #94a3b8;
	font-size: 12px;
	font-weight: 400;
	margin-left: 5px;
}

.total-amount {
	color: #111827;
	font-size: 15px;
	font-weight: 700;
	white-space: nowrap;
}

.deleted-badge {
	display: inline-flex;
	align-items: center;
	gap: 5px;
	background: #fee2e2;
	color: #b91c1c;
	border-radius: 20px;
	padding: 6px 10px;
	font-size: 12px;
	font-weight: 700;
	white-space: nowrap;
}

.action-buttons {
	display: flex;
	flex-direction: column;
	gap: 7px;
	min-width: 145px;
}

.restore-btn {
	border: 1px solid #198754;
	color: #198754;
	background: #ffffff;
	border-radius: 7px;
	padding: 7px 12px;
	font-size: 12px;
	font-weight: 600;
}

.restore-btn:hover {
	background: #198754;
	color: #ffffff;
}

.delete-btn {
	border: 1px solid #dc3545;
	color: #dc3545;
	background: #ffffff;
	border-radius: 7px;
	padding: 7px 12px;
	font-size: 12px;
	font-weight: 600;
}

.delete-btn:hover {
	background: #dc3545;
	color: #ffffff;
}

.empty-row {
	text-align: center;
	padding: 45px !important;
	color: #94a3b8 !important;
}

.empty-icon {
	font-size: 32px;
	margin-bottom: 10px;
}

@media ( max-width : 768px) {
	.page-container {
		padding: 20px 12px 40px;
	}
	.page-header {
		flex-direction: column;
		align-items: flex-start;
		gap: 15px;
	}
	.page-title {
		font-size: 27px;
	}
	.header-buttons {
		width: 100%;
	}
	.header-btn {
		flex: 1;
	}
	.filter-box {
		padding: 14px;
	}
}
</style>

</head>


<body>


	<div class="page-container">

		<div class="page-header">


			<h1 class="page-title">Deleted Orders</h1>


			<div class="header-buttons">


				<a th:href="@{/order-with-details}"
					class="btn btn-primary header-btn"> <i class="bi bi-arrow-left"></i>

					Back to Orders

				</a>


			</div>


		</div>

		<div class="filter-box">


			<div class="row g-2 align-items-center">

				<div class="col-lg-6 col-md-6">


					<div class="search-wrapper">


						<i class="bi bi-search"></i> <input type="text" id="searchOrder"
							class="form-control search-input"
							placeholder="Search token, employee, branch, product...">


					</div>


				</div>

				<div class="col-lg-4 col-md-4">


					<input type="date" id="searchDate" class="form-control date-input">


				</div>

				<div class="col-lg-2 col-md-2">


					<button type="button" class="btn clear-btn w-100"
						onclick="clearSearch()">


						<i class="bi bi-x-lg"></i> Clear


					</button>


				</div>


			</div>


		</div>

		<div class="table-card">


			<div class="table-responsive">


				<table class="orders-table">

					<thead>

						<tr>


							<th style="width: 9%;">Token No.</th>


							<th style="width: 13%;">Employee</th>


							<th style="width: 13%;">Branch</th>


							<th style="width: 15%;">Created Date</th>


							<th style="width: 28%;">Products</th>


							<th style="width: 10%;">Total</th>


							<th style="width: 7%;">Status</th>


							<th style="width: 12%;">Actions</th>


						</tr>

					</thead>

					<tbody>

						<tr th:each="order : ${orders}"
							th:attr="data-created-date=${order.created_time != null ? #temporals.format(order.created_time, 'yyyy-MM-dd') : ''}">

							<td><span class="token-number"
								th:text="${order.token_number}"> 001 </span></td>

							<td><span class="employee-name"
								th:text="${order.employee_name}"> Employee </span></td>

							<td><span class="branch-name" th:text="${order.branch_name}">

									Branch </span></td>

							<td><span class="created-time"
								th:text="${order.created_time != null ? #temporals.format(order.created_time, 'dd-MM-yyyy HH:mm:ss') : '—'}">

									03-10-2026 17:00:00 </span></td>

							<td>


								<div class="product-list">


									<th:block th:each="detail : ${orderDetails}">


										<div th:if="${detail.order_id == order.order_id}"
											class="product-item">

											<span th:text="${detail.product_name}"> Product </span>

											<span class="product-quantity"> × <span
												th:text="${detail.quantity}"> 1 </span>


											</span>

											<span
												th:if="${detail.remark != null and detail.remark != ''}"
												class="product-remark"> - <span
												th:text="${detail.remark}"> Remark </span>


											</span>


										</div>


									</th:block>


								</div>


							</td>

							<td><span class="total-amount"> <span
									th:text="${order.total_amount}"> 0.00 </span> Ks


							</span></td>

							<td><span class="deleted-badge"> <i
									class="bi bi-trash3"></i> Deleted


							</span></td>


							<td>


								<div class="action-buttons">


									<!-- RESTORE -->

									<form
										th:action="@{/order-with-details/restore/{id}(id=${order.order_id})}"
										method="post"
										onsubmit="return confirm('Restore this order?');">


										<button type="submit" class="btn restore-btn w-100">


											<i class="bi bi-arrow-counterclockwise"></i> Restore


										</button>


									</form>


									<form
										th:action="@{/order-with-details/permanent-delete/{id}(id=${order.order_id})}"
										method="post"
										onsubmit="return confirm('This will permanently delete the order and its details. Continue?');">


										<button type="submit" class="btn delete-btn w-100">


											<i class="bi bi-trash"></i> Permanent Delete


										</button>


									</form>


								</div>


							</td>


						</tr>

						<tr th:if="${#lists.isEmpty(orders)}">


							<td colspan="8" class="empty-row">


								<div class="empty-icon">

									<i class="bi bi-trash3"></i>

								</div> No deleted orders found.


							</td>


						</tr>


					</tbody>


				</table>


			</div>


		</div>


	</div>

	<script>
		
		document.getElementById("searchOrder").addEventListener("input",
				filterOrders);

		document.getElementById("searchDate").addEventListener("change",
				filterOrders);

		function filterOrders() {

			let searchValue = document.getElementById("searchOrder").value
					.toLowerCase().trim();

			let selectedDate = document.getElementById("searchDate").value;

			let rows = document
					.querySelectorAll(".orders-table tbody tr[data-created-date]");

			rows.forEach(function(row) {

				let rowText = row.innerText.toLowerCase();

				let createdDate = row.getAttribute("data-created-date");

				let matchesSearch = rowText.includes(searchValue);

				let matchesDate = selectedDate === ""
						|| createdDate === selectedDate;

				if (matchesSearch && matchesDate) {

					row.style.display = "";

				} else {

					row.style.display = "none";

				}

			});

		}

		function clearSearch() {

			document.getElementById("searchOrder").value = "";

			document.getElementById("searchDate").value = "";

			let rows = document
					.querySelectorAll(".orders-table tbody tr[data-created-date]");

			rows.forEach(function(row) {

				row.style.display = "";

			});

		}
	</script>


</body>

</html>
