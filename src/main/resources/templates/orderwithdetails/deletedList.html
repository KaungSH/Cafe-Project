<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deleted Orders</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>


<body>

	<div class="container mt-5">

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h2>Deleted Orders</h2>

			<a th:href="@{/order-with-details}" class="btn btn-secondary">

				Back to Orders </a>

		</div>

		<div class="card shadow-sm">

			<div class="card-body">

				<div class="table-responsive">

					<table class="table table-bordered table-hover">


						<thead class="table-dark">

							<tr>

								<th>Order ID</th>

								<th>Employee</th>

								<th>Branch</th>

								<th>Created Time</th>

								<th>Received Time</th>

								<th>Total Amount</th>

								<th>Token</th>

								<th>Order Details</th>

								<th>Action</th>

							</tr>

						</thead>


						<tbody>


							<tr th:each="order : ${orders}">

								<td th:text="${order.order_id}"></td>

								<td th:text="${order.employee_name}"></td>

								<td th:text="${order.branch_name}"></td>

								<td th:text="${order.created_time}"></td>


								<td th:text="${order.received_time}"></td>

								<td th:text="${order.total_amount}"></td>


								<td th:text="${order.token_number}"></td>

								<td>

									<div th:each="detail : ${orderDetails}"
										th:if="${detail.order_id == order.order_id}">

										<div>

											<strong th:text="${detail.product_name}"> </strong> × <span
												th:text="${detail.quantity}"> </span> <span
												th:if="${detail.remark != null and detail.remark != ''}">

												- <span th:text="${detail.remark}"> </span>

											</span>

										</div>

									</div>

								</td>

								<td>
									<form
										th:action="@{/order-with-details/restore/{id}(id=${order.order_id})}"
										method="post" class="mb-2">

										<button type="submit" class="btn btn-success btn-sm"
											onclick="return confirm('Restore this order?');">

											Restore</button>

									</form>
									<form
										th:action="@{/order-with-details/permanent-delete/{id}(id=${order.order_id})}"
										method="post">

										<button type="submit" class="btn btn-danger btn-sm"
											onclick="return confirm('This will permanently delete the order and its details. Continue?');">

											Permanent Delete</button>

									</form>

								</td>


							</tr>

							<tr th:if="${#lists.isEmpty(orders)}">

								<td colspan="9" class="text-center text-muted">No deleted
									orders found.</td>

							</tr>


						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>

</body>

</html>
