<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Café Луфт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-subtle: 0 4px 20px rgba(92, 61, 46, 0.05);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .container-fluid {
            max-width: 1440px;
        }

        .page-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            letter-spacing: 0.5px;
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            box-shadow: var(--shadow-subtle);
        }

        .btn-luxury-primary {
            background: linear-gradient(135deg, var(--cafe-primary) 0%, var(--cafe-primary-dark) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-luxury-primary:hover {
            color: #fff;
            opacity: 0.93;
            transform: translateY(-1px);
        }

        .btn-luxury-outline {
            background: #fff;
            color: var(--cafe-primary-dark);
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-luxury-outline:hover {
            background: var(--cafe-gold-light);
            border-color: var(--cafe-gold);
            color: var(--cafe-primary-dark);
        }

        .search-box-wrap {
            position: relative;
        }
        .search-box-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cafe-muted);
        }
        .search-box-wrap input {
            height: 44px;
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            padding-left: 42px;
            font-size: 0.9rem;
        }
        .search-box-wrap input:focus, .filter-date:focus {
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .filter-date {
            height: 44px;
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            font-size: 0.9rem;
            color: var(--cafe-dark);
        }

        .table-luxury {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-luxury thead th {
            background: #FAF8F5;
            color: var(--cafe-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            padding: 14px 18px;
            border-bottom: 1px solid var(--cafe-border);
            white-space: nowrap;
        }
        .table-luxury tbody td {
            padding: 16px 18px;
            border-bottom: 1px solid #F5EFEB;
            vertical-align: middle;
            font-size: 0.88rem;
        }
        .table-luxury tbody tr:hover td {
            background-color: #FDFBF8;
        }

        .token-tag {
            font-weight: 700;
            color: var(--cafe-primary-dark);
            background: var(--cafe-gold-light);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            display: inline-block;
        }

        .badge-status {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-paid {
            background: #E8F5E9;
            color: #2E7D32;
        }
        .badge-unpaid {
            background: #FEF3C7;
            color: #B45309;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--cafe-muted);
            opacity: 0.4;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

<div layout:fragment="content">

    <!-- Top Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="page-brand mb-1">Orders</h2>
            <p class="text-muted small mb-0">Active coffee orders and checkout tracking</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/admin/order-with-details/received-list}" class="btn btn-luxury-outline">
                <i class="bi bi-check-all me-1"></i> Received List
            </a>
        </div>
    </div>


    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(orders)}" class="luxury-card empty-state">
        <i class="bi bi-receipt d-block"></i>
        <h5 class="fw-bold mb-1" style="color: var(--cafe-primary-dark);">No Orders Found</h5>
        <p class="text-muted small mb-0">There are currently no active orders in the queue.</p>
    </div>

    <!-- Table Container -->
    <div th:unless="${#lists.isEmpty(orders)}" class="luxury-card overflow-hidden">
        <div class="table-responsive">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 10%;">Token No.</th>
                        <th style="width: 25%;">Products</th>
                        <th style="width: 10%;">Payment</th>
                        <th style="width: 15%;">Created Time</th>
                        <th style="width: 10%;">Subtotal</th>
                        <th style="width: 10%;">Discount</th>
                        <th style="width: 10%;">Total</th>
                        <th style="width: 10%; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}"
                        th:attr="data-created-date=${#temporals.format(order.created_time, 'yyyy-MM-dd')}">
                        <td><span class="token-tag" th:text="${order.token_number}">#001</span></td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <th:block th:each="detail : ${orderDetails}">
                                    <div th:if="${detail.order_id == order.order_id}" class="d-flex align-items-center gap-1">
                                        <span class="fw-semibold" th:text="${detail.product_name}">Cappuccino</span>
                                        <span class="text-muted small">× <span th:text="${detail.quantity}">1</span></span>
                                    </div>
                                </th:block>
                            </div>
                        </td>
                        <td>
                            <span th:if="${order.paymentDone}" class="badge-status badge-paid">
                                <i class="bi bi-check-circle-fill"></i> Paid
                            </span>
                            <span th:unless="${order.paymentDone}" class="badge-status badge-unpaid">
                                <i class="bi bi-clock-fill"></i> Unpaid
                            </span>
                        </td>
                        <td>
                            <span class="text-muted small" th:text="${#temporals.format(order.created_time, 'dd-MM-yyyy HH:mm:ss')}">03-10-2026 16:30</span>
                        </td>
                        <td><span class="fw-medium" th:text="${order.subtotal} + ' Ks'">0.00 Ks</span></td>
                        <td>
                            <span th:if="${order.hasDiscount}" class="text-danger fw-semibold" th:text="'- ' + ${order.discountAmount} + ' Ks'">-0.00 Ks</span>
                            <span th:unless="${order.hasDiscount}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span class="fw-bold" style="color: var(--cafe-primary-dark);" th:text="${order.finalAmount} + ' Ks'">0.00 Ks</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("searchOrder").addEventListener("input", function() {
        let searchValue = this.value.toLowerCase().trim();
        let orders = document.querySelectorAll(".table-luxury tbody tr");
        orders.forEach(function(order) {
            order.style.display = order.innerText.toLowerCase().includes(searchValue) ? "" : "none";
        });
    });

    document.getElementById("searchDateTime").addEventListener("change", function() {
        let selectedDate = this.value;
        let orders = document.querySelectorAll(".table-luxury tbody tr");
        if (selectedDate === "") {
            orders.forEach(o => o.style.display = "");
            return;
        }
        orders.forEach(function(order) {
            order.style.display = (order.getAttribute("data-created-date") === selectedDate) ? "" : "none";
        });
    });

    function clearSearch() {
        document.getElementById("searchOrder").value = "";
        document.getElementById("searchDateTime").value = "";
        document.querySelectorAll(".table-luxury tbody tr").forEach(o => o.style.display = "");
    }
</script>
</body>
</html>
