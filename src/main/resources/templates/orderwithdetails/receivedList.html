<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Received Orders</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f5f5f5;
}

.container {
	margin-top: 30px;
	margin-bottom: 50px;
}

.order-card {
	background-color: white;
	border-radius: 10px;
	margin-bottom: 25px;
	box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
	overflow: hidden;
}

.order-header {
	background-color: #212529;
	color: white;
	padding: 15px 25px;
}

.order-body {
	padding: 25px;
}

.info-label {
	font-weight: bold;
	font-size: 17px;
}

.info-value {
	font-size: 16px;
	margin-bottom: 10px;
}
</style>

</head>


<body>

	<div class="container">


		<div class="d-flex justify-content-between align-items-center mb-4">

			<h2>Received Orders</h2>

			<a th:href="@{/order-with-details}" class="btn btn-primary">

				Current Orders </a>

		</div>

		<div th:each="order : ${orders}" class="order-card">

			<div class="order-header">

				<div class="row">

					<div class="col-md-3">

						<strong> Order ID: </strong> <span th:text="${order.order_id}">
						</span>

					</div>


					<div class="col-md-3">

						<strong> Employee: </strong> <span
							th:text="${order.employee_name}"> </span>

					</div>


					<div class="col-md-3">

						<strong> Branch: </strong> <span th:text="${order.branch_name}">
						</span>

					</div>


					<div class="col-md-3">

						<strong> Token: </strong> <span th:text="${order.token_number}">
						</span>

					</div>

				</div>

			</div>

			<div class="order-body">


				<div class="row">

					<div class="col-md-3">

						<div class="info-label">Created Time</div>

						<div class="info-value"
							th:text="${#temporals.format(order.created_time, 'dd-MM-yyyy HH:mm:ss')}">
						</div>

					</div>

					<div class="col-md-3">

						<div class="info-label">Received Time</div>

						<div class="info-value"
							th:text="${#temporals.format(order.received_time, 'dd-MM-yyyy HH:mm:ss')}">
						</div>

					</div>

					<div class="col-md-3">

						<div class="info-label">Total Amount</div>

						<div class="info-value" th:text="${order.total_amount}"></div>

					</div>

				</div>

				<h4 class="mt-4">Order Details</h4>


				<table class="table table-bordered">

					<thead>

						<tr>

							<th style="width: 70px;">No.</th>

							<th>Product</th>

							<th>Quantity</th>

							<th>Remark</th>

						</tr>

					</thead>


					<tbody>

						<tr th:each="detail, stat : ${orderDetails}"
							th:if="${detail.order_id == order.order_id}">

							<td th:text="${stat.count}">1</td>

							<td th:text="${detail.product_name}">Product</td>

							<td th:text="${detail.quantity}">1</td>

							<td th:text="${detail.remark}">Remark</td>

						</tr>

					</tbody>

				</table>

				<div class="text-end">

					<span class="badge bg-success fs-6"> Received </span>

				</div>
				<div class="text-end mt-2">

					<span th:if="${order.paymentDone}" class="badge bg-success fs-6">
						✓ Payment Successful </span>

				</div>
			</div>

		</div>

		<div th:if="${#lists.isEmpty(orders)}"
			class="alert alert-info text-center">No received orders.</div>

	</div>

</body>

</html>
