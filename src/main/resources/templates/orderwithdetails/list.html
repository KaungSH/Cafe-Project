<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order List</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">


<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>
body {
	background-color: #ffffff;
	font-family: Arial, Helvetica, sans-serif;
	color: #1f2937;
}

.container {
	max-width: 1450px;
	margin: 0 auto;
}

.page-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 20px;
}

.page-title {
	font-size: 28px;
	font-weight: 700;
	margin: 0;
	color: #111827;
}

.top-btn {
	border-radius: 8px;
	font-weight: 600;
	padding: 9px 15px;
}

.order-toolbar {
	background: #ffffff;
	border: 1px solid #e5e7eb;
	border-radius: 12px;
	padding: 15px;
	margin-bottom: 20px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.search-box {
	position: relative;
}

.search-box input {
	height: 42px;
	border-radius: 8px;
	border: 1px solid #d1d5db;
	padding-left: 40px;
}

.search-icon {
	position: absolute;
	left: 14px;
	top: 50%;
	transform: translateY(-50%);
	color: #6b7280;
	z-index: 5;
}

.toolbar-btn {
	height: 42px;
	border-radius: 8px;
	font-weight: 500;
	padding: 0 16px;
}

.order-table-container {
	background: #ffffff;
	border: 1px solid #e5e7eb;
	border-radius: 12px;
	overflow: hidden;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.order-main-table {
	width: 100%;
	border-collapse: collapse;
}

.order-main-table thead {
	background: #f9fafb;
}

.order-main-table thead th {
	padding: 14px 15px;
	text-align: left;
	color: #6b7280;
	font-size: 13px;
	font-weight: 600;
	border-bottom: 1px solid #e5e7eb;
	white-space: nowrap;
}

.order-main-table tbody td {
	padding: 15px;
	border-bottom: 1px solid #f0f0f0;
	color: #374151;
	font-size: 14px;
	vertical-align: middle;
}

.order-main-table tbody tr {
	transition: background-color 0.15s ease;
}

.order-main-table tbody tr:hover {
	background: #f9fafb;
}

.order-main-table tbody tr:last-child td {
	border-bottom: none;
}

.token-number {
	font-weight: 700;
	color: #111827;
	white-space: nowrap;
}

.product-list {
	min-width: 200px;
}

.product-item {
	margin-bottom: 5px;
	color: #111827;
	font-weight: 600;
}

.product-item:last-child {
	margin-bottom: 0;
}

.quantity {
	color: #6b7280;
	font-weight: 400;
	margin-left: 4px;
}

.status-paid {
	display: inline-block;
	background: #d1fae5;
	color: #047857;
	padding: 5px 10px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 600;
	white-space: nowrap;
}

.status-unpaid {
	display: inline-block;
	background: #fef3c7;
	color: #92400e;
	padding: 5px 10px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 600;
	white-space: nowrap;
}

.created-date {
	color: #6b7280;
	white-space: nowrap;
	font-size: 13px;
}

.price {
	white-space: nowrap;
	font-weight: 500;
	color: #374151;
}

.discount-text {
	color: #dc2626;
	font-weight: 600;
	white-space: nowrap;
}

.no-discount {
	color: #9ca3af;
}

.total-price {
	font-weight: 700;
	color: #111827;
	white-space: nowrap;
}

.discount-badge {
	display: inline-block;
	background: #dcfce7;
	color: #15803d;
	border-radius: 20px;
	padding: 4px 9px;
	font-size: 11px;
	font-weight: 700;
	margin-top: 4px;
}

.action-btn {
	border-radius: 7px;
	font-size: 12px;
	padding: 6px 10px;
	font-weight: 600;
	white-space: nowrap;
}

.dropdown-toggle {
	border-radius: 7px;
	font-size: 12px;
	padding: 6px 10px;
	font-weight: 600;
}

.dropdown-menu {
	border-radius: 8px;
	border: 1px solid #e5e7eb;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.dropdown-item {
	font-size: 13px;
	padding: 8px 14px;
}

.no-orders {
	border-radius: 10px;
	padding: 25px;
}

.table-footer {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 14px 18px;
	border-top: 1px solid #e5e7eb;
	background: #ffffff;
}

.result-text {
	color: #6b7280;
	font-size: 13px;
}

.pagination {
	margin: 0;
}

.page-link {
	color: #374151;
	border: none;
	border-radius: 6px;
	margin: 0 2px;
}

.page-link:hover {
	background: #f3f4f6;
	color: #111827;
}

.page-item.active .page-link {
	background: #0d6efd;
	color: #ffffff;
}

@media ( max-width : 1100px) {
	.order-main-table {
		min-width: 1100px;
	}
	.order-table-container {
		overflow-x: auto;
	}
}

@media ( max-width : 768px) {
	.page-header {
		flex-direction: column;
		align-items: flex-start;
		gap: 15px;
	}
	.page-title {
		font-size: 24px;
	}
	.table-footer {
		flex-direction: column;
		gap: 12px;
		align-items: flex-start;
	}
}
</style>

</head>


<body>


	<div class="container mt-4 mb-5">

		<div class="page-header">

			<h1 class="page-title">Orders</h1>

			<div class="d-flex gap-2 flex-wrap">

				<a th:href="@{/order-with-details/received-list}"
					class="btn btn-success top-btn"> Received List </a> <a
					th:href="@{/order-with-details/deleted}"
					class="btn btn-secondary top-btn"> Deleted List </a> <a
					th:href="@{/order-with-details/add}"
					class="btn btn-primary top-btn"> <i class="bi bi-plus-lg"></i>

					Create Order

				</a>


			</div>


		</div>

		<div class="order-toolbar">

			<div class="row align-items-center g-2">

				<div class="col-md-5">


					<div class="search-box">


						<i class="bi bi-search search-icon"></i> <input type="text"
							id="searchOrder" class="form-control"
							placeholder="Search token, product, payment...">


					</div>


				</div>

				<div class="col-md-3">


					<input type="date" id="searchDateTime"
						class="form-control toolbar-btn">


				</div>

				<div class="col-md-auto">


					<button type="button" class="btn btn-outline-secondary toolbar-btn"
						onclick="clearSearch()">

						<i class="bi bi-x-lg"></i> Clear

					</button>


				</div>


			</div>


		</div>

		<div th:if="${#lists.isEmpty(orders)}"
			class="alert alert-info text-center no-orders">

			<i class="bi bi-info-circle"></i> No orders found.

		</div>

		<div th:unless="${#lists.isEmpty(orders)}"
			class="order-table-container">


			<div class="table-responsive">


				<table class="order-main-table">

					<thead>

						<tr>

							<th style="width: 9%;">Token No.</th>

							<th style="width: 22%;">Products</th>

							<th style="width: 10%;">Payment</th>

							<th style="width: 16%;">Created Date</th>

							<th style="width: 11%;">Subtotal</th>

							<th style="width: 11%;">Discount</th>

							<th style="width: 11%;">Total</th>

							<th style="width: 15%;">Actions</th>

						</tr>

					</thead>

					<tbody>

						<tr th:each="order : ${orders}"
							th:attr="data-created-date=${#temporals.format(order.created_time, 'yyyy-MM-dd')}">

							<td><span class="token-number"
								th:text="${order.token_number}"></span></td>

							<td>

								<div class="product-list">

									<th:block th:each="detail : ${orderDetails}">

										<div class="product-item"
											th:if="${detail.order_id == order.order_id}">

											<span th:text="${detail.product_name}"> </span> <span
												class="quantity"> × <span
												th:text="${detail.quantity}"></span>

											</span>

										</div>

									</th:block>

								</div>

							</td>

							<td><span th:if="${order.paymentDone}" class="status-paid">
									<i class="bi bi-check-circle"></i> Paid

							</span> <span th:unless="${order.paymentDone}" class="status-unpaid">
									<i class="bi bi-clock"></i> Unpaid

							</span></td>

							<td><span class="created-date"
								th:text="${#temporals.format(order.created_time, 'dd-MM-yyyy HH:mm:ss')}">

									03-10-2026 16:30:00 </span></td>


							<td><span class="price"> <span
									th:text="${order.subtotal}"> 0.00 </span> Ks


							</span></td>


							<td>

								<div th:if="${order.hasDiscount}">

									<span class="discount-text"> - <span
										th:text="${order.discountAmount}"> 0.00 </span> Ks


									</span> <br> <span class="discount-badge"
										th:text="${#numbers.formatDecimal((order.discountAmount * 100) / order.subtotal, 1, 0) + '% OFF'}">

										10% OFF </span>


								</div> <span th:unless="${order.hasDiscount}" class="no-discount">
									— </span>


							</td>

							<td><span class="total-price"> <span
									th:text="${order.finalAmount}"> 0.00 </span> Ks


							</span></td>

							<td>

								<div class="d-flex gap-1 flex-wrap">

									<a th:if="${!order.paymentDone}"
										th:href="@{/payments/add(order_id=${order.order_id})}"
										class="btn btn-success action-btn"> <i
										class="bi bi-credit-card"></i> Checkout
									</a>

									<form th:if="${order.paymentDone}"
										th:action="@{/order-with-details/received/{id}(id=${order.order_id})}"
										method="post" style="display: inline;"
										onsubmit="return confirm('Mark this order as received?');">

										<button type="submit" class="btn btn-primary action-btn">
											<i class="bi bi-check-circle"></i> Received
										</button>

									</form>

									<div class="dropdown">


										<button class="btn btn-outline-secondary dropdown-toggle"
											type="button" data-bs-toggle="dropdown" aria-expanded="false">

											Actions</button>

										<ul class="dropdown-menu dropdown-menu-end">

											<li><a class="dropdown-item"
												th:href="@{/order-with-details/edit(order_id=${order.order_id})}">

													<i class="bi bi-pencil-square"></i> Edit


											</a></li>

											<li>

												<form
													th:action="@{/order-with-details/delete/{id}(id=${order.order_id})}"
													method="post"
													onsubmit="return confirm('Are you sure you want to delete this order?');">

													<button type="submit" class="dropdown-item text-danger">

														<i class="bi bi-trash"></i> Delete

													</button>

												</form>

											</li>

										</ul>

									</div>

								</div>

							</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

	<script>
		document.getElementById("searchOrder").addEventListener(
				"input",
				function() {

					let searchValue = this.value.toLowerCase().trim();

					let orders = document
							.querySelectorAll(".order-main-table tbody tr");

					orders.forEach(function(order) {

						let text = order.innerText.toLowerCase();

						if (text.includes(searchValue)) {

							order.style.display = "";

						} else {

							order.style.display = "none";

						}

					});

				});

		document.getElementById("searchDateTime").addEventListener(
				"change",
				function() {

					let selectedDate = this.value;

					let orders = document
							.querySelectorAll(".order-main-table tbody tr");

					if (selectedDate === "") {

						orders.forEach(function(order) {

							order.style.display = "";

						});

						return;

					}

					orders
							.forEach(function(order) {

								let orderDate = order
										.getAttribute("data-created-date");

								if (orderDate === selectedDate) {

									order.style.display = "";

								} else {

									order.style.display = "none";

								}

							});

				});

		function clearSearch() {

			document.getElementById("searchOrder").value = "";

			document.getElementById("searchDateTime").value = "";

			let orders = document
					.querySelectorAll(".order-main-table tbody tr");

			orders.forEach(function(order) {

				order.style.display = "";

			});

		}
	</script>

</body>

</html>
