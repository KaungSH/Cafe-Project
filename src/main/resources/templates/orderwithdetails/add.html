<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Order</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	background-color: #f8f9fb;
	font-family: Arial, Helvetica, sans-serif;
	color: #111827;
}

.order-container {
	max-width: 1400px;
	margin: 35px auto 60px;
	padding: 0 25px;
}

.page-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

.page-title {
	font-size: 30px;
	font-weight: 700;
	margin: 0;
	color: #111827;
}

.page-subtitle {
	color: #64748b;
	font-size: 14px;
	margin-top: 6px;
}

.back-button {
	border-radius: 8px;
	padding: 10px 17px;
	font-weight: 600;
}

.order-grid {
	display: grid;
	grid-template-columns: 1.45fr 0.75fr;
	gap: 25px;
	align-items: start;
}

.order-card {
	background: #ffffff;
	border: 1px solid #e1e5ea;
	border-radius: 12px;
	padding: 24px;
	margin-bottom: 20px;
}

.card-title {
	font-size: 20px;
	font-weight: 700;
	color: #111827;
	margin-bottom: 5px;
}

.card-subtitle {
	font-size: 13px;
	color: #64748b;
	margin-bottom: 22px;
}

.details-table-wrapper {
	overflow-x: auto;
}

.details-table {
	width: 100%;
	border-collapse: collapse;
}

.details-table thead {
	background-color: #f8fafc;
}

.details-table th {
	padding: 13px 12px;
	text-align: left;
	color: #64748b;
	font-size: 13px;
	font-weight: 700;
	border-bottom: 1px solid #e2e8f0;
	white-space: nowrap;
}

.details-table td {
	padding: 13px 12px;
	border-bottom: 1px solid #edf0f3;
	vertical-align: middle;
}

.details-table tbody tr:last-child td {
	border-bottom: none;
}

.form-select, .form-control {
	border-radius: 8px;
	border: 1px solid #d1d5db;
}

.form-select {
	min-height: 44px;
}

.form-control {
	min-height: 44px;
}

.form-select:focus, .form-control:focus {
	border-color: #86b7fe;
	box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.10);
}

.row-number {
	width: 35px;
	height: 35px;
	border-radius: 50%;
	background: #f1f5f9;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 13px;
	font-weight: 700;
	color: #475569;
}

.add-product-button {
	margin-top: 18px;
	border-radius: 8px;
	padding: 9px 15px;
	font-weight: 600;
}

.remove-button {
	border-radius: 7px;
	font-size: 12px;
	padding: 7px 11px;
	white-space: nowrap;
}

.summary-card {
	background: #ffffff;
	border: 1px solid #e1e5ea;
	border-radius: 12px;
	padding: 24px;
	position: sticky;
	top: 20px;
}

.summary-title {
	font-size: 20px;
	font-weight: 700;
	color: #111827;
	margin-bottom: 20px;
}

.summary-product {
	display: flex;
	justify-content: space-between;
	gap: 12px;
	padding: 13px 0;
	border-bottom: 1px solid #eeeeee;
}

.summary-product:last-child {
	border-bottom: none;
}

.summary-product-info {
	flex: 1;
}

.summary-product-discount {
	font-size: 14px;
	color: #dc2626;
	margin-bottom: 4px;
}

.summary-product-name {
	font-size: 14px;
	font-weight: 600;
	color: #111827;
	line-height: 1.4;
}

.summary-product-quantity {
	color: #64748b;
	font-size: 13px;
	margin-top: 3px;
}

.summary-product-price {
	font-size: 14px;
	font-weight: 700;
	color: #111827;
	white-space: nowrap;
}

.empty-summary {
	color: #94a3b8;
	font-size: 14px;
	text-align: center;
	padding: 25px 0;
}

.summary-divider {
	border-top: 1px solid #d1d5db;
	margin: 18px 0;
}

.total-row {
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.total-label {
	font-size: 18px;
	font-weight: 700;
	color: #111827;
}

.total-value {
	font-size: 21px;
	font-weight: 700;
	color: #111827;
}

.currency {
	font-size: 14px;
}

#totalAmountDisplay {
	display: none;
}

.form-buttons {
	display: flex;
	justify-content: flex-end;
	gap: 10px;
	margin-top: 20px;
}

.cancel-button, .save-button {
	border-radius: 8px;
	padding: 11px 20px;
	font-weight: 600;
}

.save-button {
	min-width: 130px;
}

.info-box {
	background: #f8fafc;
	border: 1px solid #e5e7eb;
	border-radius: 8px;
	padding: 12px 14px;
	color: #64748b;
	font-size: 13px;
	margin-top: 20px;
}

@media ( max-width : 1000px) {
	.order-grid {
		grid-template-columns: 1fr;
	}
	.summary-card {
		position: static;
	}
}

@media ( max-width : 700px) {
	.order-container {
		padding: 0 15px;
		margin-top: 20px;
	}
	.page-header {
		flex-direction: column;
		align-items: flex-start;
		gap: 15px;
	}
	.page-title {
		font-size: 25px;
	}
	.form-buttons {
		flex-direction: column;
	}
	.cancel-button, .save-button {
		width: 100%;
	}
}
</style>

</head>

<body>

	<div class="order-container">

		<div class="page-header">

			<div>

				<h1 class="page-title">Add Order</h1>

				<div class="page-subtitle">Add products and create a new
					order.</div>

			</div>

			<a th:href="@{/order-with-details}"
				class="btn btn-outline-secondary back-button"> <i
				class="bi bi-arrow-left"></i> Back to Orders

			</a>

		</div>
		<div th:if="${error}" class="alert alert-danger">
			<span th:text="${error}"></span>
		</div>

		<form th:action="@{/order-with-details/save}" method="post">

			<div class="order-grid">

				<div>

					<div class="order-card">

						<div class="card-title">Order Details</div>

						<div class="card-subtitle">Select the products, quantity and
							add remarks if necessary.</div>

						<div class="details-table-wrapper">

							<table class="details-table">

								<thead>

									<tr>

										<th style="width: 7%;">No.</th>

										<th style="width: 38%;">Product</th>

										<th style="width: 17%;">Quantity</th>

										<th style="width: 28%;">Remark</th>

										<th style="width: 10%;">Action</th>

									</tr>

								</thead>


								<tbody id="orderDetailsTable">
									<tr th:each="detail, stat : ${orderDetailsDto.orderDetails}">
										<td>
											<div class="row-number" th:text="${stat.count}"></div>
										</td>

										<td><span class="selected-product"
											th:each="product : ${products}"
											th:if="${product.product_id == detail.product_id}"
											th:text="${product.type_name + ' - ' + product.size_code}"
											th:attr="data-price=${product.price},
                   data-discount=${product.discount_values != null and !product.discount_values.isEmpty() ? product.discount_values[0] : 0},
                   data-product-name=${product.type_name + ' - ' + product.size_code}">
										</span> <input type="hidden"
											th:name="|orderDetails[${stat.index}].product_id|"
											th:value="${detail.product_id}"></td>

										<td><input type="number"
											th:name="'orderDetails[' + ${stat.index} + '].quantity'"
											class="form-control quantity-input" min="1"
											th:value="${detail.quantity}" required></td>

										<td><input type="text"
											th:name="'orderDetails[' + ${stat.index} + '].remark'"
											class="form-control" placeholder="Remark"
											th:value="${detail.remark}"></td>

										<td>
											<button type="button"
												class="btn btn-outline-danger remove-button"
												onclick="removeProduct(this)">Remove</button>
										</td>
									</tr>

								</tbody>

							</table>

						</div>

						<div>

							<div class="summary-card">

								<div class="summary-title">Order Summary</div>

								<div id="summaryProducts">

									<div class="empty-summary">No product selected.</div>

								</div>


								<div class="summary-divider"></div>



								<div class="total-row">

									<span class="total-label"> Total </span> <span
										class="total-value"> <span id="summaryTotal">
											0.00 </span> <span class="currency"> Ks </span>

									</span>

								</div>

								<input type="hidden" name="total_amount" id="totalAmount"
									value="0.00"> <input type="text"
									id="totalAmountDisplay" value="0.00" readonly>


								<div class="form-buttons">

									<a th:href="@{/staff/products}"
										class="btn btn-outline-secondary cancel-button"> Cancel </a>

									<button type="submit" class="btn btn-primary save-button">

										<i class="bi bi-check-lg"></i> Save Order

									</button>

								</div>

							</div>

						</div>

					</div>
		</form>

	</div>


	<script>
		function calculateTotal() {
			let total = 0;
			const summary = document.getElementById("summaryProducts");
			summary.innerHTML = "";

			const rows = document.querySelectorAll("#orderDetailsTable tr");
			let hasProduct = false;

			rows
					.forEach(function(row) {
						const product = row.querySelector(".selected-product");
						const quantity = row.querySelector(".quantity-input");

						if (!product || !quantity) {
							return;
						}

						const price = parseFloat(product
								.getAttribute("data-price")) || 0;
						const discount = parseFloat(product
								.getAttribute("data-discount")) || 0;
						const qty = parseInt(quantity.value) || 0;

						const subtotal = price * qty;
						const discountAmount = subtotal * discount / 100;
						const finalAmount = subtotal - discountAmount;

						total += finalAmount;
						hasProduct = true;

						const item = document.createElement("div");
						item.className = "summary-product";

						const info = document.createElement("div");
						info.className = "summary-product-info";

						if (discount > 0) {
							const discountLabel = document.createElement("div");
							discountLabel.className = "summary-product-discount";
							discountLabel.innerText = discount + "% discount";
							info.appendChild(discountLabel);
						}

						const name = document.createElement("div");
						name.className = "summary-product-name";
						name.innerText = product
								.getAttribute("data-product-name");
						info.appendChild(name);

						const qtyLabel = document.createElement("div");
						qtyLabel.className = "summary-product-quantity";
						qtyLabel.innerText = "Quantity × " + qty;
						info.appendChild(qtyLabel);

						const amount = document.createElement("div");
						amount.className = "summary-product-price";
						amount.innerText = finalAmount.toFixed(2) + " Ks";

						item.appendChild(info);
						item.appendChild(amount);
						summary.appendChild(item);
					});

			if (!hasProduct) {
				summary.innerHTML = '<div class="empty-summary">No product selected.</div>';
			}

			document.getElementById("summaryTotal").innerText = total
					.toFixed(2);
			document.getElementById("totalAmount").value = total.toFixed(2);
			document.getElementById("totalAmountDisplay").value = total
					.toFixed(2);
		}

		function removeProduct(button) {
			button.closest("tr").remove();
			updateIndexes();
			calculateTotal();
		}

		function updateIndexes() {
			const rows = document.querySelectorAll("#orderDetailsTable tr");

			rows.forEach(function(row, index) {
				const number = row.querySelector(".row-number");
				if (number) {
					number.innerText = index + 1;
				}

				const productId = row.querySelector("input[type='hidden']");
				if (productId) {
					productId.name = "orderDetails[" + index + "].product_id";
				}

				const quantity = row.querySelector(".quantity-input");
				if (quantity) {
					quantity.name = "orderDetails[" + index + "].quantity";
				}

				const remark = row.querySelector("input[type='text']");
				if (remark) {
					remark.name = "orderDetails[" + index + "].remark";
				}
			});
		}

		document.addEventListener("input", function(event) {
			if (event.target.classList.contains("quantity-input")) {
				calculateTotal();
			}
		});

		document.addEventListener("DOMContentLoaded", function() {
			updateIndexes();
			calculateTotal();
		});
	</script>

</body>

</html>
