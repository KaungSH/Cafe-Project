<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Order</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f8f9fa;
}

.container {
	max-width: 1200px;
}

.card {
	border-radius: 8px;
}

.card-header {
	font-size: 22px;
	font-weight: bold;
}

.form-label {
	font-weight: 500;
}

.table th {
	vertical-align: middle;
}

.table td {
	vertical-align: middle;
}

.total-box {
	font-size: 18px;
	font-weight: bold;
}
</style>

</head>


<body>


	<div class="container mt-5 mb-5">


		<!-- ========================= -->
		<!-- PAGE TITLE -->
		<!-- ========================= -->

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h1>Add Order</h1>

			<a th:href="@{/order-with-details}" class="btn btn-secondary">

				Back </a>

		</div>


		<!-- ========================= -->
		<!-- ORDER FORM -->
		<!-- ========================= -->

		<form th:action="@{/order-with-details/save}" method="post">


			<!-- ========================= -->
			<!-- ORDER DETAILS CARD -->
			<!-- ========================= -->

			<div class="card shadow-sm mb-4">


				<div class="card-header bg-success text-white">Order Details</div>


				<div class="card-body">


					<div class="table-responsive">


						<table class="table table-bordered">


							<!-- TABLE HEADER -->

							<thead class="table-light">

								<tr>

									<th style="width: 5%;">No.</th>

									<th style="width: 35%;">Product</th>

									<th style="width: 20%;">Quantity</th>

									<th style="width: 30%;">Remark</th>

									<th style="width: 10%;">Action</th>

								</tr>

							</thead>


							<!-- TABLE BODY -->

							<tbody id="orderDetailsTable">


								<!-- FIRST PRODUCT ROW -->

								<tr>


									<!-- NO. -->

									<td class="text-center">1</td>


									<!-- PRODUCT -->

									<td><select name="orderDetails[0].product_id"
										class="form-select product-select" required>

											<option value="">-- Select Product --</option>


											<option th:each="product : ${products}"
												th:value="${product.product_id}"
												th:text="${product.type_name + ' - ' + product.price}"
												th:attr="data-price=${product.price}"></option>

									</select></td>


									<!-- QUANTITY -->

									<td><input type="number" name="orderDetails[0].quantity"
										class="form-control quantity-input" min="1" value="1" required>

									</td>


									<!-- REMARK -->

									<td><input type="text" name="orderDetails[0].remark"
										class="form-control" placeholder="Remark"></td>


									<!-- REMOVE -->

									<td class="text-center">

										<button type="button" class="btn btn-danger btn-sm"
											onclick="removeProduct(this)">Remove</button>

									</td>


								</tr>


							</tbody>

						</table>


					</div>


					<!-- ADD PRODUCT BUTTON -->

					<button type="button" class="btn btn-success"
						onclick="addProduct()">+ Add Product</button>


				</div>

			</div>


			<!-- ========================= -->
			<!-- TOTAL AMOUNT -->
			<!-- ========================= -->

			<div class="card shadow-sm mb-4">


				<div class="card-body">


					<div class="row">


						<div class="col-md-8"></div>


						<div class="col-md-4">


							<label class="form-label fw-bold"> Total Amount </label>


							<!-- DISPLAY TOTAL -->

							<input type="text" id="totalAmountDisplay"
								class="form-control form-control-lg fw-bold" value="0.00"
								readonly>


							<!-- ACTUAL VALUE SENT TO SPRING BOOT -->

							<input type="hidden" name="total_amount" id="totalAmount"
								value="0.00">


						</div>


					</div>


				</div>

			</div>


			<!-- ========================= -->
			<!-- FORM BUTTONS -->
			<!-- ========================= -->

			<div class="d-flex justify-content-end gap-2">


				<a th:href="@{/order-with-details}" class="btn btn-secondary">

					Cancel </a>


				<button type="submit" class="btn btn-primary">Save Order</button>


			</div>


		</form>


	</div>



	<script>
		/* =========================================
		 CALCULATE TOTAL
		 ========================================= */

		function calculateTotal() {

			let total = 0;

			const rows = document.querySelectorAll("#orderDetailsTable tr");

			rows
					.forEach(function(row) {

						const product = row.querySelector(".product-select");

						const quantity = row.querySelector(".quantity-input");

						if (product && quantity) {

							const selectedOption = product.options[product.selectedIndex];

							const price = parseFloat(selectedOption
									.getAttribute("data-price")) || 0;

							const qty = parseInt(quantity.value) || 0;

							total = total + (price * qty);

						}

					});

			/* Display total */

			document.getElementById("totalAmountDisplay").value = total
					.toFixed(2);

			/* Hidden total */

			document.getElementById("totalAmount").value = total.toFixed(2);

		}

		/* =========================================
		 PRODUCT CHANGE
		 ========================================= */

		document.addEventListener("change", function(event) {

			if (event.target.classList.contains("product-select")) {

				calculateTotal();

			}

		});

		/* =========================================
		 QUANTITY CHANGE
		 ========================================= */

		document.addEventListener("input", function(event) {

			if (event.target.classList.contains("quantity-input")) {

				calculateTotal();

			}

		});

		/* =========================================
		 ADD PRODUCT
		 ========================================= */

		function addProduct() {

			const table = document.getElementById("orderDetailsTable");

			const firstSelect = document.querySelector(".product-select");

			/* Create new row */

			const row = document.createElement("tr");

			/* =========================================
			   NUMBER CELL
			   ========================================= */

			const numberCell = document.createElement("td");

			numberCell.className = "text-center";

			numberCell.innerText = table.rows.length + 1;

			/* =========================================
			   PRODUCT CELL
			   ========================================= */

			const productCell = document.createElement("td");

			const productSelect = firstSelect.cloneNode(true);

			productSelect.value = "";

			productCell.appendChild(productSelect);

			/* =========================================
			   QUANTITY CELL
			   ========================================= */

			const quantityCell = document.createElement("td");

			const quantityInput = document.createElement("input");

			quantityInput.type = "number";

			quantityInput.className = "form-control quantity-input";

			quantityInput.min = "1";

			quantityInput.value = "1";

			quantityInput.required = true;

			quantityCell.appendChild(quantityInput);

			/* =========================================
			   REMARK CELL
			   ========================================= */

			const remarkCell = document.createElement("td");

			const remarkInput = document.createElement("input");

			remarkInput.type = "text";

			remarkInput.className = "form-control";

			remarkInput.placeholder = "Remark";

			remarkCell.appendChild(remarkInput);

			/* =========================================
			   ACTION CELL
			   ========================================= */

			const actionCell = document.createElement("td");

			actionCell.className = "text-center";

			const removeButton = document.createElement("button");

			removeButton.type = "button";

			removeButton.className = "btn btn-danger btn-sm";

			removeButton.innerText = "Remove";

			removeButton.onclick = function() {

				removeProduct(this);

			};

			actionCell.appendChild(removeButton);

			/* =========================================
			   ADD CELLS TO ROW
			   ========================================= */

			row.appendChild(numberCell);

			row.appendChild(productCell);

			row.appendChild(quantityCell);

			row.appendChild(remarkCell);

			row.appendChild(actionCell);

			/* =========================================
			   IMPORTANT
			   ADD ROW TO TABLE
			   ========================================= */

			table.appendChild(row);

			/* Update names */

			updateIndexes();

			/* Recalculate total */

			calculateTotal();

		}

		/* =========================================
		 REMOVE PRODUCT
		 ========================================= */

		function removeProduct(button) {

			const row = button.closest("tr");

			row.remove();

			updateIndexes();

			calculateTotal();

		}

		/* =========================================
		 UPDATE INDEXES
		 ========================================= */

		function updateIndexes() {

			const rows = document.querySelectorAll("#orderDetailsTable tr");

			rows.forEach(function(row, index) {

				/* Number */

				row.cells[0].innerText = index + 1;

				/* Product */

				const product = row.querySelector(".product-select");

				if (product) {

					product.name = "orderDetails[" + index + "].product_id";

				}

				/* Quantity */

				const quantity = row.querySelector(".quantity-input");

				if (quantity) {

					quantity.name = "orderDetails[" + index + "].quantity";

				}

				/* Remark */

				const remark = row.querySelector("input[type='text']");

				if (remark) {

					remark.name = "orderDetails[" + index + "].remark";

				}

			});

		}

		/* =========================================
		 PAGE LOAD
		 ========================================= */

		document.addEventListener("DOMContentLoaded", function() {

			/* Set correct names */

			updateIndexes();

			/* Calculate initial total */

			calculateTotal();

		});
	</script>


</body>

</html>
