<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Order - Café Луфт</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-luxury: 0 10px 30px -5px rgba(92, 61, 46, 0.08), 0 4px 12px -2px rgba(92, 61, 46, 0.03);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .order-container {
            max-width: 1440px;
            margin: 35px auto 60px;
            padding: 0 25px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin: 0;
        }

        .page-subtitle {
            color: var(--cafe-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .btn-luxury-outline {
            background: #ffffff;
            color: var(--cafe-primary-dark);
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            padding: 9px 18px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-luxury-outline:hover {
            background: var(--cafe-gold-light);
            border-color: var(--cafe-gold);
            color: var(--cafe-primary-dark);
        }

        .order-grid {
            display: grid;
            grid-template-columns: 1.45fr 0.75fr;
            gap: 25px;
            align-items: start;
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow-luxury);
        }

        .card-header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--cafe-muted);
            margin-bottom: 20px;
        }

        .details-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .details-table thead th {
            background: #FAF8F5;
            color: var(--cafe-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid var(--cafe-border);
            white-space: nowrap;
        }
        .details-table tbody td {
            padding: 14px 12px;
            border-bottom: 1px solid #F5EFEB;
            vertical-align: middle;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            padding: 8px 12px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .row-number {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .remove-button {
            border-radius: 8px;
            font-size: 12px;
            padding: 6px 12px;
            font-weight: 600;
        }

        .summary-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            padding: 24px;
            position: sticky;
            top: 20px;
            box-shadow: var(--shadow-luxury);
        }

        .summary-product {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #F5EFEB;
        }
        .summary-product:last-child {
            border-bottom: none;
        }
        .summary-product-discount {
            font-size: 12px;
            color: #DC2626;
            font-weight: 600;
        }
        .summary-product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--cafe-dark);
        }
        .summary-product-quantity {
            color: var(--cafe-muted);
            font-size: 13px;
        }
        .summary-product-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }

        .summary-divider {
            border-top: 1px solid var(--cafe-border);
            margin: 18px 0;
        }

        .total-label {
            font-size: 18px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }
        .total-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
        }

        .btn-luxury-save {
            background: linear-gradient(135deg, var(--cafe-primary) 0%, var(--cafe-primary-dark) 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 11px 22px;
            font-weight: 600;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 14px rgba(92, 61, 46, 0.2);
            transition: all 0.25s ease;
        }
        .btn-luxury-save:hover {
            opacity: 0.93;
            transform: translateY(-1px);
            color: #ffffff;
        }

        #totalAmountDisplay {
            display: none;
        }

        @media (max-width: 1000px) {
            .order-grid {
                grid-template-columns: 1fr;
            }
            .summary-card {
                position: static;
            }
        }
    </style>
</head>

<body>

    <div class="order-container">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="page-title">Add Order</h1>
                <div class="page-subtitle">Confirm products, adjust quantities and finalize creation.</div>
            </div>
            <a th:href="@{/order-with-details}" class="btn btn-luxury-outline">
                <i class="bi bi-arrow-left me-1"></i> Back to Orders
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger rounded-3">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/order-with-details/save}" method="post">
            <div class="order-grid">

                <!-- Left Column: Details -->
                <div class="luxury-card">
                    <div class="card-header-title">Order Details</div>
                    <div class="card-subtitle">Review selected items, update quantity or add custom notes.</div>

                    <div class="table-responsive">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th style="width: 8%;">No.</th>
                                    <th style="width: 40%;">Product & Variant</th>
                                    <th style="width: 18%;">Quantity</th>
                                    <th style="width: 24%;">Remark</th>
                                    <th style="width: 10%; text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="orderDetailsTable">
                                <tr th:each="detail, stat : ${orderDetailsDto.orderDetails}">
                                    <td>
                                        <div class="row-number" th:text="${stat.count}">1</div>
                                    </td>
                                    <td>
                                        <span class="selected-product fw-semibold"
                                              th:each="product : ${products}"
                                              th:if="${product.product_id == detail.product_id}"
                                              th:text="${product.type_name + ' - ' + product.size_code}"
                                              th:attr="data-price=${product.price},
                                                       data-discount=${product.discount_values != null and !product.discount_values.isEmpty() ? product.discount_values[0] : 0},
                                                       data-product-name=${product.type_name + ' - ' + product.size_code}">
                                        </span>
                                        <input type="hidden"
                                               th:name="|orderDetails[${stat.index}].product_id|"
                                               th:value="${detail.product_id}">
                                    </td>
                                    <td>
                                        <input type="number"
                                               th:name="'orderDetails[' + ${stat.index} + '].quantity'"
                                               class="form-control quantity-input" min="1"
                                               th:value="${detail.quantity}" required>
                                    </td>
                                    <td>
                                        <input type="text"
                                               th:name="'orderDetails[' + ${stat.index} + '].remark'"
                                               class="form-control" placeholder="Optional notes"
                                               th:value="${detail.remark}">
                                    </td>
                                    <td class="text-end">
                                        <button type="button"
                                                class="btn btn-outline-danger remove-button"
                                                onclick="removeProduct(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Right Column: Summary Card -->
                <div>
                    <div class="summary-card">
                        <div class="card-header-title mb-3">Order Summary</div>
                        
                        <div id="summaryProducts">
                            <div class="text-muted text-center py-4 small">No product selected.</div>
                        </div>

                        <div class="summary-divider"></div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="total-label">Total Amount</span>
                            <span class="total-value">
                                <span id="summaryTotal">0.00</span> <span style="font-size: 15px;">Ks</span>
                            </span>
                        </div>

                        <input type="hidden" name="total_amount" id="totalAmount" value="0.00">
                        <input type="text" id="totalAmountDisplay" value="0.00" readonly>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/staff/products}" class="btn btn-luxury-outline">Cancel</a>
                            <button type="submit" class="btn btn-luxury-save">
                                <i class="bi bi-check2-circle me-1"></i> Save Order
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </form>

    </div>

    <script>
        function calculateTotal() {
            let total = 0;
            const summary = document.getElementById("summaryProducts");
            summary.innerHTML = "";

            const rows = document.querySelectorAll("#orderDetailsTable tr");
            let hasProduct = false;

            rows.forEach(function(row) {
                const product = row.querySelector(".selected-product");
                const quantity = row.querySelector(".quantity-input");

                if (!product || !quantity) return;

                const price = parseFloat(product.getAttribute("data-price")) || 0;
                const discount = parseFloat(product.getAttribute("data-discount")) || 0;
                const qty = parseInt(quantity.value) || 0;

                const subtotal = price * qty;
                const discountAmount = subtotal * discount / 100;
                const finalAmount = subtotal - discountAmount;

                total += finalAmount;
                hasProduct = true;

                const item = document.createElement("div");
                item.className = "summary-product";

                const info = document.createElement("div");

                if (discount > 0) {
                    const discountLabel = document.createElement("div");
                    discountLabel.className = "summary-product-discount";
                    discountLabel.innerText = discount + "% off";
                    info.appendChild(discountLabel);
                }

                const name = document.createElement("div");
                name.className = "summary-product-name";
                name.innerText = product.getAttribute("data-product-name");
                info.appendChild(name);

                const qtyLabel = document.createElement("div");
                qtyLabel.className = "summary-product-quantity";
                qtyLabel.innerText = "Qty × " + qty;
                info.appendChild(qtyLabel);

                const amount = document.createElement("div");
                amount.className = "summary-product-price";
                amount.innerText = finalAmount.toFixed(2) + " Ks";

                item.appendChild(info);
                item.appendChild(amount);
                summary.appendChild(item);
            });

            if (!hasProduct) {
                summary.innerHTML = '<div class="text-muted text-center py-4 small">No product selected.</div>';
            }

            document.getElementById("summaryTotal").innerText = total.toFixed(2);
            document.getElementById("totalAmount").value = total.toFixed(2);
            document.getElementById("totalAmountDisplay").value = total.toFixed(2);
        }

        function removeProduct(button) {
            button.closest("tr").remove();
            updateIndexes();
            calculateTotal();
        }

        function updateIndexes() {
            const rows = document.querySelectorAll("#orderDetailsTable tr");
            rows.forEach(function(row, index) {
                const number = row.querySelector(".row-number");
                if (number) number.innerText = index + 1;

                const productId = row.querySelector("input[type='hidden']");
                if (productId) productId.name = "orderDetails[" + index + "].product_id";

                const quantity = row.querySelector(".quantity-input");
                if (quantity) quantity.name = "orderDetails[" + index + "].quantity";

                const remark = row.querySelector("input[type='text']");
                if (remark) remark.name = "orderDetails[" + index + "].remark";
            });
        }

        document.addEventListener("input", function(event) {
            if (event.target.classList.contains("quantity-input")) {
                calculateTotal();
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            updateIndexes();
            calculateTotal();
        });
    </script>
</body>
</html>
