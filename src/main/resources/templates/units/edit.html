<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Measurement Unit | Coffee Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --coffee-main: #5c3d2e;
            --coffee-hover: #452b1f;
            --coffee-accent: #b88654;
            --coffee-bg: #f9f6f0;
            --coffee-card-border: #ebdcd0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--coffee-bg);
            color: #3b2c24;
        }

        .lux-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid var(--coffee-card-border);
            box-shadow: 0 12px 35px rgba(92, 61, 46, 0.06);
        }

        .form-control:focus {
            border-color: var(--coffee-accent);
            box-shadow: 0 0 0 0.25rem rgba(184, 134, 84, 0.2);
        }

        .form-check-input:checked {
            background-color: var(--coffee-main);
            border-color: var(--coffee-main);
        }

        .switch-container {
            background: #fbf8f5;
            border: 1px solid var(--coffee-card-border);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Save Unit အရောင်အတိုင်း ပြောင်းလဲထားသော ခလုတ် Style */
        .btn-coffee {
            background-color: #d97925;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            padding: 9px 24px;
            transition: all 0.2s ease;
        }
        .btn-coffee:hover {
            background-color: #c46819;
            color: #ffffff;
        }
    </style>
</head>
<body class="py-5">
    <div layout:fragment="content">
        <div class="card lux-card p-4 p-md-5 mx-auto" style="max-width: 520px;">
            <!-- Header Section -->
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="p-2 rounded-3 text-white" style="background-color: var(--coffee-accent);">
                    <i class="bi bi-pencil-square fs-5"></i>
                </div>
                <div>
                    <h5 class="fw-bold mb-0" style="color: var(--coffee-main);">Edit Measurement Unit</h5>
                    <p class="text-muted small mb-0">Update unit information and active status.</p>
                </div>
            </div>

            <!-- Edit Form -->
            <form th:action="@{/units/edit/{id}(id=${unit.unit_id})}" th:object="${unit}" method="post">
                <input type="hidden" th:field="*{unit_id}">

                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">UNIT ID</label>
                    <input type="text" class="form-control bg-light py-2" 
                           th:value="${unit.unit_id}" disabled>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold small text-secondary">UNIT NAME</label>
                    <input type="text" class="form-control py-2" id="name"
                           th:field="*{name}" placeholder="e.g., Kilogram" required>
                </div>

                <div class="mb-3">
                    <label for="abbreviation" class="form-label fw-bold small text-secondary">ABBREVIATION</label>
                    <input type="text" class="form-control py-2" id="abbreviation"
                           th:field="*{abbreviation}" placeholder="e.g., kg" required>
                </div>

                <!-- Active Toggle Switch -->
                <div class="mb-4">
                    <div class="switch-container">
                        <label class="form-label fw-bold small text-secondary mb-0" for="activeSwitch">ACTIVE STATUS</label>
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input fs-5" type="checkbox" role="switch" 
                                   th:field="*{is_active}" id="activeSwitch">
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/units}" class="btn btn-outline-secondary px-3">
                        <i class="bi bi-x-lg me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-coffee">
                        Update Unit
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
