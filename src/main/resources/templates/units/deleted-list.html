<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleted Units - Café Luft</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-espresso: #1a0b05;
            --caramel: #e28e44;
            --caramel-soft: #fcf4ec;
            --cream-bg: #f9f5f1;
            --card-border: #ede0d4;
            --text-dark: #20130b;
            --text-muted: #856e62;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
        }

        .main-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(26, 11, 5, 0.05);
            border: 1px solid var(--card-border);
            padding: 35px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 800;
            color: #b03a2e;
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 0;
        }

        .page-title i {
            color: #c0392b;
            background: #fdf2f2;
            padding: 12px;
            border-radius: 14px;
            font-size: 20px;
            border: 1px solid #f9d5d5;
        }

        .btn-back {
            background: #f4ece4;
            color: var(--cafe-espresso);
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-back:hover {
            background: #ebdccf;
            transform: translateY(-2px);
        }

        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .custom-table thead tr th {
            background: #f5ece3;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 15px 20px;
            border: none;
        }

        .custom-table thead tr th:first-child { border-radius: 14px 0 0 14px; }
        .custom-table thead tr th:last-child { border-radius: 0 14px 14px 0; }

        .custom-table tbody tr {
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .custom-table tbody tr:hover {
            background: #fefcf9;
            box-shadow: 0 5px 18px rgba(26, 11, 5, 0.06);
            transform: translateY(-1px);
        }

        .custom-table td {
            padding: 16px 20px;
            vertical-align: middle;
            border-top: 1px solid #f6eee7;
            border-bottom: 1px solid #f6eee7;
            font-size: 14.5px;
        }

        .custom-table td:first-child {
            border-left: 1px solid #f6eee7;
            border-radius: 14px 0 0 14px;
        }

        .custom-table td:last-child {
            border-right: 1px solid #f6eee7;
            border-radius: 0 14px 14px 0;
        }

        .unit-abbr-tag {
            background: #fbf4ee;
            color: var(--caramel);
            border: 1px solid #edd9c8;
            padding: 5px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            display: inline-block;
        }

        .btn-restore {
            background: #eafaf1;
            color: #27ae60;
            border: 1px solid #abebc6;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-restore:hover {
            background: #27ae60;
            color: #ffffff;
        }

        .btn-purge {
            background: #fdf2f2;
            color: #c0392b;
            border: 1px solid #f5b7b1;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-left: 6px;
            transition: all 0.2s ease;
        }

        .btn-purge:hover {
            background: #c0392b;
            color: #ffffff;
        }
    </style>
</head>

<body>

   <div layout:fragment="content">
        
        <div class="page-header">
            <h1 class="page-title">
                <i class="fa-solid fa-trash-arrow-up"></i> Unit Deleted-List
            </h1>
            <a th:href="@{/units}" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Back to Unit List
            </a>
        </div>

        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">#</th>
                        <th>UNIT NAME</th>
                        <th>ABBREVIATION</th>
                        <th class="text-end" style="width: 240px;">ACTION</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="unit, stat : ${units}">
                        <td class="text-muted fw-bold" th:text="${stat.count}">1</td>
                        <td>
                            <strong class="text-dark fs-6" th:text="${unit.name}">Kilogram</strong>
                        </td>
                        <td>
                            <span class="unit-abbr-tag" th:text="${unit.abbreviation}">kg</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/units/restore}" method="post" style="display: inline;">
                                <input type="hidden" name="id" th:value="${unit.unit_id}">
                                <button type="submit" class="btn-restore">
                                    <i class="fa-solid fa-rotate-left me-1"></i> Restore
                                </button>
                            </form>
                            <form th:action="@{/units/real-delete}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to permanently delete this unit?');">
                                <input type="hidden" name="id" th:value="${unit.unit_id}">
                                <button type="submit" class="btn-purge">
                                    <i class="fa-solid fa-trash me-1"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(units)}">
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-box-open fa-2x mb-3 text-secondary d-block"></i>
                            No deleted units found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
