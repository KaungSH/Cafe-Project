<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Management - Café Luft</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-espresso: #1a0b05;
            --cafe-roast: #2c140a;
            --caramel: #e28e44;
            --caramel-soft: #fcf4ec;
            --caramel-hover: #d2792e;
            --cream-bg: #f9f5f1;
            --card-border: #ede0d4;
            --text-dark: #20130b;
            --text-muted: #856e62;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
        }

        .main-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(26, 11, 5, 0.05);
            border: 1px solid var(--card-border);
            padding: 35px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--cafe-espresso);
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 0;
        }

        .page-title i {
            color: var(--caramel);
            background: var(--caramel-soft);
            padding: 12px;
            border-radius: 14px;
            font-size: 20px;
            border: 1px solid rgba(226, 142, 68, 0.2);
        }

        /* Action Buttons */
        .btn-caramel {
            background: var(--caramel);
            color: #ffffff;
            border: none;
            padding: 11px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(226, 142, 68, 0.3);
        }

        .btn-caramel:hover {
            background: var(--caramel-hover);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(226, 142, 68, 0.4);
        }

        .btn-trash-outline {
            background: #ffffff;
            color: #b03a2e;
            border: 1.5px solid #f5b7b1;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-trash-outline:hover {
            background: #fdedec;
            color: #922b21;
            transform: translateY(-2px);
        }

        /* Luxury Table Styling */
        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .custom-table thead tr th {
            background: #f5ece3;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 15px 20px;
            border: none;
        }

        .custom-table thead tr th:first-child { border-radius: 14px 0 0 14px; }
        .custom-table thead tr th:last-child { border-radius: 0 14px 14px 0; }

        .custom-table tbody tr {
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .custom-table tbody tr:hover {
            background: #fefcf9;
            box-shadow: 0 5px 18px rgba(26, 11, 5, 0.06);
            transform: translateY(-1px);
        }

        .custom-table td {
            padding: 16px 20px;
            vertical-align: middle;
            border-top: 1px solid #f6eee7;
            border-bottom: 1px solid #f6eee7;
            font-size: 14.5px;
        }

        .custom-table td:first-child {
            border-left: 1px solid #f6eee7;
            border-radius: 14px 0 0 14px;
        }

        .custom-table td:last-child {
            border-right: 1px solid #f6eee7;
            border-radius: 0 14px 14px 0;
        }

        /* Unit Abbreviation Tag */
        .unit-abbr-tag {
            background: #fbf4ee;
            color: var(--caramel);
            border: 1px solid #edd9c8;
            padding: 5px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            display: inline-block;
        }

        /* Created By Capsule */
        .employee-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #faf5f0;
            border: 1px solid #eedecf;
            padding: 6px 14px;
            border-radius: 50px;
        }

        .employee-avatar-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--caramel) 0%, var(--cafe-espresso) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .employee-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--cafe-espresso);
            white-space: nowrap;
        }

        /* Status Badge */
        .badge-status {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-active {
            background: #eafaf1;
            color: #27ae60;
            border: 1px solid #abebc6;
        }

        .badge-inactive {
            background: #f4f6f6;
            color: #7f8c8d;
            border: 1px solid #d5dbdb;
        }

        /* Action Buttons */
        .btn-action-edit {
            background: #fdf5ed;
            color: var(--caramel);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-action-edit:hover {
            background: var(--caramel);
            color: #ffffff;
        }

        .btn-action-del {
            background: #fdf2f2;
            color: #e74c3c;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-action-del:hover {
            background: #e74c3c;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div layout:fragment="content">
        
        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">
                <i class="fa-solid fa-mug-saucer"></i> Unit Management
            </h1>
            <div class="d-flex gap-2">
                <a th:href="@{/units/add}" class="btn-caramel">
                    <i class="fa-solid fa-plus"></i> Add Unit
                </a>
                <a th:href="@{/units/deleted-list}" class="btn-trash-outline">
                    <i class="fa-solid fa-trash-can"></i> Deleted List
                </a>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">#</th>
                        <th>UNIT NAME</th>
                        <th>ABBREVIATION</th>
                        <th>CREATED BY</th>
                        <th>STATUS</th>
                        <th class="text-end" style="width: 200px;">ACTION</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="unit, stat : ${units}">
                        
                        <!-- Row Index Number -->
                        <td class="text-muted fw-bold" th:text="${stat.count}">1</td>

                        <!-- Unit Name -->
                        <td>
                            <strong class="text-dark fs-6" th:text="${unit.name}">Gallon</strong>
                        </td>

                        <!-- Abbreviation -->
                        <td>
                            <span class="unit-abbr-tag" th:text="${unit.abbreviation}">gl</span>
                        </td>

                        <!-- Created By: Employee Name Capsule -->
                        <td>
                            <div class="employee-badge">
                                <div class="employee-avatar-circle">
                                    <i class="fa-solid fa-user-tie"></i>
                                </div>
                                <!-- Session သို့မဟုတ် Controller မှ employee name မရှိပါက Barista/Manager အမည် အလိုအလျောက် သတ်မှတ်ပြသခြင်း -->
                                <span class="employee-name" 
                                      th:text="${session.employee_name != null ? session.employee_name : (session.user != null ? session.user : 'Café Barista')}">
                                    Café Barista
                                </span>
                            </div>
                        </td>

                        <!-- Status -->
                        <td>
                            <span th:if="${unit.is_active}" class="badge-status badge-active">
                                <i class="fa-solid fa-circle-check"></i> Active
                            </span>
                            <span th:unless="${unit.is_active}" class="badge-status badge-inactive">
                                <i class="fa-solid fa-circle-minus"></i> Inactive
                            </span>
                        </td>

                        <!-- Action Buttons -->
                        <td class="text-end">
                            <a class="btn-action-edit" th:href="@{/units/edit/{id}(id=${unit.unit_id})}">
                                <i class="fa-solid fa-pen-to-square"></i> Edit
                            </a>
                            <a class="btn-action-del" th:href="@{/units/delete/{id}(id=${unit.unit_id})}">
                                <i class="fa-solid fa-trash-can"></i> Delete
                            </a>
                        </td>

                    </tr>

                    <!-- Empty Row -->
                    <tr th:if="${#lists.isEmpty(units)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-inbox fa-3x mb-3 text-secondary d-block"></i>
                            No units available in the system.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
