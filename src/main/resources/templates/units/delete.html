<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Unit - Café Luft</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-espresso: #1a0b05;
            --caramel: #e28e44;
            --cream-bg: #f9f5f1;
            --card-border: #ede0d4;
            --text-dark: #20130b;
            --text-muted: #856e62;
            --danger-tint: #c0392b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            margin: 0;
        }

        .confirm-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(26, 11, 5, 0.06);
            border: 1px solid var(--card-border);
            padding: 40px 35px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .danger-icon-box {
            width: 70px;
            height: 70px;
            background: #fdf2f2;
            color: var(--danger-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-size: 30px;
            margin: 0 auto 18px auto;
            border: 1px solid #f9d5d5;
        }

        .confirm-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--cafe-espresso);
            margin-bottom: 8px;
        }

        .confirm-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .unit-preview-box {
            background: #faf6f2;
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 25px;
        }

        .unit-preview-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--cafe-espresso);
        }

        .btn-danger-confirm {
            background: var(--danger-tint);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(192, 57, 43, 0.25);
        }

        .btn-danger-confirm:hover {
            background: #a93226;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #f4ece4;
            color: var(--text-muted);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: #ebdccf;
            color: var(--cafe-espresso);
        }
    </style>
</head>

<body>

    <div class="confirm-card">
        <div class="danger-icon-box">
            <i class="fa-solid fa-trash-can"></i>
        </div>
        <h2 class="confirm-title">Delete Unit</h2>
        <p class="confirm-desc">Are you sure you want to move this unit to the deleted list? You can restore it later if needed.</p>

        <form th:action="@{/units/delete}" th:object="${unit}" method="post">
            <input type="hidden" th:field="*{unit_id}">

            <div class="unit-preview-box">
                <span class="unit-preview-name" th:text="${unit.name}">Kilogram</span>
                <span class="badge bg-light text-dark border ms-2" th:text="${unit.abbreviation}">kg</span>
            </div>

            <button type="submit" class="btn-danger-confirm">
                <i class="fa-solid fa-trash-can me-2"></i>Yes, Delete
            </button>
            <a th:href="@{/units}" class="btn-cancel">Cancel</a>
        </form>
    </div>

</body>
</html>
