<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Management - Café Luft</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
     <!-- Styling -->
        <style>
            :root {
                --cafe-espresso: #1a0b05;
                --cafe-roast: #2c140a;
                --caramel: #e28e44;
                --caramel-soft: #fcf4ec;
                --cream-bg: #f9f5f1;
                --card-border: #ede0d4;
                --text-dark: #20130b;
                --text-muted: #856e62;
            }

            /* Top Header */
            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 28px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .page-title {
                font-size: 24px;
                font-weight: 800;
                color: var(--cafe-espresso);
                display: flex;
                align-items: center;
                gap: 14px;
                margin: 0;
            }

            .page-title i {
                color: var(--caramel);
                background: var(--caramel-soft);
                padding: 12px;
                border-radius: 14px;
                font-size: 20px;
                border: 1px solid rgba(226, 142, 68, 0.2);
            }

            /* Flat Table Styling */
            .custom-table {
                width: 100%;
                border-collapse: collapse !important;
            }

            .custom-table thead tr th {
                background: #f5ece3;
                color: var(--text-muted);
                font-weight: 800;
                font-size: 11.5px;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                padding: 15px 20px;
                border: none !important;
            }

            .custom-table thead tr th:first-child {
                border-radius: 12px 0 0 12px;
            }

            .custom-table thead tr th:last-child {
                border-radius: 0 12px 12px 0;
            }

            .custom-table tbody tr {
                background: transparent !important;
                box-shadow: none !important;
                transition: background 0.2s ease;
            }

            .custom-table tbody tr:hover {
                background: rgba(226, 142, 68, 0.06) !important;
            }

            .custom-table td {
                padding: 16px 20px;
                vertical-align: middle;
                font-size: 14.5px;
                border: none !important;
                border-bottom: 1px solid #eedecf !important;
            }

            /* Unit Abbreviation Tag */
            .unit-abbr-tag {
                background: #fbf4ee;
                color: var(--caramel);
                border: 1px solid #edd9c8;
                padding: 5px 14px;
                border-radius: 10px;
                font-weight: 800;
                font-size: 13px;
                display: inline-block;
            }

            /* Created By Capsule */
            .employee-badge {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                background: #faf5f0;
                border: 1px solid #eedecf;
                padding: 6px 14px;
                border-radius: 50px;
            }

            .employee-avatar-circle {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: linear-gradient(
                    135deg,
                    var(--caramel) 0%,
                    var(--cafe-espresso) 100%
                );
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                flex-shrink: 0;
            }

            .employee-name {
                font-size: 13.5px;
                font-weight: 700;
                color: var(--cafe-espresso);
                white-space: nowrap;
            }

            /* Status Badge */
            .badge-status {
                padding: 6px 14px;
                border-radius: 30px;
                font-size: 12.5px;
                font-weight: 700;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .badge-active {
                background: #eafaf1;
                color: #27ae60;
                border: 1px solid #abebc6;
            }

            .badge-inactive {
                background: #f4f6f6;
                color: #7f8c8d;
                border: 1px solid #d5dbdb;
            }
        </style>
</head>

<body>

    <div layout:fragment="content">

        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">
                <i class="fa-solid fa-mug-saucer"></i>
                Unit Management
            </h1>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">#</th>
                        <th>UNIT NAME</th>
                        <th>ABBREVIATION</th>
                        <th>CREATED BY</th>
                        <th>STATUS</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="unit, stat : ${units}">
                        <!-- Row Index Number -->
                        <td class="text-muted fw-bold" th:text="${stat.count}">
                            1
                        </td>

                        <!-- Unit Name -->
                        <td>
                            <strong class="text-dark fs-6" th:text="${unit.name}">
                                Gallon
                            </strong>
                        </td>

                        <!-- Abbreviation -->
                        <td>
                            <span class="unit-abbr-tag" th:text="${unit.abbreviation}">
                                gl
                            </span>
                        </td>

                        <!-- Created By -->
                        <td>
                            <div class="employee-badge">
                                <div class="employee-avatar-circle">
                                    <i class="fa-solid fa-user-tie"></i>
                                </div>
                                <span class="employee-name" th:text="${unit.employee_name}">
                                </span>
                            </div>
                        </td>

                        <!-- Status -->
                        <td>
                            <span th:if="${unit.is_active}" class="badge-status badge-active">
                                <i class="fa-solid fa-circle-check"></i>
                                Active
                            </span>
                            <span th:unless="${unit.is_active}" class="badge-status badge-inactive">
                                <i class="fa-solid fa-circle-minus"></i>
                                Inactive
                            </span>
                        </td>
                    </tr>

                    <!-- Empty Row -->
                    <tr th:if="${#lists.isEmpty(units)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-inbox fa-3x mb-3 text-secondary d-block"></i>
                            No units available in the system.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
