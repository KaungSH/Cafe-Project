<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Unit - Café Luft</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-espresso: #1a0b05;
            --caramel: #e28e44;
            --caramel-soft: #fcf4ec;
            --caramel-hover: #d2792e;
            --cream-bg: #f9f5f1;
            --card-border: #ede0d4;
            --text-dark: #20130b;
            --text-muted: #856e62;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            margin: 0;
        }

        .form-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(26, 11, 5, 0.06);
            border: 1px solid var(--card-border);
            padding: 40px;
            width: 100%;
            max-width: 480px;
        }

        .form-icon-box {
            width: 65px;
            height: 65px;
            background: var(--caramel-soft);
            color: var(--caramel);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            font-size: 26px;
            margin: 0 auto 16px auto;
            border: 1px solid rgba(226, 142, 68, 0.2);
        }

        .form-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--cafe-espresso);
            text-align: center;
            margin-bottom: 6px;
        }

        .form-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--cafe-espresso);
            margin-bottom: 8px;
        }

        .custom-input {
            border: 1.5px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            background-color: #fdfbf9;
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            background-color: #ffffff;
            border-color: var(--caramel);
            box-shadow: 0 0 0 4px rgba(226, 142, 68, 0.15);
        }

        .switch-container {
            background: #fbf6f1;
            border: 1px solid #eedecf;
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .form-check-input:checked {
            background-color: var(--caramel);
            border-color: var(--caramel);
        }

        .btn-caramel-submit {
            background: var(--caramel);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(226, 142, 68, 0.3);
        }

        .btn-caramel-submit:hover {
            background: var(--caramel-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #f4ece4;
            color: var(--text-muted);
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: #ebdccf;
            color: var(--cafe-espresso);
        }
    </style>
</head>

<body>
<div layout:fragment="content" >
    <div class="card mx-auto shadow-sm p-4 p-md-5" 
         style="max-width: 480px; border-radius: 28px; border: 1px solid #ede0d4; background-color: #ffffff;">
        
        <div class="form-icon-box" style="width: 65px; height: 65px; background: #fcf4ec; color: #e28e44; display: flex; align-items: center; justify-content: center; border-radius: 18px; font-size: 26px; margin: 0 auto 16px auto; border: 1px solid rgba(226, 142, 68, 0.2);">
            <i class="fa-solid fa-plus"></i>
        </div>
        <h2 class="form-title text-center fw-bold" style="color: #1a0b05; font-size: 22px;">Add Measurement Unit</h2>
        <p class="form-subtitle text-center mb-4" style="color: #856e62; font-size: 13px;">Create a new unit for coffee ingredients and stocks</p>

        <form th:action="@{/admin/units/add}" th:object="${unit}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 13px; color: #1a0b05;">Unit Name</label>
                <input type="text" class="form-control custom-input" th:field="*{name}" placeholder="Example: Kilogram" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 13px; color: #1a0b05;">Abbreviation</label>
                <input type="text" class="form-control custom-input" th:field="*{abbreviation}" placeholder="Example: kg" required>
            </div>

            <div class="switch-container">
                <label class="form-label mb-0 fw-bold" for="activeSwitch" style="font-size: 13px; color: #1a0b05;">Active Status</label>
                <div class="form-check form-switch m-0">
                    <input class="form-check-input fs-5" type="checkbox" role="switch" th:field="*{is_active}" id="activeSwitch">
                </div>
            </div>

            <button type="submit" class="btn-caramel-submit">
                <i class="fa-solid fa-floppy-disk me-2"></i>Save Unit
            </button>
            <a th:href="@{/units}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
