<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Categories | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .branch-dashboard-wrapper {
            width: 95%;
            max-width: 1350px;
            margin: 35px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-title-box p {
            font-size: 13px;
            color: #8C7B6C;
            margin: 2px 0 0 0;
        }

        .btn-add-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF !important;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(88, 55, 24, 0.2);
        }

        .btn-add-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
        }

        /* Luxury Card Table */
        .luxury-table-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #FAF5EE;
            color: #796450;
            padding: 15px 18px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 18px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .id-badge {
            background-color: #F8F4EE;
            color: #7D5127;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid #EADBCC;
            display: inline-block;
        }

        .branch-name {
            font-weight: 700;
            color: #2B1D14;
        }

        /* ================= Edit & Delete Buttons Style ================= */
        .action-pill-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .btn-pill-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 78px;
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Edit Pill Button */
        .btn-pill-edit {
            background-color: #FBF6EE;
            color: #8C5332 !important;
            border: 1px solid #E8D9C8;
        }

        .btn-pill-edit:hover {
            background-color: #F2E7D5;
            color: #5C3218 !important;
            border-color: #D9C3A8;
        }

        /* Delete Pill Button */
        .btn-pill-delete {
            background-color: #FFF5F4;
            color: #A3281D !important;
            border: 1px solid transparent;
        }

        .btn-pill-delete:hover {
            background-color: #FFE6E4;
            color: #7A1910 !important;
        }

        .btn-pill-action i {
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="branch-dashboard-wrapper">
        
        <!-- Header matching Branch Management -->
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="fa-solid fa-tags"></i>
                </div>
                <div>
                    <h2>Expense Categories</h2>
                    <p>Overview of spending classifications & accounting categories for Café Luft</p>
                </div>
            </div>

            <a th:href="@{/admin/expensecategory/add}" class="btn-add-primary">
                <i class="fa-solid fa-plus"></i> Add New Category
            </a>
        </div>

        <!-- Luxury Table matching Branch Management -->
        <div class="luxury-table-card">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 80px;">No</th>
                        <th>Category Name</th>
                        <th class="text-end" style="width: 120px;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="category, stat : ${expense}">
                        <td><span class="id-badge" th:text="${stat.count}">1</span></td>
                        <td><span class="branch-name" th:text="${category.category_name}">Consumables</span></td>
                        <td class="text-end">
                            <div class="action-pill-group">
                                <a th:href="@{/admin/expensecategory/edit/{id}(id=${category.expense_category_id})}" 
                                   class="btn-pill-action btn-pill-edit" title="Edit Category">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit
                                </a>
                                <form th:action="@{/admin/expensecategory/delete/{id}(id=${category.expense_category_id})}" 
                                      method="post" class="m-0" 
                                      onsubmit="return confirm('Are you sure you want to delete this category?');">
                                    <button type="submit" class="btn-pill-action btn-pill-delete" title="Delete Category">
                                        <i class="fa-solid fa-trash-can"></i> Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(expense)}">
                        <td colspan="3" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-tags fs-2 d-block mb-2 text-secondary opacity-50"></i>
                            No expense categories found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</body>
</html>
