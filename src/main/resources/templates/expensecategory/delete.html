<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Delete Category</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #f7f3ee;
  color: #1e130c;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.delete-card {
  width: 480px;
  max-width: 95%;
  background-color: #ffffff;
  padding: 35px 30px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid #ebdcd0;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
}

.warning-icon {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #fdf2f2;
  color: #c93b3b;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  margin-bottom: 18px;
  border: 1px solid #f6cfcf;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 8px;
}

.info-pill {
  background: #faf5ef;
  border: 1px solid #ede1d3;
  border-radius: 12px;
  padding: 14px;
  margin: 20px 0;
  text-align: left;
}

.btn-cancel {
  border: 1px solid #ddd;
  background-color: white;
  color: #555;
  padding: 10px 22px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 500;
}

.btn-delete {
  background-color: #b83232;
  color: white;
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.2s;
}

.btn-delete:hover {
  background-color: #9c2727;
  color: white;
}
</style>
</head>

<body>

<div layout:fragment="content">
  <div class="warning-icon">
    <i class="bi bi-exclamation-triangle"></i>
  </div>

  <h3 class="title">Delete Expense Category?</h3>
  <p class="text-muted small">Are you sure you want to permanently remove this category? This action cannot be reversed.</p>

  <div class="info-pill">
    <div class="small text-muted mb-1">Category Details:</div>
    <div class="d-flex justify-content-between mb-1">
      <span class="text-secondary">Category ID:</span>
      <strong th:text="${expensecategory.expense_category_id}">#001</strong>
    </div>
    <div class="d-flex justify-content-between">
      <span class="text-secondary">Name:</span>
      <strong th:text="${expensecategory.category_name}">Consumables</strong>
    </div>
  </div>

  <div class="d-flex justify-content-center gap-2 mt-3">
    <a th:href="@{/admin/expensecategory}" class="btn-cancel">Cancel</a>
    <form th:action="@{/admin/expensecategory/delete/{id}(id=${expensecategory.expense_category_id})}" method="post">
      <button type="submit" class="btn-delete"><i class="bi bi-trash3 me-1"></i> Confirm Delete</button>
    </form>
  </div>
</div>

</body>
</html>
