<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Add Expense Category</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root {
  --espresso: #1a0f09;
  --accent-gold: #c59b63;
  --border-tone: #e8d9cb;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #f7f3ee;
  color: var(--espresso);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 15px;
}

.luxury-card {
  max-width: 820px;
  width: 100%;
  background: #ffffff;
  border-radius: 24px;
  border: 1px solid var(--border-tone);
  box-shadow: 0 20px 45px rgba(26, 15, 9, 0.08);
  overflow: hidden;
  display: flex;
}

.visual-side {
  width: 40%;
  background: linear-gradient(to bottom, rgba(26, 15, 9, 0.5), rgba(26, 15, 9, 0.85)),
              url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80') center/cover;
  padding: 40px 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #ffffff;
}

.logo-circle {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #ffffff;
  padding: 2px;
  border: 2px solid var(--accent-gold);
  margin-bottom: 20px;
}

.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.visual-side h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.85rem;
}

.form-side {
  width: 60%;
  padding: 45px 40px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.form-label {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #6d5b4e;
  margin-bottom: 8px;
}

.form-control {
  height: 50px;
  border-radius: 12px;
  border: 1px solid #dfd1c3;
  background-color: #fcfbfa;
  font-size: 0.95rem;
}

.form-control:focus {
  border-color: var(--accent-gold);
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(197, 155, 99, 0.15);
}

.btn-save {
  background: linear-gradient(135deg, #c59b63 0%, #a4763f 100%);
  color: #fff;
  border: none;
  font-weight: 600;
  border-radius: 12px;
  padding: 12px 28px;
  transition: 0.25s;
}

.btn-save:hover {
  box-shadow: 0 5px 20px rgba(197, 155, 99, 0.35);
  color: #fff;
}

.btn-cancel {
  border: 1px solid #dfd1c3;
  background: transparent;
  color: #7d6b5e;
  font-weight: 500;
  border-radius: 12px;
  padding: 12px 24px;
  text-decoration: none;
  transition: 0.2s;
}

.btn-cancel:hover {
  background: #f7efe7;
  color: var(--espresso);
}

.error {
  color: #b03a2e;
  font-size: 0.82rem;
  margin-top: 5px;
}

@media(max-width: 768px) {
  .luxury-card { flex-direction: column; }
  .visual-side { width: 100%; min-height: 160px; padding: 25px; }
  .form-side { width: 100%; padding: 30px 20px; }
}
</style>
</head>

<body>

<div class="luxury-card">
  <!-- Side Banner -->
  <div class="visual-side">
    <div>
      <div class="logo-circle">
        <img th:src="@{/images/luft-logo.png}" alt="Logo">
      </div>
      <h3>Café Luft</h3>
      <p class="text-white-50 small">Establish custom spending classifications for branch financial clarity.</p>
    </div>
    <div class="small text-white-50"><i class="bi bi-shield-check me-1"></i> Admin Privileges</div>
  </div>

  <!-- Form Side -->
  <div class="form-side">
    <h4 style="font-family: 'Playfair Display', serif; font-weight: 700; margin-bottom: 25px;">Add Expense Category</h4>

    <form th:action="@{/admin/expensecategory/add}" th:object="${expensecategory}" method="post">
      <div class="mb-4">
        <label class="form-label">Category Name</label>
        <input type="text" class="form-control" th:field="*{category_name}" placeholder="e.g. Cleaning & Consumables">
        <div class="error" th:if="${#fields.hasErrors('category_name')}" th:errors="*{category_name}"></div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a th:href="@{/admin/expensecategory}" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-save"><i class="bi bi-check2 me-1"></i> Save Category</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
