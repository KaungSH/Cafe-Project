<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Expense Categories</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root {
  --espresso: #1e130c;
  --dark-roast: #2c1d11;
  --accent-gold: #c59b63;
  --warm-cream: #fbf8f5;
  --border-gold: #eadbc9;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--warm-cream);
  color: var(--espresso);
  min-height: 100vh;
}

.luxury-container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
}

.brand-hero {
  background: linear-gradient(135deg, rgba(30, 19, 12, 0.95), rgba(44, 29, 17, 0.90)), 
              url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80') center/cover;
  border-radius: 20px;
  padding: 28px 35px;
  margin-bottom: 30px;
  box-shadow: 0 15px 35px rgba(30, 19, 12, 0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(197, 155, 99, 0.35);
}

.logo-wrapper {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #ffffff;
  padding: 2px;
  border: 2px solid var(--accent-gold);
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.35);
  flex-shrink: 0;
}

.brand-logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.brand-name {
  font-family: 'Playfair Display', serif;
  color: #ffffff;
  font-size: 2rem;
  margin: 0;
}

.brand-subtext {
  color: var(--accent-gold);
  font-size: 0.85rem;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-top: 4px;
  margin-bottom: 0;
}

.table-card {
  background: #ffffff;
  border-radius: 20px;
  border: 1px solid var(--border-gold);
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(44, 29, 17, 0.04);
}

.table thead {
  background: #f7efe6;
}

.table thead th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--dark-roast);
  padding: 18px 24px;
  border: none;
}

.table tbody tr {
  border-bottom: 1px solid #f3e9df;
}

.table tbody td {
  padding: 18px 24px;
  vertical-align: middle;
  border: none;
}

.badge-id {
  background: #f2e9df;
  color: #5d422a;
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.85rem;
}
</style>
</head>

<body>
<div class="luxury-container">
  <div class="brand-hero">
    <div class="d-flex align-items-center gap-3">
      <div class="logo-wrapper">
        <img th:src="@{/images/luft-logo.png}" alt="Café Luft Logo" class="brand-logo">
      </div>
      <div>
        <h1 class="brand-name">Café Luft</h1>
        <p class="brand-subtext"><i class="bi bi-eye me-1"></i> Expense Categories Directory (View Only)</p>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th style="width: 100px;">No</th>
            <th style="width: 200px;">Category ID</th>
            <th>Category Name</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(expense)}">
            <td colspan="3" class="text-center py-5 text-muted">No Expense Categories Found</td>
          </tr>
          <tr th:each="category, stat : ${expense}">
            <td th:text="${stat.count}">1</td>
            <td><span class="badge-id" th:text="${category.expense_category_id}">#001</span></td>
            <td><strong th:text="${category.category_name}">Consumables</strong></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
