
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Category</title>

<style>
body {
	margin: 0;
	font-family: Arial, sans-serif;
	background: #f4f6f9;
}

.container {
	width: 450px;
	margin: 100px auto;
	background: white;
	padding: 35px;
	border-radius: 12px;
	text-align: center;
	box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}

h2 {
	color: #dc3545;
	margin-bottom: 15px;
}

p {
	color: #555;
	margin-bottom: 25px;
}

.category-name {
	font-weight: bold;
	font-size: 20px;
	margin-bottom: 25px;
}

.buttons {
	display: flex;
	gap: 10px;
	justify-content: center;
}

button, .cancel {
	padding: 12px 25px;
	border: none;
	border-radius: 6px;
	font-size: 15px;
	cursor: pointer;
	text-decoration: none;
}

button {
	background: #dc3545;
	color: white;
}

.cancel {
	background: #6c757d;
	color: white;
}
</style>
</head>

<body>

	<div class="container">

		<h2>Delete Category</h2>

		<p>Are you sure you want to delete this category?</p>

		<div class="category-name" th:text="${category.name}">Category
			Name</div>

		<form th:action="@{/categories/delete/{id}(id=${category.category_id})}"
			method="post">

			<div class="buttons">

				<button type="submit">Yes, Delete</button>

				<a th:href="@{/categories}" class="cancel"> Cancel </a>

			</div>

		</form>

	</div>

</body>
