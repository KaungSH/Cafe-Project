<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payments</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Payments</h2>

        <a th:href="@{/payments/add}"
           class="btn btn-primary">
            + Add Payment
        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                    <tr>
                        <th>Payment ID</th>
                        <th>Order ID</th>
                        <th>Paid Time</th>
                        <th>Method ID</th>
                        <th>Note</th>
                        <th>Date</th>
                        <th>File Path</th>
                        <th>Employee ID</th>
                        <th width="180">Action</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="payment : ${payments}">

                        <td th:text="${payment.payment_id}"></td>

                        <td th:text="${payment.order_id}"></td>

                        <td th:text="${payment.paid_time}"></td>

                        <td th:text="${payment.method_id}"></td>

                        <td th:text="${payment.note}"></td>

                        <td th:text="${payment.date}"></td>

                        <td th:text="${payment.filepath}"></td>

                        <td th:text="${payment.employee_id}"></td>

                        <td>

                            <a
                                th:href="@{/payments/edit/{id}(id=${payment.payment_id})}"
                                class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <a
                                th:href="@{/payments/delete/{id}(id=${payment.payment_id})}"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Are you sure you want to delete this payment?');">
                                Delete
                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(payments)}">

                        <td colspan="9"
                            class="text-center text-muted">
                            No payments found.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
