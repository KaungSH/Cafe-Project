<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Order</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
    <h3 class="mb-4">Edit Order</h3>

    <form th:action="@{/orders/update}" th:object="${order}" method="post">
        <div class="mb-3">
            <label class="form-label">Order ID</label>
            <input type="text" th:field="*{order_id}" class="form-control bg-light" readonly />
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Employee ID</label>
                <input type="text" th:field="*{employee_id}" class="form-control" required />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Customer ID</label>
                <input type="text" th:field="*{customer_id}" class="form-control" required />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Branch ID</label>
                <input type="text" th:field="*{branch_id}" class="form-control" required />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Order Type ID</label>
                <input type="text" th:field="*{order_type_id}" class="form-control" required />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Total Amount</label>
            <input type="number" step="0.01" th:field="*{total_amount}" class="form-control" required />
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/orders}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-warning">Update Order</button>
        </div>
    </form>
</div>

</body>
</html>
