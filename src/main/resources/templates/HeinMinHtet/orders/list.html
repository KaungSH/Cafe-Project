<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm">
    <h3 class="mb-4">Order List</h3>
	 <a th:href="@{/orders/add}" class="btn btn-primary">+ Create New Order</a>
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>Employee ID</th>
                <th>Customer ID</th>
                <th>Branch ID</th>
                <th>Total Amount</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ord : ${orders}">
                <td th:text="${ord.order_id}">ORD-001</td>
                <td th:text="${ord.employee_id}">EMP-01</td>
                <td th:text="${ord.customer_id}">CUST-01</td>
                <td th:text="${ord.branch_id}">BR-01</td>
                <td th:text="${ord.total_amount}">1000.00</td>
                <td>
                    <span th:if="${ord.orderStatus.name() == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                    <span th:if="${ord.orderStatus.name() == 'COMPLETED'}" class="badge bg-success">COMPLETED</span>
                    <span th:if="${ord.orderStatus.name() == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
                </td>
                <td>
                
                    <a th:href="@{/orders/edit/{id}(id=${ord.order_id})}" class="btn btn-sm btn-outline-secondary me-1">Edit</a>
                    <a th:href="@{/orders/delete-confirm/{id}(id=${ord.order_id})}" class="btn btn-sm btn-outline-danger">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
