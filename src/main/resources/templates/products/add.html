<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Product Type - Café Shop</title>

<!-- Fonts & FontAwesome -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

<style>
* {
	box-sizing: border-box;
}

body {
	font-family: 'Plus Jakarta Sans', sans-serif;
	background-color: #f8fafc;
	color: #0f172a;
}

.page-container {
	padding: 24px 32px 48px;
	max-width: 1300px;
	margin: 0 auto;
}

/* Breadcrumb Header */
.header-breadcrumb {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 24px;
	padding-bottom: 16px;
	border-bottom: 1px solid #edf2f7;
}

.breadcrumb-tag {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	font-size: 0.85rem;
	color: #64748b;
	text-decoration: none;
	font-weight: 500;
	transition: color 0.2s;
}

.breadcrumb-tag:hover {
	color: #c2410c;
}

/* Dashboard Card */
.dashboard-card {
	background: #ffffff;
	border-radius: 20px;
	border: 1px solid #edf2f7;
	box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
	overflow: hidden;
}

.sub-panel {
	background: #ffffff;
	border: 1px solid #e2e8f0;
	border-radius: 16px;
	padding: 24px;
	height: 100%;
}

.sub-panel-title {
	font-size: 0.95rem;
	font-weight: 700;
	color: #0f172a;
	margin-bottom: 18px;
	display: flex;
	align-items: center;
	gap: 10px;
}

.sub-panel-title i {
	color: #ea580c;
}

/* Form Styles */
.form-label-caps {
	display: block;
	font-size: 0.72rem;
	font-weight: 700;
	color: #64748b;
	letter-spacing: 0.5px;
	text-transform: uppercase;
	margin-bottom: 6px;
}

.input-rounded {
	width: 100%;
	height: 44px;
	border-radius: 12px;
	border: 1px solid #e2e8f0;
	padding: 8px 16px;
	font-size: 0.88rem;
	color: #1e293b;
	background-color: #f8fafc;
	outline: none;
	transition: all 0.2s;
}

.input-rounded:focus {
	border-color: #c2410c;
	background-color: #ffffff;
	box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.1);
}

.textarea-rounded {
	width: 100%;
	border-radius: 12px;
	border: 1px solid #e2e8f0;
	padding: 12px 16px;
	font-size: 0.88rem;
	color: #1e293b;
	background-color: #f8fafc;
	outline: none;
	resize: none;
	transition: all 0.2s;
}

.textarea-rounded:focus {
	border-color: #c2410c;
	background-color: #ffffff;
	box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.1);
}

/* Upload & Preview */
.image-preview-box {
	display: flex;
	align-items: center;
	gap: 16px;
	background-color: #f8fafc;
	border: 1px dashed #cbd5e1;
	border-radius: 14px;
	padding: 14px 18px;
}

.cover-thumb-preview {
	width: 60px;
	height: 60px;
	border-radius: 12px;
	object-fit: cover;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
	border: 1px solid #e2e8f0;
	flex-shrink: 0;
	background: #ffffff;
}

.btn-choose-file {
	background-color: #fff7ed;
	border: 1px solid #fed7aa;
	color: #c2410c;
	font-weight: 600;
	font-size: 0.82rem;
	border-radius: 8px;
	padding: 7px 16px;
	cursor: pointer;
	white-space: nowrap;
	transition: all 0.2s;
}

.btn-choose-file:hover {
	background-color: #ffedd5;
}

/* Variant Table */
.variant-card-table {
	width: 100%;
	border: 1px solid #edf2f7;
	border-radius: 14px;
	overflow: hidden;
	background: #ffffff;
	border-collapse: separate;
	border-spacing: 0;
}

.variant-card-table th {
	background-color: #f8fafc;
	color: #64748b;
	font-size: 0.74rem;
	font-weight: 700;
	padding: 12px 14px;
	border-bottom: 1px solid #edf2f7;
	text-transform: uppercase;
	letter-spacing: 0.5px;
}

.variant-card-table td {
	padding: 12px 14px;
	font-size: 0.88rem;
	color: #1e293b;
	border-bottom: 1px solid #f8fafc;
	vertical-align: middle;
}

.variant-card-table tr:hover td {
	background-color: #fffaf5;
}

.variant-card-table tr:last-child td {
	border-bottom: none;
}

.custom-checkbox {
	width: 18px;
	height: 18px;
	border-radius: 5px;
	accent-color: #c2410c;
	cursor: pointer;
}

/* Action Bar */
.footer-action-bar {
	display: flex;
	justify-content: flex-end;
	align-items: center;
	gap: 12px;
	padding: 20px 28px;
	background: #fafafa;
	border-top: 1px solid #edf2f7;
}

.btn-cancel-custom {
	background: #ffffff;
	border: 1px solid #e2e8f0;
	color: #475569;
	font-weight: 600;
	font-size: 0.88rem;
	border-radius: 10px;
	padding: 9px 24px;
	text-decoration: none;
	transition: all 0.2s;
}

.btn-cancel-custom:hover {
	background-color: #f1f5f9;
	color: #0f172a;
}

.btn-save-custom {
	background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
	color: #ffffff;
	font-weight: 600;
	font-size: 0.88rem;
	border-radius: 10px;
	padding: 10px 28px;
	border: none;
	cursor: pointer;
	box-shadow: 0 4px 12px rgba(194, 65, 12, 0.25);
	transition: all 0.2s;
}

.btn-save-custom:hover {
	transform: translateY(-1px);
	box-shadow: 0 6px 16px rgba(194, 65, 12, 0.35);
}
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-container">

			<!-- Top Header -->
			<div class="header-breadcrumb">
				<div>
					<a th:href="@{/manager/products}" class="breadcrumb-tag mb-1">
						<i class="fa-solid fa-arrow-left"></i> Back to Products
					</a>
					<h3 class="fw-bold text-dark mb-0">Add Product Type</h3>
				</div>
				<a th:href="@{/manager/products}" class="btn-cancel-custom py-1 px-3 small">
					<i class="fa-solid fa-xmark me-1"></i> Close
				</a>
			</div>

			<!-- Dashboard Form Card -->
			<div class="dashboard-card">
				<form method="post" th:action="@{/manager/products/add}"
					th:object="${product_type}" enctype="multipart/form-data"
					id="productTypeForm">

					<div class="p-4 p-lg-5">
						<div class="row g-4">

							<!-- Left Column: Product Information -->
							<div class="col-lg-5">
								<div class="sub-panel">
									<div class="sub-panel-title">
										<i class="fa-solid fa-mug-hot"></i> General Information
									</div>

									<!-- Name -->
									<div class="mb-3">
										<label class="form-label-caps" for="name">Product Name</label>
										<input type="text" id="name" class="input-rounded" th:field="*{name}" placeholder="e.g. Café Mocha" required>
									</div>

									<!-- Category -->
									<div class="mb-3">
										<label class="form-label-caps" for="category">Category</label>
										<select id="category" class="input-rounded" th:field="*{category_id}">
											<option value="" disabled selected>Select Category</option>
											<option th:each="c : ${categories}" th:value="${c.category_id}" th:text="${c.name}"></option>
										</select>
									</div>

									<!-- Default Price -->
									<div class="mb-3">
										<label class="form-label-caps" for="priceDisplay">Default Base Price (MMK)</label>
										<div class="position-relative">
											<input type="text" id="priceDisplay" class="input-rounded" placeholder="12,000.00" inputmode="decimal" required>
											<span class="position-absolute end-0 top-50 translate-middle-y me-3 fw-bold text-muted small">MMK</span>
										</div>
										<input type="hidden" id="price" th:field="*{price}">
									</div>

									<!-- Description -->
									<div class="mb-3">
										<label class="form-label-caps" for="description">Description</label>
										<textarea id="description" class="textarea-rounded" rows="3" th:field="*{description}" placeholder="A rich blend of espresso and chocolate milk..."></textarea>
									</div>

									<!-- Cover Image Upload -->
									<div>
										<label class="form-label-caps">Cover Image File</label>
										<div class="image-preview-box">
											<img id="coverPreview" th:src="@{/images/cafe.jpg}" class="cover-thumb-preview" alt="Preview">
											<div class="overflow-hidden">
												<label for="coverImg" class="btn-choose-file mb-1">
													<i class="fa-solid fa-cloud-arrow-up me-1"></i> Upload Image
												</label>
												<div id="fileNameDisplay" class="small text-muted text-truncate" style="max-width: 180px;">No file chosen</div>
												<input type="file" id="coverImg" name="coverImgPart" accept="image/*" style="display: none;">
											</div>
										</div>
									</div>
								</div>
							</div>

							<!-- Right Column: Sizes & Recipe Setup -->
							<div class="col-lg-7">
								<div class="sub-panel">
									<div class="sub-panel-title">
										<i class="fa-solid fa-layer-group"></i> Sizes and Variant Pricing Setup
									</div>
									<p class="text-muted small mb-3">
										Select the sizes to activate for this product and define their variant prices:
									</p>

									<table class="variant-card-table">
										<thead>
											<tr>
												<th style="width: 25%;">Size</th>
												<th style="width: 15%;">Code</th>
												<th style="width: 45%;">Variant Price</th>
												<th style="width: 15%; text-align: center;">Active</th>
											</tr>
										</thead>
										<tbody>
											<th:block th:each="s : ${sizes}">
												<tr class="product-size-row">
													<!-- Enable & Size Name -->
													<td>
														<div class="d-flex align-items-center gap-2">
															<input type="checkbox" class="custom-checkbox size-enable">
															<span class="fw-semibold text-dark" th:text="${s.name}">Small</span>
														</div>
													</td>

													<!-- Size Code -->
													<td class="text-muted fw-bold">
														<input type="hidden" class="size-id" th:value="${s.size_id}">
														<span th:text="${s.size_code}">S</span>
													</td>

													<!-- Variant Price Input -->
													<td>
														<div class="d-flex align-items-center gap-2">
															<input type="number" class="input-rounded variant-price py-1" style="height: 36px;" placeholder="Price" step="500">
															<span class="small fw-semibold text-muted">MMK</span>
														</div>
													</td>

													<!-- Active -->
													<td class="text-center">
														<input type="checkbox" class="custom-checkbox is-active" checked>
													</td>
												</tr>

												<!-- Hidden Row for Ingredients -->
												<tr style="display: none;">
													<td>
														<div th:each="ing : ${ingredients}" class="ingredient-row">
															<input type="hidden" class="ingredient-id" th:value="${ing.ingredient_type_id}">
															<input type="checkbox" class="ingredient-required">
															<input type="number" class="ingredient-quantity" value="1">
														</div>
													</td>
												</tr>
											</th:block>
										</tbody>
									</table>
								</div>
							</div>

						</div>
					</div>

					<!-- Bottom Action Buttons -->
					<div class="footer-action-bar">
						<a th:href="@{/manager/products}" class="btn-cancel-custom">Cancel</a>
						<button type="submit" class="btn-save-custom">
							<i class="fa-solid fa-plus me-1"></i> Save Product Type
						</button>
					</div>

				</form>
			</div>

		</div>

		<!-- Scripts -->
		<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

		<!-- Instant Image Preview -->
		<script>
			document.getElementById("coverImg").addEventListener("change", function(e) {
				const file = e.target.files[0];
				if (file) {
					document.getElementById("fileNameDisplay").textContent = file.name;
					document.getElementById("coverPreview").src = URL.createObjectURL(file);
				}
			});
		</script>

		<!-- Default Price Formatting -->
		<script>
			const priceDisplay = document.getElementById("priceDisplay");
			const price = document.getElementById("price");

			priceDisplay.addEventListener("input", function() {
				let value = this.value.replace(/[^0-9.]/g, "");
				const parts = value.split(".");
				if (parts.length > 2) {
					value = parts[0] + "." + parts.slice(1).join("");
				}
				if (value) {
					const number = parseFloat(value);
					if (!isNaN(number)) {
						this.value = number.toLocaleString("en-US");
						price.value = number.toFixed(2);
					}
				} else {
					this.value = "";
					price.value = "";
				}
			});
		</script>

		<!-- Form Dynamic Submission Script -->
		<script>
			document.getElementById("productTypeForm").addEventListener("submit", function(event) {
				document.querySelectorAll(".generated-product-field").forEach(function(field) {
					field.remove();
				});

				const defaultPrice = price.value;
				if (defaultPrice === "") {
					event.preventDefault();
					alert("Please enter a default price.");
					return;
				}

				const rows = document.querySelectorAll(".product-size-row");
				let productIndex = 0;

				rows.forEach(function(row) {
					const enableCheckbox = row.querySelector(".size-enable");
					if (!enableCheckbox.checked) return;

					const sizeId = row.querySelector(".size-id").value;
					let variantPrice = row.querySelector(".variant-price").value;
					if (variantPrice === "") {
						variantPrice = defaultPrice;
					}

					const activeCheckbox = row.querySelector(".is-active");

					addHiddenField(this, "product[" + productIndex + "].size_id", sizeId);
					addHiddenField(this, "product[" + productIndex + "].price", variantPrice);
					addHiddenField(this, "product[" + productIndex + "].is_active", activeCheckbox.checked ? "true" : "false");

					const hiddenRow = row.nextElementSibling;
					if (hiddenRow) {
						const ingredientRows = hiddenRow.querySelectorAll(".ingredient-row");
						let ingredientIndex = 0;
						ingredientRows.forEach(function(ingredientRow) {
							const requiredCheckbox = ingredientRow.querySelector(".ingredient-required");
							if (!requiredCheckbox.checked) return;

							const ingredientId = ingredientRow.querySelector(".ingredient-id").value;
							const quantity = ingredientRow.querySelector(".ingredient-quantity").value;

							addHiddenField(this, "product[" + productIndex + "].ingredient_ids[" + ingredientIndex + "]", ingredientId);
							addHiddenField(this, "product[" + productIndex + "].quantity_required[" + ingredientIndex + "]", quantity);
							ingredientIndex++;
						}.bind(this));
					}

					productIndex++;
				}.bind(this));
			});

			function addHiddenField(form, name, value) {
				const input = document.createElement("input");
				input.type = "hidden";
				input.name = name;
				input.value = value;
				input.classList.add("generated-product-field");
				form.appendChild(input);
			}
		</script>
	</div>
</body>
</html>
