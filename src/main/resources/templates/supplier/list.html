<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Supplier List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	margin: 0;
	background-color: #faf7f1;
	color: #241c16;
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.supplier-container {
	width: 95%;
	max-width: 1450px;
	margin: 25px auto;
}

.supplier-header {
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	margin-bottom: 28px;
}

.supplier-title h2 {
	margin: 0 0 6px 0;
	color: #241c16;
	font-size: 27px;
	font-weight: 700;
	line-height: 1.2;
}

.supplier-title h2 i {
	color: #875522;
	font-size: 22px;
	margin-right: 7px;
}

.supplier-title p {
	margin: 0;
	color: #806b56;
	font-size: 14px;
	line-height: 1.5;
}

.btn-add {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #925d2b;
	color: #ffffff;
	border: none;
	border-radius: 9px;
	padding: 10px 18px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	transition: 0.2s;
}

.btn-add:hover {
	background-color: #75451f;
	color: #ffffff;
}

.btn-deleted {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #eadbc7;
	color: #624522;
	border: none;
	border-radius: 9px;
	padding: 10px 18px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	margin-left: 7px;
	transition: 0.2s;
}

.btn-deleted:hover {
	background-color: #ddc9ae;
	color: #4f351c;
}

.supplier-container .table {
	width: 100%;
	margin: 0;
	background-color: #fffaf4;
	border: 1px solid #eadcca;
	border-radius: 14px;
	overflow: hidden;
	border-collapse: separate;
	border-spacing: 0;
	box-shadow: 0 2px 8px rgba(80, 50, 20, 0.04);
}

.supplier-container .table thead th {
	background-color: #f5ecdf;
	color: #9a8067;
	padding: 13px 20px;
	font-size: 12px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.4px;
	border: none;
	border-bottom: 1px solid #eadcca;
	white-space: nowrap;
}

.supplier-container .table tbody td {
	padding: 14px 20px;
	color: #705a45;
	font-size: 14px;
	vertical-align: middle;
	border: none;
	border-bottom: 1px solid #eadcca;
}

.supplier-container .table tbody tr:last-child td {
	border-bottom: none;
}

.supplier-container .table tbody tr:hover {
	background-color: #fcf5eb;
}

.supplier-container .table tbody td:nth-child(2) {
	color: #211a15;
	font-weight: 500;
}

.supplier-container .table tbody td:nth-child(3) {
	color: #745d47;
}

.supplier-container .table tbody td:nth-child(4) {
	color: #806b56;
	white-space: nowrap;
}

.btn-edit {
	display: inline-block;
	color: #5f401f;
	background-color: #ffffff;
	border: 1px solid #ddcbb4;
	border-radius: 8px;
	padding: 6px 13px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	transition: 0.2s;
}

.btn-edit:hover {
	background-color: #f1e4d1;
	color: #5f401f;
	border-color: #cdb391;
}

.btn-delete {
	display: inline-block;
	color: #8f3e2e;
	background-color: #ffffff;
	border: 1px solid #e2c9bf;
	border-radius: 8px;
	padding: 6px 13px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	margin-left: 5px;
	transition: 0.2s;
}

.btn-delete:hover {
	background-color: #f2d8d0;
	color: #8f3e2e;
	border-color: #d6afa3;
}
</style>
</head>
<body>

	<div class="supplier-container">
		<div class="supplier-header">
			<div class="supplier-title">
				<h2>
					<i class="bi bi-truck"></i> Supplier Management
				</h2>
				<p>Manage your suppliers and contact information</p>
			</div>
			<div>
				<a th:href="@{/manager/suppliers/add}" class="btn-add"><i
					class="bi bi-plus-lg"></i> Add Supplier</a> <a
					th:href="@{/manager/suppliers/deleted}" class="btn-deleted"><i
					class="bi bi-trash"></i> Deleted List</a>
			</div>
		</div>

		<table class="table">
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Contact Info</th>
					<th>Created At</th>
					<th class="text-end">Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="supplier : ${suppliers}">
					<td th:text="${supplier.supplier_id}">SUP-001</td>
					<td th:text="${supplier.name}">Supplier Name</td>
					<td th:text="${supplier.contact_info}">Yangon / 09765473828</td>
					<td
						th:text="${supplier.created_at != null ? #temporals.format(supplier.created_at, 'yyyy-MM-dd HH:mm') : '-'}">2026-09-24
						15:30</td>
					<td class="text-end"><a
						th:href="@{/manager/suppliers/edit/{id}(id=${supplier.supplier_id})}"
						class="btn-edit">Edit</a> <a
						th:href="@{/manager/suppliers/delete/{id}(id=${supplier.supplier_id})}"
						class="btn-delete" onclick="return confirm('Are you sure?')">Delete</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</body>
</html>
