<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Luft | Delete Supplier Confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-espresso: #1c1612;
            --luft-cream: #fbf8f5;
            --luft-border: #ede4d8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .confirm-card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 22px;
            border: 1px solid var(--luft-border);
            box-shadow: 0 16px 45px rgba(28, 22, 18, 0.08);
            overflow: hidden;
        }

        .confirm-header {
            background-color: #fdf2f2;
            padding: 26px 32px;
            border-bottom: 1px solid #f6d2d2;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .danger-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fde8e8;
            color: #c0392b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .info-preview-box {
            background: #fdfbf7;
            border: 1px solid var(--luft-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .meta-label {
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #82746b;
            letter-spacing: 0.05em;
        }
        .meta-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--luft-espresso);
            margin-bottom: 12px;
        }

        .btn-purge {
            background: #c0392b;
            color: #ffffff;
            border: none;
            padding: 12px 26px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-purge:hover {
            background: #a93226;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="confirm-card">
        <div class="confirm-header">
            <div class="danger-icon-circle"><i class="bi bi-exclamation-triangle"></i></div>
            <div>
                <h4 class="serif-font mb-0 text-danger" style="font-size: 1.5rem; font-weight: 700;">Deactivate Supplier</h4>
                <small class="text-muted">Are you sure you want to archive this supplier?</small>
            </div>
        </div>

        <form method="post" th:action="@{/manager/suppliers/delete}" th:object="${supplier}" class="p-4 p-md-5">
            <input type="hidden" th:field="*{supplier_id}">

            <div class="info-preview-box">
                <div class="meta-label">Supplier Name</div>
                <div class="meta-value" th:text="${supplier.name}">Yami Artisanal Roasters</div>

                <div class="meta-label">Contact Information</div>
                <div class="meta-value" th:text="${supplier.contact_info}">Coffee / 09455678894</div>

                <div class="meta-label">Reference ID</div>
                <div class="meta-value font-monospace small text-muted" th:text="${supplier.supplier_id}">83a01982-34ca-4367-8f2f</div>
            </div>

            <p class="small text-muted mb-4">
                <i class="bi bi-info-circle me-1"></i>
                This record will be moved to the <strong>Deleted Suppliers</strong> vault. You can restore it at any time.
            </p>

            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a th:href="@{/manager/suppliers}" class="btn btn-outline-secondary rounded-3 px-4">Cancel</a>
                <button type="submit" class="btn-purge">
                    <i class="bi bi-trash3 me-1"></i> Delete Supplier
                </button>
            </div>
        </form>
    </div>

</body>
</html>
