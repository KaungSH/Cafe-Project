<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Luft | Archived Suppliers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-espresso: #1c1612;
            --luft-cream: #fbf8f5;
            --luft-border: #ede4d8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            margin: 0;
            padding-bottom: 50px;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .vault-container {
            width: 94%;
            max-width: 1400px;
            margin: 40px auto;
        }

        .luxury-card {
            background: #ffffff;
            border: 1px solid var(--luft-border);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(28, 22, 18, 0.04);
            overflow: hidden;
        }

        .table thead th {
            background-color: #241c17;
            color: #d8c8ba;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            padding: 16px 24px;
            border: none;
        }

        .table tbody td {
            padding: 18px 24px;
            vertical-align: middle;
            border-top: 1px solid #f6eee5;
            font-size: 0.92rem;
        }

        .btn-restore-craft {
            background-color: #f7f1e8;
            border: 1px solid #dfcbb8;
            color: #7b4f24;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 7px 16px;
            transition: all 0.2s;
        }
        .btn-restore-craft:hover {
            background-color: #7b4f24;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="vault-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h2 class="serif-font mb-1" style="font-size: 2rem; font-weight: 700;">Archived Suppliers Vault</h2>
                <p class="text-muted small mb-0">Recover inactive partnerships or safely inspect legacy supplier records</p>
            </div>
            <a th:href="@{/manager/suppliers}" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i> Active Suppliers
            </a>
        </div>

        <div class="luxury-card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Supplier ID</th>
                            <th>Partner Name</th>
                            <th>Contact Info</th>
                            <th>Status</th>
                            <th>Created Timestamp</th>
                            <th class="text-end pe-4">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(supplier)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-archive fs-2 d-block mb-2 opacity-25"></i>
                                No archived suppliers in records.
                            </td>
                        </tr>
                        <tr th:each="sup : ${supplier}">
                            <td><span class="font-monospace small text-muted" th:text="${sup.supplier_id}">ID-001</span></td>
                            <td><strong class="text-dark" th:text="${sup.name}">Supplier Name</strong></td>
                            <td th:text="${sup.contact_info}">Contact</td>
                            <td><span class="badge bg-danger-subtle text-danger border border-danger-subtle">Archived</span></td>
                            <td class="small text-muted" th:text="${sup.created_at}">2026-10-01</td>
                            <td class="text-end pe-4">
                                <form method="post" th:action="@{/manager/suppliers/restore}" style="display: inline;">
                                    <input type="hidden" name="supplier_id" th:value="${sup.supplier_id}">
                                    <button type="submit" class="btn btn-restore-craft">
                                        <i class="bi bi-arrow-counterclockwise me-1"></i> Restore
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
