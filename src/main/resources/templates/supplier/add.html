<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Luft | Add New Supplier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-gold: #c5a059;
            --luft-espresso: #1c1612;
            --luft-cream: #fbf8f5;
            --luft-border: #ede4d8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .luxury-form-card {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border: 1px solid var(--luft-border);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 16px 45px rgba(28, 22, 18, 0.08);
        }

        .form-side-banner {
            background: linear-gradient(180deg, rgba(28, 22, 18, 0.4) 0%, rgba(28, 22, 18, 0.88) 100%),
                        url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            color: #ffffff;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #615045;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        .form-control {
            height: 50px;
            border: 1.5px solid var(--luft-border);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.94rem;
            color: var(--luft-espresso);
        }

        .form-control:focus {
            border-color: var(--luft-primary);
            box-shadow: 0 0 0 4px rgba(133, 83, 37, 0.12);
        }

        .error {
            color: #b23a2e;
            font-size: 0.82rem;
            margin-top: 5px;
            font-weight: 500;
        }

        .btn-luxury-submit {
            background: linear-gradient(135deg, var(--luft-primary) 0%, #683d16 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px 28px;
            font-size: 0.92rem;
            box-shadow: 0 4px 14px rgba(104, 61, 22, 0.22);
            transition: all 0.2s;
        }
        .btn-luxury-submit:hover {
            transform: translateY(-1px);
            color: #fff;
        }

        .btn-cancel {
            background: #ffffff;
            border: 1px solid var(--luft-border);
            border-radius: 10px;
            color: #635348;
            font-weight: 600;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 0.92rem;
            transition: 0.2s;
        }
        .btn-cancel:hover {
            background: #f7eee3;
            color: var(--luft-espresso);
        }
    </style>
</head>
<body>

    <div class="luxury-form-card">
        <div class="row g-0">
            <!-- Left Side Image -->
            <div class="col-lg-4 d-none d-lg-block form-side-banner">
                <span class="badge bg-warning text-dark mb-2 align-self-start">Café Luft Roastery</span>
                <h3 class="serif-font mb-2">Artisan Origin Partners</h3>
                <p class="small text-white-50 mb-0">Register trusted coffee bean farms, dairy specialists, and café consumables suppliers.</p>
            </div>

            <!-- Right Side Form Content -->
            <div class="col-lg-8 p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h2 class="serif-font mb-0" style="font-size: 1.8rem; font-weight: 700;">Add New Supplier</h2>
                        <small class="text-muted">Register vendor credentials & contact routes</small>
                    </div>
                    <a th:href="@{/manager/suppliers}" class="btn-close" aria-label="Close"></a>
                </div>

                <form method="post" th:action="@{/manager/suppliers/add}" th:object="${supplier}">
                    
                    <div class="mb-4">
                        <label class="form-label">Supplier / Company Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0" style="border-color: var(--luft-border);"><i class="bi bi-building text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" th:field="*{name}" placeholder="e.g., Yami Coffee Plantation" required>
                        </div>
                        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contact Information & Category <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0" style="border-color: var(--luft-border);"><i class="bi bi-telephone text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" th:field="*{contact_info}" placeholder="e.g., Coffee Beans / +95 9455678894" required>
                        </div>
                        <div class="error" th:if="${#fields.hasErrors('contact_info')}" th:errors="*{contact_info}"></div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 pt-3 border-top mt-5">
                        <a th:href="@{/manager/suppliers}" class="btn-cancel">Cancel</a>
                        <button type="submit" class="btn-luxury-submit">
                            <i class="bi bi-check2-circle me-1"></i> Add Supplier
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
