<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Deleted suppliers List</title>
</head>
<body>
	<h2>Deleted Suppliers List</h2>
	<a th:href="@{/supplier}"> Back to Supplier List </a>
	<table>
		<thead>
			<tr>
				<th>Supplier ID</th>
				<th>Name</th>
				<th>Contact Info</th>
				<th>Is Deleted</th>
				<th>Created At</th>
			</tr>
		</thead>

		<tbody>

			<tr th:each="supplier : ${supplier}">

				<td th:text="${supplier.supplier_id}"></td>

				<td th:text="${supplier.name}"></td>

				<td th:text="${supplier.contact_info}"></td>

				<td th:text="${supplier.isdeleted}"></td>

				<td th:text="${supplier.created_at}"></td>

				<td>
					<form method="post" th:action="@{/supplier/restore}">

						<input type="hidden" name="supplier_id"
							th:value="${supplier.supplier_id}">

						<button type="submit">Restore</button>
					</form>
					<form method="post" th:action="@{/supplier/real-delete}">

						<input type="hidden" name="supplier_id"
							th:value="${supplier.supplier_id}">

						<button type="submit"
							onclick="return confirm('Are you sure you want to delete this supplier?');">
							Delete</button>
					</form>

				</td>

			</tr>

		</tbody>

	</table>
</body>
</html>
