
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-5">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2>Orders</h2>

			<a th:href="@{/orders/add}" class="btn btn-primary"> + Add Order
			</a>
		</div>

		<div class="card shadow-sm">

			<div class="card-body">

				<table class="table table-bordered table-hover">

					<thead class="table-dark">
						<tr>
							<th>Order ID</th>
							<th>Employee ID</th>
							<th>Customer ID</th>
							<th>Branch ID</th>
							<th>Created Time</th>
							<th>Received Time</th>
							<th>Order Type</th>
							<th>Total Amount</th>
							<th width="180">Action</th>
						</tr>
					</thead>

					<tbody>

						<tr th:each="order : ${orders}">

							<td th:text="${order.order_id}"></td>

							<td th:text="${order.employee_id}"></td>

							<td th:text="${order.customer_id}"></td>

							<td th:text="${order.branch_id}"></td>

							<td th:text="${order.created_time}"></td>

							<td th:text="${order.received_time}"></td>

							<td th:text="${order.order_type_id}"></td>

							<td th:text="${order.total_amount}"></td>

							<td><a th:href="@{/orders/edit/{id}(id=${order.order_id})}"
								class="btn btn-warning btn-sm"> Edit </a> <a
								th:href="@{/orders/delete/{id}(id=${order.order_id})}"
								class="btn btn-danger btn-sm"
								onclick="return confirm('Are you sure you want to delete this order?');">
									Delete </a></td>

						</tr>

						<tr th:if="${#lists.isEmpty(orders)}">
							<td colspan="9" class="text-center text-muted">No orders
								found.</td>
						</tr>

					</tbody>

				</table>

			</div>
		</div>

	</div>

</body>
</html>
