
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Order</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-5">

		<div class="card shadow">

			<div class="card-header">
				<h3 class="mb-0">Edit Order</h3>
			</div>

			<div class="card-body">

				<form th:action="@{/orders/edit/{id}(id=${order.order_id})}"
					th:object="${order}" method="post">

					<div class="mb-3">
						<label class="form-label"> Order ID </label> <input type="text"
							class="form-control" th:field="*{order_id}" readonly>
					</div>

					<div class="mb-3">
						<label class="form-label"> Employee ID </label> <input type="text"
							class="form-control" th:field="*{employee_id}">
					</div>

					<div class="mb-3">
						<label class="form-label"> Customer ID </label> <input type="text"
							class="form-control" th:field="*{customer_id}">
					</div>

					<div class="mb-3">
						<label class="form-label"> Branch ID </label> <input type="text"
							class="form-control" th:field="*{branch_id}">
					</div>

					<div class="mb-3">
						<label class="form-label"> Received Time </label> <input
							type="datetime-local" class="form-control"
							th:field="*{received_time}">
					</div>

					<div class="mb-3">
						<label class="form-label"> Order Type ID </label> <input
							type="text" class="form-control" th:field="*{order_type_id}">
					</div>

					<div class="mb-3">
						<label class="form-label"> Total Amount </label> <input
							type="number" step="0.01" class="form-control"
							th:field="*{total_amount}">
					</div>

					<div class="d-flex gap-2">

						<button type="submit" class="btn btn-primary">Update</button>

						<a th:href="@{/orders}" class="btn btn-secondary"> Cancel </a>

					</div>

				</form>

			</div>
		</div>

	</div>

</body>
</html>
