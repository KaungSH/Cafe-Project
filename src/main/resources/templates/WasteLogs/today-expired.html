<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Expired Items - Luft Cafe</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

    body {
        background-color: #f6f1eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #5d534a;
    }

    .container-box {
        background-color: #efe8e0;
        border-radius: 16px;
        padding: 30px;
        margin-top: 30px;
        margin-bottom: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .page-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #63584e;
    }

    .custom-table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
    }

    .custom-table th {
        color: #7a6e65;
        font-weight: 600;
        padding: 12px;
        border-bottom: 1px solid #e0d6cc;
        white-space: nowrap;
    }

    .custom-table td {
        padding: 14px 12px;
        vertical-align: middle;
        background-color: rgba(255, 255, 255, 0.2);
        border-bottom: 1px solid #e6ded5;
    }

    .display-value {
        color: #5d534a;
        font-weight: 500;
    }

    .notes-input {
        background-color: #fdfbf7;
        border: 1px solid #d8ceca;
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 220px;
        color: #5d534a;
    }

    .notes-input:focus {
        background-color: #ffffff;
        border-color: #a39387;
        box-shadow: 0 0 0 0.2rem rgba(115, 99, 86, 0.15);
        outline: none;
    }

    .btn-submit {
        background-color: #736356;
        color: #ffffff;
        border-radius: 8px;
        padding: 9px 24px;
        font-weight: 500;
        border: none;
    }

    .btn-submit:hover {
        background-color: #5c4e43;
        color: #ffffff;
    }

    .btn-cancel {
        background-color: #e5ded7;
        color: #5d534a;
        border-radius: 8px;
        padding: 9px 20px;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
    }

    .btn-cancel:hover {
        background-color: #d8cec5;
        color: #433b34;
    }

    .empty-message {
        padding: 50px 20px;
        text-align: center;
        color: #7a6e65;
        font-size: 1.05rem;
    }

</style>

</head>

<body class="p-4">

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="page-title m-0">
            Today's Expired Items
        </h2>

    </div>


    <!--
        EMPTY LIST
    -->
    <div th:if="${wasteLogs == null or #lists.isEmpty(wasteLogs)}"
         class="empty-message">

        There is no Expired Ingredient Batches Today

    </div>


    <!--
        WASTE LOG LIST
    -->
    <form th:if="${wasteLogs != null and not #lists.isEmpty(wasteLogs)}"
          th:action="@{/manager/WasteLogs/today-expired}"
          method="post">

        <div class="table-responsive">

            <table class="table custom-table">

                <thead>

                    <tr>
                        <th>Batch ID</th>
                        <th>Waste Reason</th>
                        <th>Quantity Lost</th>
                        <th>Financial Loss</th>
                        <th>Notes</th>
                    </tr>

                </thead>


                <tbody>

                    <tr th:each="log, stat : ${wasteLogs.dtoList}">

					    <td>
					
					        <span class="display-value"
					              th:text="${log.batch_id}">
					            BATCH001
					        </span>
					
					        <input type="hidden"
					               th:name="${'dtoList[' + stat.index + '].batch_id'}"
					               th:value="${log.batch_id}">
					
					    </td>
					
					
					    <td>
					
					        <span class="display-value">
					            Expired
					        </span>
					
					        <input type="hidden"
					               th:name="${'dtoList[' + stat.index + '].waste_reason_id'}"
					               th:value="${log.waste_reason_id}">
					
					    </td>
					
					
					    <td>
					
					        <span class="display-value"
					              th:text="${log.quantity_lost}">
					            2.500
					        </span>
					
					        <input type="hidden"
					               th:name="${'dtoList[' + stat.index + '].quantity_lost'}"
					               th:value="${log.quantity_lost}">
					
					    </td>
					
					
					    <td>
					
					        <span class="display-value"
					              th:text="${log.financial_loss}">
					            15000.00
					        </span>
					
					        <input type="hidden"
					               th:name="${'dtoList[' + stat.index + '].financial_loss'}"
					               th:value="${log.financial_loss}">
					
					    </td>
					
					
					    <td>
					
					        <input type="hidden"
					               th:name="${'dtoList[' + stat.index + '].employee_id'}"
					               th:value="${log.employee_id}">
					
					        <input type="text"
					               class="form-control notes-input"
					               th:name="${'dtoList[' + stat.index + '].notes'}"
					               th:value="${log.notes}"
					               maxlength="255"
					               placeholder="Enter optional notes">
					
					    </td>
					
					</tr>
                </tbody>

            </table>

        </div>


        <!-- Buttons -->

        <div class="d-flex justify-content-end gap-2 mt-4">

            <a th:href="@{/manager/WasteLogs}"
               class="btn btn-cancel">
                Cancel
            </a>

            <button type="submit"
                    class="btn btn-submit">
                Save Waste Logs
            </button>

        </div>

    </form>

</div>

</body>

</html>
