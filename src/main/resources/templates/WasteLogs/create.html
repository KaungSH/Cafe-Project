<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>

<meta charset="UTF-8">

<title>Create Waste Log - Luft Cafe</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

    body {
        background-color: #f6f1eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #5d534a;
    }

    .form-card {
        background-color: #efe8e0;
        border-radius: 16px;
        padding: 35px;
        max-width: 600px;
        margin: 40px auto;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .page-title {
        font-size: 1.6rem;
        font-weight: 700;
        color: #63584e;
        margin-bottom: 25px;
    }

    .form-label {
        font-weight: 600;
        color: #7a6e65;
        font-size: 0.9rem;
    }

    .form-control,
    .form-select {
        background-color: #fdfbf7;
        border: 1px solid #d8ceca;
        border-radius: 8px;
        padding: 10px 14px;
        color: #5d534a;
    }

    .form-control:focus,
    .form-select:focus {
        background-color: #ffffff;
        border-color: #a39387;
        box-shadow: 0 0 0 0.2rem rgba(115, 99, 86, 0.15);
    }

    .btn-submit {
        background-color: #736356;
        color: #ffffff;
        border-radius: 8px;
        padding: 9px 24px;
        font-weight: 500;
        border: none;
    }

    .btn-submit:hover {
        background-color: #5c4e43;
        color: #ffffff;
    }

    .btn-cancel {
        background-color: #e5ded7;
        color: #5d534a;
        border-radius: 8px;
        padding: 9px 20px;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
    }

    .btn-cancel:hover {
        background-color: #d8cec5;
        color: #433b34;
    }

    .calculated-field {
        background-color: #f3eee8;
    }

</style>

</head>

<body class="p-4">

<div layout:fragment="content">

<div class="form-card">

    <h3 class="page-title">
        Create Waste Log
    </h3>

    <form th:action="@{/manager-only/WasteLogs/create}"
          th:object="${wasteLog}"
          method="post">


        <!-- Ingredient Batch -->

        <div class="mb-3">

            <label class="form-label">
                Ingredient Batch
            </label>

            <select id="batchSelect"
                    th:field="*{batch_id}"
                    class="form-select">

                <option value="">
                    Select Batch
                </option>

                <option th:each="b : ${batches}"
				        th:value="${b.batch_id}"
				        th:text="${b.batch_id}"
				        th:attr="data-unit-cost=${b.unit_cost},
				                 data-remaining-quantity=${b.remaining_quantity}">
				</option>

            </select>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('batch_id')}"
                 th:errors="*{batch_id}">
            </div>

        </div>


        <!-- Waste Reason -->

        <div class="mb-3">

            <label class="form-label">
                Waste Reason
            </label>

            <select th:field="*{waste_reason_id}"
                    class="form-select">

                <option value="">
                    Select Reason
                </option>

                <option th:each="r : ${reasons}"
                        th:value="${r.waste_reason_id}"
                        th:text="${r.reason_name}">
                </option>

            </select>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('waste_reason_id')}"
                 th:errors="*{waste_reason_id}">
            </div>

        </div>


        <!-- Quantity / Financial Loss -->

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Quantity Lost
                </label>

                <input type="number"
                       step="0.01"
                       min="0"
                       id="quantityLost"
                       th:field="*{quantity_lost}"
                       class="form-control"
                       placeholder="0.000">

                <div class="text-danger small mt-1"
                     th:if="${#fields.hasErrors('quantity_lost')}"
                     th:errors="*{quantity_lost}">
                </div>

            </div>


            <div class="col-md-6 mb-3">

                <label class="form-label">
                    Financial Loss
                </label>

                <input type="number"
                       step="0.01"
                       min="0"
                       id="financialLoss"
                       th:field="*{financial_loss}"
                       class="form-control calculated-field"
                       placeholder="0.00"
                       readonly>

                <div class="text-danger small mt-1"
                     th:if="${#fields.hasErrors('financial_loss')}"
                     th:errors="*{financial_loss}">
                </div>

            </div>

        </div>

        <!-- Notes -->

        <div class="mb-4">

            <label class="form-label">
                Notes
            </label>

            <textarea th:field="*{notes}"
                      class="form-control"
                      rows="3"
                      placeholder="Enter optional notes">
            </textarea>

            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('notes')}"
                 th:errors="*{notes}">
            </div>

        </div>


        <!-- Buttons -->

        <div class="d-flex justify-content-end gap-2">

            <a th:href="@{/manager-only/WasteLogs}"
               class="btn btn-cancel">
                Cancel
            </a>

            <button type="submit"
                    class="btn btn-submit">
                Save
            </button>

        </div>

    </form>

</div>



<script>
    const batchSelect = document.getElementById("batchSelect");
    const quantityLost = document.getElementById("quantityLost");
    const financialLoss = document.getElementById("financialLoss");

    function getSelectedBatch() {
        return batchSelect.options[batchSelect.selectedIndex];
    }

    function updateQuantityLimit() {
        const selectedBatch = getSelectedBatch();

        const remainingQuantity =
            parseFloat(selectedBatch.dataset.remainingQuantity);

        if (!isNaN(remainingQuantity)) {
            quantityLost.max = remainingQuantity;
        } else {
            quantityLost.removeAttribute("max");
        }
    }

    function calculateFinancialLoss() {
        const selectedBatch = getSelectedBatch();

        const unitCost =
            parseFloat(selectedBatch.dataset.unitCost);

        const quantity =
            parseFloat(quantityLost.value);

        if (!isNaN(unitCost) && !isNaN(quantity)) {
            const loss = quantity * unitCost;
            financialLoss.value = loss.toFixed(2);
        } else {
            financialLoss.value = "";
        }
    }

    function validateQuantity() {
        const selectedBatch = getSelectedBatch();

        const remainingQuantity =
            parseFloat(selectedBatch.dataset.remainingQuantity);

        const quantity =
            parseFloat(quantityLost.value);

        if (!isNaN(remainingQuantity) &&
            !isNaN(quantity) &&
            quantity > remainingQuantity) {

            quantityLost.value = remainingQuantity.toFixed(3);
        }

        calculateFinancialLoss();
    }

    batchSelect.addEventListener("change", function () {
        updateQuantityLimit();
        validateQuantity();
    });

    quantityLost.addEventListener("input", validateQuantity);

    // Set the limit when the page initially loads
    updateQuantityLimit();
    calculateFinancialLoss();
</script>
</div>
</body>

</html>
