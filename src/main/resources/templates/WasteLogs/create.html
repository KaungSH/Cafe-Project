<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Waste Log - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
body {
	background-color: #f6f1eb;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
		sans-serif;
	color: #5d534a;
}

.container-box {
	background-color: #efe8e0;
	border-radius: 16px;
	padding: 30px;
	max-width: 600px;
	margin-top: 30px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}

.page-title {
	font-size: 1.6rem;
	font-weight: 700;
	color: #63584e;
}

.form-control {
	border-radius: 8px;
	border: 1px solid #d8cec5;
	background-color: rgba(255, 255, 255, 0.6);
}

.btn-save {
	background-color: #736356;
	color: #ffffff;
	border-radius: 8px;
	padding: 8px 20px;
	font-weight: 500;
	border: none;
}

.btn-save:hover {
	background-color: #5c4e43;
	color: #ffffff;
}

.btn-cancel {
	background-color: #e5ded7;
	color: #5d534a;
	border-radius: 8px;
	padding: 8px 20px;
	text-decoration: none;
}

.btn-cancel:hover {
	background-color: #d8cec5;
	color: #433b34;
}
</style>
</head>
<body class="p-4">
	<div class="container container-box">
		<h2 class="page-title mb-4">Add New Waste Log</h2>
		<form th:action="@{/manager/WasteLogs/create}" th:object="${wasteLog}"
			method="post">
			<div class="mb-3">
				<label class="form-label font-weight-bold">Batch ID</label> <input
					type="text" th:field="*{batch_id}" class="form-control" required />
			</div>
			<div class="mb-3">
				<label class="form-label">Waste Reason ID</label> <input type="text"
					th:field="*{waste_reason_id}" class="form-control" required />
			</div>
			<div class="mb-3">
				<label class="form-label">Quantity Lost</label> <input type="number"
					step="0.001" th:field="*{quantity_lost}" class="form-control"
					required />
			</div>
			<div class="mb-3">
				<label class="form-label">Financial Loss</label> <input
					type="number" step="0.01" th:field="*{financial_loss}"
					class="form-control" />
			</div>
			<div class="mb-3">
				<label class="form-label">Employee ID</label> <input type="text"
					th:field="*{employee_id}" class="form-control" required />
			</div>
			<div class="mb-3">
				<label class="form-label">Notes</label>
				<textarea th:field="*{notes}" class="form-control" rows="3"></textarea>
			</div>
			<div class="d-flex justify-content-between mt-4">
				<a th:href="@{/manager/WasteLogs}" class="btn btn-cancel">Cancel</a>
				<button type="submit" class="btn btn-save">Save Log</button>
			</div>
		</form>
	</div>
</body>
</html>
