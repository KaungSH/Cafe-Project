<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Waste Log | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .center-form-wrapper {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .luxury-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            padding: 34px 40px;
        }

        .luxury-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #F0E8DC;
        }

        .icon-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            color: #F4E8D8;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .luxury-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .luxury-subtitle {
            font-size: 13px;
            color: #8C7B6C;
            margin-top: 3px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #554133;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom .icon-addon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9C8976;
            font-size: 14px;
        }

        .form-control-luxury, .form-select-luxury {
            width: 100%;
            background-color: #FAF8F5;
            border: 1px solid #DFD5C6;
            border-radius: 11px;
            padding: 10px 14px 10px 38px;
            color: #2D2422;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-control-luxury:focus, .form-select-luxury:focus {
            background-color: #FFFFFF;
            border-color: #8B572A;
            box-shadow: 0 0 0 3px rgba(139, 87, 42, 0.12);
            outline: none;
        }

        .calculated-luxury {
            background-color: #F8F4EE !important;
            color: #9E382B !important;
            font-weight: 700;
        }

        textarea.form-control-luxury {
            padding-left: 14px;
        }

        .btn-luxury-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 14px rgba(88, 55, 24, 0.2);
        }

        .btn-luxury-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
            color: #FFFFFF;
        }

        .btn-luxury-cancel {
            background-color: #EFE8DD;
            color: #5C4533;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-luxury-cancel:hover {
            background-color: #E2D7C7;
            color: #3C2B1D;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="center-form-wrapper">
        <div class="luxury-card">

            <div class="luxury-header">
                <div class="icon-badge">
                    <i class="fa-solid fa-file-circle-plus"></i>
                </div>
                <div>
                    <h2>Create Waste Log</h2>
                    <p class="luxury-subtitle">Record damaged or expired inventory items</p>
                </div>
            </div>

            <form th:action="@{/manager-only/WasteLogs/create}" th:object="${wasteLog}" method="post">
                <div class="row g-3">
                    
                    <div class="col-md-6">
                        <label class="form-label">Ingredient Batch <span class="text-danger">*</span></label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-boxes-stacked icon-addon"></i>
                            <select id="batchSelect" th:field="*{batch_id}" class="form-select-luxury">
                                <option value="">-- Select Batch --</option>
                                <option th:each="b : ${batches}"
                                        th:value="${b.batch_id}"
                                        th:text="${b.batch_id}"
                                        th:attr="data-unit-cost=${b.unit_cost}, data-remaining-quantity=${b.remaining_quantity}">
                                </option>
                            </select>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('batch_id')}" th:errors="*{batch_id}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Waste Reason <span class="text-danger">*</span></label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-circle-exclamation icon-addon"></i>
                            <select th:field="*{waste_reason_id}" class="form-select-luxury">
                                <option value="">-- Select Reason --</option>
                                <option th:each="r : ${reasons}"
                                        th:value="${r.waste_reason_id}"
                                        th:text="${r.reason_name}">
                                </option>
                            </select>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('waste_reason_id')}" th:errors="*{waste_reason_id}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Quantity Lost <span class="text-danger">*</span></label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-scale-unbalanced icon-addon"></i>
                            <input type="number" step="0.001" min="0" id="quantityLost"
                                   th:field="*{quantity_lost}" class="form-control-luxury" placeholder="0.000">
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('quantity_lost')}" th:errors="*{quantity_lost}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Financial Loss (MMK)</label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-coins icon-addon"></i>
                            <input type="number" step="0.01" min="0" id="financialLoss"
                                   th:field="*{financial_loss}" class="form-control-luxury calculated-luxury"
                                   placeholder="0.00" readonly>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('financial_loss')}" th:errors="*{financial_loss}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Notes (Optional)</label>
                        <textarea th:field="*{notes}" class="form-control-luxury" rows="2"
                                  placeholder="Describe the cause of waste..."></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                    </div>

                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 mt-4 pt-3 border-top border-light-subtle">
                    <a th:href="@{/manager-only/WasteLogs}" class="btn-luxury-cancel">
                        <i class="fa-solid fa-xmark"></i> Cancel
                    </a>
                    <button type="submit" class="btn-luxury-primary">
                        <i class="fa-solid fa-check"></i> Save Waste Log
                    </button>
                </div>
            </form>

        </div>
    </div>

<script>
    const batchSelect = document.getElementById("batchSelect");
    const quantityLost = document.getElementById("quantityLost");
    const financialLoss = document.getElementById("financialLoss");

    function getSelectedBatch() {
        return batchSelect.options[batchSelect.selectedIndex];
    }

    function updateQuantityLimit() {
        const selectedBatch = getSelectedBatch();
        const remainingQuantity = parseFloat(selectedBatch.dataset.remainingQuantity);
        if (!isNaN(remainingQuantity)) {
            quantityLost.max = remainingQuantity;
        } else {
            quantityLost.removeAttribute("max");
        }
    }

    function calculateFinancialLoss() {
        const selectedBatch = getSelectedBatch();
        const unitCost = parseFloat(selectedBatch.dataset.unitCost);
        const quantity = parseFloat(quantityLost.value);

        if (!isNaN(unitCost) && !isNaN(quantity)) {
            const loss = quantity * unitCost;
            financialLoss.value = loss.toFixed(2);
        } else {
            financialLoss.value = "";
        }
    }

    function validateQuantity() {
        const selectedBatch = getSelectedBatch();
        const remainingQuantity = parseFloat(selectedBatch.dataset.remainingQuantity);
        const quantity = parseFloat(quantityLost.value);

        if (!isNaN(remainingQuantity) && !isNaN(quantity) && quantity > remainingQuantity) {
            quantityLost.value = remainingQuantity.toFixed(3);
        }
        calculateFinancialLoss();
    }

    batchSelect.addEventListener("change", function () {
        updateQuantityLimit();
        validateQuantity();
    });

    quantityLost.addEventListener("input", validateQuantity);
    updateQuantityLimit();
    calculateFinancialLoss();
</script>
</div>
</body>
</html>
