<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Logs Admin View | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .waste-wrapper {
            width: 95%;
            max-width: 1350px;
            margin: 35px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-title-box p {
            font-size: 13px;
            color: #8C7B6C;
            margin: 2px 0 0 0;
        }

        .admin-badge {
            background: #EFE6D8;
            color: #6C441E;
            font-size: 11.5px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid #DFD2C0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .luxury-table-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #FAF5EE;
            color: #796450;
            padding: 15px 16px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 16px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .badge-batch {
            background-color: #F8F4EE;
            color: #7D5127;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #EADBCC;
        }

        .badge-reason {
            background-color: #FFF2F0;
            color: #A8382B;
            border: 1px solid #FACDC7;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .loss-amount {
            color: #B23B2A;
            font-weight: 700;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="waste-wrapper">
        
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div>
                    <h2>Waste Logs Analytical Overview</h2>
                    <p>Read-only summary of logged kitchen and coffee batch losses</p>
                </div>
            </div>

            <div>
                <span class="admin-badge">
                    <i class="fa-solid fa-shield-halved"></i> Admin Privileges (Audit Mode)
                </span>
            </div>
        </div>

        <div class="luxury-table-card">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 55px;">No.</th>
                        <th>Batch ID</th>
                        <th>Reason</th>
                        <th>Quantity Lost</th>
                        <th>Financial Loss</th>
                        <th>Employee</th>
                        <th>Logged At</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log, state : ${wasteLogs}">
                        <td th:text="${state.count}" class="text-muted fw-semibold">1</td>
                        <td><span class="badge-batch" th:text="${log.batch_id}">BATCH001</span></td>
                        <td><span class="badge-reason" th:text="${log.reason_name}">Expired</span></td>
                        <td><strong th:text="${log.quantity_lost}">2.500</strong></td>
                        <td><span class="loss-amount" th:text="${#numbers.formatDecimal(log.financial_loss, 1, 'COMMA', 2, 'POINT')} + ' MMK'">15,000.00 MMK</span></td>
                        <td class="fw-semibold" th:text="${log.name}">MaMa</td>
                        <td th:text="${#temporals.format(log.logged_at, 'yyyy-MM-dd HH:mm')}">2026-09-18 10:00</td>
                        <td th:text="${log.notes}">Damaged</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(wasteLogs)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                            No waste logs record found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</body>
</html>
