<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Deleted Waste Logs - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
body {
	background-color: #f6f1eb;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
		sans-serif;
	color: #5d534a;
}

.container-box {
	background-color: #efe8e0;
	border-radius: 16px;
	padding: 30px;
	margin-top: 30px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}

.page-title {
	font-size: 1.8rem;
	font-weight: 700;
	color: #a94442;
}

.btn-back {
	background-color: #736356;
	color: #ffffff;
	border-radius: 8px;
	padding: 8px 18px;
	text-decoration: none;
}

.btn-back:hover {
	background-color: #5c4e43;
	color: #ffffff;
}

.custom-table {
	border-collapse: separate;
	border-spacing: 0;
	width: 100%;
}

.custom-table th {
	color: #8a6d3b;
	font-weight: 600;
	padding: 12px;
	border-bottom: 1px solid #e0d6cc;
}

.custom-table td {
	padding: 14px 12px;
	vertical-align: middle;
	background-color: rgba(255, 255, 255, 0.2);
	border-bottom: 1px solid #e6ded5;
}

.btn-action-recover {
	background-color: #5cb85c;
	color: #ffffff;
	border: none;
	border-radius: 6px;
	padding: 4px 12px;
	font-size: 0.85rem;
	text-decoration: none;
	display: inline-block;
	margin-bottom: 4px;
}

.btn-action-recover:hover {
	background-color: #4cae4c;
	color: #ffffff;
}

.btn-action-harddelete {
	background-color: transparent;
	color: #d9534f;
	border: none;
	padding: 2px 10px;
	font-size: 0.85rem;
	text-decoration: none;
	display: inline-block;
}

.btn-action-harddelete:hover {
	color: #c9302c;
	text-decoration: underline;
}
</style>
</head>
<body class="p-4">
	<div class="container container-box">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="page-title m-0">Trash Bin - Deleted Logs</h2>
			<a th:href="@{/manager/WasteLogs}" class="btn btn-back">Back to
				Active List</a>
		</div>

		<div class="table-responsive">
			<table class="table custom-table">
				<thead>
					<tr>
						<th>ID</th>
						<th>Batch ID</th>
						<th>Reason</th>
						<th>Quantity Lost</th>
						<th>Financial Loss</th>
						<th>Employee</th>
						<th>Notes</th>
						<th class="text-center">Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="log : ${deletedLogs}">
						<td th:text="${log.waste_id}">1</td>
						<td th:text="${log.batch_id}">BATCH001</td>
						<td th:text="${log.reason_name}">Expired</td>
						<td th:text="${log.quantity_lost}">2.500</td>
						<td th:text="${log.financial_loss}">15000.00</td>
						<td th:text="${log.name}">MaMa</td>
						<td th:text="${log.notes}">Damaged</td>
						<td class="text-center" style="width: 150px;"><a
							th:href="@{/manager/WasteLogs/recover/{waste_id}(waste_id=${log.waste_id})}"
							class="btn-action-recover">Recover</a> <a
							th:href="@{/manager/WasteLogs/confirm-hard-delete/{waste_id}(waste_id=${log.waste_id})}"
							class="btn-action-harddelete">Hard Delete</a></td>
					</tr>
					<tr th:if="${#lists.isEmpty(deletedLogs)}">
						<td colspan="8" class="text-center text-muted py-4">No
							deleted records in Trash Bin.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
