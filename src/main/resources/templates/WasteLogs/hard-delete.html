<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Confirm Hard Delete - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
body {
	background-color: #f6f1eb;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
		sans-serif;
	color: #5d534a;
}

.container-box {
	background-color: #efe8e0;
	border-radius: 16px;
	padding: 30px;
	max-width: 500px;
	margin-top: 50px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
}

.page-title {
	font-size: 1.5rem;
	font-weight: 700;
	color: #d9534f;
}

.btn-hard-delete {
	background-color: #d9534f;
	color: #ffffff;
	border-radius: 8px;
	padding: 8px 18px;
	font-weight: 500;
	border: none;
}

.btn-hard-delete:hover {
	background-color: #c9302c;
	color: #ffffff;
}

.btn-cancel {
	background-color: #e5ded7;
	color: #5d534a;
	border-radius: 8px;
	padding: 8px 18px;
	text-decoration: none;
}

.btn-cancel:hover {
	background-color: #d8cec5;
	color: #433b34;
}

.detail-box {
	background-color: rgba(255, 255, 255, 0.4);
	border-radius: 8px;
	padding: 15px;
	border: 1px solid #e0d6cc;
}
</style>
</head>
<body class="p-4">
	<div class="container container-box text-center">
		<h2 class="page-title mb-3">Permanent Delete Confirmation</h2>
		<p class="text-muted mb-4">Warning: This action cannot be undone.
			This waste log will be permanently deleted from the database.</p>

		<div class="detail-box text-start mb-4" th:object="${wasteLog}">
			<p class="mb-1">
				<strong>Waste ID:</strong> <span th:text="*{waste_id}"></span>
			</p>
			<p class="mb-1">
				<strong>Batch ID:</strong> <span th:text="*{batch_id}"></span>
			</p>
			<p class="mb-0">
				<strong>Quantity Lost:</strong> <span th:text="*{quantity_lost}"></span>
			</p>
		</div>

		<form
			th:action="@{/manager/WasteLogs/hard-delete/{waste_id}(waste_id=${wasteLog.waste_id})}"
			method="post">
			<div class="d-flex justify-content-between">
				<a th:href="@{/manager/WasteLogs/trash}" class="btn btn-cancel">Cancel</a>
				<button type="submit" class="btn btn-hard-delete">Permanently
					Delete</button>
			</div>
		</form>
	</div>
</body>
</html>
