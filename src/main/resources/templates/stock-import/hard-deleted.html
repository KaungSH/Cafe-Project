<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Permanent Delete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <h4 class="text-danger">Warning: Permanent Delete</h4>
        <p>Are you sure you want to permanently delete Stock Import <strong th:text="${importId}">SI-001</strong> and all associated ingredient batches? This action cannot be undone.</p>
        
        <form th:action="@{/stock-imports/hard-delete}" method="post">
            <input type="hidden" name="import_id" th:value="${import_id}" />
            <div class="d-flex justify-content-between">
                <a th:href="@{/stock-imports/deleted}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">Confirm Permanent Delete</button>
            </div>
        </form>
    </div>
</body>
</html>
