<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Permanent Delete — Cafe Luft</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #fbf9f5; font-family: 'Plus Jakarta Sans', sans-serif; }
        .danger-card {
            border: 1px solid #fed7d7; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(229, 62, 62, 0.08); background: #ffffff;
        }
        .warning-icon-wrapper {
            width: 80px; height: 80px; border-radius: 50%;
            background-color: #fff5f5; display: inline-flex;
            align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container d-flex justify-content-center">
        <div class="card danger-card p-4 text-center" style="max-width: 480px; width: 100%;">
            <div class="mb-3">
                <div class="warning-icon-wrapper text-danger fs-1">
                    <i class="bi bi-trash3-fill"></i>
                </div>
            </div>
            
            <h4 class="fw-bold text-dark mb-2">Permanent Deletion</h4>
            <p class="text-muted small mb-4">
                Are you sure you want to permanently delete import <strong class="text-dark" th:text="${importId}">SI-001</strong>? All related batches and historical cost data will be unrecoverable[cite: 2].
            </p>

            <form th:action="@{/manager-only/stock-imports/hard-delete}" method="post">
                <input type="hidden" name="import_id" th:value="${importId}" />
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/manager-only/stock-imports/deleted}" class="btn btn-light px-4 border rounded-3">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold rounded-3 shadow-sm">Delete Forever</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
