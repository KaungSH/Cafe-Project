<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Permanent Delete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5 d-flex justify-content-center">
        <div class="card shadow-sm border-0" style="max-width: 500px; width: 100%;">
            <div class="card-header bg-danger text-white py-3">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Permanent Delete</h4>
            </div>
            <div class="card-body p-4 text-center">
                <div class="text-danger display-1 mb-3">
                    <i class="bi bi-x-circle-fill"></i>
                </div>
                <h5 class="mb-3">Are you sure you want to permanently delete this?</h5>
                <p class="text-muted mb-4">
                    Import ID: <strong class="text-dark" th:text="${import_id}">SI-001</strong><br>
                    This action will permanently delete the stock import record and all related ingredient batches from the database. <strong class="text-danger">This process cannot be undone.</strong>
                </p>

                <form th:action="@{/stock-imports/hard-delete}" method="post">
                    <input type="hidden" name="import_id" th:value="${import_id}" />
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/stock-imports/deleted}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-bold">Delete Permanently</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
