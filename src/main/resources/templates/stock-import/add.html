<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Stock Import</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-cart-plus me-2"></i>Add Stock Import</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/stock-imports/add}" th:object="${stockImport}" method="post">
                    
                    <!-- Import ID အတွက် Input Field လုံးဝ မထည့်ပါ -->

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Imported At:</label>
                            <input type="datetime-local" th:field="*{imported_at}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Supplier:</label>
                            <select th:field="*{supplier_id}" class="form-select" required>
                                <option value="" disabled selected>-- Select Supplier --</option>
                                <option th:each="sup : ${suppliers}" 
                                        th:value="${sup.supplier_id}" 
                                        th:text="${sup.name}">Supplier Name</option>
                            </select>
                        </div>
                    </div>

                    <h5 class="border-bottom pb-2 mb-3"><i class="bi bi-card-checklist me-2"></i>Ingredients</h5>
                    
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr class="text-center">
                                    <th style="width: 50px;">Select</th>
                                    <th>Ingredient</th>
                                    <th style="width: 100px;">Unit</th>
                                    <th style="width: 130px;">Quantity</th>
                                    <th style="width: 130px;">Unit Cost</th>
                                    <th style="width: 160px;">Manufactured</th>
                                    <th style="width: 160px;">Expire</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item, stat : *{items}">
                                    <td class="text-center">
                                        <input type="checkbox" class="form-check-input" 
                                               th:field="*{items[__${stat.index}__].selected}" />
                                        <input type="hidden" th:field="*{items[__${stat.index}__].ingredientTypeId}" />
                                    </td>
                                    <td class="fw-bold" th:text="${item.ingredientTypeName}">Sugar</td>
                                    <td class="text-center" th:text="${item.Uname}">kg</td>
                                    <td>
                                        <input type="number" step="0.01" th:field="*{items[__${stat.index}__].quantity_ordered}" class="form-control" placeholder="0.00" />
                                    </td>
                                    <td>
                                        <input type="number" step="0.01" th:field="*{items[__${stat.index}__].unit_cost}" class="form-control" placeholder="0.00" />
                                    </td>
                                    <td>
                                        <input type="date" th:field="*{items[__${stat.index}__].manufactured_date}" class="form-control" />
                                    </td>
                                    <td>
                                        <input type="date" th:field="*{items[__${stat.index}__].expire_date}" class="form-control" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/stock-imports}" class="btn btn-outline-secondary">Back to List</a>
                        <button type="submit" class="btn btn-warning px-4 fw-bold">[ Save Stock Import ]</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
