<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deleted Stock Imports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0"><i class="bi bi-trash-fill me-2"></i>Deleted Stock Import Records</h4>
                <a th:href="@{/stock-imports}" class="btn btn-light btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Active Imports
                </a>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Import ID</th>
                                <th>Imported At</th>
                                <th>Supplier</th>
                                <th>Employee</th>
                                <th>Branch</th>
                                <th>Total Cost</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="imp : ${imports}">
                                <td class="fw-bold" th:text="${imp.import_id}">SI-001</td>
                                <td th:text="${#temporals.format(imp.imported_at, 'yyyy-MM-dd HH:mm')}">2026-10-01 14:50</td>
                                <td th:text="${imp.supplier_name}">Supplier Name</td>
                                <td th:text="${imp.employee_name}">Employee Name</td>
                                <td th:text="${imp.branch_name}">Main Branch</td>
                                <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(imp.total_cost, 1, 2)}">200.00</td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/stock-imports/recover/{id}(id=${imp.import_id})}" class="btn btn-outline-success">Recover</a>
                                        <a th:href="@{/stock-imports/hard-delete/{id}(id=${imp.import_id})}" class="btn btn-outline-danger">Hard Delete</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(imports)}">
                                <td colspan="7" class="text-center text-muted py-4">No soft-deleted records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
