<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Luft | Types Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #F8F5F0;
            color: #2D241E;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .stats-dashboard {
            width: 95%;
            max-width: 1100px;
            margin: 32px auto;
        }

        /* ================= Header matching Branch Stats Management ================= */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #7D5127, #4E3013);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(78, 48, 19, 0.2);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #261B14;
            margin: 0;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-title-box p {
            font-size: 13px;
            color: #8C7A68;
            margin: 2px 0 0 0;
        }

        .ref-badge {
            background-color: #F1E7D9;
            color: #6C4724;
            border: 1px solid #E2D2BE;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF !important;
            border: none;
            border-radius: 9px;
            padding: 8px 16px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(88, 55, 24, 0.15);
        }

        .btn-action-primary:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #6C441E 0%, #432810 100%);
        }

        .btn-action-outline {
            background: #FFFFFF;
            color: #6A4421 !important;
            border: 1px solid #D8C8B5;
            border-radius: 9px;
            padding: 8px 15px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s;
        }

        .btn-action-outline:hover {
            background: #F3EBDD;
            border-color: #BFA78E;
        }

        /* ================= Glass / Card Table Design ================= */
        .table-container {
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #EADBCC;
            box-shadow: 0 8px 24px -6px rgba(58, 41, 26, 0.05);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #F8F3EC;
            color: #796450;
            padding: 14px 22px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 22px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .index-badge {
            font-family: monospace;
            background-color: #F1E7D9;
            color: #6C4724;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        .designation-name {
            font-weight: 600;
            color: #2D1D12;
            font-size: 14px;
        }

        /* ================= Edit & Delete Buttons Style (From Categories) ================= */
        .action-pill-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .btn-pill-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 78px;
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* Edit Pill Button */
        .btn-pill-edit {
            background-color: #FBF6EE;
            color: #8C5332 !important;
            border: 1px solid #E8D9C8;
        }

        .btn-pill-edit:hover {
            background-color: #F2E7D5;
            color: #5C3218 !important;
            border-color: #D9C3A8;
        }

        /* Delete Pill Button */
        .btn-pill-delete {
            background-color: #FFF5F4;
            color: #A3281D !important;
            border: 1px solid transparent;
        }

        .btn-pill-delete:hover {
            background-color: #FFE6E4;
            color: #7A1910 !important;
        }

        .btn-pill-action i {
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="stats-dashboard">

        <!-- Header matching Branch Stats Management -->
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="bi bi-cup-hot-fill"></i>
                </div>
                <div>
                    <h2>
                        <span><span th:text="${dname}">Audience</span> Types Directory</span>
                        <span class="ref-badge">Manager Reference</span>
                    </h2>
                    <p>Active taxonomy classifications for Café Luft operations</p>
                </div>
            </div>

            <!-- အကယ်၍ Header ညာဘက်တွင် ခလုတ်များ ထည့်သုံးလိုပါက အောက်ပါ comment ကို ဖြုတ်ပေးနိုင်ပါသည် -->
            <!--
            <div class="action-group">
                <a th:href="@{/manager-only/types/deleted}" class="btn-action-outline">
                    <i class="bi bi-archive"></i> Deleted List
                </a>
                <a th:href="@{/manager-only/types/add}" class="btn-action-primary">
                    <i class="bi bi-plus-lg"></i> Add New Type
                </a>
            </div>
            -->
        </div>

        <!-- Luxury Table Card -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table-luxury">
                    <thead>
                        <tr>
                            <th style="width: 160px;">Index</th>
                            <th>Designation Name</th>
                            <!-- Action ကော်လံ ထည့်သုံးလိုပါက အောက်ပါ comment ကို ဖြုတ်ပေးပါ -->
                            <!-- <th class="text-end" style="width: 120px;">Action</th> -->
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(types)}">
                            <td colspan="2" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                                No classifications registered in system.
                            </td>
                        </tr>
                        <tr th:each="t, state : ${types}">
                            <td>
                                <span class="index-badge" th:text="${state.count}">#1</span>
                            </td>
                            <td>
                                <span class="designation-name" th:if="${t.audience_type_name != null}" th:text="${t.audience_type_name}">All Customers</span>
                                <span class="designation-name" th:if="${t.promo_type_name != null}" th:text="${t.promo_type_name}">Seasonal</span>
                            </td>

                            <!-- Edit / Delete ခလုတ်များ ထည့်သုံးလိုပါက အောက်ပါ comment ကို ဖြုတ်ပေးပါ -->
                            <!--
                            <td class="text-end">
                                <div class="action-pill-group">
                                    <a href="#" class="btn-pill-action btn-pill-edit" title="Edit">
                                        <i class="fa-solid fa-pen-to-square"></i> Edit
                                    </a>
                                    <a href="#" class="btn-pill-action btn-pill-delete" onclick="return confirm('Are you sure you want to delete this record?');" title="Delete">
                                        <i class="fa-solid fa-trash-can"></i> Delete
                                    </a>
                                </div>
                            </td>
                            -->
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
