<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Café Luft | Types Directory</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-gold: #c5a059;
            --luft-espresso: #1a1410;
            --luft-cream: #faf7f2;
            --luft-surface: #ffffff;
            --luft-border: #ede4d8;
            --luft-shadow: 0 16px 40px rgba(26, 20, 16, 0.06);
        }

        body {
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
            letter-spacing: -0.02em;
        }

        .container-box {
            width: 92%;
            max-width: 840px;
            margin: 45px auto;
        }

        .type-hero {
            background: linear-gradient(135deg, rgba(26, 20, 16, 0.92) 0%, rgba(55, 38, 27, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            border-radius: 20px;
            padding: 34px 40px;
            color: #ffffff;
            box-shadow: 0 14px 35px rgba(26, 20, 16, 0.12);
            border: 1px solid rgba(197, 160, 89, 0.35);
            margin-bottom: 26px;
        }

        .luxury-card {
            background: var(--luft-surface);
            border: 1px solid var(--luft-border);
            border-radius: 20px;
            box-shadow: var(--luft-shadow);
            overflow: hidden;
        }

        .luxury-table thead th {
            background-color: #f7f3ed;
            color: #705e52;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 18px 28px;
            border-bottom: 1.5px solid var(--luft-border);
        }

        .luxury-table tbody td {
            padding: 18px 28px;
            vertical-align: middle;
            border-top: 1px solid #f6eee5;
            font-size: 0.94rem;
        }

        .index-badge {
            font-family: monospace;
            background: #faf4eb;
            color: var(--luft-primary);
            border: 1px solid #eadac7;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container-box">

        <div class="type-hero">
            <span class="badge bg-warning text-dark mb-2">Manager Reference</span>
            <h1 class="serif-font mb-1" style="font-size: 2.2rem; font-weight: 700;">
                <span th:text="${dname}">Audience</span> Types Directory
            </h1>
            <p class="text-white-50 mb-0 small">Active taxonomy classifications for Café Luft operations</p>
        </div>

        <div class="luxury-card">
            <div class="table-responsive">
                <table class="table luxury-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width: 25%;">INDEX</th>
                            <th style="width: 75%;">DESIGNATION NAME</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(types)}">
                            <td colspan="2" class="text-center py-5 text-muted">No classifications registered in system.</td>
                        </tr>
                        <tr th:each="t, state : ${types}">
                            <td>
                                <span class="index-badge" th:text="${'#' + state.count}">#1</span>
                            </td>
                            <td>
                                <strong class="text-dark fs-6" th:if="${t.audience_type_name != null}" th:text="${t.audience_type_name}">All Customers</strong>
                                <strong class="text-dark fs-6" th:if="${t.promo_type_name != null}" th:text="${t.promo_type_name}">Seasonal</strong>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
