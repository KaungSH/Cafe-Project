<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Luft | Types Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #F8F5F0;
            color: #2D241E;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        /* ဘားတန်းကြီး အရမ်းမရှည်စေရန် max-width ကို 720px သို့ ချုံ့ထားပါသည် */
        .stats-dashboard {
            width: 92%;
            max-width: 720px;
            margin: 42px auto;
        }

        /* ================= Header Design ================= */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 22px;
            background: #FFFFFF;
            padding: 18px 24px;
            border-radius: 16px;
            border: 1px solid #EADBCC;
            box-shadow: 0 6px 20px -6px rgba(58, 41, 26, 0.05);
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-avatar {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #7D5127, #4E3013);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(78, 48, 19, 0.2);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 20px;
            font-weight: 700;
            color: #261B14;
            margin: 0;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-title-box p {
            font-size: 12.5px;
            color: #8C7A68;
            margin: 3px 0 0 0;
        }

        .ref-badge {
            background-color: #F8F3EC;
            color: #7D5127;
            border: 1px solid #E2D2BE;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-count-pill {
            background-color: #FAF6F0;
            border: 1px solid #E5D7C6;
            color: #5C3D21;
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .total-count-pill strong {
            background: #7D5127;
            color: #FFFFFF;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* ================= Compact Luxury Table Card ================= */
        .table-container {
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #EADBCC;
            box-shadow: 0 8px 24px -6px rgba(58, 41, 26, 0.05);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #F8F3EC;
            color: #796450;
            padding: 14px 24px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 24px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .index-badge {
            font-family: monospace;
            background-color: #F1E7D9;
            color: #6C4724;
            border: 1px solid #E4D4C0;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            display: inline-block;
        }

        .designation-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .designation-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background-color: #FAF5EE;
            border: 1px solid #ECE0D1;
            color: #7D5127;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .designation-name {
            font-weight: 600;
            color: #2D1D12;
            font-size: 14px;
        }

        .status-tag-right {
            background-color: #DCFCE7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="stats-dashboard">

        <!-- Compact Header Card -->
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="bi bi-cup-hot-fill"></i>
                </div>
                <div>
                    <h2>
                        <span><span th:text="${dname}">Audience</span> Types</span>
                        <span class="ref-badge">Manager Reference</span>
                    </h2>
                    <p>Active taxonomy classifications for Café Luft operations</p>
                </div>
            </div>

            <!-- ညာဘက်ခြမ်းတွင် ကွက်လပ်မဖြစ်စေရန် Total Count ပြပေးထားပါသည် -->
            <div class="total-count-pill">
                <span>Total Types</span>
                <strong th:text="${types != null ? types.size() : '0'}">4</strong>
            </div>
        </div>

        <!-- Compact Luxury Table Card -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table-luxury">
                    <thead>
                        <tr>
                            <th style="width: 110px;">Index</th>
                            <th>Designation Name</th>
                            <th class="text-end" style="width: 140px;">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(types)}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                                No classifications registered in system.
                            </td>
                        </tr>
                        <tr th:each="t, state : ${types}">
                            <td>
                                <span class="index-badge" th:text="${state.count}">#1</span>
                            </td>
                            <td>
                                <div class="designation-box">
                                    <span class="designation-icon">
                                        <i class="fa-solid fa-tag"></i>
                                    </span>
                                    <span class="designation-name" th:if="${t.audience_type_name != null}" th:text="${t.audience_type_name}">All Customers</span>
                                    <span class="designation-name" th:if="${t.promo_type_name != null}" th:text="${t.promo_type_name}">Seasonal</span>
                                </div>
                            </td>
                            <td class="text-end">
                                <span class="status-tag-right">
                                    <i class="fa-solid fa-check"></i> Active
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
