<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Café Luft | Add Type</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-gold: #c5a059;
            --luft-espresso: #1a1410;
            --luft-cream: #faf7f2;
            --luft-border: #ede4d8;
        }

        body {
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .form-card {
            width: 100%;
            max-width: 580px;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--luft-border);
            box-shadow: 0 16px 45px rgba(26, 20, 16, 0.08);
            margin: 60px auto;
            overflow: hidden;
        }

        .form-card-header {
            background: linear-gradient(135deg, #241c17 0%, #3e2d22 100%);
            padding: 26px 32px;
            color: #ffffff;
            border-bottom: 2px solid var(--luft-gold);
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #615045;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;
            border: 1.5px solid var(--luft-border);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.94rem;
            color: var(--luft-espresso);
        }
        .form-control:focus {
            border-color: var(--luft-primary);
            box-shadow: 0 0 0 4px rgba(133, 83, 37, 0.12);
        }

        .btn-luxury-submit {
            background: linear-gradient(135deg, var(--luft-primary) 0%, #683d16 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 11px 26px;
            font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(104, 61, 22, 0.22);
            transition: all 0.2s;
        }
        .btn-luxury-submit:hover {
            transform: translateY(-1px);
            color: #ffffff;
        }

        .btn-cancel {
            background: #ffffff;
            border: 1px solid var(--luft-border);
            border-radius: 10px;
            color: #635348;
            font-weight: 600;
            padding: 11px 22px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-cancel:hover {
            background: #f7eee3;
            color: var(--luft-espresso);
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="form-card">
        <div class="form-card-header d-flex justify-content-between align-items-center">
            <div>
                <h3 class="serif-font mb-0" style="font-size: 1.65rem;">
                    <i class="bi bi-tag-fill me-2" style="color: var(--luft-gold);"></i>Add <span th:text="${dname}">Audience</span> Type
                </h3>
                <small class="text-white-50">Register new promotion group or audience tier</small>
            </div>
            <a th:href="@{/admin/types/{type}(type = ${name})}" class="btn-close btn-close-white" aria-label="Close"></a>
        </div>

        <div class="p-4 p-md-5">
            <form method="post" th:action="@{/admin/types/add}" th:object="${type}">
                <input type="hidden" name="name" th:value="${name}"/>

                <div class="mb-4">
                    <label class="form-label">Type Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-color: var(--luft-border);"><i class="bi bi-pen text-muted"></i></span>
                        <input th:if="${name == 'audience'}" type="text" class="form-control border-start-0" th:field="${type.audience_type_name}" placeholder="e.g., VIP Members" required>
                        <input th:if="${name == 'promo'}" type="text" class="form-control border-start-0" th:field="${type.promo_type_name}" placeholder="e.g., Seasonal Special" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 pt-3 border-top mt-4">
                    <a th:href="@{/admin/types/{type}(type = ${name})}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-luxury-submit">
                        <i class="bi bi-check2-circle me-1"></i> Add Type
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
