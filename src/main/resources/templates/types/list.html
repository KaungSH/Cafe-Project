<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Café Luft | Classification Types</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-gold: #c5a059;
            --luft-espresso: #1a1410;
            --luft-cream: #faf7f2;
            --luft-surface: #ffffff;
            --luft-border: #ede4d8;
            --luft-muted: #82746b;
            --luft-shadow: 0 16px 40px rgba(26, 20, 16, 0.06);
        }

        body {
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
            margin: 0;
            padding-bottom: 60px;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
            letter-spacing: -0.02em;
        }

        .container-box {
            width: 92%;
            max-width: 960px;
            margin: 40px auto;
        }

        /* Hero Banner */
        .type-hero {
            background: linear-gradient(135deg, rgba(26, 20, 16, 0.92) 0%, rgba(55, 38, 27, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            border-radius: 20px;
            padding: 34px 40px;
            color: #ffffff;
            box-shadow: 0 14px 35px rgba(26, 20, 16, 0.12);
            border: 1px solid rgba(197, 160, 89, 0.35);
            margin-bottom: 26px;
        }

        .hero-tag {
            background: rgba(197, 160, 89, 0.22);
            border: 1px solid var(--luft-gold);
            color: #fcefd6;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .btn-add-type {
            background: linear-gradient(135deg, var(--luft-primary) 0%, #683d16 100%);
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            padding: 10px 22px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(104, 61, 22, 0.22);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s ease;
        }
        .btn-add-type:hover {
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* Card & Table */
        .luxury-card {
            background: var(--luft-surface);
            border: 1px solid var(--luft-border);
            border-radius: 20px;
            box-shadow: var(--luft-shadow);
            overflow: hidden;
        }

        .luxury-table {
            width: 100%;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .luxury-table thead th {
            background-color: #f7f3ed;
            color: #705e52;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 18px 28px;
            border-bottom: 1.5px solid var(--luft-border);
            border-top: none;
        }

        .luxury-table tbody td {
            padding: 18px 28px;
            vertical-align: middle;
            border-top: 1px solid #f6eee5;
            color: var(--luft-espresso);
            font-size: 0.94rem;
        }

        .luxury-table tbody tr:first-child td {
            border-top: none;
        }

        .luxury-table tbody tr:hover td {
            background-color: #fbf7f1;
        }

        .index-badge {
            font-family: monospace;
            background: #faf4eb;
            color: var(--luft-primary);
            border: 1px solid #eadac7;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .type-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(197, 160, 89, 0.16);
            color: var(--luft-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            border: 1px solid rgba(197, 160, 89, 0.25);
        }

        .type-text {
            font-weight: 700;
            color: var(--luft-espresso);
            font-size: 1.05rem;
        }

        .btn-act {
            padding: 6px 15px;
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-act-edit {
            background: #ffffff;
            color: #7b4f24;
            border: 1px solid #dfcbb8;
        }
        .btn-act-edit:hover {
            background: #7b4f24;
            color: #ffffff;
        }

        .btn-act-del {
            background: #ffffff;
            color: #b32d2d;
            border: 1px solid #f5c8c8;
        }
        .btn-act-del:hover {
            background: #b32d2d;
            color: #ffffff;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container-box">

        <!-- Top Header Hero -->
        <div class="type-hero d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <span class="hero-tag"><i class="bi bi-tag-fill me-1"></i> Promotion Configurations</span>
                <h1 class="serif-font mb-1" style="font-size: 2.2rem; font-weight: 700;">
                    <span th:text="${dname}">Audience</span> Types Directory
                </h1>
                <p class="text-white-50 mb-0 small">Manage discount audience tiers and promo types for Café Luft</p>
            </div>
            <div class="mt-3 mt-md-0">
                <a th:href="@{/admin/types/add/{type}(type = ${name})}" class="btn-add-type">
                    <i class="bi bi-plus-lg"></i> Add New <span th:text="${dname}">Type</span>
                </a>
            </div>
        </div>

        <!-- Master Classification Ledger -->
        <div class="luxury-card">
            <div class="table-responsive">
                <table class="table luxury-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 15%;">INDEX</th>
                            <th style="width: 55%;">TYPE DESIGNATION</th>
                            <th style="width: 30%;" class="text-end pe-4">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(types)}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 opacity-50"></i>
                                No classifications defined yet. Click "Add New" to create one.
                            </td>
                        </tr>
                        <tr th:each="t, state : ${types}">
                            <td>
                                <span class="index-badge" th:text="${'#' + state.count}">#1</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="type-icon">
                                        <i class="bi bi-bookmark-star"></i>
                                    </div>
                                    <div>
                                        <div class="type-text" th:if="${t.audience_type_name != null}" th:text="${t.audience_type_name}">All Customers</div>
                                        <div class="type-text" th:if="${t.promo_type_name != null}" th:text="${t.promo_type_name}">Seasonal</div>
                                        <small class="text-muted" style="font-size: 0.78rem;">Active Promotion Scope</small>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end pe-4">
                                <!-- Audience Type Actions -->
                                <div class="d-inline-flex gap-2" th:if="${t.audience_type_id != null}">
                                    <a th:href="@{/admin/types/audience/edit/{id}(id = ${t.audience_type_id})}" class="btn-act btn-act-edit">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    <a th:href="@{/admin/types/audience/delete/{id}(id = ${t.audience_type_id})}" 
                                       class="btn-act btn-act-del"
                                       onclick="return confirm('Are you sure you want to delete this audience type?');">
                                        <i class="bi bi-trash3"></i> Delete
                                    </a>
                                </div>

                                <!-- Promo Type Actions -->
                                <div class="d-inline-flex gap-2" th:if="${t.promo_type_id != null}">
                                    <a th:href="@{/admin/types/promo/edit/{id}(id = ${t.promo_type_id})}" class="btn-act btn-act-edit">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    <a th:href="@{/admin/types/promo/delete/{id}(id = ${t.promo_type_id})}" 
                                       class="btn-act btn-act-del"
                                       onclick="return confirm('Are you sure you want to delete this promo type?');">
                                        <i class="bi bi-trash3"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
