<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Luft | Status Ledger</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-canvas: #f8f5f0;
            --surface: #ffffff;
            --espresso-dark: #1a110a;
            --roast-caramel: #b8864e;
            --champagne-gold: #cbb493;
            --cream-soft: #faf6f0;
            --border-subtle: #ede3d5;
            --text-main: #2b1d14;
            --text-secondary: #7f7267;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        /* တွင်ကျယ်လွန်းခြင်းမရှိဘဲ အလယ်ဗဟို၌ ကျစ်လစ်စေရန် */
        .status-wrapper {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Expense Category ပုံစံ အပေါ်ထိပ် ကော်ဖီနောက်ခံ Banner */
        .cafe-header-banner {
            background: linear-gradient(135deg, rgba(26, 17, 10, 0.92) 0%, rgba(46, 29, 19, 0.88) 100%),
                        url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            border-radius: 24px;
            padding: 26px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 18px 45px -10px rgba(26, 17, 10, 0.25);
            border: 1px solid rgba(203, 180, 147, 0.35);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(203, 180, 147, 0.45);
            border: 2.5px solid var(--champagne-gold);
            overflow: hidden;
            flex-shrink: 0;
        }

        .brand-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            color: #ffffff;
            font-weight: 700;
            margin: 0;
        }

        .brand-subtitle {
            color: var(--champagne-gold);
            font-size: 0.74rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Floating Capsule Tabs */
        .capsule-tabs {
            display: inline-flex;
            background: #ede3d5;
            padding: 5px;
            border-radius: 14px;
            border: 1px solid #dfd1c0;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
        }

        .capsule-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 0.84rem;
            font-weight: 600;
            color: #6d5b4e;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .capsule-link:hover {
            color: var(--espresso-dark);
            background: rgba(255, 255, 255, 0.55);
        }

        .capsule-link.active {
            background: #ffffff;
            color: var(--roast-caramel);
            box-shadow: 0 4px 12px rgba(26, 20, 16, 0.08);
            font-weight: 700;
        }

        /* Ledger Table Card */
        .ledger-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.05);
            overflow: hidden;
        }

        .ledger-table {
            width: 100%;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .ledger-table thead th {
            background-color: #f7f3ed;
            color: var(--text-secondary);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 16px 24px;
            border-bottom: 1.5px solid var(--border-subtle);
        }

        .ledger-table tbody td {
            padding: 18px 24px;
            vertical-align: middle;
            border-top: 1px solid #f6eee5;
            font-size: 0.92rem;
            transition: background 0.18s ease;
        }

        .ledger-table tbody tr:first-child td {
            border-top: none;
        }

        .ledger-table tbody tr:hover td {
            background-color: var(--cream-soft);
        }

        .id-capsule {
            display: inline-flex;
            align-items: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #faf4eb;
            color: var(--roast-caramel);
            border: 1px solid #eadac7;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .status-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--espresso-dark);
            margin-bottom: 2px;
        }

        .status-sub {
            font-size: 0.76rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

  <div layout:fragment="content">
    <div class="status-wrapper">

        <!-- Executive Boutique Hero (Coffee Background & Logo) -->
        <div class="cafe-header-banner">
            <div class="brand-section">
                <div class="brand-logo-circle">
                    <img th:src="@{/images/luft-logo.png}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/924/924514.png'" alt="Logo">
                </div>
                <div>
                    <h1 class="brand-name">Café Luft</h1>
                    <div class="brand-subtitle">
                        <i class="bi bi-shield-check"></i> STATUS REGISTRY &amp; REFERENCE
                    </div>
                </div>
            </div>
            <div class="text-white-50 small d-none d-md-block">System Governance</div>
        </div>

        <!-- Scope Navigation Tabs -->
        <div class="d-flex justify-content-start">
            <div class="capsule-tabs">
                <a class="capsule-link" 
                   th:classappend="${selectedType == 'branch' or selectedType == null} ? 'active'"
                   th:href="@{/admin/statuses(type='branch')}">
                    <i class="bi bi-shop"></i> Branch
                </a>
                <a class="capsule-link" 
                   th:classappend="${selectedType == 'employee'} ? 'active'"
                   th:href="@{/admin/statuses(type='employee')}">
                    <i class="bi bi-person-badge"></i> Employee
                </a>
                <a class="capsule-link" 
                   th:classappend="${selectedType == 'customer'} ? 'active'"
                   th:href="@{/admin/statuses(type='customer')}">
                    <i class="bi bi-people"></i> Customer
                </a>
                <a class="capsule-link" 
                   th:classappend="${selectedType == 'register'} ? 'active'"
                   th:href="@{/admin/statuses(type='register')}">
                    <i class="bi bi-clipboard2-check"></i> Register
                </a>
            </div>
        </div>

        <!-- Minimal Status Ledger Card -->
        <div class="ledger-card">
            <div class="table-responsive">
                <table class="table ledger-table align-middle">
                    <thead>
                        <tr>
                            <th style="width: 35%;">Reference ID</th>
                            <th style="width: 65%;">Status State / Identifier</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="st : ${statusList}">
                            <td>
                                <span class="id-capsule" th:text="${'ST-' + st.id}">ST-1</span>
                            </td>
                            <td>
                                <div class="status-title" th:text="${st.name}">OPENED</div>
                                <div class="status-sub">Standard Lifecycle Condition</div>
                            </td>
                        </tr>

                        <!-- No Data Found State -->
                        <tr th:if="${#lists.isEmpty(statusList)}">
                            <td colspan="2" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 opacity-50"></i>
                                No status configurations recorded for this category.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
  </div>

</body>
</html>
