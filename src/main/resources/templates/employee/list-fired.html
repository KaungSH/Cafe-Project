<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminated Employee Archives | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #fcf9f5;
            --surface: #ffffff;
            --espresso: #1f140e;
            --caramel: #c49a6c;
            --border-subtle: #f0e9df;
            --text-dark: #2a1d17;
        }
        body { background-color: var(--bg-canvas); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-dark); }
        .main-card {
            background: var(--surface); border-radius: 20px; border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 30px rgba(42, 29, 23, 0.04); padding: 30px; max-width: 1200px; margin: 40px auto;
        }
        .brand-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--espresso); }
        .cafe-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; }
        .cafe-table thead th {
            font-size: 0.74rem; font-weight: 700; color: #5c4335; text-transform: uppercase;
            letter-spacing: 1.2px; padding: 14px; border-bottom: 1.5px solid var(--border-subtle);
        }
        .cafe-table tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border-subtle); }
        .cafe-table tbody td { padding: 14px; vertical-align: middle; font-size: 0.92rem; }
        .btn-rehire {
            background-color: #3f6e52; color: #fff; border: none; border-radius: 10px;
            padding: 6px 16px; font-weight: 600; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-uppercase fw-bold" style="font-size: 0.72rem; letter-spacing: 1.5px; color: var(--caramel);">Vault Archives</span>
                <h2 class="brand-title mb-0">Fired Staff Directory</h2>
            </div>
            <div>
                <a th:if="${session.loggedInUser.employee_role == 'MANAGER'}" th:href="@{/manager-only/employee}" 
                   class="btn btn-light px-3 py-2 fw-semibold" style="border-radius: 12px; border: 1.5px solid var(--border-subtle);">
                    <i class="bi bi-arrow-left"></i> Active Roster
                </a>
                <a th:if="${session.loggedInUser.employee_role == 'ADMIN'}" th:href="@{/admin/employee}" 
                   class="btn btn-light px-3 py-2 fw-semibold" style="border-radius: 12px; border: 1.5px solid var(--border-subtle);">
                    <i class="bi bi-arrow-left"></i> Active Roster
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="cafe-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Profile</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Salary</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp, state : ${employees}">
                        <td class="text-muted fw-bold" th:text="${state.count < 10 ? '0' + state.count : state.count}">01</td>
                        <td>
                            <img th:if="${emp.photopath != null and emp.photopath != ''}" th:src="@{'/images/' + ${emp.photopath}}" alt="Photo"
                                 style="width: 38px; height: 38px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-subtle);" />
                            <span th:unless="${emp.photopath != null and emp.photopath != ''}" class="text-muted">—</span>
                        </td>
                        <td><strong style="color: var(--espresso);" th:text="${emp.name}">Name</strong></td>
                        <td class="text-muted" th:text="${emp.email}">Email</td>
                        <td th:text="${emp.role_name}">Role</td>
                        <td class="fw-bold" th:text="${emp.salary}">Salary</td>
                        <td><span class="badge" style="background-color: #fdf2f0; color: #cb5a4c; border-radius: 20px; padding: 5px 12px;">Fired</span></td>
                        <td class="text-end">
                            <a th:if="${session.loggedInUser.employee_role == 'MANAGER'}" 
                               th:href="@{/manager-only/employee/setonleave/{id}(id=${emp.employee_id})}" 
                               onclick="return confirm('Do you really want to re-hire this employee?')" class="btn-rehire">
                                <i class="bi bi-arrow-counterclockwise"></i> Re-Hire
                            </a>
                            <a th:if="${session.loggedInUser.employee_role == 'ADMIN'}" 
                               th:href="@{/manager-only/employee/setonleave/{id}(id=${emp.employee_id})}" 
                               onclick="return confirm('Do you really want to re-hire this employee?')" class="btn-rehire">
                                <i class="bi bi-arrow-counterclockwise"></i> Re-Hire
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i> No terminated records found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
