<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .error {
        	color : red;
            font-size: 0.950rem;
        }
    </style>
</head>
<body class="container mt-4">

    <h2>Create Employee For <span th:text = "${branch_name}"></span></h2>

    <form th:action="@{/manager-only/employee/add}" th:object="${employeeDto}" method="post" class="w-50 mt-3">
    <input type = "hidden" th:field = "*{employee_role_id}">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="text" th:field="*{password}" class="form-control">
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control">
            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control">
            <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control">
            <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">DOB</label>
            <input type="date" th:field="*{dob}" class="form-control">
            <span th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}" class="text-danger"></span>
            <span th:text="${error}" class = "error"></span>
        </div>
        <div class="mb-3">
		    <label class="form-label">Gender</label>
		    
		    <select th:field="*{gender}" class="form-control" required="required">
		        <!-- Placeholder option -->
		        <option value="" disabled="disabled" selected="selected" hidden="hidden">Select Gender</option>
		        
		        <!-- Loop through the Enum values automatically -->
		        <option th:each="g : ${T(cafe.project.models.Gender).values()}" 
		                th:value="${g}" 
		                th:text="${g}">
		        </option>
		    </select>
		    
		    <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-danger"></span>
		</div>
        <div class="mb-3">
		    <label class="form-label">Status</label>
		    <select th:field="*{employee_status_id}" class="form-control" required="required">
		        <!-- Placeholder option -->
		        <option value="" disabled="disabled" selected="selected" hidden="hidden">Select Status</option>
		        
		        <!-- Dynamic options populated from the controller's status list -->
		        <option th:each="s : ${statuses}" 
		                th:value="${s.status_id}" 
		                th:text="${s.name}">
		        </option>
		    </select>
		    <span th:if="${#fields.hasErrors('employee_status_id')}" th:errors="*{employee_status_id}" class="text-danger"></span>
		</div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/manager-only/employee}" class="btn btn-secondary">Cancel</a>
    </form>

</body>
</html>
