<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-3">Employee List<span th:text = "${branch_name}"></span></h2>
    
    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/manager-only/employee/add}" class="btn btn-primary">+ Add Employee</a>
        <a th:href="@{/manager-only/employee/fired}" class="btn btn-secondary">See Fired Employees</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>No.</th>
                <th>Photo</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>DateofBirth</th>
                <th>Gender</th>
                <th>Role</th>
                <th>Salary</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp,state : ${employees}">
                <td th:text="${state.count}"></td>
                <td><img th:if="${emp.photopath != null and emp.photopath  != ''}"
							th:src="@{'/images/' + ${emp.photopath}}" alt="image error"
							style="width: 40px; height: 40px; object-fit: contain; border-radius: 8px;" />

							<span th:if="${emp.photopath == null or emp.photopath == ''}"
							class="text-muted"> — </span></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.address}"></td>
                <td th:text="${emp.dob}"></td>
                <td th:text="${emp.gender}"></td>
                <td th:text="${emp.salary}"></td>
                <td th:text="${emp.role_name}"></td>
                <td th:text="${emp.status_name}"></td>
                <td>
                    <a th:href="@{/manager-only/employee/edit/{id}(id=${emp.employee_id})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/manager-only/employee/transfer/{id}(id=${emp.employee_id})}" class="btn btn-warning btn-sm">Transfer</a>
                    <a th:if="${emp.status_name == 'NORMAL'}" th:href="@{/manager-only/employee/setonleave/{id}(id=${emp.employee_id})}"  
                       class="btn btn-danger btn-sm">Set On Leave</a>
                   	<a th:if="${emp.status_name == 'ONLEAVE'}" th:href="@{/manager-only/employee/setnormal/{id}(id=${emp.employee_id})}"  
                       class="btn btn-danger btn-sm">Set Normal</a>
                    <a th:href="@{/manager-only/employee/fire/{id}(id=${emp.employee_id})}" 
                       onclick="return confirm('Do not Really want to fire this Employee?')" 
                       class="btn btn-danger btn-sm">Fire</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
