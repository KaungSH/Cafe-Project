<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8f5f0;
            --surface: #ffffff;
            --espresso: #1f140e;
            --roast-caramel: #b8864e;
            --champagne-gold: #cbb493;
            --border-subtle: #ede3d5;
            --text-dark: #2a1d17;
            --active-bg: #eaf6ed;
            --active-text: #2d7a46;
            --leave-bg: #fdf5e6;
            --leave-text: #b8860b;
        }
        body { background-color: var(--bg-canvas); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-dark); }
        .main-wrapper { max-width: 1400px; margin: 40px auto; padding: 0 20px; }

        /* Expense Category Style Coffee Header */
        .cafe-header-banner {
            background: linear-gradient(135deg, rgba(26, 17, 10, 0.92) 0%, rgba(46, 29, 19, 0.88) 100%),
                        url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            border-radius: 24px; padding: 28px 40px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 18px 45px -10px rgba(26, 17, 10, 0.25);
            border: 1px solid rgba(203, 180, 147, 0.35); flex-wrap: wrap; gap: 20px;
        }
        .brand-section { display: flex; align-items: center; gap: 20px; }
        .brand-logo-circle {
            width: 62px; height: 62px; border-radius: 50%; background: #ffffff;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(203, 180, 147, 0.45);
            border: 2.5px solid var(--champagne-gold); overflow: hidden; flex-shrink: 0;
        }
        .brand-logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .brand-name { font-family: 'Playfair Display', serif; font-size: 1.95rem; color: #ffffff; font-weight: 700; margin: 0; }
        .brand-subtitle { color: var(--champagne-gold); font-size: 0.76rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
        .btn-recycle {
            background: rgba(255, 255, 255, 0.08); color: #f7ede2; border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px; padding: 11px 22px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; backdrop-filter: blur(8px); transition: 0.25s;
        }
        .btn-recycle:hover { background: rgba(255, 255, 255, 0.16); color: #fff; transform: translateY(-2px); }
        .btn-add-primary {
            background: linear-gradient(135deg, var(--roast-caramel) 0%, #9c6c39 100%); color: #ffffff; border: none;
            border-radius: 14px; padding: 12px 26px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem; box-shadow: 0 6px 20px rgba(184, 134, 78, 0.35); transition: 0.25s;
        }
        .btn-add-primary:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(184, 134, 78, 0.5); }
        .table-card {
            background: var(--surface); border-radius: 24px; border: 1px solid var(--border-subtle);
            box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.05); padding: 28px 32px; margin-top: 28px;
        }
        .cafe-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .cafe-table thead th {
            font-size: 0.74rem; font-weight: 700; color: #7f7267; text-transform: uppercase;
            letter-spacing: 1.4px; padding: 16px 14px; border-bottom: 1.5px solid var(--border-subtle);
        }
        .cafe-table tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border-subtle); }
        .cafe-table tbody tr:hover { background-color: #faf6f0; }
        .cafe-table tbody td { padding: 16px 14px; vertical-align: middle; font-size: 0.92rem; }
        .user-avatar { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; border: 1.5px solid #ebdccb; }
        .user-initials {
            width: 42px; height: 42px; border-radius: 10px; background: #faf5ee; border: 1px solid #ebdccb;
            display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #6a4933;
        }
        .badge-status { font-size: 0.75rem; font-weight: 600; padding: 5px 12px; border-radius: 30px; display: inline-flex; align-items: center; gap: 5px; }
        .badge-status.normal { background: var(--active-bg); color: var(--active-text); }
        .badge-status.onleave { background: var(--leave-bg); color: var(--leave-text); }
        .btn-action-icon {
            width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border-subtle); background: #fff;
            display: inline-flex; align-items: center; justify-content: center; color: var(--text-dark); text-decoration: none; transition: 0.2s;
        }
        .btn-action-icon:hover { border-color: var(--espresso); color: #fff; background: var(--espresso); transform: translateY(-2px); }
        .btn-action-icon.danger:hover { background: #b94234; color: #fff; border-color: #b94234; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="main-wrapper">
        <div class="cafe-header-banner">
            <div class="brand-section">
                <div class="brand-logo-circle">
                    <img th:src="@{/images/luft-logo.png}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/924/924514.png'" alt="Logo">
                </div>
                <div>
                    <h1 class="brand-name">Café Luft</h1>
                    <div class="brand-subtitle"><i class="bi bi-people-fill"></i> EMPLOYEE ROSTER MANAGEMENT</div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/admin/employee/fired}" class="btn-recycle"><i class="bi bi-archive"></i> Fired Archives</a>
                <a th:href="@{/admin/employee/add}" class="btn-add-primary"><i class="bi bi-plus-circle"></i> Add Employee</a>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="cafe-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Photo</th>
                            <th>Name</th>
                            <th>Contact</th>
                            <th>Branch</th>
                            <th>Role</th>
                            <th>Salary</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp, state : ${employees}">
                            <td class="text-muted fw-bold" th:text="${state.count < 10 ? '0' + state.count : state.count}">01</td>
                            <td>
                                <img th:if="${emp.photopath != null and emp.photopath != ''}" th:src="@{'/images/' + ${emp.photopath}}" alt="Photo" class="user-avatar" />
                                <div th:unless="${emp.photopath != null and emp.photopath != ''}" class="user-initials" th:text="${#strings.substring(emp.name, 0, 1)}">U</div>
                            </td>
                            <td>
                                <strong style="color: var(--espresso);" th:text="${emp.name}">Employee Name</strong>
                                <div class="text-muted small" th:text="${emp.gender}">MALE</div>
                            </td>
                            <td>
                                <div th:text="${emp.email}">email@cafeluft.com</div>
                                <small class="text-muted" th:text="${emp.phone}">+95912345678</small>
                            </td>
                            <td><span class="badge" style="background: #f7f3ed; color: #6a4933; border: 1px solid #ebdccb;" th:text="${emp.branch_name}">Main</span></td>
                            <td><span class="fw-semibold text-muted" th:text="${emp.role_name}">BARISTA</span></td>
                            <td class="fw-bold" style="color: #4a2e1b;" th:text="${emp.salary}">$650.00</td>
                            <td>
                                <span th:if="${emp.status_name == 'NORMAL'}" class="badge-status normal"><i class="bi bi-check2"></i> Active</span>
                                <span th:if="${emp.status_name == 'ONLEAVE'}" class="badge-status onleave"><i class="bi bi-clock-history"></i> On Leave</span>
                                <span th:if="${emp.status_name != 'NORMAL' and emp.status_name != 'ONLEAVE'}" class="badge-status" style="background: #f1edeb; color: #8c827a;" th:text="${emp.status_name}">Status</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/admin/employee/edit/{id}(id=${emp.employee_id})}" class="btn-action-icon" title="Edit"><i class="bi bi-pencil-square"></i></a>
                                    <a th:href="@{/admin/employee/transfer/{id}(id=${emp.employee_id})}" class="btn-action-icon" title="Transfer"><i class="bi bi-arrow-left-right"></i></a>
                                    <a th:if="${emp.status_name == 'NORMAL'}" th:href="@{/admin/employee/setonleave/{id}(id=${emp.employee_id})}" class="btn-action-icon" title="Set On Leave"><i class="bi bi-pause-circle"></i></a>
                                    <a th:if="${emp.status_name == 'ONLEAVE'}" th:href="@{/admin/employee/setnormal/{id}(id=${emp.employee_id})}" class="btn-action-icon" title="Set Normal"><i class="bi bi-play-circle"></i></a>
                                    <a th:href="@{/admin/employee/fire/{id}(id=${emp.employee_id})}" onclick="return confirm('Do you really want to fire this employee?')" class="btn-action-icon danger" title="Fire"><i class="bi bi-person-x"></i></a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="9" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i> No employee records found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
