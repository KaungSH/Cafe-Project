body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.42) 100%);
  pointer-events:none;
  z-index:0;
}

/* Falling coffee beans */
#coffee-rain{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:30;
}
.coffee-bean{
  position:absolute;
  top:-45px;
  width:11px;
  height:16px;
  border-radius:50% 45% 50% 45%;
  background:linear-gradient(135deg,#281006 0%,#6f3619 46%,#2a0d05 100%);
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.25);
  opacity:.96;
  will-change:top,transform,opacity;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));
  animation:beanFall var(--duration) linear var(--delay) forwards;
}
.coffee-bean::after{
  content:"";
  position:absolute;
  left:50%;
  top:1px;
  width:2px;
  height:13px;
  border-radius:50%;
  background:rgba(242,191,148,.38);
  transform:translateX(-50%) rotate(10deg);
}
@keyframes beanFall{
  0%{top:-50px;transform:translateX(0) rotate(var(--rot)) scale(.7);opacity:0}
  8%{opacity:.8}
  50%{top:50vh;transform:translateX(var(--drift1)) rotate(190deg);opacity:.75}
  100%{top:110vh;transform:translateX(var(--drift2)) rotate(430deg) scale(.9);opacity:0}
}

.login-card{
  position:relative;
  z-index:5;
  width:min(500px,92vw);
  padding:34px 32px 28px;
  text-align:center;
  border:1px solid rgba(255,238,220,.28);
  border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(35,15,8,.50));
  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);
  box-shadow:0 28px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.14);
  overflow:hidden;
}
.login-card::before{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  top:-250px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(214,129,67,.24);
  filter:blur(50px);
  border-radius:50%;
  pointer-events:none;
}

.coffee-logo{
  position:relative;
  width:104px;
  height:104px;
  margin:0 auto 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#6d361d 0%,#3a170c 58%,#170904 100%);
  border:7px solid rgba(61,25,12,.92);
  box-shadow:0 0 0 10px rgba(220,139,77,.08),0 12px 26px rgba(0,0,0,.45),inset 0 4px 10px rgba(255,198,143,.10);
  animation:logoFloat 3.4s ease-in-out infinite;
}
.coffee-logo .cup{
  position:relative;
  font-size:50px;
  line-height:1;
  color:#fff6ec;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.3));
  animation:cupSway 2.8s ease-in-out infinite;
}
.coffee-logo .cup::after{
  content:"";
  position:absolute;
  left:50%;
  top:15%;
  width:48px;
  height:22px;
  transform:translateX(-50%);
  border-radius:50%;
  border:4px solid rgba(106,52,28,.9);
  opacity:.9;
}
.steam{position:absolute;top:18px;width:4px;height:25px;border-radius:50%;border-left:3px solid rgba(255,239,223,.72);filter:blur(.2px);animation:steam 1.9s ease-in-out infinite}
.steam.s1{left:40px}.steam.s2{left:53px;height:22px;animation-delay:.45s}.steam.s3{left:65px;height:24px;animation-delay:.9s}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes cupSway{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(4deg) scale(1.04)}}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scale(.8)}30%{opacity:.8}100%{opacity:0;transform:translateY(-20px) translateX(6px) scale(1.15)}}

.login-title{
  margin:0 0 9px;
  font-size:clamp(2rem,4.5vw,2.7rem);
  line-height:1.1;
  font-weight:700;
  letter-spacing:.2px;
  color:#fffaf5;
  text-shadow:0 4px 18px rgba(0,0,0,.28);
}
.login-subtitle{
  margin:0 0 24px;
  font-size:.85rem;
  color:#e6d3c5;
}
.login-subtitle .mini-cup{display:inline-block;animation:miniCup 1.8s ease-in-out infinite}
@keyframes miniCup{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateY(-2px)}}

.form-control-wrap{position:relative;margin-bottom:18px}
.form-control-wrap .input-icon{
  position:absolute;
  left:22px;
  top:50%;
  transform:translateY(-50%);
  color:#df9b59;
  font-size:1.05rem;
  z-index:2;
}
.form-control-wrap .toggle-password{
  position:absolute;
  right:22px;
  top:50%;
  transform:translateY(-50%);
  color:#d8c5b8;
  cursor:pointer;
  z-index:2;
}
.form-control{
  width:100%;
  height:56px;
  padding:0 50px;
  border-radius:18px;
  border:1px solid rgba(255,239,225,.18);
  outline:none;
  color: #fffaf6 !important; 
  font-size:.95rem;
  background:rgba(20,9,5,.48) !important;
  box-shadow:inset 0 2px 12px rgba(0,0,0,.18);
  transition:.3s ease;
}
.form-control::placeholder{color:#cbb7aa;opacity:1}
.form-control:focus{
  border-color:rgba(229,154,85,.72);
  box-shadow:0 0 0 4px rgba(229,154,85,.10),inset 0 2px 12px rgba(0,0,0,.18);
  background:rgba(20,9,5,.58) !important;
}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:#fff6ef !important;
  -webkit-box-shadow:0 0 0 1000px rgba(20,9,5,.75) inset !important;
  transition:background-color 9999s ease-in-out 0s;
}

.login-options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin:10px 4px 20px;
  color:#d9c5b8;
  font-size:.85rem;
}
.remember{display:flex;align-items:center;gap:12px;cursor:pointer}
.remember input{width:23px;height:23px;accent-color:#d98943;cursor:pointer}
.forgot{color:#e5a466;text-decoration:none;font-weight:500;transition:.2s}
.forgot:hover{color:#ffd0a5}

.btn-primary-login{
  height:56px;
  width:100%;
  margin-top: 50px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#c96e2e,#eea35c);
  color:#fffaf6;
  font-size:1.05rem;
  font-weight:700;
  box-shadow:0 12px 30px rgba(205,103,39,.28),inset 0 1px 0 rgba(255,255,255,.2);
  transition:.3s ease;
}
.btn-primary-login:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 16px 34px rgba(205,103,39,.36)}
.btn-primary-login:active{transform:translateY(0)}
.btn-primary-login .btn-cup{display:inline-block;margin-right:8px;animation:buttonCup 1.6s ease-in-out infinite}
@keyframes buttonCup{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg) translateY(-2px)}}

.footer-text{
  margin-top:24px;
  font-size:.85rem;
  color:#d6c3b7;
}
.create-account{color:#e9a365;font-weight:700;text-decoration:none}
.create-account:hover{color:#ffd1aa}

@media(max-width:600px){
  body{padding:18px 12px}
  .login-card{padding:42px 22px 36px;border-radius:30px}
  .coffee-logo{width:132px;height:132px;border-width:8px;margin-bottom:35px}
  .coffee-logo .cup{font-size:62px}
  .steam{top:21px}.steam.s1{left:46px}.steam.s2{left:63px}.steam.s3{left:77px}
  .login-subtitle{margin-bottom:38px}
  .form-control{height:70px;padding-left:62px;border-radius:24px}
  .form-control-wrap .input-icon{left:23px}
  .form-control-wrap .toggle-password{right:22px}
  .login-options{font-size:.88rem;margin-bottom:28px}
  .btn-primary-login{height:70px;border-radius:24px}
  .footer-text{margin-top:35px;font-size:.88rem}
}

/* Select dropdown styling */
select.form-control {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  cursor: pointer;
}
.form-control-wrap .select-arrow {
  position: absolute;
  right: 22px;
  top: 50%;
  transform: translateY(-50%);
  color: #df9b59;
  pointer-events: none;
  font-size: 0.9rem;
  z-index: 2;
}
select.form-control option {
  background: var(--coffee-dark);
  color: var(--cream);
}
</style>
</head>
<body>
	<div id="coffee-rain" aria-hidden="true"></div>

	<div class="login-card">
		<div class="coffee-logo" aria-label="Coffee cup icon">
			<span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>
			<i class="fa-solid fa-mug-hot cup"></i>
		</div>

		<h1 class="login-title">Employee Login</h1>
		<p class="login-subtitle">Your perfect coffee is waiting <span class="mini-cup">☕</span></p>

		<form th:action="@{/login}" method="post">
			<div class="form-control-wrap">
				<i class="fa-solid fa-user input-icon"></i>
				<input type="text" class="form-control" id="email" name="username"
					placeholder="Username" required autofocus>
			</div>

			<div class="form-control-wrap">
				<i class="fa-solid fa-lock input-icon"></i>
				<input type="password" class="form-control" id="password" name="password"
					placeholder="Password" required>
				<i class="fa-solid fa-eye toggle-password" id="togglePassword" title="Show password"></i>
			</div>

			
			
			<!-- Branch Input Field -->
<div class="form-control-wrap">
    <i class="fa-solid fa-store input-icon"></i>
    <select class="form-control" id="branchId" name="branchId" required>
        <option value="" disabled selected hidden>Select Branch</option>
        
        <!-- Controller ဘက်မှ List ထည့်ပေးထားပါက Thymeleaf ဖြင့် သုံးရန် -->
        <option th:each="b : ${branches}" 
                th:value="${b.id}" 
                th:text="${b.name}">
        </option>


        <option value="1">Main Branch (Downtown)</option>
        <option value="2">Branch 1 (Hledan)</option>
        <option value="3">Branch 2 (Mandalay)</option>
       
    </select>
    <i class="fa-solid fa-chevron-down select-arrow"></i>
</div>

			<button type="submit" class="btn btn-primary-login">
				<span class="btn-cup">☕</span> Login
			</button>
		</form>

		
	</div>

<script>
(function(){
  const rain=document.getElementById('coffee-rain');
  function makeBean(initial=false){
    const bean=document.createElement('span');
    bean.className='coffee-bean';
    const size=7+Math.random()*9;
    const duration=5.5+Math.random()*4.5;
    bean.style.width=size+'px';
    bean.style.height=(size*1.45)+'px';
    bean.style.left=(Math.random()*100)+'vw';
    bean.style.setProperty('--drift1',((Math.random()*120)-60)+'px');
    bean.style.setProperty('--drift2',((Math.random()*180)-90)+'px');
    bean.style.setProperty('--rot',((Math.random()*80)-40)+'deg');
    bean.style.setProperty('--duration',duration+'s');
    bean.style.setProperty('--delay',initial?(-Math.random()*duration)+'s':'0s');
    bean.style.opacity=(0.45+Math.random()*0.4).toFixed(2);
    rain.appendChild(bean);
    setTimeout(()=>bean.remove(),(duration+1)*1000);
  }
  for(let i=0;i<45;i++) makeBean(true);
  setInterval(()=>makeBean(false),200);

  const toggle=document.getElementById('togglePassword');
  const password=document.getElementById('password');
  toggle.addEventListener('click',()=>{
    const show=password.type==='password';
    password.type=show?'text':'password';
    toggle.classList.toggle('fa-eye',!show);
    toggle.classList.toggle('fa-eye-slash',show);
    toggle.title=show?'Hide password':'Show password';
  });
})();
</script>
</body>
