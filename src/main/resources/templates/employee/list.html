<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body layout:fragment="content">

    <h2 class="mb-3">Employee List</h2>
    
    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/manager/employee/add}" class="btn btn-primary">+ Add Employee</a>
        <a th:href="@{/manager/employee/deleted-list}" class="btn btn-secondary">Trash (Deleted List)</a>
    </div>

    <!-- Filter Bar -->
    <form th:action="@{/manager/employee/filter}" method="get" class="row g-2 mb-4">
        <div class="col-md-3">
            <select name="roleId" class="form-select">
                <option value="">-- Filter by Role --</option>
                <option value="1">Admin</option>
                <option value="2">Manager</option>
                <option value="3">Staff</option>
            </select>
        </div>
        <div class="col-md-3">
            <select name="statusId" class="form-select">
                <option value="">-- Filter by Status --</option>
                <option value="1">Active</option>
                <option value="2">Inactive</option>
            </select>
        </div>
        <div class="col-md-3">
            <input type="text" name="branchId" class="form-control" placeholder="Filter by Branch ID">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-info text-white">Filter</button>
            <a th:href="@{/manager/employee}" class="btn btn-outline-secondary">Reset</a>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Branch</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.employee_id}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.role_name}"></td>
                <td th:text="${emp.branch_name}"></td>
                <td th:text="${emp.ESname}"></td>
                <td>
                    <a th:href="@{/manager/employee/edit/{id}(id=${emp.employee_id})}" class="btn btn-warning btn-sm">Edit</a>
                    <a th:href="@{/manager/employee/delete/{id}(id=${emp.employee_id})}" 
                       onclick="return confirm('Move this employee to deleted list?')" 
                       class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
