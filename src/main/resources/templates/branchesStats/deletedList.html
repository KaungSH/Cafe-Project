<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Deleted Branch Stats</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	margin: 0;
	background-color: #faf7f1;
	color: #241c16;
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.branchesStats-container {
	width: 95%;
	max-width: 1450px;
	margin: 25px auto;
}

.branchesStats-header {
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	margin-bottom: 28px;
}

.branchesStats-title h2 {
	margin: 0 0 6px 0;
	color: #241c16;
	font-size: 27px;
	font-weight: 700;
	line-height: 1.2;
}

.branchesStats-title h2 i {
	color: #875522;
	font-size: 22px;
	margin-right: 7px;
}

.branchesStats-title p {
	margin: 0;
	color: #806b56;
	font-size: 14px;
	line-height: 1.5;
}

.btn-back {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #eadbc7;
	color: #624522;
	border: none;
	border-radius: 9px;
	padding: 10px 18px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	transition: 0.2s;
}

.btn-back:hover {
	background-color: #ddc9ae;
	color: #4f351c;
}

/* Table */
.branchesStats-container .table {
	width: 100%;
	margin: 0;
	background-color: #fffaf4;
	border: 1px solid #eadcca;
	border-radius: 14px;
	overflow: hidden;
	border-collapse: separate;
	border-spacing: 0;
	box-shadow: 0 2px 8px rgba(80, 50, 20, 0.04);
}

.branchesStats-container .table thead th {
	background-color: #f5ecdf;
	color: #9a8067;
	padding: 13px 20px;
	font-size: 12px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.4px;
	border: none;
	border-bottom: 1px solid #eadcca;
	white-space: nowrap;
}

.branchesStats-container .table tbody td {
	padding: 14px 20px;
	color: #705a45;
	font-size: 14px;
	vertical-align: middle;
	border: none;
	border-bottom: 1px solid #eadcca;
}

.branchesStats-container .table tbody tr:last-child td {
	border-bottom: none;
}

.branchesStats-container .table tbody tr:hover {
	background-color: #fcf5eb;
}

.branchesStats-container .table tbody td:nth-child(2) {
	color: #211a15;
	font-weight: 500;
}

.branchesStats-container .table tbody td:nth-child(3) {
	color: #745d47;
}

.branchesStats-container .table tbody td:nth-child(4) {
	color: #806b56;
	white-space: nowrap;
}

.btn-restore {
	display: inline-block;
	color: #5f401f;
	background-color: #ffffff;
	border: 1px solid #ddcbb4;
	border-radius: 8px;
	padding: 6px 13px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	transition: 0.2s;
}

.btn-restore:hover {
	background-color: #f1e4d1;
	color: #5f401f;
	border-color: #cdb391;
}

.btn-hard-delete {
	display: inline-block;
	color: #8f3e2e;
	background-color: #ffffff;
	border: 1px solid #e2c9bf;
	border-radius: 8px;
	padding: 6px 13px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	margin-left: 5px;
	transition: 0.2s;
}

.btn-hard-delete:hover {
	background-color: #f2d8d0;
	color: #8f3e2e;
	border-color: #d6afa3;
}
</style>

</head>


<body>

	<div class="branchesStats-container">

		<div class="branchesStats-header">

			<div class="branchesStats-title">

				<h2>
					<i class="bi bi-trash"></i> Deleted Branch Stats
				</h2>

				<p>Manage your deleted branch stats</p>

			</div>


			<div>

				<a th:href="@{/manager/branchesStats}" class="btn-back"> <i
					class="bi bi-arrow-left"></i> Back to List

				</a>

			</div>

		</div>

		<table class="table">

			<thead>

				<tr>

					<th>No</th>

					<th>Branch Name</th>

					<th>Sale Count</th>

					<th>Sale Amount</th>

					<th>Month</th>

					<th>Employee Cost</th>

					<th>Employee Name</th>

					<th class="text-end">Actions</th>

				</tr>

			</thead>


			<tbody>

				<tr th:each="branchesStats, state : ${branchseStats}">

					<td th:text="${state.count}"></td>

					<td th:text="${branchesStats.branch_name}"></td>

					<td th:text="${branchesStats.salecount}"></td>

					<td th:text="${branchesStats.saleamount}"></td>

					<td th:text="${branchesStats.month}"></td>

					<td th:text="${branchesStats.employee_cost}"></td>

					<td th:text="${branchesStats.employee_name}"></td>


					<td class="text-end">
					<a
						th:href="@{/manager/branchesStats/restore(
                        branch_stats_id=${branchesStats.branch_stats_id})}"
						class="btn-restore"
						onclick="return confirm('Are you sure you want to restore this record?')">

							<i class="bi bi-arrow-counterclockwise"></i> Restore

					</a>  <a
						th:href="@{/manager/branchesStats/real-delete(
                        branch_stats_id=${branchesStats.branch_stats_id})}"
						class="btn-hard-delete"
						onclick="return confirm('This record will be permanently deleted. Are you sure?')">

							<i class="bi bi-trash"></i> Hard Delete

					</a>

					</td>

				</tr>


				<tr th:if="${#lists.isEmpty(branchseStats)}">

					<td colspan="8"
						style="text-align: center; color: #806b56; padding: 30px;">

						No deleted records found.</td>

				</tr>

			</tbody>

		</table>

	</div>

</body>

</html>
