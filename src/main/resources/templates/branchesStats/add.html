<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">

<head>
<meta charset="UTF-8">
<title>Add Branch Stats</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	margin: 0;
	background-color: #faf7f1;
	color: #241c16;
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.form-container {
	width: 90%;
	max-width: 800px;
	margin: 35px auto;
}

.form-card {
	background-color: #fffaf4;
	border: 1px solid #eadcca;
	border-radius: 14px;
	padding: 30px;
	box-shadow: 0 2px 8px rgba(80, 50, 20, 0.05);
}

.form-title {
	margin-bottom: 25px;
}

.form-title h2 {
	color: #241c16;
	font-size: 27px;
	font-weight: 700;
	margin-bottom: 5px;
}

.form-title p {
	color: #806b56;
	margin: 0;
}

.form-label {
	color: #624522;
	font-weight: 600;
	margin-bottom: 7px;
}

.form-control, .form-select {
	border: 1px solid #ddcbb4;
	border-radius: 8px;
	padding: 10px 12px;
}

.form-control:focus, .form-select:focus {
	border-color: #925d2b;
	box-shadow: 0 0 0 0.15rem rgba(146, 93, 43, 0.15);
}

.btn-save {
	background-color: #925d2b;
	color: white;
	border: none;
	border-radius: 8px;
	padding: 10px 20px;
	font-weight: 600;
}

.btn-save:hover {
	background-color: #75451f;
	color: white;
}

.btn-cancel {
	background-color: #eadbc7;
	color: #624522;
	border: none;
	border-radius: 8px;
	padding: 10px 20px;
	font-weight: 600;
	text-decoration: none;
}

.btn-cancel:hover {
	background-color: #ddc9ae;
	color: #4f351c;
}
</style>
</head>

<body>

	<div layout:fragment="content">

		<div class="form-card">

			<div class="form-title">
				<h2>
					<i class="bi bi-bar-chart-fill"></i> Add Branch Stats
				</h2>

				<p>Add monthly statistics for a branch</p>
			</div>

			<form th:action="@{/manager/branchesStats/add}"
				th:object="${branchesStats}" method="post">

				<div class="mb-3">
					<label class="form-label">Sale Count</label> <input type="number"
						class="form-control" th:field="*{salecount}" min="0" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Sale Amount</label> <input type="number"
						class="form-control" th:field="*{saleamount}" min="0" step="0.01"
						required>
				</div>

				<div class="mb-3">
					<label class="form-label">Month</label> <input type="month"
						class="form-control" th:field="*{month}" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Employee Cost</label> <input
						type="number" class="form-control" th:field="*{employee_cost}"
						min="0" step="0.01" required>
				</div>

				<button type="submit" class="btn-save">Save</button>

				<a th:href="@{/manager/branchesStats}" class="btn-cancel">
					Cancel </a>

			</form>

		</div>

	</div>

</body>
</html>
