<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-luxury: 0 10px 30px -5px rgba(92, 61, 46, 0.08), 0 4px 12px -2px rgba(92, 61, 46, 0.03);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .checkout-container {
            max-width: 1350px;
            margin: 35px auto 60px;
            padding: 0 25px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin: 0;
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow-luxury);
            margin-bottom: 22px;
        }

        .card-heading {
            font-size: 19px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin-bottom: 4px;
        }

        .card-subheading {
            color: var(--cafe-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .token-pill {
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
            border: 1px solid var(--cafe-border);
            border-radius: 12px;
            padding: 10px 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
        }

        .form-select, .form-control {
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            padding: 10px 14px;
            font-size: 0.95rem;
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #F5EFEB;
        }
        .product-item:last-child {
            border-bottom: none;
        }

        .product-avatar {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .amount-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .btn-luxury-pay {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--cafe-primary) 0%, var(--cafe-primary-dark) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(92, 61, 46, 0.25);
            transition: all 0.25s ease;
        }
        .btn-luxury-pay:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(92, 61, 46, 0.35);
        }

        .btn-luxury-back {
            width: 100%;
            height: 46px;
            background: #ffffff;
            border: 1px solid var(--cafe-border);
            border-radius: 12px;
            color: var(--cafe-muted);
            font-weight: 600;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-luxury-back:hover {
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
        }
    </style>
</head>

<body>

    <div class="checkout-container">

        <!-- Top Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title">Order Checkout</h1>
                <p class="text-muted small mb-0">Select settlement method and complete transactions</p>
            </div>
            <div class="token-pill">
                <i class="bi bi-ticket-perforated"></i>
                Token No: <span th:text="${order.token_number}">001</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Payment Form -->
            <div class="col-lg-6">
                <div class="luxury-card">
                    <div class="card-heading">Payment Information</div>
                    <div class="card-subheading">Choose customer's preferred payment tender.</div>

                    <form th:action="@{/payments/add}" th:object="${payment}" method="post">
                        <input type="hidden" name="order_id" th:value="${order.order_id}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted small">PAYMENT METHOD</label>
                            <select name="method_id" class="form-select" required>
                                <option value="">-- Choose Payment Method --</option>
                                <option th:each="method : ${payMethods}"
                                        th:value="${method.methodId}"
                                        th:text="${method.name}">Cash</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted small">ATTACHMENT / RECEIPT FILE PATH</label>
                            <input type="text" name="filepath" class="form-control" placeholder="Optional transaction reference / receipt path">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-muted small">TRANSACTION NOTE</label>
                            <textarea name="note" class="form-control" rows="3" placeholder="Additional details, table number or transaction ID..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-luxury-pay">
                            Complete Payment <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                        <a th:href="@{/order-with-details}" class="btn-luxury-back">
                            <i class="bi bi-arrow-left"></i> Cancel and Return
                        </a>
                    </form>
                </div>
            </div>

            <!-- Right Column: Summary & Total -->
            <div class="col-lg-6">
                <div class="luxury-card">
                    <div class="card-heading mb-3">Order Items</div>
                    <div class="order-items-wrapper mb-3">
                        <div th:each="detail : ${orderDetails}" class="product-item">
                            <div class="d-flex align-items-center gap-3">
                                <div class="product-avatar">
                                    <i class="bi bi-cup-hot"></i>
                                </div>
                                <div>
                                    <div class="fw-bold" style="color: var(--cafe-dark);" th:text="${detail.product_name}">Cappuccino</div>
                                    <div th:if="${detail.remark != null and detail.remark != ''}" class="text-muted small" th:text="'Note: ' + ${detail.remark}">Note</div>
                                    <div class="badge bg-light text-muted border mt-1">Quantity: <span th:text="${detail.quantity}">1</span></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr style="border-color: var(--cafe-border);">

                    <div class="amount-row">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-semibold" th:text="${subtotal} + ' Ks'">0.00 Ks</span>
                    </div>

                    <div th:if="${hasDiscount}" class="amount-row text-danger">
                        <span>Discount Savings</span>
                        <span class="fw-semibold" th:text="'- ' + ${discountAmount} + ' Ks'">-0.00 Ks</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 mt-2 border-top" style="border-color: var(--cafe-border) !important;">
                        <span class="fw-bold" style="font-size: 18px; color: var(--cafe-primary-dark);">Grand Total</span>
                        <span class="fw-bold" style="font-size: 24px; color: var(--cafe-primary-dark);" th:text="${finalAmount} + ' Ks'">0.00 Ks</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
