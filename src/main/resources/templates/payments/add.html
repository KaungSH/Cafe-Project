<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background-color: #f5f6f8;
        }

        .container {
            max-width: 1100px;
        }

        .checkout-title {
            font-weight: bold;
            font-size: 30px;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        }

        .card-header {
            font-size: 20px;
            font-weight: bold;
        }

        .token-box {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        .table th {
            background-color: #f8f9fa;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .total-box {
            font-size: 22px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container mt-5 mb-5">


    <!-- ================================= -->
    <!-- TITLE -->
    <!-- ================================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="checkout-title">
            Checkout
        </h2>


        <a th:href="@{/order-with-details}"
           class="btn btn-secondary">

            Back

        </a>

    </div>



    <!-- ================================= -->
    <!-- ORDER INFORMATION -->
    <!-- TOKEN ONLY -->
    <!-- ================================= -->

    <div class="card mb-4">


        <div class="card-header bg-primary text-white">

            Order Information

        </div>


        <div class="card-body">

            <div class="token-box">

                Token No.

                <span th:text="${order.token_number}">
                    7
                </span>

            </div>

        </div>

    </div>



    <!-- ================================= -->
    <!-- ORDER DETAILS -->
    <!-- ALL DETAILS -->
    <!-- ================================= -->

    <div class="card mb-4">


        <div class="card-header bg-success text-white">

            Order Details

        </div>


        <div class="card-body">


            <div class="table-responsive">


                <table class="table table-bordered">


                    <thead>

                    <tr>

                        <th style="width: 70px;">
                            No.
                        </th>

                        <th>
                            Product
                        </th>

                        <th style="width: 150px;">
                            Quantity
                        </th>

                        <th>
                            Remark
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr
                        th:each="detail, stat : ${orderDetails}">


                        <td th:text="${stat.count}">
                            1
                        </td>


                        <td th:text="${detail.product_name}">
                            Caffe Latte
                        </td>


                        <td th:text="${detail.quantity}">
                            1
                        </td>


                        <td>

                            <span
                                th:if="${detail.remark != null
                                        and !#strings.isEmpty(detail.remark)}"
                                th:text="${detail.remark}">
                                No sugar
                            </span>

                            <span
                                th:if="${detail.remark == null
                                        or #strings.isEmpty(detail.remark)}">
                                -
                            </span>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>



            <!-- TOTAL -->

            <div class="d-flex justify-content-end mt-3">

                <div class="total-box">

                    Total Amount:

                    <span th:text="${order.total_amount}">
                        3000.00
                    </span>

                </div>

            </div>


        </div>

    </div>



    <!-- ================================= -->
    <!-- PAYMENT -->
    <!-- ================================= -->

    <div class="card mb-4">


        <div class="card-header bg-warning">

            Payment

        </div>


        <div class="card-body">


            <form
                th:action="@{/payments/add}"
                th:object="${payment}"
                method="post">


                <!-- ORDER ID -->
                <!-- Hidden only -->
                <input
                    type="hidden"
                    name="order_id"
                    th:value="${order.order_id}">



                <!-- ========================= -->
                <!-- PAYMENT METHOD -->
                <!-- ========================= -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Payment Method

                    </label>


                    <select
                        name="method_id"
                        class="form-select"
                        required>

                        <option value="">

                            -- Select Payment Method --

                        </option>


                        <option
                            th:each="method : ${payMethods}"
                            th:value="${method.methodId}"
                            th:text="${method.name}">

                        </option>


                    </select>

                </div>



                <!-- ========================= -->
                <!-- NOTE -->
                <!-- ========================= -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Note

                    </label>


                    <textarea
                        name="note"
                        class="form-control"
                        rows="3"
                        placeholder="Payment note">
                    </textarea>

                </div>



                <!-- ========================= -->
                <!-- BUTTONS -->
                <!-- ========================= -->

                <div class="d-flex justify-content-end gap-2">


                    <a
                        th:href="@{/order-with-details}"
                        class="btn btn-secondary">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="btn btn-success">

                        Pay Now

                    </button>


                </div>


            </form>


        </div>

    </div>


</div>


</body>

</html>
