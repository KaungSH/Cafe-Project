<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payments</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>
body {
	background-color: #ffffff;
	font-family: Arial, Helvetica, sans-serif;
	color: #111827;
}

.page-container {
	max-width: 1500px;
	margin: 0 auto;
	padding: 25px 20px 50px;
}

.page-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

.page-title {
	margin: 0;
	font-size: 32px;
	font-weight: 700;
	color: #111827;
}

.header-buttons {
	display: flex;
	gap: 10px;
}

.header-btn {
	border-radius: 9px;
	padding: 10px 18px;
	font-weight: 600;
}

.filter-box {
	background: #ffffff;
	border: 1px solid #e5e7eb;
	border-radius: 14px;
	padding: 20px;
	margin-bottom: 28px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.search-wrapper {
	position: relative;
}

.search-wrapper i {
	position: absolute;
	left: 17px;
	top: 50%;
	transform: translateY(-50%);
	color: #64748b;
	font-size: 20px;
	z-index: 2;
}

.search-input {
	height: 56px;
	border: 1px solid #cbd5e1;
	border-radius: 10px;
	padding-left: 52px;
	font-size: 17px;
}

.search-input:focus {
	border-color: #94a3b8;
	box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.15);
}

.date-input {
	height: 56px;
	border: 1px solid #cbd5e1;
	border-radius: 10px;
	font-size: 17px;
}

.clear-btn {
	height: 56px;
	border: 1px solid #94a3b8;
	border-radius: 10px;
	padding: 0 20px;
	color: #475569;
	background: #ffffff;
	font-size: 16px;
}

.clear-btn:hover {
	background-color: #f8fafc;
}

.table-card {
	background: #ffffff;
	border: 1px solid #e2e8f0;
	border-radius: 14px;
	overflow: hidden;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.table-responsive {
	overflow-x: auto;
}

.payment-table {
	width: 100%;
	min-width: 1250px;
	border-collapse: collapse;
}

.payment-table thead {
	background-color: #f8fafc;
}

.payment-table thead th {
	padding: 18px 20px;
	color: #64748b;
	font-size: 14px;
	font-weight: 700;
	text-align: left;
	border-bottom: 1px solid #e2e8f0;
	white-space: nowrap;
}

.payment-table tbody td {
	padding: 19px 20px;
	border-bottom: 1px solid #edf0f3;
	font-size: 14px;
	color: #475569;
	vertical-align: middle;
}

.payment-table tbody tr {
	transition: background-color 0.15s ease;
}

.payment-table tbody tr:hover {
	background-color: #f8fafc;
}

.payment-table tbody tr:last-child td {
	border-bottom: none;
}

.token-number {
	font-weight: 700;
	color: #111827;
	white-space: nowrap;
}

.method-badge {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #e0f2fe;
	color: #0369a1;
	padding: 6px 11px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 700;
	white-space: nowrap;
}

.employee-name {
	font-weight: 600;
	color: #111827;
	white-space: nowrap;
}

.branch-name {
	color: #475569;
	white-space: nowrap;
}

.total-amount {
	font-weight: 700;
	color: #111827;
	white-space: nowrap;
}

.payment-date {
	white-space: nowrap;
	color: #64748b;
}

.file-path {
	display: inline-block;
	max-width: 220px;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	color: #64748b;
}

.deleted-badge {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #fee2e2;
	color: #b91c1c;
	padding: 6px 11px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 700;
	white-space: nowrap;
}

.action-buttons {
	display: flex;
	gap: 7px;
	white-space: nowrap;
}

.restore-btn {
	border: 1px solid #198754;
	color: #198754;
	background-color: #ffffff;
	border-radius: 7px;
	padding: 7px 13px;
	font-size: 12px;
	font-weight: 600;
	text-decoration: none;
}

.restore-btn:hover {
	background-color: #198754;
	color: #ffffff;
}

.delete-btn {
	border: 1px solid #dc3545;
	color: #dc3545;
	background-color: #ffffff;
	border-radius: 7px;
	padding: 7px 13px;
	font-size: 12px;
	font-weight: 600;
	text-decoration: none;
}

.delete-btn:hover {
	background-color: #dc3545;
	color: #ffffff;
}

.empty-row {
	text-align: center;
	padding: 50px !important;
	color: #94a3b8 !important;
}

.empty-icon {
	font-size: 34px;
	margin-bottom: 10px;
}

@media ( max-width : 768px) {
	.page-container {
		padding: 20px 12px 40px;
	}
	.page-header {
		flex-direction: column;
		align-items: flex-start;
		gap: 15px;
	}
	.page-title {
		font-size: 27px;
	}
	.header-buttons {
		width: 100%;
	}
	.header-btn {
		flex: 1;
	}
	.filter-box {
		padding: 14px;
	}
}
</style>

</head>


<body>


	<div class="page-container">

		<div class="page-header">

			<h1 class="page-title">Payments</h1>


			<div class="header-buttons">

				<a th:href="@{/payments}" class="btn btn-secondary header-btn">

					<i class="bi bi-arrow-left"></i> Back to Payments

				</a>

			</div>

		</div>

		<div class="filter-box">

			<div class="row g-2 align-items-center">

				<div class="col-lg-6 col-md-6">

					<div class="search-wrapper">

						<i class="bi bi-search"></i> <input type="text" id="searchPayment"
							class="form-control search-input"
							placeholder="Search payment, employee, branch, method...">

					</div>

				</div>

				<div class="col-lg-4 col-md-4">

					<input type="date" id="searchDate" class="form-control date-input">

				</div>

				<div class="col-lg-2 col-md-2">

					<button type="button" class="btn clear-btn w-100"
						onclick="clearSearch()">

						<i class="bi bi-x-lg"></i> Clear

					</button>

				</div>


			</div>

		</div>

		<div class="table-card">

			<div class="table-responsive">

				<table class="payment-table">

					<thead>

						<tr>

							<th>Token No.</th>

							<th>Pay Method</th>

							<th>Employee</th>

							<th>Branch</th>

							<th>Product</th>

							<th>Note</th>

							<th>Total Amount</th>

							<th>Date</th>

							<th>File Path</th>

							<th>Status</th>

							<th>Actions</th>

						</tr>

					</thead>

					<tbody>


						<tr th:each="payment : ${payments}"
							th:attr="data-date=${payment.date != null ? payment.date : ''}">

							<td><span class="token-number"
								th:text="${payment.token_number}"></span></td>

							<td><span class="method-badge"> <i
									class="bi bi-credit-card"></i> <span
									th:text="${payment.pay_method_name}"></span>

							</span></td>

							<td><span class="employee-name"
								th:text="${payment.employee_name}"></span></td>

							<td><span class="branch-name"
								th:text="${payment.branch_name}"></span></td>

							<td><span class="prodct-name"
								th:text="${payment.product_name}"></span></td>
							<td><span class="payment-note" th:text="${payment.note}">-</span></td>

							<td><span class="total-amount"
								th:text="${#numbers.formatDecimal(payment.total_amount, 1, 2) + ' Ks'}">

									</span></td>

							<td><span class="payment-date" th:text="${payment.date}">

									</span></td>

							<td><span class="file-path"
								th:text="${payment.filepath != null and payment.filepath != '' ? payment.filepath : '—'}">

									— </span></td>

							<td><span class="deleted-badge"> <i
									class="bi bi-trash3"></i> Deleted

							</span></td>

							<td>

								<div class="action-buttons">

									<a
										th:href="@{/payments/restore/{id}(id=${payment.payment_id})}"
										class="btn restore-btn"
										onclick="return confirm('Are you sure you want to restore this payment?');">

										<i class="bi bi-arrow-counterclockwise"></i> Restore

									</a> <a
										th:href="@{/payments/real-deleted/{id}(id=${payment.payment_id})}"
										class="btn delete-btn"
										onclick="return confirm('Are you sure you want to permanently delete this payment?');">

										<i class="bi bi-trash"></i> Delete

									</a>


								</div>

							</td>


						</tr>

						<tr th:if="${#lists.isEmpty(payments)}">

							<td colspan="9" class="empty-row">

								<div class="empty-icon">

									<i class="bi bi-trash3"></i>

								</div> No deleted payments found.

							</td>

						</tr>


					</tbody>

				</table>

			</div>

		</div>


	</div>

	<script>
		document.getElementById("searchPayment").addEventListener("input",
				filterPayments);

		document.getElementById("searchDate").addEventListener("change",
				filterPayments);

		function filterPayments() {

			const searchValue = document.getElementById("searchPayment").value
					.toLowerCase().trim();

			const selectedDate = document.getElementById("searchDate").value;

			const rows = document
					.querySelectorAll(".payment-table tbody tr[data-date]");

			rows.forEach(function(row) {

				const rowText = row.innerText.toLowerCase();

				const rowDate = row.getAttribute("data-date");

				const matchesSearch = rowText.includes(searchValue);

				const matchesDate = selectedDate === ""
						|| rowDate === selectedDate;

				if (matchesSearch && matchesDate) {

					row.style.display = "";

				} else {

					row.style.display = "none";

				}

			});

		}

		function clearSearch() {

			document.getElementById("searchPayment").value = "";

			document.getElementById("searchDate").value = "";

			const rows = document
					.querySelectorAll(".payment-table tbody tr[data-date]");

			rows.forEach(function(row) {

				row.style.display = "";

			});

		}
	</script>


</body>

</html>
