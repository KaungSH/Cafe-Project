<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleted Payments - Café Luft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-luxury: 0 10px 30px -5px rgba(92, 61, 46, 0.08), 0 4px 12px -2px rgba(92, 61, 46, 0.03);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .page-container {
            max-width: 1480px;
            margin: 0 auto;
            padding: 30px 25px 60px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin: 0;
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            box-shadow: var(--shadow-luxury);
        }

        .btn-luxury-outline {
            background: #ffffff;
            color: var(--cafe-primary-dark);
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 600;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-luxury-outline:hover {
            background: var(--cafe-gold-light);
            border-color: var(--cafe-gold);
            color: var(--cafe-primary-dark);
        }

        .payment-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .payment-table thead th {
            background: #FAF8F5;
            color: var(--cafe-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            padding: 14px 18px;
            border-bottom: 1px solid var(--cafe-border);
            white-space: nowrap;
        }
        .payment-table tbody td {
            padding: 16px 18px;
            border-bottom: 1px solid #F5EFEB;
            vertical-align: middle;
            font-size: 0.88rem;
        }

        .token-tag {
            font-weight: 700;
            color: var(--cafe-primary-dark);
            background: var(--cafe-gold-light);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            display: inline-block;
        }

        .deleted-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #FEE2E2;
            color: #DC2626;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Stacked Pill Buttons */
        .action-pill-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .btn-pill-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 82px;
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Restore Pill */
        .btn-pill-edit {
            background-color: #FBF6EE;
            color: #8C5332 !important;
            border: 1px solid #E8D9C8;
        }
        .btn-pill-edit:hover {
            background-color: #F2E7D5;
            color: #5C3218 !important;
            border-color: #D9C3A8;
        }

        /* Purge Pill */
        .btn-pill-delete {
            background-color: #FFF5F4;
            color: #A3281D !important;
            border: 1px solid transparent;
        }
        .btn-pill-delete:hover {
            background-color: #FFE6E4;
            color: #7A1910 !important;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="page-container">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title">Deleted Payments</h1>
                <p class="text-muted small mb-0">Archived transactions and permanent purge</p>
            </div>
            <a th:href="@{/payments}" class="btn-luxury-outline">
                <i class="bi bi-arrow-left me-1"></i> Active Payments
            </a>
        </div>

        <!-- Table -->
        <div class="luxury-card overflow-hidden">
            <div class="table-responsive">
                <table class="payment-table">
                    <thead>
                        <tr>
                            <th>Token No.</th>
                            <th>Method</th>
                            <th>Staff & Branch</th>
                            <th>Products</th>
                            <th>Total Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="payment : ${payments}">
                            <td><span class="token-tag" th:text="${payment.token_number}">#001</span></td>
                            <td><span class="fw-semibold text-muted" th:text="${payment.pay_method_name}">Cash</span></td>
                            <td>
                                <div class="fw-semibold" th:text="${payment.employee_name}">Staff</div>
                                <div class="text-muted small" th:text="${payment.branch_name}">Branch</div>
                            </td>
                            <td><span class="fw-medium" th:text="${payment.product_name}">Espresso</span></td>
                            <td>
                                <strong style="color: var(--cafe-primary-dark);"
                                        th:text="${#numbers.formatDecimal(payment.total_amount, 1, 2) + ' Ks'}">0.00 Ks</strong>
                            </td>
                            <td><span class="text-muted small" th:text="${payment.date}">2026-10-10</span></td>
                            <td>
                                <span class="deleted-tag"><i class="bi bi-x-circle-fill"></i> Deleted</span>
                            </td>
                            <td class="text-end">
                                <div class="action-pill-group">
                                    <a th:href="@{/payments/restore/{id}(id=${payment.payment_id})}"
                                       class="btn-pill-action btn-pill-edit"
                                       title="Restore Payment"
                                       onclick="return confirm('Restore this payment back to records?');">
                                        <i class="fa-solid fa-rotate-left"></i> Restore
                                    </a>
                                    <a th:href="@{/payments/real-deleted/{id}(id=${payment.payment_id})}"
                                       class="btn-pill-action btn-pill-delete"
                                       title="Permanently Purge"
                                       onclick="return confirm('Permanently delete this payment record? This cannot be undone.');">
                                        <i class="fa-solid fa-trash-can"></i> Purge
                                    </a>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(payments)}">
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-muted"></i> No deleted payments found in the archive.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
