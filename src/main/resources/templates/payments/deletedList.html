<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deleted Payments</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>

<body>

	<div class="container mt-5">

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h2>Deleted Payments</h2>

			<a th:href="@{/payments}" class="btn btn-secondary"> Back to
				Payments </a>

		</div>

		<div class="card shadow-sm">

			<div class="card-body">

				<table class="table table-bordered table-hover">

					<thead class="table-dark">

						<tr>

							<th>Payment ID</th>
							<th>Order ID</th>
							<th>Paid Time</th>
							<th>Method ID</th>
							<th>Note</th>
							<th>Date</th>
							<th>File Path</th>
							<th>Employee ID</th>
							<th width="120">Action</th>

						</tr>

					</thead>

					<tbody>

						<tr th:each="payment : ${payments}">

							<td th:text="${payment.payment_id}">Payment ID</td>

							<td th:text="${payment.order_id}">Order ID</td>

							<td th:text="${payment.paid_time}">Paid Time</td>

							<td th:text="${payment.method_id}">Method ID</td>

							<td th:text="${payment.note}">Note</td>

							<td th:text="${payment.date}">Date</td>

							<td th:text="${payment.filepath}">File Path</td>

							<td th:text="${payment.employee_id}">Employee ID</td>

							<td><a
								th:href="@{/payments/restore/{id}(id=${payment.payment_id})}"
								class="btn btn-success btn-sm"
								onclick="return confirm('Are you sure you want to restore this payment?');">

									Restore </a> <a
								th:href="@{/payments/real-deleted/{id}(id=${payment.payment_id})}"
								class="btn btn-success btn-sm"
								onclick="return confirm('Are you sure you want to delete this payment?');">

									Delete </a></td>

						</tr>

						<tr th:if="${#lists.isEmpty(payments)}">

							<td colspan="9" class="text-center text-muted">No deleted
								payments found.</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>

</html>
