<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Payment - Café Luft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-border: #EFE9E1;
            --cafe-muted: #827E7A;
            --shadow-luxury: 0 10px 30px -5px rgba(92, 61, 46, 0.08), 0 4px 12px -2px rgba(92, 61, 46, 0.03);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .edit-container {
            max-width: 860px;
            margin: 45px auto 70px;
            padding: 0 20px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--cafe-primary-dark);
            margin: 0;
        }

        .luxury-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 18px;
            padding: 30px;
            box-shadow: var(--shadow-luxury);
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .btn-luxury-update {
            background: linear-gradient(135deg, var(--cafe-primary) 0%, var(--cafe-primary-dark) 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 11px 24px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(92, 61, 46, 0.2);
            transition: all 0.25s ease;
        }
        .btn-luxury-update:hover {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-luxury-cancel {
            background: #ffffff;
            color: var(--cafe-muted);
            border: 1px solid var(--cafe-border);
            border-radius: 10px;
            padding: 11px 22px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-luxury-cancel:hover {
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title">Edit Payment</h1>
                <p class="text-muted small mb-0">Adjust payment record values and metadata</p>
            </div>
            <a th:href="@{/payments}" class="btn-luxury-cancel">
                <i class="bi bi-arrow-left me-1"></i> Back to Payments
            </a>
        </div>

        <div class="luxury-card">
            <form th:action="@{/payments/edit/{id}(id=${payment.payment_id})}" th:object="${payment}" method="post">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">PAYMENT ID</label>
                        <input type="text" class="form-control bg-light" th:field="*{payment_id}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">ORDER ID</label>
                        <input type="text" class="form-control" th:field="*{order_id}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">METHOD ID</label>
                        <input type="text" class="form-control" th:field="*{method_id}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">EMPLOYEE ID</label>
                        <input type="text" class="form-control" th:field="*{employee_id}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">PAID TIME</label>
                        <input type="datetime-local" class="form-control" th:field="*{paid_time}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">DATE</label>
                        <input type="date" class="form-control" th:field="*{date}" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">ATTACHMENT / FILE PATH</label>
                        <input type="text" class="form-control" th:field="*{filepath}" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">PAYMENT NOTE</label>
                        <textarea class="form-control" rows="3" th:field="*{note}"></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top" style="border-color: var(--cafe-border) !important;">
                    <a th:href="@{/payments}" class="btn-luxury-cancel">Cancel</a>
                    <button type="submit" class="btn btn-luxury-update">
                        <i class="bi bi-check2-circle me-1"></i> Update Payment
                    </button>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
