<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Payment</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3 class="mb-0">Edit Payment</h3>
        </div>

        <div class="card-body">

            <form
                th:action="@{/payments/edit/{id}(id=${payment.payment_id})}"
                th:object="${payment}"
                method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Payment ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{payment_id}"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Order ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{order_id}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Paid Time
                    </label>

                    <input
                        type="datetime-local"
                        class="form-control"
                        th:field="*{paid_time}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Method ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{method_id}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Note
                    </label>

                    <textarea
                        class="form-control"
                        th:field="*{note}">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        th:field="*{date}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        File Path
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{filepath}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:field="*{employee_id}"
                        required>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">
                        Update
                    </button>

                    <a
                        th:href="@{/payments}"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
