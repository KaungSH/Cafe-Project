<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Delete Expense Category</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f8f9fa;
}

.delete-box {
	width: 500px;
	max-width: 95%;
	margin: 100px auto;
	background-color: white;
	padding: 35px;
	border-radius: 15px;
	text-align: center;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.title {
	font-size: 26px;
	font-weight: 600;
	margin-bottom: 15px;
}

.message {
	color: #666;
	margin-bottom: 25px;
}

.cancel-btn {
	border: 1px solid #ddd;
	background-color: white;
	color: #555;
	padding: 10px 22px;
	border-radius: 8px;
	text-decoration: none;
}

.delete-btn {
	background-color: #dc3545;
	color: white;
	border: none;
	padding: 10px 22px;
	border-radius: 8px;
}

.delete-btn:hover {
	background-color: #bb2d3b;
}
</style>

</head>

<body>

	<div class="delete-box">

		<div class="title">Delete Expense Category?</div>

		<div class="message">Are you sure you want to delete this
			expense category?</div>


		<p>
			<strong>Category ID:</strong> <span
				th:text="${expensecategory.expense_category_id}"></span>
		</p>


		<p class="mb-4">
			<strong>Category Name:</strong> <span
				th:text="${expensecategory.category_name}"></span>
		</p>


		<div class="d-flex justify-content-center gap-2">


			<a th:href="@{/manager/expensecategory}" class="cancel-btn"> Cancel </a>


			<form
				th:action="@{/manager/expensecategory/delete/{id}
                         (id=${expensecategory.expense_category_id})}"
				method="post">

				<button type="submit" class="delete-btn">Delete</button>

			</form>

		</div>

	</div>

</body>

</html>
