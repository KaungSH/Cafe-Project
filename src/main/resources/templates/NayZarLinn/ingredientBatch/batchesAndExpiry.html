<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batches & Expiry</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	margin: 0;
	background-color: #faf7f1;
	color: #241c16;
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.page-container {
	max-width: 1450px;
	margin: 0 auto;
	padding: 18px 22px;
}

.top-nav {
	display: inline-flex;
	align-items: center;
	background-color: #f4eadc;
	border-radius: 12px;
	padding: 3px;
	margin-bottom: 22px;
}

.top-nav a {
	text-decoration: none;
	color: #725637;
	padding: 8px 16px;
	border-radius: 9px;
	font-size: 13px;
	transition: 0.2s;
}

.top-nav a:hover {
	color: #5d3b1d;
}

.top-nav a.active {
	background-color: #ffffff;
	color: #603b18;
	font-weight: 600;
	box-shadow: 0 1px 5px rgba(80, 50, 20, 0.08);
}

.page-title {
	margin: 0 0 4px 0;
	font-size: 25px;
	font-weight: 700;
	line-height: 1.2;
	color: #201913;
}

.page-title i {
	color: #875522;
	margin-right: 7px;
	font-size: 22px;
}

.page-description {
	margin: 0 0 18px 0;
	color: #806b56;
	font-size: 13px;
	line-height: 1.5;
}

.summary-card {
	min-height: 78px;
	padding: 14px 18px;
	border: 1px solid #eadcca;
	border-radius: 14px;
	box-shadow: 0 2px 8px rgba(80, 50, 20, 0.04);
}

.total-card {
	background-color: #ffffff;
}

.near-card {
	background-color: #f1e4d1;
}

.expired-card {
	background-color: #f5ddd3;
}

.summary-number {
	margin: 0;
	font-family: Georgia, serif;
	font-size: 28px;
	font-weight: 700;
	line-height: 1;
	color: #211912;
}

.near-card .summary-number {
	color: #754918;
}

.expired-card .summary-number {
	color: #b34e32;
}

.summary-label {
	margin-top: 7px;
	color: #927963;
	font-size: 12px;
}

.table-container {
	margin-top: 20px;
	border: 1px solid #eadcca;
	border-radius: 14px;
	overflow: hidden;
	background-color: #fffaf4;
	box-shadow: 0 2px 8px rgba(80, 50, 20, 0.03);
}

.batch-table {
	width: 100%;
	margin: 0;
	border-collapse: collapse;
}

.batch-table thead th {
	padding: 11px 14px;
	background-color: #f5ecdf;
	color: #9a8067;
	border-bottom: 1px solid #eadcca;
	font-size: 11px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.4px;
	white-space: nowrap;
}

.batch-table tbody td {
	padding: 11px 14px;
	color: #705a45;
	font-size: 13px;
	line-height: 1.3;
	vertical-align: middle;
	border-bottom: 1px solid #eadcca;
}

.batch-table tbody tr:last-child td {
	border-bottom: none;
}

.batch-table tbody tr:hover {
	background-color: #fcf5eb;
}

.batch-table tbody td:first-child {
	color: #5f4b38;
	font-weight: 500;
	white-space: nowrap;
}

.ingredient-icon {
	width: 28px;
	height: 28px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	margin-right: 7px;
	background-color: #f0e3d1;
	border-radius: 8px;
	color: #875522;
	font-size: 13px;
}

.ingredient-name {
	color: #211a15;
	font-weight: 600;
	white-space: nowrap;
}

.status-badge {
	display: inline-block;
	padding: 5px 10px;
	border-radius: 16px;
	font-size: 11px;
	font-weight: 600;
	white-space: nowrap;
}

.fresh {
	background-color: #eee3d2;
	color: #62481f;
}

.near {
	background-color: #eee0ca;
	color: #704617;
}

.expired {
	background-color: #f2d4ca;
	color: #a54129;
}

.shelf-badge {
	display: inline-block;
	padding: 5px 10px;
	border-radius: 16px;
	font-size: 11px;
	font-weight: 600;
	white-space: nowrap;
}

.shelf-fresh {
	background-color: #e5eddc;
	color: #5f743c;
}

.shelf-near {
	background-color: #eee0ca;
	color: #69471f;
}

.shelf-expired {
	background-color: #f2d4ca;
	color: #a54129;
}

.expired-row {
	background-color: #fff5f1;
}

.empty-message {
	padding: 35px 20px;
	text-align: center;
	color: #9a8067;
	font-size: 13px;
}

@media ( max-width : 900px) {
	.page-container {
		padding: 15px;
	}
	.table-container {
		overflow-x: auto;
	}
	.batch-table {
		min-width: 850px;
	}
	.summary-card {
		margin-bottom: 5px;
	}
}
</style>

</head>
<body>

	<div class="page-container">

		<div class="top-nav">

			<a href="#" class="active"> <i class="bi bi-box-seam me-2"></i>
				Batches & expiry
			</a>

		</div>

		<h1 class="page-title">

			<i class="bi bi-box-seam"></i> Batches & expiry

		</h1>

		<p class="page-description">Track ingredient batches and expiry
			dates.</p>

		<div class="row g-3">

			<div class="col-md-4">

				<div class="summary-card total-card">

					<div class="summary-number"
						th:text="${#lists.size(batchesAndExpiryDtoList)}"></div>

					<div class="summary-label">Total batches</div>

				</div>

			</div>

			<div class="col-md-4">

				<div class="summary-card near-card">

					<div class="summary-number"
						th:text="${#lists.size(batchesAndExpiryDtoList.?[status == 'NearExpiry'])}">
					</div>

					<div class="summary-label">Near expiry (≤2 days)</div>

				</div>

			</div>

			<div class="col-md-4">

				<div class="summary-card expired-card">

					<div class="summary-number"
						th:text="${#lists.size(batchesAndExpiryDtoList.?[status == 'Expired'])}">
					</div>

					<div class="summary-label">Expired, not yet written off</div>

				</div>

			</div>

		</div>

		<div class="table-container">

			<table class="table batch-table">

				<thead>

					<tr>

						<th>Batch</th>

						<th>Ingredient</th>

						<th>Made</th>

						<th>Expires</th>

						<th>Remaining</th>

						<th>Unit Cost</th>

						<th>Status</th>

						<th>Shelf-life</th>

					</tr>

				</thead>


				<tbody>

					<tr th:each="batch : ${batchesAndExpiryDtoList}"
						th:classappend="${batch.status == 'Expired'} ? 'expired-row' : ''">

						<td><span th:text="${batch.batchId}"> </span></td>

						<td><span class="ingredient-icon"> <i
								class="bi bi-basket"></i>

						</span> <span class="ingredient-name"
							th:text="${batch.ingredientTypeName}"> </span></td>

						<td><span
							th:text="${#temporals.format(batch.manufacturedDate, 'MMM dd, yyyy')}">
						</span></td>

						<td><span
							th:text="${#temporals.format(batch.expireDate, 'MMM dd, yyyy')}">
						</span></td>

						<td><span th:text="${batch.remainingQty}"> </span></td>

						<td>$ <span th:text="${batch.unitCost}"> </span>

						</td>

						<td><span th:if="${batch.status == 'Fresh'}"
							class="status-badge fresh" th:text="${batch.status}"> </span> <span
							th:if="${batch.status == 'NearExpiry'}" class="status-badge near"
							th:text="${batch.status}"> </span> <span
							th:if="${batch.status == 'Expired'}" class="status-badge expired"
							th:text="${batch.status}"> </span></td>

						<td><span th:if="${batch.daysLeft < 0}"
							class="shelf-badge shelf-expired"> <span
								th:text="${batch.daysLeft * -1}"> </span> d ago

						</span> <span th:if="${batch.daysLeft >= 0 and batch.daysLeft <= 2}"
							class="shelf-badge shelf-near"> <span
								th:text="${batch.daysLeft}"> </span> d left

						</span> <span th:if="${batch.daysLeft > 2}"
							class="shelf-badge shelf-fresh"> <span
								th:text="${batch.daysLeft}"> </span> d left

						</span></td>

					</tr>

					<tr th:if="${#lists.isEmpty(batchesAndExpiryDtoList)}">

						<td colspan="8" class="text-center py-5">No batch data found.

						</td>

					</tr>

				</tbody>

			</table>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
