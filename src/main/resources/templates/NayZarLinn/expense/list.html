<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Expense List</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	margin: 0;
	padding: 30px;
	font-family: Arial, sans-serif;
	background-color: #faf7f2;
	color: #5b4636;
}

.container {
	width: 95%;
	margin: auto;
}

/* Header */
.expense-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 10px;
}

.expense-title h2 {
	margin: 0;
	font-size: 32px;
	color: #3f2d20;
}

.expense-title p {
	margin-top: 10px;
	margin-bottom: 30px;
	color: #806c5b;
	font-size: 16px;
}

/* Buttons */
.add-button {
	background-color: #95612e;
	color: white;
	text-decoration: none;
	padding: 14px 22px;
	border-radius: 10px;
	font-weight: bold;
	display: inline-block;
}

.add-button:hover {
	background-color: #75491f;
	color: white;
}

.deleted-button {
	background-color: white;
	color: #3f2d20;
	text-decoration: none;
	padding: 14px 22px;
	border-radius: 10px;
	border: 1px solid #e4cdb2;
	font-weight: bold;
	display: inline-block;
	margin-left: 5px;
}

.deleted-button:hover {
	background-color: #f4eadc;
	color: #3f2d20;
}

/* Table */
table {
	width: 100%;
	border-collapse: separate;
	border-spacing: 0;
	background-color: #fcf9f4;
	border: 1px solid #eadbc9;
	border-radius: 14px;
	overflow: hidden;
}

thead {
	background-color: #f4eadc;
}

th {
	padding: 18px 12px;
	text-align: left;
	font-size: 14px;
	color: #927b65;
	text-transform: uppercase;
	letter-spacing: 1px;
	border-bottom: 1px solid #eadbc9;
}

td {
	padding: 18px 12px;
	border-bottom: 1px solid #eadbc9;
	font-size: 16px;
}

tbody tr:last-child td {
	border-bottom: none;
}

tbody tr:hover {
	background-color: #f7efe4;
}

/* Actions */
.actions {
	white-space: nowrap;
}

.edit-button {
	display: inline-block;
	padding: 7px 14px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	text-decoration: none;
	background-color: white;
	font-weight: bold;
	margin-right: 6px;
}

.edit-button:hover {
	background-color: #f4eadc;
	color: #3f2d20;
}

.delete-button {
	display: inline-block;
	padding: 7px 14px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	text-decoration: none;
	background-color: white;
	font-weight: bold;
}

.delete-button:hover {
	background-color: #f4eadc;
	color: #3f2d20;
}

/* Empty message */
.empty-message {
	text-align: center;
	padding: 30px;
	color: #806c5b;
}
</style>

</head>


<body>

	<div class="container">

		<!-- ================= HEADER ================= -->

		<div class="expense-header">

			<div class="expense-title">

				<h2>
					<i class="bi bi-cup-hot"></i> Expense List
				</h2>

				<p>Manage Expenses</p>

			</div>


			<div>

				<!-- Add -->
				<a th:href="@{/manager/expense/add}" class="add-button"> Add </a>


				<!-- Deleted List -->
				<a th:href="@{/manager/expense/deleted}" class="deleted-button">
					Deleted Expenses List </a>

			</div>

		</div>


		<!-- ================= EXPENSE TABLE ================= -->

		<table>

			<thead>

				<tr>

					<th>Date</th>

					<th>Branch</th>

					<th>Category</th>

					<th>Description</th>

					<th>Amount</th>

					<th>Action</th>

				</tr>

			</thead>


			<tbody>


				<!-- No Data -->

				<tr th:if="${#lists.isEmpty(expense)}">

					<td colspan="6" class="empty-message">No expense found.</td>

				</tr>


				<tr th:each="e : ${expense}">

					<!-- Date -->
					<td th:text="${#temporals.format(e.expense_date, 'dd-MM-yy')}">Date</td>

					<!-- Brand / Branch Name -->
					<td th:text="${e.branch_name}">Branch</td>

					<!-- Category Name -->
					<td th:text="${e.category_name}">Category</td>

					<!-- Description -->
					<td th:text="${e.description}">Description</td>

					<!-- Amount -->
					<td th:text="${e.amount}">Amount</td>

					<td class="actions"><a
						th:href="@{/manager/expense/edit/{expense_id}(expense_id=${e.expense_id})}"
						class="edit-button"> Edit </a> <a
						th:href="@{/manager/expense/delete/{expense_id}(expense_id=${e.expense_id})}"
						class="delete-button"> Delete </a></td>

				</tr>
			</tbody>

		</table>

	</div>


	<!-- Bootstrap JS -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
