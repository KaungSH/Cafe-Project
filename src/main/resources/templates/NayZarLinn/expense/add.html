<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>New Expense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f8f9fa;
}

.expense-card {
	width: 650px;
	max-width: 95%;
	margin: 60px auto;
	background: white;
	padding: 30px;
	border-radius: 16px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

.title {
	font-size: 24px;
	font-weight: 600;
	margin-bottom: 30px;
}

.form-label {
	font-size: 14px;
	font-weight: 500;
	margin-bottom: 8px;
}

.form-control, .form-select {
	height: 46px;
	border-radius: 8px;
}

textarea.form-control {
	height: 100px;
	resize: vertical;
}

.error {
	color: #dc3545;
	font-size: 13px;
	margin-top: 5px;
}

.button-area {
	display: flex;
	justify-content: flex-end;
	gap: 10px;
	margin-top: 25px;
}

.cancel-btn {
	background-color: white;
	border: 1px solid #ddd;
	color: #555;
	padding: 10px 22px;
	border-radius: 8px;
	text-decoration: none;
}

.cancel-btn:hover {
	background-color: #f5f5f5;
	color: #333;
}

.create-btn {
	background-color: #8b7373;
	border: none;
	color: white;
	padding: 10px 24px;
	border-radius: 8px;
}

.create-btn:hover {
	background-color: #765f5f;
	color: white;
}
</style>

</head>


<body>

	<div class="expense-card">

		<div class="title">New Expense</div>


		<form th:action="@{/manager/expense/add}" th:object="${expense}"
			method="post">

			<div class="row">


				<div class="col-md-6 mb-3">

					<label class="form-label"> Branch </label> <select
						class="form-select" th:field="*{branch_id}">

						<option value="">Select Branch</option>

						<option th:each="branch : ${branches}"
							th:value="${branch.branch_id}" th:text="${branch.name}">
						</option>

					</select>

					<div class="error" th:if="${#fields.hasErrors('branch_id')}"
						th:errors="*{branch_id}"></div>

				</div>

				<div class="col-md-6 mb-3">

					<label class="form-label"> Category </label> <select
						class="form-select" th:field="*{expense_category_id}">

						<option value="">Select Category</option>

						<option th:each="category : ${expenseCategories}"
							th:value="${category.expense_category_id}"
							th:text="${category.category_name}"></option>

					</select>

					<div class="error"
						th:if="${#fields.hasErrors('expense_category_id')}"
						th:errors="*{expense_category_id}"></div>

				</div>

			</div>

			<div class="row">


				<div class="col-md-6 mb-3">

					<label class="form-label"> Amount </label> <input type="number"
						class="form-control" th:field="*{amount}" min="0" step="0.01"
						placeholder="0">

					<div class="error" th:if="${#fields.hasErrors('amount')}"
						th:errors="*{amount}"></div>

				</div>


				<div class="col-md-6 mb-3">

					<label class="form-label"> Date </label> <input
						type="datetime-local" class="form-control"
						th:field="*{expense_date}">

					<div class="error" th:if="${#fields.hasErrors('expense_date')}"
						th:errors="*{expense_date}"></div>

				</div>

			</div>


			<div class="mb-3">

				<label class="form-label"> Description </label>

				<textarea class="form-control" th:field="*{description}"
					placeholder="Enter expense description"></textarea>

				<div class="error" th:if="${#fields.hasErrors('description')}"
					th:errors="*{description}"></div>

			</div>


			<div class="button-area">

				<a th:href="@{/manager/expense}" class="cancel-btn"> Cancel </a>


				<button type="submit" class="create-btn">Create</button>

			</div>

		</form>

	</div>

</body>

</html>
