<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Ingredient Type List</title>
</head>
<body>
	<h2>Ingredient Type List</h2>

	<p>
		<a th:href="@{/staff/ingredientType/add}">+ Add New Ingredient</a> | <a
			th:href="@{/staff/ingredientType/deleted}">View Deleted Ingredients</a>
	</p>

	<table border="1" cellpadding="6" cellspacing="0">
		<thead>
			<tr>
				<th>No.</th>
				<th>ID</th>
				<th>Name</th>
				<th>Description</th>
				<th>Unit ID</th>
				<th>Unit</th>
				<th>Created At</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<!-- Show message if table is empty -->
			<tr th:if="${#lists.isEmpty(ingredients)}">
				<td colspan="8" style="text-align: center;">No ingredients
					found.</td>
			</tr>

			<!-- Loop over active ingredients from controller -->
			<tr th:each="i, state : ${ingredients}">
				<td th:text="${state.count}"></td>
				<td th:text="${i.ingredientTypeId}"></td>
				<td th:text="${i.name}"></td>
				<td th:text="${i.description}"></td>
				<td th:text="${i.unitId}"></td>
				<td
					th:text="${i.unitAbbreviation != null ? i.unitAbbreviation : '-'}"></td>
				<td
					th:text="${i.createdAt != null ? #temporals.format(i.createdAt, 'dd-MM-yyyy HH:mm') : '-'}"></td>
				<td><a
					th:href="@{/staff/ingredientType/edit/{id}(id=${i.ingredientTypeId})}">Edit</a>
					|
					<form
						th:action="@{/staff/ingredientType/soft-delete/{id}(id=${i.ingredientTypeId})}"
						method="post" style="display: inline;">
						<button type="submit"
							onclick="return confirm('Soft delete this item?');">Delete</button>
					</form></td>
			</tr>
		</tbody>
	</table>
</body>
</html>
