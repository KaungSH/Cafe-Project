<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deleted Ingredient Types</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0"><i class="bi bi-trash-fill me-2"></i>Deleted Ingredient Type Records</h4>
                <a th:href="@{/ingredient-types}" class="btn btn-light btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Active List
                </a>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Unit</th>
                                <th>Description</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${ingredientTypes}">
                                <td class="fw-bold" th:text="${item.ingredient_type_id}">ING-01</td>
                                <td th:text="${item.name}">Coffee Beans</td>
                                <td><span class="badge bg-secondary" th:text="${item.name}">Kg</span></td>
                                <td th:text="${item.description}">Arabica Dark Roast</td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/ingredient-types/recover/{id}(id=${item.ingredient_type_id})}" class="btn btn-outline-success">Recover</a>
                                        <a th:href="@{/ingredient-types/hard-delete/{id}(id=${item.ingredient_type_id})}" class="btn btn-outline-danger">Hard Delete</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ingredientTypes)}">
                                <td colspan="5" class="text-center text-muted py-4">No soft-deleted records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
