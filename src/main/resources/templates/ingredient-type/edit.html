<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ingredient Type | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #f8f5f0;
            --surface: #ffffff;
            --espresso-dark: #1a110a;
            --roast-caramel: #b8864e;
            --champagne-gold: #cbb493;
            --border-subtle: #ede4d8;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b1d14;
        }

        .compact-luxury-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.08);
            overflow: hidden;
            max-width: 620px;
            margin: 30px auto 50px;
        }

        .card-header-banner {
            background: linear-gradient(180deg, rgba(26, 17, 10, 0.70) 0%, rgba(26, 17, 10, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            padding: 30px 32px 22px;
            position: relative;
        }

        .logo-glow {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--champagne-gold);
            box-shadow: 0 0 16px rgba(203, 180, 147, 0.45);
            margin-bottom: 10px;
            overflow: hidden;
        }

        .logo-glow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: var(--espresso-dark);
            font-weight: 700;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #7f7267;
            margin-bottom: 5px;
        }

        .form-control, .form-select {
            border: 1.5px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.92rem;
            transition: 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--roast-caramel);
            box-shadow: 0 0 0 3px rgba(184, 134, 78, 0.15);
        }

        .btn-luxury {
            background: linear-gradient(135deg, var(--roast-caramel) 0%, #9c6c39 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 10px 24px;
            font-size: 0.9rem;
            transition: 0.25s;
        }

        .btn-luxury:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(61, 38, 24, 0.25);
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="compact-luxury-card">
        <!-- Top Coffee Banner -->
        <div class="card-header-banner">
            <div class="logo-glow">
                <img th:src="@{/images/luft-logo.png}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/924/924514.png'" alt="Logo">
            </div>
            <h2 class="brand-title text-white mb-1" style="font-size: 1.65rem;">Café Luft</h2>

            <span class="badge" style="background: rgba(255,255,255,0.12); color: var(--champagne-gold); border: 1px solid rgba(255,255,255,0.2); font-size: 0.72rem;">
                <i class="bi bi-pencil-square me-1"></i> Edit Mode
            </span>
        </div>

        <div class="p-4">
            <div class="mb-3">
                <a th:href="@{/admin/ingredient-types}" class="text-decoration-none text-muted small fw-semibold">
                    <i class="bi bi-arrow-left"></i> Back to Ingredient List
                </a>
                <h3 class="brand-title mt-2 mb-1" style="font-size: 1.45rem;">Edit Ingredient Type</h3>
               
            </div>

            <form th:action="@{/admin/ingredient-types/edit}" th:object="${ingredientType}" method="post">
                <input type="hidden" th:field="*{ingredient_type_id}" />

                <div class="mb-3">
                    <label class="form-label">Ingredient Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required autofocus />
                </div>

                <div class="mb-3">
                    <label class="form-label">Measuring Unit</label>
                    <select th:field="*{unit_id}" class="form-select" required>
                        <option th:each="u : ${units}" th:value="${u.unit_id}" 
                                th:text="${u.name + ' (' + u.abbreviation + ')'}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Description (Optional)</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 pt-3 border-top">
                    <a th:href="@{/admin/ingredient-types}" class="btn btn-light px-3" style="border-radius: 12px; font-weight: 600;">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-luxury">
                        Update Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
