<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Ingredient Type</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5 d-flex justify-content-center">
        <div class="card shadow-sm border-0" style="max-width: 600px; width: 100%;">
            <div class="card-header bg-warning text-dark py-3">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Ingredient Type</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/ingredient-types/edit}" th:object="${ingredientType}" method="post">
                    
                    <input type="hidden" th:field="*{ingredient_type_id}" />

                    <div class="mb-3">
                        <label class="form-label fw-bold">Name:</label>
                        <input type="text" th:field="*{name}" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Unit:</label>
                        <select th:field="*{unit_id}" class="form-select" required>
                            <option th:each="u : ${units}" th:value="${u.unit_id}" th:text="${u.name + ' (' + u.abbreviation + ')'}"></option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Description:</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/ingredient-types}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4 fw-bold">Update Ingredient Type</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
