<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ingredient Type | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .center-form-wrapper {
            max-width: 620px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .luxury-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            padding: 34px 40px;
        }

        .luxury-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #F0E8DC;
        }

        .icon-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            color: #F4E8D8;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .luxury-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .luxury-subtitle {
            font-size: 13px;
            color: #8C7B6C;
            margin-top: 3px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #554133;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom .icon-addon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9C8976;
            font-size: 14px;
        }

        .form-control-luxury, .form-select-luxury {
            width: 100%;
            background-color: #FAF8F5;
            border: 1px solid #DFD5C6;
            border-radius: 11px;
            padding: 10px 14px 10px 38px;
            color: #2D2422;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-control-luxury:focus, .form-select-luxury:focus {
            background-color: #FFFFFF;
            border-color: #8B572A;
            box-shadow: 0 0 0 3px rgba(139, 87, 42, 0.12);
            outline: none;
        }

        textarea.form-control-luxury {
            padding-left: 14px;
        }

        .btn-luxury-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 14px rgba(88, 55, 24, 0.2);
        }

        .btn-luxury-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
            color: #FFFFFF;
        }

        .btn-luxury-cancel {
            background-color: #EFE8DD;
            color: #5C4533;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-luxury-cancel:hover {
            background-color: #E2D7C7;
            color: #3C2B1D;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="center-form-wrapper">
        <div class="luxury-card">

            <div class="luxury-header">
                <div class="icon-badge">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h2>Edit Ingredient Type</h2>
                    <p class="luxury-subtitle">Update catalog names, units and description notes</p>
                </div>
            </div>

            <form th:action="@{/ingredient-types/edit}" th:object="${ingredientType}" method="post">
                <input type="hidden" th:field="*{ingredient_type_id}" />

                <div class="mb-3">
                    <label class="form-label">Ingredient Name <span class="text-danger">*</span></label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-tag icon-addon"></i>
                        <input type="text" th:field="*{name}" class="form-control-luxury" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Measuring Unit <span class="text-danger">*</span></label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-scale-balanced icon-addon"></i>
                        <select th:field="*{unit_id}" class="form-select-luxury" required>
                            <option th:each="u : ${units}" th:value="${u.unit_id}" 
                                    th:text="${u.name + ' (' + u.abbreviation + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control-luxury" rows="3"></textarea>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 pt-3 border-top border-light-subtle">
                    <a th:href="@{/ingredient-types}" class="btn-luxury-cancel">
                        <i class="fa-solid fa-xmark"></i> Cancel
                    </a>
                    <button type="submit" class="btn-luxury-primary">
                        <i class="fa-solid fa-check"></i> Update Changes
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
