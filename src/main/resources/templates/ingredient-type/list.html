<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Types | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .ing-wrapper {
            width: 95%;
            max-width: 1350px;
            margin: 35px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-title-box p {
            font-size: 13px;
            color: #8C7B6C;
            margin: 2px 0 0 0;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-luxury-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF !important;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(88, 55, 24, 0.15);
        }

        .btn-luxury-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
        }

        .btn-luxury-outline {
            background-color: #FFFFFF;
            color: #6C4724 !important;
            border: 1px solid #DFD2C0;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-luxury-outline:hover {
            background-color: #F8F3EC;
            border-color: #C8B6A2;
        }

        .luxury-table-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #FAF5EE;
            color: #796450;
            padding: 15px 18px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 18px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .id-badge {
            background-color: #F8F4EE;
            color: #7D5127;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #EADBCC;
            display: inline-block;
        }

        .unit-badge {
            background-color: #EFE6D8;
            color: #6C441E;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
        }

        .btn-edit-action {
            color: #7D5127;
            background-color: #FAF5EE;
            border: 1px solid #DFCDBD;
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-action:hover {
            background-color: #EFE3D3;
            color: #4E3013;
        }

        .btn-delete-action {
            color: #A33A2D;
            background-color: #FFF5F4;
            border: 1px solid #F0C4BD;
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            margin-left: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete-action:hover {
            background-color: #FCE1DF;
            color: #7C2419;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="ing-wrapper">
        
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <h2>Ingredient Type List</h2>
                    <p>Manage cafe ingredient catalog, packaging units & stock configurations</p>
                </div>
            </div>

            <div class="action-group">
                <a th:href="@{/stock-imports}" class="btn-luxury-outline">
                    <i class="fa-solid fa-dolly"></i> Stock Import List
                </a>
                <a th:href="@{/ingredient-types/deleted}" class="btn-luxury-outline">
                    <i class="fa-solid fa-box-archive"></i> View Deleted List
                </a>
                <a th:href="@{/ingredient-types/add}" class="btn-luxury-primary">
                    <i class="fa-solid fa-plus"></i> Add New Type
                </a>
            </div>
        </div>

        <div class="luxury-table-card">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 90px;">ID</th>
                        <th>Ingredient Name</th>
                        <th>Measuring Unit</th>
                        <th>Description</th>
                        <th class="text-end" style="width: 170px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${ingredientTypes}">
                        <td><span class="id-badge" th:text="${item.ingredient_type_id}">ING-01</span></td>
                        <td><strong th:text="${item.name}">Coffee Beans</strong></td>
                        <td><span class="unit-badge" th:text="${item.Uname}">Kg</span></td>
                        <td class="text-muted" th:text="${item.description}">Arabica Dark Roast</td>
                        <td class="text-end">
                            <a th:href="@{/ingredient-types/edit/{id}(id=${item.ingredient_type_id})}" class="btn-edit-action">
                                <i class="fa-solid fa-pen"></i> Edit
                            </a>
                            <a th:href="@{/ingredient-types/soft-delete/{id}(id=${item.ingredient_type_id})}" 
                               class="btn-delete-action" onclick="return confirm('Soft delete this record?');">
                                <i class="fa-solid fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ingredientTypes)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                            No active ingredient types found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</body>
</html>
