<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ingredient Type List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0"><i class="bi bi-box-seam me-2"></i>Ingredient Type List</h4>
                <div>
                    <a th:href="@{/ingredient-types/add}" class="btn btn-light btn-sm fw-bold me-2">
                        <i class="bi bi-plus-circle me-1"></i> Add New Ingredient Type
                    </a>
                    <a th:href="@{/stock-imports}" class="btn btn-warning btn-sm fw-bold me-2">
                        <i class="bi bi-cart me-1"></i> Stock Import List
                    </a>
                    <a th:href="@{/ingredient-types/deleted}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-trash me-1"></i> View Deleted List
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Unit</th>
                                <th>Description</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${ingredientTypes}">
                                <td class="fw-bold" th:text="${item.ingredient_type_id}">ING-01</td>
                                <td th:text="${item.name}">Coffee Beans</td>
                                <td><span class="badge bg-info text-dark" th:text="${item.Uname}">Kg</span></td>
                                <td th:text="${item.description}">Arabica Dark Roast</td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/ingredient-types/edit/{id}(id=${item.ingredient_type_id})}" class="btn btn-outline-primary">Edit</a>
                                        <a th:href="@{/ingredient-types/soft-delete/{id}(id=${item.ingredient_type_id})}" class="btn btn-outline-danger" onclick="return confirm('Soft delete this record?');">Delete</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ingredientTypes)}">
                                <td colspan="5" class="text-center text-muted py-4">No active ingredient types found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
