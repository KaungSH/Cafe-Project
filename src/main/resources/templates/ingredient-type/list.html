<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient Types | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #f8f5f0;
            --surface: #ffffff;
            --espresso-dark: #1a110a;
            --roast-caramel: #b8864e;
            --champagne-gold: #cbb493;
            --cream-soft: #faf6f0;
            --border-subtle: #ede3d5;
            --text-main: #2b1d14;
            --text-secondary: #7f7267;
            --danger-color: #b94234;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        .main-wrapper {
            max-width: 1240px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* Top Executive Coffee Banner */
        .cafe-header-banner {
            background: linear-gradient(135deg, rgba(26, 17, 10, 0.90) 0%, rgba(46, 29, 19, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            border-radius: 24px;
            padding: 28px 40px;
            box-shadow: 0 18px 45px -10px rgba(26, 17, 10, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(203, 180, 147, 0.35);
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand-logo-circle {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(203, 180, 147, 0.45);
            border: 2.5px solid var(--champagne-gold);
            overflow: hidden;
            flex-shrink: 0;
        }

        .brand-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.95rem;
            color: #ffffff;
            font-weight: 700;
            margin: 0;
        }

        .brand-subtitle {
            color: var(--champagne-gold);
            font-size: 0.76rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-recycle {
            background: rgba(255, 255, 255, 0.08);
            color: #f7ede2;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 11px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .btn-recycle:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-add-primary {
            background: linear-gradient(135deg, var(--roast-caramel) 0%, #9c6c39 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 12px 26px;
            font-size: 0.92rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(184, 134, 78, 0.35);
            transition: all 0.25s ease;
        }

        .btn-add-primary:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(184, 134, 78, 0.5);
        }

        .table-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.05);
            padding: 28px 32px;
            margin-top: 28px;
        }

        .cafe-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .cafe-table thead th {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            padding: 16px 14px;
            border-bottom: 1.5px solid var(--border-subtle);
        }

        .cafe-table tbody tr:not(:last-child) td {
            border-bottom: 1px solid var(--border-subtle);
        }

        .cafe-table tbody tr:hover {
            background-color: var(--cream-soft);
        }

        .cafe-table tbody td {
            padding: 18px 14px;
            vertical-align: middle;
        }

        .id-badge {
            background-color: #f2e9df;
            color: #5d422a;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .unit-badge {
            background-color: #f0e6da;
            color: #6a4933;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            display: inline-block;
        }

        .btn-action-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            transition: 0.2s ease;
        }

        .btn-action-icon:hover {
            background: var(--espresso-dark);
            color: #ffffff;
            border-color: var(--espresso-dark);
            transform: translateY(-2px);
        }

        .btn-action-icon.delete:hover {
            background: var(--danger-color);
            color: #ffffff;
            border-color: var(--danger-color);
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="main-wrapper">
        <!-- Top Executive Banner -->
        <div class="cafe-header-banner">
            <div class="brand-section">
                <div class="brand-logo-circle">
                    <img th:src="@{/images/luft-logo.png}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/924/924514.png'" alt="Logo">
                </div>
                <div>
                    <h1 class="brand-name">Café Luft</h1>
                    <div class="brand-subtitle">
                        <i class="bi bi-box-seam"></i> INGREDIENT TYPES &amp; CATALOG
                    </div>
                </div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/ingredient-types/deleted}" class="btn-recycle">
                    <i class="bi bi-archive"></i> View Deleted List
                </a>
                <a th:href="@{/admin/ingredient-types/add}" class="btn-add-primary">
                    <i class="bi bi-plus-circle"></i> Add New Type
                </a>
            </div>
        </div>

        <!-- Management Table Card -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="cafe-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">No.</th>
                            <th style="width: 250px;">Ingredient Name</th>
                            <th style="width: 160px;">Measuring Unit</th>
                            <th>Description</th>
                            <th style="width: 130px;" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item, state: ${ingredientTypes}">
                            <td class="text-muted fw-bold" th:text="${state.count < 10 ? '0' + state.count : state.count}">01</td>
                            <td><strong style="color: var(--espresso-dark);" th:text="${item.name}">Coffee Beans</strong></td>
                            <td><span class="unit-badge" th:text="${item.Uname}">Kg</span></td>
                            <td class="text-muted small" th:text="${item.description != null and item.description != '' ? item.description : '—'}">Arabica Dark Roast</td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/admin/ingredient-types/edit/{id}(id=${item.ingredient_type_id})}" 
                                       class="btn-action-icon" title="Edit">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/admin/ingredient-types/soft-delete/{id}(id=${item.ingredient_type_id})}" 
                                       class="btn-action-icon delete" title="Delete"
                                       onclick="return confirm('Soft delete this record?');">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ingredientTypes)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary opacity-50"></i>
                                No active ingredient types found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
