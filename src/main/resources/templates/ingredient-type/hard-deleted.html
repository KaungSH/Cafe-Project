<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .confirm-wrapper {
            max-width: 480px;
            margin: 65px auto;
            padding: 0 15px;
        }

        .luxury-card-dialog {
            background: #FFFFFF;
            border-radius: 22px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 20px 45px -12px rgba(58, 41, 26, 0.1), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            padding: 36px 32px;
            text-align: center;
        }

        .alert-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #FFF2F0, #FEE3DF);
            color: #B23B2A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 20px auto;
            border: 1px solid #FACDC7;
        }

        .dialog-title {
            font-size: 20px;
            font-weight: 700;
            color: #2B1D14;
            margin-bottom: 10px;
        }

        .dialog-desc {
            font-size: 13.5px;
            color: #6C5B4C;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .id-highlight {
            background: #F8F4EE;
            border: 1px solid #EADBCC;
            color: #7D5127;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-block;
            margin-top: 5px;
        }

        .btn-luxury-danger {
            background: linear-gradient(135deg, #B23B2A 0%, #852215 100%);
            color: #FFFFFF !important;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(178, 59, 42, 0.25);
        }

        .btn-luxury-danger:hover {
            background: linear-gradient(135deg, #9E3122 0%, #6E180D 100%);
            transform: translateY(-1px);
        }

        .btn-luxury-cancel {
            background-color: #EFE8DD;
            color: #5C4533;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-luxury-cancel:hover {
            background-color: #E2D7C7;
            color: #3C2B1D;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="confirm-wrapper">
        <div class="luxury-card-dialog">
            
            <div class="alert-circle">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <h3 class="dialog-title">Confirm Permanent Purge</h3>
            
            <p style="color: red" class="dialog-desc">
                Are you sure you want to permanently erase this record?<br>
                Target ID: <span class="id-highlight" th:text="${typeId}">ING-001</span><br>
               
            </p>

            <form th:action="@{/ingredient-types/hard-delete}" method="post">
                <input type="hidden" name="typeId" th:value="${typeId}" />

                <div class="d-flex justify-content-center align-items-center gap-2">
                    <a th:href="@{/ingredient-types/deleted}" class="btn-luxury-cancel">
                        <i class="fa-solid fa-xmark"></i> Cancel
                    </a>
                    <button type="submit" class="btn-luxury-danger">
                        <i class="fa-solid fa-trash-can"></i> Delete Permanently
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
