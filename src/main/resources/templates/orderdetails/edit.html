<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Order Detail</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-5">

		<div class="card shadow">

			<div class="card-header">
				<h3>Edit Order Detail</h3>
			</div>

			<div class="card-body">

				<form th:action="@{/order-details/update}" method="post">

					<!-- Detail ID -->
					<input type="hidden" name="orderDetails[0].order_detail_id"
						th:value="${orderDetail.order_detail_id}">


					<!-- Product ID -->
					<div class="mb-3">

						<label class="form-label"> Product ID </label> <input type="text"
							class="form-control" name="orderDetails[0].product_id"
							th:value="${orderDetail.product_id}">

					</div>


					<!-- Order ID -->
					<div class="mb-3">

						<label class="form-label"> Order ID </label> <input type="text"
							class="form-control" name="orderDetails[0].order_id"
							th:value="${orderDetail.order_id}">

					</div>


					<!-- Quantity -->
					<div class="mb-3">

						<label class="form-label"> Quantity </label> <input type="number"
							class="form-control" name="orderDetails[0].quantity"
							th:value="${orderDetail.quantity}">

					</div>


					<!-- Remark -->
					<div class="mb-3">

						<label class="form-label"> Remark </label> <input type="text"
							class="form-control" name="orderDetails[0].remark"
							th:value="${orderDetail.remark}">

					</div>


					<button type="submit" class="btn btn-primary">Update</button>

					<a th:href="@{/order-details}" class="btn btn-secondary">
						Cancel </a>

				</form>

			</div>

		</div>

	</div>

</body>
</html>
