<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Details</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-5">

		<!-- Header -->
		<div class="d-flex justify-content-between align-items-center mb-4">

			<h2>Order Details</h2>

			<a th:href="@{/order-details/add}" class="btn btn-primary"> + Add
				Order Detail </a>

		</div>


		<!-- Table -->
		<div class="card shadow-sm">

			<div class="card-body">

				<table class="table table-bordered table-hover">

					<thead class="table-dark">

						<tr>
							<th>Detail ID</th>
							<th>Product Name</th>
							<th>Order ID</th>
							<th>Quantity</th>
							<th>Remark</th>
							<th width="180">Action</th>
						</tr>

					</thead>


					<tbody>

						<tr th:each="detail : ${orderDetails}">

							<!-- Detail ID -->
							<td th:text="${detail.order_detail_id}">OD001</td>


							<!-- Product Name -->
							<td th:text="${detail.product_name}">Product Name</td>


							<!-- Order ID -->
							<td th:text="${detail.order_id}">ORD001</td>


							<!-- Quantity -->
							<td th:text="${detail.quantity}">1</td>


							<!-- Remark -->
							<td th:text="${detail.remark}">-</td>


							<!-- Action -->
							<td><a
								th:href="@{/order-details/edit/{id}(id=${detail.order_detail_id})}"
								class="btn btn-warning btn-sm"> Edit </a>
								<form th:action="@{/order-details/delete}" method="post"
									style="display: inline;">

									<input type="hidden" name="orderDetails[0].order_detail_id"
										th:value="${detail.order_detail_id}">

									<button type="submit" class="btn btn-danger btn-sm"
										onclick="return confirm('Are you sure?');">Delete</button>

								</form></td>

						</tr>


						<!-- Empty -->
						<tr th:if="${#lists.isEmpty(orderDetails)}">

							<td colspan="6" class="text-center text-muted">No order
								details found.</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>

</html>
