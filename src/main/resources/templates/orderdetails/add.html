<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Order Details</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-5">

		<div class="card shadow">

			<div class="card-header">
				<h3>Add Order Detail</h3>
			</div>

			<div class="card-body">

				<form th:action="@{/order-details/save}"
					th:object="${orderDetailsDto}" method="post">

					<!-- Order -->
					<div class="mb-3">

						<label class="form-label"> Order </label> <select
							name="orderDetails[0].order_id" class="form-select" required>

							<option value="">-- Select Order --</option>

							<option th:each="orderId : ${orders}" th:value="${orderId}"
								th:text="${orderId}"></option>

						</select>

					</div>


					<!-- Product -->
					<div class="mb-3">

						<label class="form-label"> Product </label> <select
							name="orderDetails[0].product_id" class="form-select" required>

							<option value="">-- Select Product --</option>

							<option th:each="product : ${products}"
								th:value="${product.product_id}" th:text="${product.type_name}">
							</option>

						</select>

					</div>


					<!-- Quantity -->
					<div class="mb-3">

						<label class="form-label"> Quantity </label> <input type="number"
							class="form-control" name="orderDetails[0].quantity" min="1"
							required>

					</div>


					<!-- Remark -->
					<div class="mb-3">

						<label class="form-label"> Remark </label> <input type="text"
							class="form-control" name="orderDetails[0].remark">

					</div>


					<!-- Buttons -->
					<button type="submit" class="btn btn-primary">Save</button>

					<a th:href="@{/order-details}" class="btn btn-secondary">
						Cancel </a>

				</form>

			</div>

		</div>

	</div>

</body>
</html>
