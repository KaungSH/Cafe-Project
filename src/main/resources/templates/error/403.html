<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>403 - Access Forbidden | Café Luft</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-deep: #1e0f07;       /* Espresso အနက်ရောင် */
            --cafe-card: #2d160c;       /* Card နောက်ခံအရောင် */
            --caramel: #e28e44;         /* Caramel လိုင်းအရောင် */
            --caramel-bright: #ffad66;  /* ခလုတ်အရောင် */
            --text-main: #ffffff;       /* ခေါင်းစဉ်ဖြူ */
            --text-sub: #ecd9cb;        /* ဖတ်ရလွယ်သော စာသားအရောင် */
            --pill-bg: #472414;         /* Tag နောက်ခံ */
        }

        .error-viewport {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 30px 15px;
        }

        /* ၄၀၄ နှင့် တူညီသော Card အချိုးအစား */
        .error-card-pro {
            width: 100%;
            max-width: 500px;
            background: var(--cafe-card);
            border: 2px solid var(--caramel);
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(30, 15, 7, 0.45);
        }

        /* ၄၀၄ Icon Box နှင့် အတိအကျတူသော Lock Box */
        .coffee-cup-art {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            background: #190b04;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(226, 142, 68, 0.4);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }

        .cup-icon {
            font-size: 38px;
            color: var(--caramel-bright);
        }

        /* ၄၀၄ Status Pill စတိုင် */
        .code-pill {
            display: inline-block;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 18px;
            background: var(--pill-bg);
            border: 1px solid var(--caramel);
            border-radius: 50px;
            color: var(--caramel-bright);
            margin-bottom: 16px;
        }

        /* Main Heading */
        .error-heading {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        /* Sub-message */
        .error-description {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        /* ခလုတ် ၂ ခုကို ဘေးချင်းယှဉ်ဖြစ်စေရန် display: flex သုံးထားခြင်း */
        .action-flex {
            display: flex !important;
            flex-direction: row;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        /* Primary Caramel Button */
        .btn-luxe-primary {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 20px;
            background: var(--caramel-bright);
            border: none;
            border-radius: 12px;
            color: #1a0a03;
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(226, 142, 68, 0.4);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .btn-luxe-primary:hover {
            background: #ffbe85;
            color: #000;
            transform: translateY(-2px);
        }

        /* Secondary Button */
        .btn-luxe-secondary {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 20px;
            background: #472414;
            border: 1.5px solid var(--caramel);
            border-radius: 12px;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .btn-luxe-secondary:hover {
            background: #5a2e19;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>

<div layout:fragment="content">
    <div class="error-viewport">
        <div class="error-card-pro">
            
            <!-- Lock Icon Box (၄၀၄ အတိုင်း တူညီသော Square Radius Box) -->
            <div class="coffee-cup-art">
                <i class="fa-solid fa-lock cup-icon"></i>
            </div>

            <!-- 403 Tag -->
            <div class="code-pill">ERROR 403 FORBIDDEN</div>

            <!-- Title -->
            <h1 class="error-heading">Access Denied</h1>
            
            <!-- Message -->
            <p class="error-description">
                <span th:if="${message}" th:text="${message}">You do not have permission to view this page.</span>
                <span th:unless="${message}">This counter is reserved for authorized staff only. Please verify your role or return to the main dashboard.</span>
            </p>

            <!-- Buttons: ဘေးချင်းယှဉ်ဖြစ်စေမည့် Flex Group -->
            <div class="action-flex">
                <a th:href="@{/}" class="btn-luxe-primary">
                    <i class="fa-solid fa-house-chimney me-2"></i>Go to Home
                </a>
                <a href="javascript:history.back()" class="btn-luxe-secondary">
                    <i class="fa-solid fa-arrow-left me-2"></i>Go Back
                </a>
            </div>

        </div>
    </div>
</div>
</html>
