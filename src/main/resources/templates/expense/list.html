<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Expense Management</title>

<!-- Google Fonts: Luxury Serif & Modern Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 & Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root {
  --espresso: #1e130c;
  --dark-roast: #2c1d11;
  --accent-gold: #c59b63;
  --gold-hover: #b0854d;
  --warm-cream: #fbf8f5;
  --surface-white: #ffffff;
  --text-muted: #857467;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--warm-cream);
  color: var(--espresso);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Subtle luxury ambient background glow */
.bg-ambient {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 10% 20%, rgba(197, 155, 99, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(44, 29, 17, 0.05) 0%, transparent 40%);
  pointer-events: none;
  z-index: -1;
}

.luxury-container {
  max-width: 1300px;
  margin: 40px auto;
  padding: 0 25px;
}

/* Top Hero Bar */
.brand-hero {
  background: linear-gradient(135deg, rgba(30, 19, 12, 0.95), rgba(44, 29, 17, 0.90)), 
              url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
  border-radius: 20px;
  padding: 30px 40px;
  margin-bottom: 35px;
  box-shadow: 0 15px 35px rgba(30, 19, 12, 0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(197, 155, 99, 0.3);
  flex-wrap: wrap;
  gap: 20px;
}

/* Brand Logo Styling */
.logo-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #ffffff;
  padding: 3px;
  border: 2px solid var(--accent-gold);
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.35);
  flex-shrink: 0;
}

.brand-logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.brand-name {
  font-family: 'Playfair Display', serif;
  color: #ffffff;
  font-size: 2.1rem;
  letter-spacing: 0.5px;
  font-weight: 700;
  line-height: 1.1;
}

.brand-subtext {
  color: var(--accent-gold);
  font-size: 0.88rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 5px;
  margin-bottom: 0;
}

.badge-branch {
  background: rgba(197, 155, 99, 0.2);
  color: #f7e7ce;
  border: 1px solid rgba(197, 155, 99, 0.4);
  font-size: 0.85rem;
  padding: 4px 12px;
  border-radius: 30px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  vertical-align: middle;
}

/* Action Buttons */
.btn-gold {
  background: linear-gradient(135deg, #c59b63 0%, #ad824a 100%);
  color: #ffffff;
  font-weight: 600;
  border: none;
  padding: 12px 24px;
  border-radius: 12px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.3);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(197, 155, 99, 0.45);
  color: #ffffff;
}

.btn-glass {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(10px);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-weight: 500;
  padding: 12px 22px;
  border-radius: 12px;
  transition: all 0.3s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-glass:hover {
  background: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  transform: translateY(-2px);
}

/* Luxury Table Card */
.table-card {
  background: #ffffff;
  border-radius: 20px;
  border: 1px solid #ebdcd0;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(44, 29, 17, 0.04);
}

.table {
  margin-bottom: 0;
  vertical-align: middle;
}

.table thead {
  background: #f7efe6;
}

.table thead th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--dark-roast);
  padding: 20px 24px;
  border: none;
}

.table tbody tr {
  transition: all 0.2s ease;
  border-bottom: 1px solid #f1e7dd;
}

.table tbody tr:hover {
  background-color: #faf5ef;
}

.table tbody td {
  padding: 20px 24px;
  font-size: 0.95rem;
  color: #42352b;
  border: none;
}

.category-tag {
  background: #f4ece4;
  color: #634327;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 0.82rem;
  font-weight: 600;
  display: inline-block;
}

.amount-value {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--espresso);
}

/* Action Icons */
.action-btn-edit {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid #ebdcd0;
  color: #5a4536;
  background: white;
  transition: all 0.2s;
  text-decoration: none;
  margin-right: 6px;
}

.action-btn-edit:hover {
  background: var(--accent-gold);
  border-color: var(--accent-gold);
  color: #fff;
}

.action-btn-delete {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid #f2d8d8;
  color: #b04848;
  background: white;
  transition: all 0.2s;
  cursor: pointer;
}

.action-btn-delete:hover {
  background: #b04848;
  border-color: #b04848;
  color: #fff;
}

.empty-state {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
}
</style>
</head>

<body>
<div class="bg-ambient"></div>

<div class="luxury-container">
  <!-- Brand Header Hero Section -->
  <div class="brand-hero">
    <div class="d-flex align-items-center gap-3">
      <!-- Luft Logo -->
      <div class="logo-wrapper">
        <img th:src="@{/images/logo.jpg}" alt="Café Luft Logo" class="brand-logo">
      </div>
      <div>
        <div class="d-flex align-items-center gap-2">
          <h1 class="brand-name mb-0">Café Luft</h1>
          <span class="badge-branch ms-2" th:text="${branch}">Original</span>
        </div>
        <p class="brand-subtext"><i class="bi bi-cup-hot me-1"></i> Expense &amp; Financial Register</p>
      </div>
    </div>

    <!-- Actions Area -->
    <div class="d-flex gap-3">
      <a th:href="@{/manager-only/expense/add}" class="btn-gold">
        <i class="bi bi-plus-lg"></i> Add Expense
      </a>
      <a th:href="@{/manager-only/expense/deleted}" class="btn-glass">
        <i class="bi bi-archive"></i> Deleted Expenses List
      </a>
    </div>
  </div>

  <!-- Error Alert (If Any) -->
  <div th:if="${error}" class="alert alert-danger rounded-4 mb-4 border-0 shadow-sm" th:text="${error}"></div>

  <!-- Luxury Table -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Branch</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- Empty State -->
          <tr th:if="${#lists.isEmpty(expense)}">
            <td colspan="6" class="empty-state">
              <i class="bi bi-receipt mb-2" style="font-size: 2.5rem; opacity: 0.4;"></i>
              <div>No expense found.</div>
            </td>
          </tr>

          <!-- Data Rows -->
          <tr th:each="e : ${expense}">
            <td>
              <i class="bi bi-calendar3 me-2 text-muted"></i>
              <span th:text="${#temporals.format(e.expense_date, 'MMM dd, yyyy')}">Date</span>
            </td>
            <td><strong th:text="${e.branch_name}">Branch</strong></td>
            <td>
              <span class="category-tag" th:text="${e.category_name}">Category</span>
            </td>
            <td class="text-secondary" th:text="${e.description}">Description</td>
            <td>
              <span class="amount-value">$<span th:text="${e.amount}">Amount</span></span>
            </td>
            <td class="text-end">
              <a th:href="@{/manager-only/expense/edit/{expense_id}(expense_id=${e.expense_id})}" 
                 class="action-btn-edit" title="Edit Expense">
                <i class="bi bi-pencil-square"></i>
              </a>
              <form th:action="@{/manager-only/expense/delete}" method="post" style="display: inline;"
                    onsubmit="return confirm('Are you sure you want to delete this expense?');">
                <input type="hidden" name="expense_id" th:value="${e.expense_id}">
                <button type="submit" class="action-btn-delete" title="Delete">
                  <i class="bi bi-trash3"></i>
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
