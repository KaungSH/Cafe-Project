<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Archived Expenses</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #fbf8f5;
  color: #2b1c11;
  padding: 40px 20px;
}

.archive-wrapper {
  max-width: 1200px;
  margin: auto;
}

.archive-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  border-bottom: 2px solid #ecdac8;
  padding-bottom: 20px;
}

.archive-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
}

.btn-back {
  background: #3b281b;
  color: #f7ede3;
  padding: 10px 20px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-back:hover {
  background: #25180f;
  color: #fff;
}

.table-glass {
  background: #ffffff;
  border-radius: 18px;
  border: 1px solid #ebdcd0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.03);
  overflow: hidden;
}

.table-glass thead th {
  background: #f4eae0;
  padding: 16px 20px;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #634731;
}

.table-glass tbody td {
  padding: 16px 20px;
  vertical-align: middle;
  border-bottom: 1px solid #f6eee6;
}

.btn-restore {
  background: #f1f8f3;
  border: 1px solid #b7dcbf;
  color: #2e6939;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  transition: 0.2s;
}

.btn-restore:hover {
  background: #2e6939;
  color: #fff;
}

.btn-permanent {
  background: #fff5f5;
  border: 1px solid #f0baba;
  color: #a82e2e;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  transition: 0.2s;
}

.btn-permanent:hover {
  background: #a82e2e;
  color: #fff;
}
</style>
</head>

<body>
<div class="archive-wrapper">
  <div class="archive-header">
    <div>
      <h2><i class="bi bi-trash3 text-muted me-2"></i>Deleted Expenses Archive</h2>
      <p class="text-muted small mb-0 mt-1">Review, restore or permanently remove discarded records.</p>
    </div>
    <a th:href="@{/manager-only/expense}" class="btn-back">
      <i class="bi bi-arrow-left"></i> Back to Expenses
    </a>
  </div>

  <div class="table-glass">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>Branch</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Date & Time</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(expense)}">
            <td colspan="6" class="text-center py-5 text-muted">No deleted records in archive.</td>
          </tr>
          <tr th:each="e : ${expense}">
            <td><strong th:text="${e.branch_name}">Branch</strong></td>
            <td><span class="badge bg-light text-dark border px-3 py-1" th:text="${e.category_name}">Category</span></td>
            <td><strong>$<span th:text="${e.amount}">0.00</span></strong></td>
            <td th:text="${#temporals.format(e.expense_date, 'dd-MM-yyyy HH:mm')}">Date</td>
            <td th:text="${e.description}">Description</td>
            <td class="text-end">
              <form th:action="@{/manager-only/expense/restore}" method="post" style="display:inline;">
                <input type="hidden" name="expense_id" th:value="${e.expense_id}">
                <button type="submit" class="btn-restore"><i class="bi bi-arrow-counterclockwise"></i> Restore</button>
              </form>
              <form th:action="@{/manager-only/expense/real-delete}" method="post" style="display:inline;"
                    onsubmit="return confirm('Permanently delete this record?');">
                <input type="hidden" name="expense_id" th:value="${e.expense_id}">
                <button type="submit" class="btn-permanent"><i class="bi bi-x-circle"></i> Delete Permanently</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
