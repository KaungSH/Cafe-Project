<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Expense Management</title>

<!-- Google Fonts: Luxury Serif & Modern Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 & Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div layout:fragment="content">

<style>
:root {
  --espresso: #1e130c;
  --dark-roast: #2c140a;
  --accent-gold: #c59b63;
  --gold-hover: #b0854d;
  --warm-cream: #fbf8f5;
  --surface-white: #ffffff;
  --text-muted: #857467;
}

.luxury-container {
  width: 100%;
  padding: 0;
}

/* Top Hero Bar */
.brand-hero {
  background: linear-gradient(135deg, rgba(30, 19, 12, 0.95), rgba(44, 29, 17, 0.90)), 
              url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
  border-radius: 20px;
  padding: 25px 35px;
  margin-bottom: 30px;
  box-shadow: 0 15px 35px rgba(30, 19, 12, 0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(197, 155, 99, 0.3);
  flex-wrap: wrap;
  gap: 20px;
}

/* Brand Logo Styling */
.logo-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #ffffff;
  padding: 3px;
  border: 2px solid var(--accent-gold);
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.35);
  flex-shrink: 0;
}

.brand-logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.brand-name {
  font-family: 'Playfair Display', serif;
  color: #ffffff;
  font-size: 2rem;
  letter-spacing: 0.5px;
  font-weight: 700;
  line-height: 1.1;
}

.brand-subtext {
  color: var(--accent-gold);
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 5px;
  margin-bottom: 0;
}

.badge-branch {
  background: rgba(197, 155, 99, 0.2);
  color: #f7e7ce;
  border: 1px solid rgba(197, 155, 99, 0.4);
  font-size: 0.85rem;
  padding: 4px 12px;
  border-radius: 30px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  vertical-align: middle;
}

/* Action Buttons */
.btn-gold {
  background: linear-gradient(135deg, #c59b63 0%, #ad824a 100%);
  color: #ffffff !important;
  font-weight: 600;
  border: none;
  padding: 11px 22px;
  border-radius: 12px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.3);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(197, 155, 99, 0.45);
}

.btn-glass {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(10px);
  color: #ffffff !important;
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-weight: 500;
  padding: 11px 20px;
  border-radius: 12px;
  transition: all 0.3s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-glass:hover {
  background: rgba(255, 255, 255, 0.22);
  transform: translateY(-2px);
}

/* Table Card - ဘောင်အထူကြီး မဖြစ်စေရန် ပြင်ဆင်ထားခြင်း */
.table-card {
  background: transparent !important;
  border-radius: 0;
  border: none !important;
  overflow: hidden;
  box-shadow: none !important;
}

.table {
  margin-bottom: 0;
  vertical-align: middle;
  border-collapse: collapse !important;
}

.table thead {
  background: #f5ece3;
}

.table thead th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--dark-roast);
  padding: 16px 20px;
  border: none !important;
}

.table thead th:first-child {
  border-radius: 12px 0 0 12px;
}

.table thead th:last-child {
  border-radius: 0 12px 12px 0;
}

.table tbody tr {
  background: transparent !important;
  transition: all 0.2s ease;
  border-bottom: 1px solid #eedecf !important;
}

.table tbody tr:hover {
  background-color: rgba(197, 155, 99, 0.06) !important;
}

.table tbody td {
  padding: 16px 20px;
  font-size: 0.95rem;
  color: #42352b;
  border: none !important;
}

.category-tag {
  background: #f4ece4;
  color: #634327;
  padding: 5px 12px;
  border-radius: 30px;
  font-size: 0.82rem;
  font-weight: 600;
  display: inline-block;
  border: 1px solid #ebdcd0;
}

.amount-value {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--espresso);
}

/* Action Icons */
.action-btn-edit {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid #ebdcd0;
  color: #5a4536 !important;
  background: white;
  transition: all 0.2s;
  text-decoration: none;
  margin-right: 6px;
}

.action-btn-edit:hover {
  background: var(--accent-gold);
  border-color: var(--accent-gold);
  color: #fff !important;
}

.action-btn-delete {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid #f2d8d8;
  color: #b04848;
  background: white;
  transition: all 0.2s;
  cursor: pointer;
}

.action-btn-delete:hover {
  background: #b04848;
  border-color: #b04848;
  color: #fff;
}

.empty-state {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
}
</style>

<div class="luxury-container">
  <!-- Brand Header Hero Section -->
  <div class="brand-hero">
    <div class="d-flex align-items-center gap-3">
      <!-- Luft Logo -->
      <div class="logo-wrapper">
        <img th:src="@{/images/logo.jpg}" alt="Café Luft Logo" class="brand-logo">
      </div>
      <div>
        <div class="d-flex align-items-center gap-2">
          <h1 class="brand-name mb-0">Café Luft</h1>
          <span class="badge-branch ms-2" th:text="${branch != null ? branch : 'Branch'}">Original</span>
        </div>
        <p class="brand-subtext"><i class="bi bi-cup-hot me-1"></i> Expense &amp; Financial Register</p>
      </div>
    </div>
  </div>

  <!-- Error Alert (If Any) -->
  <div th:if="${error}" class="alert alert-danger rounded-4 mb-4 border-0 shadow-sm" th:text="${error}"></div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Branch</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <!-- Empty State -->
          <tr th:if="${#lists.isEmpty(expense)}">
            <td colspan="6" class="empty-state">
              <i class="bi bi-receipt mb-2" style="font-size: 2.5rem; opacity: 0.4;"></i>
              <div>No expense found.</div>
            </td>
          </tr>

          <!-- Data Rows -->
          <tr th:each="e : ${expense}">
            <td>
              <i class="bi bi-calendar3 me-2 text-muted"></i>
              <span th:text="${#temporals.format(e.expense_date, 'MMM dd, yyyy')}">Date</span>
            </td>
            <td><strong th:text="${e.branch_name}">Branch</strong></td>
            <td>
              <span class="category-tag" th:text="${e.category_name}">Category</span>
            </td>
            <td class="text-secondary" th:text="${e.description}">Description</td>
            <td>
              <span class="amount-value">$<span th:text="${e.amount}">Amount</span></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
