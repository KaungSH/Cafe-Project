<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Luft | Add Expense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root {
  --espresso: #1a0f09;
  --accent-gold: #c59b63;
  --crema: #fdfaf6;
  --border-tone: #e8d9cb;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #f7f3ee;
  color: var(--espresso);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 15px;
}

.luxury-card {
  max-width: 950px;
  width: 100%;
  background: #ffffff;
  border-radius: 24px;
  border: 1px solid var(--border-tone);
  box-shadow: 0 20px 50px rgba(26, 15, 9, 0.08);
  overflow: hidden;
  display: flex;
}

.visual-side {
  width: 38%;
  background: linear-gradient(to bottom, rgba(26, 15, 9, 0.4), rgba(26, 15, 9, 0.8)),
              url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80') center/cover;
  padding: 40px 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #ffffff;
}

.visual-side h3 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  letter-spacing: 0.5px;
}

.form-side {
  width: 62%;
  padding: 45px;
  background: #ffffff;
}

.form-label {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #6d5b4e;
  margin-bottom: 7px;
}

.form-control, .form-select {
  height: 48px;
  border-radius: 12px;
  border: 1px solid #dfd1c3;
  background-color: #fcfbfa;
  font-size: 0.95rem;
  transition: all 0.2s ease;
}

.form-control:focus, .form-select:focus {
  border-color: var(--accent-gold);
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(197, 155, 99, 0.15);
}

textarea.form-control {
  height: 95px;
}

.btn-create {
  background: linear-gradient(135deg, #c59b63 0%, #a4763f 100%);
  color: #fff;
  border: none;
  font-weight: 600;
  border-radius: 12px;
  padding: 12px 28px;
  transition: 0.3s;
}

.btn-create:hover {
  box-shadow: 0 5px 20px rgba(197, 155, 99, 0.35);
  color: #fff;
}

.btn-cancel {
  border: 1px solid #dfd1c3;
  background: transparent;
  color: #7d6b5e;
  font-weight: 500;
  border-radius: 12px;
  padding: 12px 24px;
  text-decoration: none;
  transition: 0.2s;
}

.btn-cancel:hover {
  background: #f7efe7;
  color: var(--espresso);
}

.error {
  color: #b03a2e;
  font-size: 0.82rem;
  margin-top: 4px;
}

@media(max-width: 820px) {
  .luxury-card { flex-direction: column; }
  .visual-side { width: 100%; min-height: 180px; }
  .form-side { width: 100%; padding: 25px; }
}
</style>
</head>

<body>

<div layout:fragment="content">
  <!-- Side Banner -->
  <div class="visual-side">
    <div>
      <span class="badge bg-light text-dark px-3 py-2 rounded-pill fw-semibold mb-3">Branch Accounting</span>
      <h3>Café Luft</h3>
      <p class="text-white-50">Crafting quality moments and managing resources flawlessly.</p>
    </div>
    
    <div class="small text-white-50"><i class="bi bi-geo-alt"></i> Selected: <strong class="text-white" th:text="${branch}">Main Hub</strong></div>
  </div>

  <!-- Form Side -->
  <div class="form-side">
    <h4 style="font-family: 'Playfair Display', serif; font-weight: 700; margin-bottom: 25px;">Create Expense</h4>

    <form th:action="@{/manager-only/expense/add}" th:object="${expense}" method="post">
      <div class="mb-3">
        <label class="form-label">Expense Category</label>
        <select class="form-select" th:field="*{expense_category_id}">
          <option value="">Select Category</option>
          <option th:each="category : ${expenseCategories}"
                  th:value="${category.expense_category_id}"
                  th:text="${category.category_name}"></option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('expense_category_id')}" th:errors="*{expense_category_id}"></div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Amount ($)</label>
          <input type="number" step="0.01" min="0" class="form-control" th:field="*{amount}" placeholder="0.00">
          <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Date & Time</label>
          <input type="datetime-local" class="form-control" th:field="*{expense_date}">
          <div class="error" th:if="${#fields.hasErrors('expense_date')}" th:errors="*{expense_date}"></div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Description / Remarks</label>
        <textarea class="form-control" th:field="*{description}" placeholder="e.g. Milk & Coffee bean restock shipment..."></textarea>
        <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a th:href="@{/manager-only/expense}" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-create"><i class="bi bi-check-lg me-1"></i> Confirm & Save</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
