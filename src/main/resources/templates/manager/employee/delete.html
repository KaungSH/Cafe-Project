<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Delete Employee</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow border-danger">
					<div class="card-header bg-danger text-white">
						<h4 class="mb-0">Confirm Deletion</h4>
					</div>
					<div class="card-body">
						<p class="fs-5">Are you sure you want to delete this employee?</p>
						<ul class="list-group mb-4">
							<li class="list-group-item"><strong>Name:</strong> <span
								th:text="${employee.name}"></span></li>
							<li class="list-group-item"><strong>Email:</strong> <span
								th:text="${employee.email}"></span></li>
							<li class="list-group-item"><strong>Phone:</strong> <span
								th:text="${employee.phone}"></span></li>
						</ul>
						<div class="d-flex justify-content-end gap-2">
							<a th:href="@{/manager/employee}" class="btn btn-secondary">Cancel</a> <a
								th:href="@{/manager/employee/delete/{id}(id=${employee.employeeId})}"
								class="btn btn-danger">Yes, Delete</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
