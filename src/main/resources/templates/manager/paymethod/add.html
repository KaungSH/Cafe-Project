<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Payment Method</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5 mb-5">
		<div class="row justify-content-center">
			<div class="col-md-7">
				<div class="card shadow">

					<div class="card-header bg-success text-white">
						<h4 class="mb-0">Add New Payment Method</h4>
					</div>

					<div class="card-body">
						<form th:action="@{/manager/paymethod/add}"
							th:object="${payMethod}" method="post">

							<!-- Name -->
							<div class="mb-3">
								<label class="form-label fw-bold">Method Name</label> <input
									type="text" class="form-control" th:field="*{name}"
									placeholder="e.g. Cash, KBZ Pay, Wave Money" required /> <small
									class="text-muted">(UNIQUE)။</small>
							</div>

							<!-- Description -->
							<div class="mb-3">
								<label class="form-label fw-bold">Description</label>
								<textarea class="form-control" rows="3"
									th:field="*{description}" placeholder="Example"></textarea>
							</div>

							<!-- Logo Path -->
							<div class="mb-3">
								<label class="form-label fw-bold">Logo Path</label> <input
									type="text" class="form-control" th:field="*{logoPath}"
									placeholder="e.g. /images/kbz.png" />
							</div>

							<!-- Employee ID (optional) -->
							<div class="mb-3">
								<label class="form-label fw-bold">Employee ID (Created
									By)</label> <input type="text" class="form-control"
									th:field="*{employeeId}" placeholder="(optional)" />
							</div>

							<!-- Active checkbox -->
							<div class="form-check mb-3">
								<input class="form-check-input" type="checkbox"
									th:field="*{active}" id="isActive" checked /> <label
									class="form-check-label fw-bold" for="isActive"> </label>
							</div>

							<!-- Buttons -->
							<div class="d-flex justify-content-end gap-2 mt-4">
								<a th:href="@{/manager/paymethod}" class="btn btn-secondary">Cancel</a>
								<button type="submit" class="btn btn-success px-4">Save
									Method</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
