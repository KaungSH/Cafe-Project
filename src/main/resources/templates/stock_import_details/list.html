<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Import Details | Coffee Shop</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
	rel="stylesheet">
<style>
body {
	background-color: #f9f4ef;
	font-family: 'Nunito', sans-serif;
	color: #4a3018;
}

.custom-container {
	background-color: #ffffff;
	border-radius: 20px;
	padding: 30px;
	box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08);
	margin-top: 50px;
	margin-bottom: 50px;
}

h2 {
	color: #5c3a21;
	font-weight: 700;
}

.btn-coffee-primary {
	background-color: #a87b51;
	color: white;
	border-radius: 12px;
	padding: 10px 20px;
	font-weight: 600;
	text-decoration: none;
	transition: all 0.3s ease;
}

.btn-coffee-primary:hover {
	background-color: #8c633e;
	color: white;
	transform: translateY(-2px);
}

.btn-coffee-secondary {
	background-color: #e6d5c3;
	color: #5c3a21;
	border-radius: 12px;
	padding: 10px 20px;
	font-weight: 600;
	text-decoration: none;
	transition: all 0.3s ease;
}

.btn-coffee-secondary:hover {
	background-color: #d4bda5;
	color: #4a3018;
}

.table thead th {
	background-color: #5c3a21;
	color: #f9f4ef;
	padding: 15px;
	border: none;
}

.table thead th:first-child {
	border-top-left-radius: 15px;
}

.table thead th:last-child {
	border-top-right-radius: 15px;
}

.table tbody tr td {
	vertical-align: middle;
	padding: 12px 15px;
	border-bottom: 1px solid #eee5da;
}

.table tbody tr:hover {
	background-color: #fcf9f5;
}

.btn-edit {
	background-color: #d4a373;
	color: white;
	border-radius: 8px;
	border: none;
}

.btn-edit:hover {
	background-color: #b58555;
	color: white;
}

.btn-delete {
	background-color: #b07d62;
	color: white;
	border-radius: 8px;
	border: none;
}

.btn-delete:hover {
	background-color: #94644a;
	color: white;
}
</style>
</head>
<body>
	<div class="container custom-container">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2>
				📦 Import Details (ID: <span th:text="${importId}"></span>)
			</h2>
			<div>
				<a
					th:href="@{/manager/stock_import_details/add/{id}(id=${importId})}"
					class="btn btn-coffee-primary me-2">+ Add Item</a> <a
					th:href="@{/manager/stock_imports}"
					class="btn btn-coffee-secondary">Back to Imports</a>
			</div>
		</div>

		<div class="table-responsive">
			<table class="table table-hover">
				<thead>
					<tr>
						<th>No.</th>
						<th>Ingredient</th>
						<th>Quantity</th>
						<th>Unit Cost</th>
						<th>Sub Total</th>
						<th class="text-center">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item, state : ${details}">
						<td th:text="${state.count}" class="fw-bold"></td>
						<td th:text="${item.ingredient_type_name}"></td>
						<td
							th:text="${item.quantity_ordered + ' ' + item.unit_abbreviation}"
							class="text-primary fw-bold"></td>
						<td th:text="${item.unit_cost}"></td>
						<td th:text="${item.line_total}" class="fw-bold text-success"></td>
						<td class="text-center"><a
							th:href="@{/manager/stock_import_details/edit/{id}(id=${item.import_detail_id})}"
							class="btn btn-edit btn-sm px-3">Edit</a> <a
							th:href="@{/manager/stock_import_details/delete/{id}/{importId}(id=${item.import_detail_id}, importId=${item.import_id})}"
							class="btn btn-delete btn-sm px-3"
							onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(details)}">
						<td colspan="6" class="text-center py-4 text-muted">No items
							added to this import yet.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
