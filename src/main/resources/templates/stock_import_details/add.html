<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Import Item | Coffee Shop</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
	rel="stylesheet">
<style>
body {
	background-color: #f9f4ef;
	font-family: 'Nunito', sans-serif;
	color: #4a3018;
}

.card-coffee {
	border: none;
	border-radius: 20px;
	box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08);
	margin-top: 50px;
	background-color: #ffffff;
}

h3 {
	color: #5c3a21;
	font-weight: 700;
}

.btn-save {
	background-color: #a87b51;
	color: white;
	border-radius: 12px;
	font-weight: 600;
	padding: 10px;
}

.btn-save:hover {
	background-color: #8c633e;
	color: white;
}

.btn-cancel {
	background-color: #e6d5c3;
	color: #5c3a21;
	border-radius: 12px;
	font-weight: 600;
	padding: 10px;
}

.btn-cancel:hover {
	background-color: #d4bda5;
	color: #4a3018;
}

.form-control, .form-select {
	border-radius: 10px;
	border: 1px solid #d4bda5;
}

.form-control:focus, .form-select:focus {
	border-color: #a87b51;
	box-shadow: 0 0 0 0.25rem rgba(168, 123, 81, 0.25);
}
</style>
</head>
<body>
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card card-coffee p-4">
					<h3 class="mb-4 text-center">Add Stock Item</h3>

					<form th:action="@{/manager/stock_import_details/add}"
						th:object="${detailForm}" method="post">
						<!-- Hidden import_id to link detail to correct stock import -->
						<input type="hidden" th:field="*{import_id}" />

						<div class="mb-3">
							<label class="form-label fw-bold">Ingredient</label> <select
								class="form-select" th:field="*{ingredient_type_id}" required>
								<option value="">-- Select Ingredient --</option>
								<option th:each="ing : ${ingredients}"
									th:value="${ing.ingredientTypeId}" th:text="${ing.name}"></option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label fw-bold">Quantity</label> <input
								type="number" class="form-control" th:field="*{quantity_ordered}"
								required min="1" placeholder="Enter quantity">
						</div>

						<div class="mb-4">
							<label class="form-label fw-bold">Unit Price</label> <input
								type="number" step="0.01" class="form-control"
								th:field="*{unit_cost}" required min="0"
								placeholder="Enter price per unit">
						</div>

						<div class="d-grid gap-2">
							<button type="submit" class="btn btn-save">Save Item</button>
							<a
								th:href="@{/manager/stock_import_details/{id}(id=${detailForm.import_id})}"
								class="btn btn-cancel text-center text-decoration-none">Cancel</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
