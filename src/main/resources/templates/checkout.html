<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>POS Checkout</title>
<style>
body {
	font-family: Arial, sans-serif;
	background-color: #f4f7f6;
	padding: 20px;
}

.container {
	max-width: 600px;
	margin: auto;
	background: white;
	padding: 20px;
	border-radius: 8px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-bottom: 20px;
}

th, td {
	border: 1px solid #ddd;
	padding: 10px;
	text-align: left;
}

th {
	background-color: #007bff;
	color: white;
}

.form-group {
	margin-bottom: 15px;
}

label {
	display: block;
	font-weight: bold;
	margin-bottom: 5px;
}

input[type="text"], textarea {
	width: 100%;
	padding: 10px;
	border: 1px solid #ccc;
	border-radius: 4px;
	box-sizing: border-box;
}

.btn {
	background-color: #28a745;
	color: white;
	padding: 10px 20px;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	width: 100%;
	font-size: 16px;
}

.btn:hover {
	background-color: #218838;
}
</style>
</head>
<body>

	<div class="container">
		<h2>Checkout (ငွေရှင်းရန်)</h2>

		<!-- ဝယ်ယူမည့် ပစ္စည်းများကို ပြသရန် ဇယား (Controller မှ cartItems ကို loop ပတ်သည်) -->
		<table>
			<thead>
				<tr>
					<th>Product Name</th>
					<th>Price</th>
					<th>Qty</th>
					<th>Total</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${cartItems}">
					<td th:text="${item.productName}">Product</td>
					<td th:text="${item.price} + ' Ks'">Price</td>
					<td th:text="${item.quantity}">Qty</td>
					<!-- Total တွက်ခြင်း (Price * Quantity) -->
					<td th:text="${item.price * item.quantity} + ' Ks'">Total</td>
				</tr>
			</tbody>
		</table>

		<!-- Checkout Form (Controller မှ checkoutForm ကို ချိတ်ဆက်ထားသည်) -->
		<form th:action="@{/checkout/process}" th:object="${checkoutForm}"
			method="post">

			<!-- Order Detail Code ကို ဖွက်ထားမည် (Hidden) -->
			<input type="hidden" th:field="*{orderDetailCode}" />

			<div class="form-group">
				<label for="customerName">Customer Name (ဝယ်ယူသူအမည်)</label>
				<!-- th:field ဖြင့် CheckoutForm ရှိ customerName နှင့် ချိတ်ဆက်သည် -->
				<input type="text" id="customerName" th:field="*{customerName}"
					required placeholder="အမည်ထည့်ပါ" />
			</div>

			<div class="form-group">
				<label for="remark">Remark (မှတ်ချက်)</label>
				<!-- th:field ဖြင့် CheckoutForm ရှိ remark နှင့် ချိတ်ဆက်သည် -->
				<textarea id="remark" th:field="*{remark}" rows="4"
					placeholder="အထူးမှာကြားလိုသည်များ ရေးရန်..."></textarea>
			</div>

			<button type="submit" class="btn">Confirm Checkout</button>
		</form>
	</div>

</body>
</html>
