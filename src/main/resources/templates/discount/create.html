<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Café Luft | Create Discount</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-gold: #c5a059;
            --luft-espresso: #1c1612;
            --luft-cream: #fbf8f5;
            --luft-border: #ede4d8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--luft-cream);
            color: var(--luft-espresso);
            min-height: 100vh;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .split-card {
            background-color: #ffffff;
            border-radius: 22px;
            border: 1px solid var(--luft-border);
            overflow: hidden;
            box-shadow: 0 16px 45px rgba(28, 22, 18, 0.08);
        }

        /* Side Coffee Visual Banner */
        .visual-side-pane {
            position: relative;
            background: linear-gradient(180deg, rgba(28, 22, 18, 0.4) 0%, rgba(28, 22, 18, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            color: #ffffff;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #615045;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 7px;
        }

        .form-control, .form-select {
            height: 48px;
            border: 1.5px solid var(--luft-border);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.94rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--luft-primary);
            box-shadow: 0 0 0 4px rgba(133, 83, 37, 0.12);
        }

        .form-check-input:checked {
            background-color: var(--luft-primary);
            border-color: var(--luft-primary);
        }

        .btn-luxury-submit {
            background: linear-gradient(135deg, var(--luft-primary) 0%, #683d16 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px 28px;
            box-shadow: 0 4px 14px rgba(104, 61, 22, 0.25);
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-xl-10">

                <div class="split-card">
                    <div class="row g-0">
                        <!-- Left Image Sidepane -->
                        <div class="col-lg-4 d-none d-lg-block visual-side-pane">
                            <span class="badge bg-warning text-dark mb-2 align-self-start">Café Luft Exclusive</span>
                            <h3 class="serif-font mb-2">Artisanal Roast Campaign</h3>
                            <p class="small text-white-50 mb-0">Crafting tailored promotion packages for our guests.</p>
                        </div>

                        <!-- Right Form Sidepane -->
                        <div class="col-lg-8 p-4 p-md-5">
                            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                                <div>
                                    <h3 class="serif-font mb-0">Craft New Discount</h3>
                                    <small class="text-muted">Branch: <strong class="text-dark" th:text="${branch}">Café Luft - Original</strong></small>
                                </div>
                            </div>

                            <form th:action="@{/manager-only/discounts/save}" th:object="${discountForm}" method="post">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-7">
                                        <label for="name" class="form-label">Discount Title <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="e.g., Afternoon Special 10%" required>
                                    </div>
                                    <div class="col-md-5">
                                        <label for="discountValue" class="form-label">Discount Value (%) <span class="text-danger">*</span></label>
                                        <input type="number" step="0.01" th:field="*{discount_value}" class="form-control" id="discountValue" placeholder="10.00" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="promo_type_id" class="form-label">Promo Type <span class="text-danger">*</span></label>
                                        <select th:field="*{promo_type_id}" class="form-select" id="promo_type_id" required>
                                            <option value="" disabled selected>-- Select Type --</option>
                                            <option th:each="promo : ${promoTypes}" th:value="${promo.promo_type_id}" th:text="${promo.promo_type_name}">Seasonal</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="audience_type_id" class="form-label">Target Tier <span class="text-danger">*</span></label>
                                        <select th:field="*{audience_type_id}" class="form-select" id="audience_type_id" required>
                                            <option value="" disabled selected>-- Select Tier --</option>
                                            <option th:each="audience : ${audienceTypes}" th:value="${audience.audience_type_id}" th:text="${audience.audience_type_name}">All Customers</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="startdate" class="form-label">Start Date <span class="text-danger">*</span></label>
                                        <input type="date" th:field="*{startdate}" class="form-control" id="startdate" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="enddate" class="form-label">End Date <span class="text-danger">*</span></label>
                                        <input type="date" th:field="*{enddate}" class="form-control" id="enddate" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea th:field="*{description}" class="form-control" id="description" rows="3" placeholder="Add promotion details..."></textarea>
                                </div>

                                <!-- Git Conflict Solved Cleanly -->
                                <div class="mb-4 p-3 rounded-3" style="background-color: #faf5ed; border: 1px dashed var(--luft-border);">
                                    <div class="form-check form-switch mb-0">
                                        <input class="form-check-input" type="checkbox" id="is_active" th:field="*{is_active}" th:value="1" checked>
                                        <label class="form-check-label fw-semibold ms-2" for="is_active">Set Promotion Active Immediately</label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/manager-only/discounts}" class="btn btn-outline-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-luxury-submit">
                                        <i class="bi bi-check2-circle me-1"></i> Save Discount
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
