
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Deleted Discount List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

	<div class="container my-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h3 class="fw-bold mb-0">Deleted list</h3>

				<a th:href="@{/manager/discounts}" class="btn btn-primary">Back
					to Discount List </a>

			</div>
		</div>

		<div class="card border-0 shadow-sm">
			<div class="card-body p-0">
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="table-dark">
							<tr>
								<th>Discount Name</th>
								<th>Branch</th>
								<th>Promo Type</th>
								<th>Audience</th>
								<th>Value</th>
								<th>Duration</th>
								<th>Status</th>
								<th>Created By</th>
								<th class="text-end pe-4">Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${#lists.isEmpty(discounts)}">
								<td colspan="8" class="text-center py-4 text-muted">No
									discounts available. Click 'Add New Discount' to create one.</td>
							</tr>
							<tr th:each="discount : ${discounts}">
								<td><strong th:text="${discount.name}">Summer Sale</strong>
									<br th:if="${discount.description != null}"> <small
									class="text-muted" th:text="${discount.description}">Description</small>
								</td>
								<td><span class="badge bg-info text-dark"
									th:text="${discount.branch_name}">Branch</span></td>
								
								<td><span class="badge bg-info text-dark"
									th:text="${discount.promo_type_name}">Promo</span></td>
								<td><span class="badge bg-secondary"
									th:text="${discount.audience_type_name}">Audience</span></td>
								<td><span class="fw-bold text-success"
									th:text="${discount.discount_value}">10.00</span></td>
								<td><small> <i class="bi bi-calendar3 me-1"></i><span
										th:text="${discount.startdate}">2026-09-01</span> <br> <i
										class="bi bi-calendar-check me-1"></i><span
										th:text="${discount.enddate}">2026-09-30</span>
								</small></td>
								<td><span th:if="${discount.is_active == 1}"
									class="badge bg-success">Active</span> <span
									th:if="${discount.is_active== 0}" class="badge bg-danger">Inactive</span>
								</td>
								<td><small
									th:text="${discount.ename != null ? discount.ename : 'N/A'}">Employee</small>
								</td>
								<td class="text-end pe-4"><form
										th:action="@{/manager/discounts/restore}" method="post">
										<input type="hidden" name="id"
											th:value="${discount.discount_id}">

										<button type="submit">Restore</button>
									</form>
									<form th:action="@{/manager/discounts/real-delete}"
										method="post" style="display: inline;"
										onsubmit="return confirm('Are you sure you want to delete this discount?');">

										<input type="hidden" name="id"
											th:value="${discount.discount_id}">

										<button type="submit" class="btn btn-sm btn-outline-danger">
											<i class="bi bi-trash"></i>
										</button>

									</form></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
