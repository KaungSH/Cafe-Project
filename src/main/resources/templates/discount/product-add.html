<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Café Luft | Select Offer Coffees</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --luft-primary: #855325;
            --luft-espresso: #1c1612;
            --luft-cream: #fbf8f5;
            --luft-border: #ede4d8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--luft-cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--luft-espresso);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .dialog-card {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--luft-border);
            box-shadow: 0 16px 45px rgba(28, 22, 18, 0.08);
            overflow: hidden;
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 28px;
            border-bottom: 1px solid var(--luft-border);
            background: #fbf9f6;
        }

        .dialog-body {
            padding: 28px;
        }

        .product-choice-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border: 1px solid var(--luft-border);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .product-choice-card:hover {
            background-color: #faf5ee;
            border-color: #c5a059;
        }

        .coffee-icon-img {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
        }

        .dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 20px 28px;
            border-top: 1px solid var(--luft-border);
            background: #fbf9f6;
        }

        .btn-confirm {
            padding: 10px 26px;
            background: linear-gradient(135deg, var(--luft-primary) 0%, #683d16 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
        <div class="dialog-header">
            <div>
                <h3 class="serif-font mb-0">Assign Coffees & Offerings</h3>
                <small class="text-muted">Promotion: <strong class="text-dark" th:text="${discount.name}">Espresso Delight</strong></small>
            </div>
            <a th:href="@{/manager-only/discounts}" style="text-decoration: none; color: #888; font-size: 20px;">&times;</a>
        </div>

        <form th:action="@{/manager-only/discounts/discountProducts/add}" th:object="${discountProduct}" method="post">
            <input type="hidden" id="discount" name="discount_id" th:value="${discount.discount_id}">

            <div class="dialog-body">
                <div style="max-height: 340px; overflow-y: auto; padding-right: 5px;">
                    <label class="product-choice-card" th:each="product : ${products}">
                        <input type="checkbox" name="product_ids"
                               th:value="${product.product_id}" 
                               th:checked="${existingProductIds.contains(product.product_id)}"
                               style="width: 18px; height: 18px; accent-color: #855325;">
                        <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=120&q=80" 
                             class="coffee-icon-img" alt="Coffee">
                        <div class="flex-grow-1">
                            <div class="fw-semibold text-dark" th:text="${product.type_name + ' (' + product.size_code + ')'}">Espresso (L)</div>
                            <small class="text-muted">Handcrafted Specialty</small>
                        </div>
                    </label>

                    <div th:if="${#lists.isEmpty(products)}" class="text-center py-4 text-muted">
                        No coffee varieties found.
                    </div>
                </div>
            </div>

            <div class="dialog-footer">
                <a th:href="@{/manager-only/discounts}" class="btn btn-outline-secondary px-4" style="border-radius: 10px; font-weight: 600;">Cancel</a>
                <button type="submit" class="btn-confirm">Update Discount Offerings</button>
            </div>
        </form>
    </div>
</body>
</html>
