<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Coffees | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #fcf9f5;
            --surface: #ffffff;
            --espresso: #1f140e;
            --caramel: #c49a6c;
            --border-subtle: #f0e9df;
            --text-dark: #2a1d17;
            --active-bg: #eaf6ed;
            --active-text: #2d7a46;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-dark);
        }

        .main-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Employee Directory Header Banner */
        .cafe-header-banner {
            background: linear-gradient(135deg, #1f140e 0%, #2e1c12 50%, #150d08 100%);
            border-radius: 20px;
            padding: 24px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 14px 30px rgba(27, 17, 11, 0.18);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(243, 203, 161, 0.35);
            flex-shrink: 0;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            color: #ffffff;
            font-weight: 700;
            margin: 0;
        }

        .brand-subtitle {
            color: var(--caramel);
            font-size: 0.72rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .btn-header-back {
            background: rgba(255, 255, 255, 0.08);
            color: #f3ece4;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 9px 20px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .btn-header-back:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }

        /* Table Card Container */
        .table-card {
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 30px rgba(42, 29, 23, 0.04);
            padding: 24px 32px;
            margin-top: 24px;
        }

        .promo-summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            margin-bottom: 18px;
            border-bottom: 1.5px solid var(--border-subtle);
        }

        .cafe-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .cafe-table thead th {
            font-size: 0.74rem;
            font-weight: 700;
            color: #5c4335;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 16px 14px;
            border-bottom: 1.5px solid var(--border-subtle);
            white-space: nowrap;
        }

        .cafe-table tbody tr:not(:last-child) td {
            border-bottom: 1px solid var(--border-subtle);
        }

        .cafe-table tbody tr:hover {
            background-color: #faf7f2;
        }

        .cafe-table tbody td {
            padding: 14px 14px;
            vertical-align: middle;
            font-size: 0.9rem;
        }

        /* Checkbox styling */
        .custom-checkbox {
            width: 19px;
            height: 19px;
            accent-color: var(--caramel);
            cursor: pointer;
        }

        /* Avatar Icon matching Employee Initials */
        .item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #faf5ee;
            border: 1px solid #ebdccb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #6a4933;
            font-size: 1.1rem;
        }

        .badge-branch {
            background: #f7f3ed;
            color: #6a4933;
            border: 1px solid #ebdccb;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .badge-status-pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--active-bg);
            color: var(--active-text);
        }

        /* Action Buttons */
        .btn-add-primary {
            background: linear-gradient(135deg, #c49a6c 0%, #aa7e4e 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            box-shadow: 0 4px 14px rgba(196, 154, 108, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-add-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(196, 154, 108, 0.45);
            color: #ffffff;
        }

        .btn-cancel-link {
            background-color: #faf5ee;
            color: #6a4933 !important;
            border: 1px solid #ebdccb;
            border-radius: 12px;
            padding: 9px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-cancel-link:hover {
            background-color: #f2e7d5;
            color: #5c3218 !important;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="main-wrapper">

        <!-- Top Header Banner (Matching Employee Roster Header) -->
        <div class="cafe-header-banner">
            <div class="brand-section">
                <div class="brand-logo-circle">
                    <i class="bi bi-cup-hot-fill" style="font-size: 24px; color: #5c3a21;"></i>
                </div>
                <div>
                    <h1 class="brand-name">Café Luft</h1>
                    <div class="brand-subtitle"><i class="bi bi-link-45deg"></i> ASSIGN COFFEE OFFERINGS</div>
                </div>
            </div>
            <a th:href="@{/manager-only/discounts}" class="btn-header-back">
                <i class="bi bi-arrow-left"></i> Back to Roster
            </a>
        </div>

        <!-- Table Card Section -->
        <div class="table-card">
            <!-- Promo Title Info -->
            <div class="promo-summary-bar">
                <div>
                    <span class="text-muted small text-uppercase fw-bold" style="letter-spacing: 0.5px;">Active Campaign</span>
                    <h5 class="fw-bold mb-0" style="color: var(--espresso);" th:text="${discount.name}">Espresso Delight</h5>
                </div>
                <div>
                    <span class="badge" style="background: #faf6ee; color: #8c5332; border: 1px solid #e8d9c8; padding: 6px 14px; border-radius: 20px; font-weight: 600;">
                        <i class="bi bi-percent me-1"></i> <span th:text="${discount.discount_value}">10.00</span>% OFF
                    </span>
                </div>
            </div>

            <!-- Form -->
            <form th:action="@{/manager-only/discounts/discountProducts/add}" th:object="${discountProduct}" method="post">
                <input type="hidden" id="discount" name="discount_id" th:value="${discount.discount_id}">

                <div class="table-responsive">
                    <table class="cafe-table">
                        <thead>
                            <tr>
                                <th style="width: 48px;" class="text-center">Select</th>
                                <th style="width: 70px;">Item</th>
                                <th>Coffee / Offering Name</th>
                                <th>Cup Size</th>
                                <th>Category</th>
                                <th class="text-end">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <!-- Checkbox Column -->
                                <td class="text-center">
                                    <input type="checkbox" name="product_ids"
                                           class="custom-checkbox"
                                           th:value="${product.product_id}" 
                                           th:checked="${existingProductIds.contains(product.product_id)}">
                                </td>

                                <!-- Icon Avatar Column -->
                                <td>
                                    <div class="item-avatar">
                                        <i class="bi bi-cup-hot"></i>
                                    </div>
                                </td>

                                <!-- Product Name Column -->
                                <td>
                                    <strong style="color: var(--espresso);" th:text="${product.type_name}">Espresso</strong>
                                    <div class="text-muted small">Handcrafted Beverage</div>
                                </td>

                                <!-- Size Column -->
                                <td>
                                    <span class="badge-branch" th:text="${product.size_code != null ? product.size_code : 'Regular'}">Regular</span>
                                </td>

                                <!-- Category Column -->
                                <td>
                                    <span class="fw-semibold text-muted">SPECIALTY</span>
                                </td>

                                <!-- Status Column -->
                                <td class="text-end">
                                    <span class="badge-status-pill">
                                        <i class="bi bi-check2"></i> Available
                                    </span>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i> No products varieties found.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Footer Buttons -->
                <div class="d-flex justify-content-end align-items-center gap-2 pt-4 mt-2 border-top" style="border-color: var(--border-subtle) !important;">
                    <a th:href="@{/manager-only/discounts}" class="btn-cancel-link">Cancel</a>
                    <button type="submit" class="btn-add-primary">
                        <i class="bi bi-check2-circle"></i> Save Enrolled Coffees
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
</body>
</html>
