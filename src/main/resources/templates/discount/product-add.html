<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>New Discount Product</title>

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background-color: #faf6ef;
	font-family: Arial, Helvetica, sans-serif;
	color: #3f342c;
}

.form-container {
	width: 100%;
	max-width: 720px;
	margin: 40px auto;
	background-color: #fcf8f1;
	border: 1px solid #e5d7c4;
	border-radius: 22px;
	overflow: hidden;
}

.form-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 25px 28px;
	border-bottom: 1px solid #eadbc8;
}

.form-header h1 {
	margin: 0;
	font-family: Georgia, "Times New Roman", serif;
	font-size: 25px;
	color: #3f342c;
}

.close-button {
	font-size: 30px;
	color: #806b58;
	text-decoration: none;
	line-height: 1;
}

.close-button:hover {
	color: #3f342c;
}

.form-body {
	padding: 30px 28px;
}

.form-group {
	margin-bottom: 24px;
}

label {
	display: block;
	margin-bottom: 10px;
	font-size: 15px;
	font-weight: bold;
	color: #6d5847;
}

select {
	width: 100%;
	height: 52px;
	padding: 0 16px;
	border: 1px solid #e3d0b8;
	border-radius: 10px;
	background-color: white;
	color: #4c3b2e;
	font-size: 16px;
	outline: none;
}

select:focus {
	border-color: #9a642f;
}

.products-box {
	border: 1px solid #e3d0b8;
	border-radius: 12px;
	background-color: white;
	padding: 8px 0;
	max-height: 240px;
	overflow-y: auto;
}

.product-item {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 13px 16px;
	border-bottom: 1px solid #f0e6da;
	cursor: pointer;
}

.product-item:last-child {
	border-bottom: none;
}

.product-item:hover {
	background-color: #faf4eb;
}

.product-item input[type="checkbox"] {
	width: 19px;
	height: 19px;
	accent-color: #95602f;
	cursor: pointer;
}

.product-name {
	font-size: 15px;
	color: #604c3b;
}

.form-footer {
	display: flex;
	justify-content: flex-end;
	gap: 12px;
	padding: 20px 28px;
	border-top: 1px solid #eadbc8;
	background-color: #fcf8f1;
}

.cancel-button {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-width: 102px;
	height: 50px;
	padding: 0 20px;
	border: 1px solid #e2d0b9;
	border-radius: 10px;
	background-color: white;
	color: #4b3b2e;
	text-decoration: none;
	font-size: 15px;
	font-weight: bold;
}

.cancel-button:hover {
	background-color: #f7eee3;
}

.save-button {
	min-width: 120px;
	height: 50px;
	padding: 0 22px;
	border: none;
	border-radius: 10px;
	background-color: #95602f;
	color: white;
	font-size: 15px;
	font-weight: bold;
	cursor: pointer;
}

.save-button:hover {
	background-color: #7d4e25;
}

.no-products {
	padding: 18px;
	text-align: center;
	color: #927c68;
	font-size: 14px;
}

@media ( max-width : 600px) {
	.form-container {
		margin: 15px;
		width: auto;
		border-radius: 16px;
	}
	.form-header {
		padding: 20px;
	}
	.form-body {
		padding: 22px 20px;
	}
	.form-footer {
		padding: 18px 20px;
	}
}
</style>

</head>


<body>

	<div class="form-container">

		<div class="form-header">

			<h1>New Discount Product</h1>

			<a th:href="@{/manager/discounts}" class="close-button"> × </a>

		</div>


		<form th:action="@{/manager/discounts/discountProducts/add}"
			th:object="${discountProduct}" method="post">

			<div class="form-body">

				<div class="form-group">

					<label for="discount"> Discount </label> 
					<div class="display-field"
						th:text="${discount.name}">
						Discount Name
					</div>
					<input type = "hidden" id="discount"
						name="discount_id" th:value="${discount.discount_id}">

				</div>

				<div class="form-group">

					<label> Products </label>

					<div class="products-box">

						<div class="product-item" th:each="product : ${products}">

							<input type="checkbox" name="product_ids"
								th:value="${product.product_id}" th:checked="${existingProductIds.contains(product.product_id)}"> <span
								class="product-name" th:text="${product.type_name + ' (' + product.size_code + ')'}">
								Product Name </span>

						</div>


						<div class="no-products" th:if="${#lists.isEmpty(products)}">

							No products available.</div>

					</div>

				</div>

			</div>

			<div class="form-footer">

				<a th:href="@{/manager/discounts}" class="cancel-button"> Cancel
				</a>

				<button type="submit" class="save-button">Create</button>

			</div>

		</form>

	</div>

</body>

</html>
