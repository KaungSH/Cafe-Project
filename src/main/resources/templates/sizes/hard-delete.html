<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Luft | Confirm Permanent Delete</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #f7f3ee;
  color: #1e130c;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.delete-card {
  width: 480px;
  max-width: 95%;
  background-color: #ffffff;
  padding: 35px 30px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid #ebdcd0;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
}

.warning-icon {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #fdf2f2;
  color: #c93b3b;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  margin-bottom: 18px;
  border: 1px solid #f6cfcf;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 8px;
}

.info-pill {
  background: #faf5ef;
  border: 1px solid #ede1d3;
  border-radius: 12px;
  padding: 14px;
  margin: 20px 0;
  text-align: left;
}

.btn-cancel {
  border: 1px solid #ddd;
  background-color: white;
  color: #555;
  padding: 10px 22px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 500;
}

.btn-delete {
  background-color: #b83232;
  color: white;
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.2s;
}

.btn-delete:hover {
  background-color: #9c2727;
  color: white;
}
</style>
</head>

<body>
<div class="delete-card">
  <div class="warning-icon">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>

  <h3 class="title">Confirm Permanent Delete</h3>
  <p class="text-muted small">Are you sure you want to permanently erase this cup size? This action cannot be undone.</p>

  <div class="info-pill">
    <div class="d-flex justify-content-between mb-1">
      <span class="text-secondary">Size Code:</span>
      <strong th:text="${size.size_code}">-</strong>
    </div>
    <div class="d-flex justify-content-between mb-1">
      <span class="text-secondary">Size Name:</span>
      <strong th:text="${size.name}">-</strong>
    </div>
    <div class="d-flex justify-content-between">
      <span class="text-secondary">Created By:</span>
      <strong th:text="${size.employee_name != null ? size.employee_name : '-'}">-</strong>
    </div>
  </div>

  <form th:action="@{/admin/sizes/hard-delete/{size_id}(size_id=${size.size_id})}" method="post">
    <div class="d-flex justify-content-center gap-2">
      <a th:href="@{/admin/sizes/deleted}" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-delete"><i class="fa-solid fa-trash-can me-1"></i> Yes, Permanently Delete</button>
    </div>
  </form>
</div>
</body>
</html>
