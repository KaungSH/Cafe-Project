<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Luft | Add Size</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --espresso: #1a0f09;
  --accent-gold: #c59b63;
  --border-tone: #e8d9cb;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #f7f3ee;
  color: var(--espresso);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 15px;
}

.luxury-card {
  max-width: 840px;
  width: 100%;
  background: #ffffff;
  border-radius: 24px;
  border: 1px solid var(--border-tone);
  box-shadow: 0 20px 45px rgba(26, 15, 9, 0.08);
  overflow: hidden;
  display: flex;
}

.visual-side {
  width: 40%;
  background: linear-gradient(to bottom, rgba(26, 15, 9, 0.45), rgba(26, 15, 9, 0.85)),
              url('https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=800&q=80') center/cover;
  padding: 40px 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #ffffff;
}

.logo-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #ffffff;
  padding: 2px;
  border: 2px solid var(--accent-gold);
  margin-bottom: 20px;
}

.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.visual-side h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.85rem;
}

.form-side {
  width: 60%;
  padding: 45px 40px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.form-label {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #6d5b4e;
  margin-bottom: 7px;
}

.form-control {
  height: 48px;
  border-radius: 12px;
  border: 1px solid #dfd1c3;
  background-color: #fcfbfa;
}

.form-control:focus {
  border-color: var(--accent-gold);
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(197, 155, 99, 0.15);
}

.form-check-input:checked {
  background-color: var(--accent-gold);
  border-color: var(--accent-gold);
}

.btn-save {
  background: linear-gradient(135deg, #c59b63 0%, #a4763f 100%);
  color: #fff;
  border: none;
  font-weight: 600;
  border-radius: 12px;
  padding: 12px 26px;
  transition: 0.25s;
}

.btn-save:hover {
  box-shadow: 0 5px 20px rgba(197, 155, 99, 0.35);
  color: #fff;
}

.btn-cancel {
  border: 1px solid #dfd1c3;
  background: transparent;
  color: #7d6b5e;
  font-weight: 500;
  border-radius: 12px;
  padding: 12px 24px;
  text-decoration: none;
  transition: 0.2s;
}

.btn-cancel:hover {
  background: #f7efe7;
  color: var(--espresso);
}

.error {
  color: #b03a2e;
  font-size: 0.82rem;
  margin-top: 5px;
}

@media(max-width: 768px) {
  .luxury-card { flex-direction: column; }
  .visual-side { width: 100%; min-height: 160px; padding: 25px; }
  .form-side { width: 100%; padding: 30px 20px; }
}
</style>
</head>

<body>
<div class="luxury-card">
  <!-- Side Banner -->
  <div class="visual-side">
    <div>
      <div class="logo-circle">
        <img th:src="@{/images/luft-logo.png}" alt="Logo">
      </div>
      <h3>Café Luft</h3>
      <p class="text-white-50 small">Standardize cup volumes and serving portions for consistent barista quality.</p>
    </div>
    <div class="small text-white-50"><i class="fa-solid fa-mug-hot me-1"></i> Serving Configurations</div>
  </div>

  <!-- Form Side -->
  <div class="form-side">
    <h4 style="font-family: 'Playfair Display', serif; font-weight: 700; margin-bottom: 25px;">Add New Size</h4>

    <form th:action="@{/admin/sizes/create}" th:object="${sizeDto}" method="post">
      <div class="mb-3">
        <label class="form-label">Size Name</label>
        <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Regular, Large" />
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">Size Code</label>
        <input type="text" th:field="*{size_code}" class="form-control" placeholder="e.g. R, L, XL" />
        <div class="error" th:if="${#fields.hasErrors('size_code')}" th:errors="*{size_code}"></div>
      </div>

      <div class="mb-4 form-check">
        <input type="checkbox" th:field="*{is_active}" class="form-check-input" id="isActive" checked />
        <label class="form-check-label fw-medium text-secondary" for="isActive">Set as Active Size</label>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a th:href="@{/admin/sizes}" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-save"><i class="fa-solid fa-check me-1"></i> Save Size</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
