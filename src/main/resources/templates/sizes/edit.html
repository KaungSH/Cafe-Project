<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Luft | Edit Size</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-canvas: #f8f5f0;
  --surface: #ffffff;
  --espresso-dark: #1a110a;
  --roast-caramel: #b8864e;
  --champagne-gold: #cbb493;
  --border-subtle: #ede4d8;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg-canvas);
  color: #2b1d14;
}

.compact-luxury-card {
  background: var(--surface);
  border-radius: 24px;
  border: 1px solid var(--border-subtle);
  box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.08);
  overflow: hidden;
  max-width: 580px;
  width: 100%;
  margin: 40px auto;
}

.card-header-banner {
  background: linear-gradient(180deg, rgba(26, 17, 10, 0.70) 0%, rgba(26, 17, 10, 0.95) 100%),
              url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
  padding: 28px 30px 20px;
  text-align: center;
  position: relative;
}

.logo-glow {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--champagne-gold);
  box-shadow: 0 0 16px rgba(203, 180, 147, 0.45);
  margin-bottom: 8px;
  overflow: hidden;
}

.logo-glow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-title {
  font-family: 'Playfair Display', serif;
  color: var(--espresso-dark);
  font-weight: 700;
}

.form-label {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #7f7267;
  margin-bottom: 5px;
}

.form-control {
  height: 46px;
  border-radius: 12px;
  border: 1.5px solid var(--border-subtle);
  background-color: #fcfbfa;
  font-size: 0.92rem;
}

.form-control:focus {
  border-color: var(--roast-caramel);
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(184, 134, 78, 0.15);
}

.form-check-input:checked {
  background-color: var(--roast-caramel);
  border-color: var(--roast-caramel);
}

.btn-luxury {
  background: linear-gradient(135deg, var(--roast-caramel) 0%, #9c6c39 100%);
  color: #ffffff;
  border: none;
  font-weight: 600;
  border-radius: 12px;
  padding: 10px 24px;
  font-size: 0.9rem;
  transition: 0.25s;
}

.btn-luxury:hover {
  box-shadow: 0 8px 18px rgba(61, 38, 24, 0.25);
  color: #fff;
  transform: translateY(-2px);
}

.error {
  color: #b03a2e;
  font-size: 0.78rem;
  margin-top: 4px;
}
</style>
</head>

<body>
<div layout:fragment="content">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 d-flex justify-content-center">

        <div class="compact-luxury-card">
          <!-- Top Coffee Banner -->
          <div class="card-header-banner">
            <div class="logo-glow">
              <img th:src="@{/images/luft-logo.png}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/924/924514.png'" alt="Logo">
            </div>
            <h2 class="brand-title text-white mb-1" style="font-size: 1.6rem;">Café Luft</h2>
            <span class="badge" style="background: rgba(255,255,255,0.12); color: var(--champagne-gold); border: 1px solid rgba(255,255,255,0.2); font-size: 0.72rem;">
              <i class="fa-regular fa-pen-to-square me-1"></i> Edit Mode
            </span>
          </div>

          <!-- Form Body -->
          <div class="p-4 p-md-4">
            <div class="mb-3">
              <a th:href="@{/admin/sizes}" class="text-decoration-none text-muted small fw-semibold">
                <i class="fa-solid fa-arrow-left"></i> Back to Size List
              </a>
              <h4 class="brand-title mt-2 mb-1" style="font-size: 1.4rem;">Edit Cup Size</h4>
              <p class="text-muted small mb-3">Update beverage options, codes, and activation statuses.</p>
            </div>

            <form th:action="@{/admin/sizes/edit/{size_id}(size_id=${sizeDto.size_id})}" th:object="${sizeDto}" method="post">
              <input type="hidden" th:field="*{size_id}" />

              <div class="mb-3">
                <label class="form-label">Size Name</label>
                <input type="text" th:field="*{name}" class="form-control" required autofocus />
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Size Code</label>
                <input type="text" th:field="*{size_code}" class="form-control" required />
                <div class="error" th:if="${#fields.hasErrors('size_code')}" th:errors="*{size_code}"></div>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" th:field="*{is_active}" class="form-check-input" id="isActive" />
                <label class="form-check-label fw-medium text-secondary small" for="isActive">Is Active</label>
              </div>

              <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a th:href="@{/admin/sizes}" class="btn btn-light px-3" style="border-radius: 12px; font-weight: 600;">Cancel</a>
                <button type="submit" class="btn btn-luxury"><i class="fa-solid fa-arrows-rotate me-1"></i> Update Size</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
