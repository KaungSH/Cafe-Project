<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Luft | Cup Size Management</title>

<!-- Luxury Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 & FontAwesome -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --espresso: #1e130c;
  --dark-roast: #2c1d11;
  --accent-gold: #c59b63;
  --warm-cream: #fbf8f5;
  --border-gold: #eadbc9;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--warm-cream);
  color: var(--espresso);
  min-height: 100vh;
}

.luxury-container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}

/* Brand Banner */
.brand-hero {
  background: linear-gradient(135deg, rgba(30, 19, 12, 0.95), rgba(44, 29, 17, 0.90)), 
              url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1600&q=80') center/cover;
  border-radius: 20px;
  padding: 30px 40px;
  margin-bottom: 35px;
  box-shadow: 0 15px 35px rgba(30, 19, 12, 0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(197, 155, 99, 0.35);
  flex-wrap: wrap;
  gap: 20px;
}

.logo-wrapper {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #ffffff;
  padding: 3px;
  border: 2px solid var(--accent-gold);
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.35);
  flex-shrink: 0;
}

.brand-logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.brand-name {
  font-family: 'Playfair Display', serif;
  color: #ffffff;
  font-size: 2.1rem;
  letter-spacing: 0.5px;
  font-weight: 700;
  margin: 0;
}

.brand-subtext {
  color: var(--accent-gold);
  font-size: 0.88rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 5px;
  margin-bottom: 0;
}

/* Buttons */
.btn-gold {
  background: linear-gradient(135deg, #c59b63 0%, #ad824a 100%);
  color: #ffffff;
  font-weight: 600;
  border: none;
  padding: 11px 22px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(197, 155, 99, 0.3);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s ease;
}

.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(197, 155, 99, 0.45);
  color: #ffffff;
}

.btn-glass {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(10px);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-weight: 500;
  padding: 11px 20px;
  border-radius: 12px;
  transition: all 0.25s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-glass:hover {
  background: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  transform: translateY(-2px);
}

/* Table Card */
.table-card {
  background: #ffffff;
  border-radius: 20px;
  border: 1px solid var(--border-gold);
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(44, 29, 17, 0.04);
}

.table thead {
  background: #f7efe6;
}

.table thead th {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  color: var(--dark-roast);
  padding: 20px 24px;
  border: none;
}

.table tbody tr {
  border-bottom: 1px solid #f3e9df;
  transition: 0.2s;
}

.table tbody tr:hover {
  background-color: #faf5ef;
}

.table tbody td {
  padding: 18px 24px;
  vertical-align: middle;
  color: #42352b;
  border: none;
}

.badge-code {
  background: #f3eae0;
  color: #634327;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #e7d5c3;
  display: inline-block;
}

.status-active {
  background: #eef7ee;
  color: #2b7a38;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.82rem;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.status-inactive {
  background: #fdf2f2;
  color: #9e3636;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.82rem;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* Actions */
.btn-action-edit {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid #ebdcd0;
  color: #5a4536;
  background: white;
  transition: 0.2s;
  text-decoration: none;
  margin-right: 6px;
}

.btn-action-edit:hover {
  background: var(--accent-gold);
  border-color: var(--accent-gold);
  color: #fff;
}

.btn-action-del {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid #f2d8d8;
  color: #b04848;
  background: white;
  transition: 0.2s;
  text-decoration: none;
}

.btn-action-del:hover {
  background: #b04848;
  border-color: #b04848;
  color: #fff;
}
</style>
</head>

<body>
<div layout:fragment="content">
  <!-- Brand Hero -->
  <div class="brand-hero">
    <div class="d-flex align-items-center gap-3">
      <div class="logo-wrapper">
        <img th:src="@{/images/luft-logo.png}" alt="Café Luft Logo" class="brand-logo">
      </div>
      <div>
        <h1 class="brand-name">Café Luft</h1>
        <p class="brand-subtext"><i class="fa-solid fa-mug-saucer me-1"></i> Beverage Cup Size Management</p>
      </div>
    </div>
    <div class="d-flex gap-3">
      <a th:href="@{/admin/sizes/deleted}" class="btn-glass">
        <i class="fa-solid fa-trash-can"></i> Recycle Bin
      </a>
      <a th:href="@{/admin/sizes/create}" class="btn-gold">
        <i class="fa-solid fa-plus"></i> Add New Size
      </a>
    </div>
  </div>

  <!-- Size List Table -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th style="width: 140px;">Size Code</th>
            <th>Size Name</th>
            <th style="width: 160px;">Status</th>
            <th>Created By</th>
            <th style="width: 130px;" class="text-end">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(sizes)}">
            <td colspan="5" class="text-center py-5 text-muted">
              <i class="fa-solid fa-mug-hot mb-2 d-block" style="font-size: 2.2rem; opacity: 0.35;"></i>
              No size records found.
            </td>
          </tr>
          <tr th:each="s : ${sizes}">
            <td><span class="badge-code" th:text="${s.size_code}">SZ-01</span></td>
            <td><strong class="fs-6" th:text="${s.name}">Medium</strong></td>
            <td>
              <span th:if="${s.is_active}" class="status-active">
                <i class="fa-solid fa-check"></i> Active
              </span>
              <span th:unless="${s.is_active}" class="status-inactive">
                <i class="fa-solid fa-xmark"></i> Inactive
              </span>
            </td>
            <td>
              <span class="text-secondary" th:text="${s.employee_name != null ? s.employee_name : '-'}">Admin</span>
            </td>
            <td class="text-end">
              <a th:href="@{/admin/sizes/edit/{id}(id=${s.size_id})}" class="btn-action-edit" title="Edit Size">
                <i class="fa-regular fa-pen-to-square"></i>
              </a>
              <a th:href="@{/admin/sizes/delete/{id}(id=${s.size_id})}" class="btn-action-del" title="Move to Recycle Bin"
                 onclick="return confirm('Are you sure you want to move this size to recycle bin?');">
                <i class="fa-regular fa-trash-can"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
