<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Deleted Ingredients</title>

<style>
body {
	margin: 0;
	padding: 30px;
	font-family: Arial, sans-serif;
	background-color: #faf7f2;
	color: #5b4636;
}

.container {
	width: 95%;
	margin: auto;
}

.header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 10px;
}

h2 {
	margin: 0;
	font-size: 32px;
	color: #3f2d20;
}

.description {
	margin-top: 10px;
	margin-bottom: 30px;
	color: #806c5b;
	font-size: 16px;
}

.back-link {
	display: inline-block;
	margin-bottom: 25px;
	color: #95612e;
	text-decoration: none;
	font-weight: bold;
}

.back-link:hover {
	text-decoration: underline;
}

table {
	width: 100%;
	border-collapse: separate;
	border-spacing: 0;
	background-color: #fcf9f4;
	border: 1px solid #eadbc9;
	border-radius: 14px;
	overflow: hidden;
}

thead {
	background-color: #f4eadc;
}

th {
	padding: 18px 20px;
	text-align: left;
	font-size: 14px;
	color: #927b65;
	text-transform: uppercase;
	letter-spacing: 1px;
	border-bottom: 1px solid #eadbc9;
}

td {
	padding: 18px 20px;
	border-bottom: 1px solid #eadbc9;
	font-size: 16px;
}

tbody tr:last-child td {
	border-bottom: none;
}

tbody tr:hover {
	background-color: #f7efe4;
}

.actions {
	white-space: nowrap;
}

.restore-button {
	padding: 9px 16px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	background-color: white;
	font-weight: bold;
	cursor: pointer;
}

.restore-button:hover {
	background-color: #f4eadc;
}

.delete-button {
	padding: 9px 16px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #a33a2b;
	background-color: white;
	font-weight: bold;
	cursor: pointer;
}

.delete-button:hover {
	background-color: #f8e5df;
}

.empty-message {
	text-align: center;
	padding: 30px;
	color: #806c5b;
}
</style>

</head>

<body>

	<div class="container">

		<div class="header">

			<div>

				<h2>Deleted Ingredient Types</h2>

				<p class="description">Deleted ingredient types are stored here.
					You can restore or permanently delete them.</p>

			</div>

		</div>


		<a class="back-link" th:href="@{/staff/ingredientType}"> ← Back to
			Active Ingredients </a>


		<table>

			<thead>

				<tr>
					<th>Name</th>
					<th>Description</th>
					<th>Unit</th>
					<th>Created At</th>
					<th>Actions</th>
				</tr>

			</thead>


			<tbody>

				<tr th:if="${#lists.isEmpty(deletedIngredients)}">

					<td colspan="5" class="empty-message">No deleted ingredients
						found.</td>

				</tr>


				<tr th:each="i : ${deletedIngredients}">

					<td th:text="${i.name}"></td>

					<td th:text="${i.description}"></td>

					<td
						th:text="${i.unitAbbreviation != null ? i.unitAbbreviation : '-'}"></td>

					<td
						th:text="${i.createdAt != null ? #temporals.format(i.createdAt, 'dd-MM-yyyy HH:mm') : '-'}"></td>


					<td class="actions">

						<form
							th:action="@{/staff/ingredientType/restore/{id}(id=${i.ingredientTypeId})}"
							method="post" style="display: inline;">

							<button type="submit" class="restore-button"
								onclick="return confirm('Restore this ingredient?');">
								Restore</button>

						</form>


						<form
							th:action="@{/staff/ingredientType/hard-delete/{id}(id=${i.ingredientTypeId})}"
							method="post" style="display: inline;">

							<button type="submit" class="delete-button"
								onclick="return confirm('Permanently delete this record?');">
								Hard Delete</button>

						</form>

					</td>

				</tr>

			</tbody>

		</table>

	</div>

</body>

</html>
