<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Ingredient Type List</title>

<style>
body {
	margin: 0;
	padding: 30px;
	font-family: Arial, sans-serif;
	background-color: #faf7f2;
	color: #5b4636;
}

.container {
	width: 95%;
	margin: auto;
}

.header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 10px;
}

h2 {
	margin: 0;
	font-size: 32px;
	color: #3f2d20;
}

.description {
	margin-top: 10px;
	margin-bottom: 30px;
	color: #806c5b;
	font-size: 16px;
}

.add-button {
	background-color: #95612e;
	color: white;
	text-decoration: none;
	padding: 14px 22px;
	border-radius: 10px;
	font-weight: bold;
}

.add-button:hover {
	background-color: #75491f;
}

.links {
	margin-bottom: 25px;
}

.links a {
	color: #95612e;
	text-decoration: none;
	font-weight: bold;
}

.links a:hover {
	text-decoration: underline;
}

table {
	width: 100%;
	border-collapse: separate;
	border-spacing: 0;
	background-color: #fcf9f4;
	border: 1px solid #eadbc9;
	border-radius: 14px;
	overflow: hidden;
}

thead {
	background-color: #f4eadc;
}

th {
	padding: 18px 20px;
	text-align: left;
	font-size: 14px;
	color: #927b65;
	text-transform: uppercase;
	letter-spacing: 1px;
	border-bottom: 1px solid #eadbc9;
}

td {
	padding: 18px 20px;
	border-bottom: 1px solid #eadbc9;
	font-size: 16px;
}

tbody tr:last-child td {
	border-bottom: none;
}

tbody tr:hover {
	background-color: #f7efe4;
}

.actions {
	white-space: nowrap;
}

.edit-button {
	display: inline-block;
	padding: 9px 16px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	text-decoration: none;
	background-color: white;
	font-weight: bold;
	margin-right: 6px;
}

.edit-button:hover {
	background-color: #f4eadc;
}

.delete-button {
	padding: 9px 16px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	background-color: white;
	font-weight: bold;
	cursor: pointer;
}

.delete-button:hover {
	background-color: #f4eadc;
}

.empty-message {
	text-align: center;
	padding: 30px;
	color: #806c5b;
}
</style>

</head>

<body>

	<div class="container">

		<div class="header">
			<div>
				<h2>Ingredient types</h2>

				<p class="description">Raw ingredients used in recipes — coffee
					beans, milk, flour</p>
			</div>

			<a class="add-button" th:href="@{/staff/ingredientType/add}"> +
				Add ingredient type </a>
		</div>

		<div class="links">
			<a th:href="@{/staff/ingredientType/deleted}"> View Deleted
				Ingredients </a>
		</div>

		<table>

			<thead>
				<tr>
					<th>Name</th>
					<th>Description</th>
					<th>Unit</th>
					<th>Created At</th>
					<th>Actions</th>
				</tr>
			</thead>

			<tbody>

				<!-- Show message if table is empty -->
				<tr th:if="${#lists.isEmpty(ingredients)}">
					<td colspan="5" class="empty-message">No ingredients found.</td>
				</tr>

				<!-- Loop over active ingredients from controller -->
				<tr th:each="i : ${ingredients}">

					<td th:text="${i.name}"></td>

					<td th:text="${i.description}"></td>

					<td
						th:text="${i.unitAbbreviation != null ? i.unitAbbreviation : '-'}"></td>

					<td
						th:text="${i.createdAt != null ? #temporals.format(i.createdAt, 'dd-MM-yyyy HH:mm') : '-'}"></td>

					<td class="actions"><a class="edit-button"
						th:href="@{/staff/ingredientType/edit/{id}(id=${i.ingredientTypeId})}">
							Edit </a>

						<form
							th:action="@{/staff/ingredientType/soft-delete/{id}(id=${i.ingredientTypeId})}"
							method="post" style="display: inline;">

							<button type="submit" class="delete-button"
								onclick="return confirm('Soft delete this item?');">
								Delete</button>

						</form></td>

				</tr>

			</tbody>

		</table>

	</div>

</body>
</html>
