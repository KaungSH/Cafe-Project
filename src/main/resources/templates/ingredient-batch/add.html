<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Ingredient Batches</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add Ingredient Batches to Import</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/ingredient-batches/add}" th:object="${batchEntry}" method="post">
                    
                    <input type="hidden" th:field="*{import_id}" />

                    <div class="alert alert-info">
                        <strong>Target Import ID:</strong> <span th:text="*{import_id}">SI-001</span>
                    </div>

                    <h5 class="border-bottom pb-2 mb-3"><i class="bi bi-card-checklist me-2"></i>Select Ingredients to Add</h5>
                    
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr class="text-center">
                                    <th style="width: 50px;">Select</th>
                                    <th>Ingredient</th>
                                    <th style="width: 100px;">Unit</th>
                                    <th style="width: 130px;">Quantity</th>
                                    <th style="width: 130px;">Unit Cost</th>
                                    <th style="width: 160px;">Manufactured</th>
                                    <th style="width: 160px;">Expire</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item, stat : *{items}">
                                    <td class="text-center">
                                        <input type="checkbox" class="form-check-input" 
                                               th:field="*{items[__${stat.index}__].selected}" />
                                        <input type="hidden" th:field="*{items[__${stat.index}__].ingredientTypeId}" />
                                    </td>
                                    <td class="fw-bold" th:text="${item.ingredientTypeName}">Sugar</td>
                                    <td class="text-center" th:text="${item.unit_name}">kg</td>
                                    <td>
                                        <input type="number" step="0.01" th:field="*{items[__${stat.index}__].quantity_ordered}" class="form-control" placeholder="0.00" />
                                    </td>
                                    <td>
                                        <input type="number" step="0.01" th:field="*{items[__${stat.index}__].unit_cost}" class="form-control" placeholder="0.00" />
                                    </td>
                                    <td>
                                        <input type="date" th:field="*{items[__${stat.index}__].manufactured_date}" class="form-control" />
                                    </td>
                                    <td>
                                        <input type="date" th:field="*{items[__${stat.index}__].expire_date}" class="form-control" />
                                        
                                    </td>
                                   
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/stock-imports}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success px-4 fw-bold">Save New Batches</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
