<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Luft — Permanent Delete</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f9f7f4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .luxury-card {
            background: #ffffff;
            border: 1px solid #ede7e0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 32px;
            max-width: 520px;
            width: 100%;
        }
        .danger-icon-circle {
            width: 56px;
            height: 56px;
            background-color: #fde8e8;
            color: #b8332a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<div layout:fragment="content" class="luxury-card">
    <div class="danger-icon-circle">
        <i class="bi bi-exclamation-triangle-fill"></i>
    </div>

    <h4 class="fw-bold text-dark mb-1">Permanently Delete Batch?</h4>
    <p class="text-muted small mb-4">
        This action <strong>cannot be undone</strong>. This record will be permanently wiped out from the Café Luft database.
    </p>

    <div class="bg-light p-3 rounded-3 mb-4 border">
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted small">Batch ID:</span>
            <span class="fw-bold font-monospace" th:text="${batch.batch_id}"></span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted small">Ingredient:</span>
            <span class="fw-bold" th:text="${batch.ingredientType_name}"></span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted small">Branch:</span>
            <span class="fw-bold" th:text="${batch.branch_name}"></span>
        </div>
        <div class="d-flex justify-content-between">
            <span class="text-muted small">Remaining Qty:</span>
            <span class="fw-bold text-danger" th:text="${batch.remaining_quantity}"></span>
        </div>
    </div>

    <form th:action="@{/manager-only/ingredient-batches/hard-delete/{id}(id=${batch.batch_id})}" method="post" class="d-flex gap-2">
        <a th:href="@{/manager-only/ingredient-batches/deleted-list}" class="btn btn-light border flex-grow-1 py-2 fw-semibold">Cancel</a>
        <button type="submit" class="btn btn-danger flex-grow-1 py-2 fw-semibold">
            <i class="bi bi-trash3-fill me-1"></i> Permanently Delete
        </button>
    </form>
</div>
</body>
</html>
