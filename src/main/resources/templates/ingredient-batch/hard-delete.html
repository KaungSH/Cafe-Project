<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Delete Ingredient Batch</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<body class="container mt-4">

	<div class="row justify-content-center">
		<div class="col-md-6">
			<div class="card border-danger shadow-sm">
				<div class="card-header bg-danger text-white">
					<h4 class="mb-0">Permanent Delete Warning</h4>
				</div>
				<div class="card-body">
					<div class="alert alert-warning" role="alert">
						<strong>Warning!</strong> This action cannot be undone. The batch
						data will be permanently removed from the database.
					</div>

					<ul class="list-group list-group-flush mb-3">
						<li class="list-group-item"><strong>Batch ID:</strong> <span
							th:text="${batch.batch_id}"></span></li>
						<li class="list-group-item"><strong>Ingredient Type:</strong>
							<span th:text="${batch.ingredientType_name}"></span></li>
						<li class="list-group-item"><strong>Branch:</strong> <span
							th:text="${batch.branch_name}"></span></li>
						<li class="list-group-item"><strong>Remaining Qty:</strong> <span
							th:text="${batch.remaining_quantity}"></span></li>
					</ul>

					<form
						th:action="@{/ingredient-batches/hard-delete/{id}(id=${batch.batch_id})}"
						method="post" class="d-flex justify-content-end gap-2">
						<a th:href="@{/ingredient-batches/deleted-list}"
							class="btn btn-secondary">Cancel</a>
						<button type="submit" class="btn btn-danger">Permanently
							Delete</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
