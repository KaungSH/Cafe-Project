<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - Café Shop">Café Shop</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #faf6f0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #34251f;
        }

        /* ================= SHARED LAYOUT ================= */

        .cafe-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .cafe-sidebar {
            width: 245px;
            min-width: 245px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 25px 15px 15px;
            overflow-y: auto;
            position: sticky;
            top: 0;
        }

        /* ================= MANAGER SIDEBAR ================= */

        .manager-sidebar {
            background: #6E473B;
            border-right: 1px solid #ead8c8;
        }

        .manager-sidebar .cafe-brand-icon {
            background: #f6dfca;
            color: #c77b3b;
        }

        .manager-sidebar .cafe-brand-name span {
            color: #d88945;
        }

        .manager-sidebar .cafe-menu-item:hover {
            background: #f8e5d3;
            color: #bd7137;
        }

        .manager-sidebar .cafe-menu-item:hover i {
            color: #bd7137;
        }

        .manager-sidebar .cafe-role {
            color: #c77b3b;
        }

        /* ================= ADMIN SIDEBAR ================= */

        .admin-sidebar {
            width: 250px;
            min-width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #1f140e 0%, #160e0a 100%);
            border-right: 1px solid rgba(199, 123, 59, 0.22);
            padding: 22px 14px 20px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(199, 123, 59, 0.35) transparent;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.28);
        }

        .admin-sidebar::-webkit-scrollbar {
            width: 5px;
        }

        .admin-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .admin-sidebar::-webkit-scrollbar-thumb {
            background: rgba(199, 123, 59, 0.3);
            border-radius: 10px;
        }

        .admin-sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(199, 123, 59, 0.65);
        }

        .admin-sidebar .cafe-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
            margin-bottom: 22px;
        }

        .admin-sidebar .cafe-brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #c77b3b 0%, #7d3f1a 100%);
            color: #fffaf5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(199, 123, 59, 0.35);
        }

        .admin-sidebar .cafe-brand-name {
            color: #fff7f0;
        }

        .admin-sidebar .cafe-brand-name span {
            color: #d99350;
        }

        .admin-sidebar .admin-user-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #f7ede6;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 145px;
            display: block;
        }

        .admin-sidebar .cafe-role {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #e2a05e;
            background: rgba(226, 160, 94, 0.12);
            border: 1px solid rgba(226, 160, 94, 0.25);
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .admin-sidebar .staff-profile-dropdown {
            font-size: 12px;
            font-weight: 600;
            color: #bfa393 !important;
            margin-top: 3px;
            transition: color 0.2s ease;
        }

        .admin-sidebar .staff-profile-dropdown:hover {
            color: #f3a668 !important;
        }

        .admin-sidebar .cafe-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 10px;
        }

        .admin-sidebar .cafe-menu-item {
            min-height: 42px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 14px;
            border-radius: 12px;
            text-decoration: none;
            color: #c7b6ab;
            font-weight: 500;
            font-size: 13.5px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .admin-sidebar .cafe-menu-item i {
            width: 22px;
            font-size: 16px;
            color: #9c8477;
            margin-right: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .admin-sidebar .cafe-menu-item:hover {
            background: rgba(199, 123, 59, 0.14);
            color: #ffffff;
            transform: translateX(4px);
        }

        .admin-sidebar .cafe-menu-item:hover i {
            color: #f3a668;
            transform: scale(1.12);
        }

        .admin-sidebar .cafe-menu-item.active {
            background: linear-gradient(135deg, #b86b2d 0%, #874116 100%);
            color: #ffffff !important;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(184, 107, 45, 0.38);
        }

        .admin-sidebar .cafe-menu-item.active i {
            color: #ffffff !important;
        }

        .admin-sidebar .cafe-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(199, 123, 59, 0.25), transparent);
            margin: 14px 6px;
        }

        .admin-sidebar .cafe-bottom-menu {
            margin-top: auto;
            padding-top: 10px;
        }

        .admin-sidebar .logout-item {
            color: #fca5a5 !important;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.18);
        }

        .admin-sidebar .logout-item:hover {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ffffff !important;
            transform: translateX(4px);
        }

        .admin-sidebar .logout-item i {
            color: #f87171 !important;
        }

        /* ================= SIDEBAR COMPONENTS ================= */

        .cafe-brand {
            display: flex;
            align-items: center;
            padding: 0 12px;
            margin-bottom: 30px;
        }

        .cafe-brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 20px;
        }

        .cafe-brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        .cafe-role {
            font-size: 11px;
            font-weight: 700;
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .cafe-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .cafe-menu-item {
            min-height: 44px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border-radius: 11px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .cafe-menu-item i {
            width: 28px;
            margin-right: 8px;
            font-size: 17px;
        }

        .cafe-divider {
            height: 1px;
            background: #eaded6;
            margin: 18px 8px;
        }

        .cafe-bottom-menu {
            margin-top: auto;
        }

        .logout-item:hover {
            color: #d9534f;
        }

        /* ================= MAIN CONTENT ================= */

        .cafe-content {
            flex: 1;
            min-width: 0;
            min-height: 100vh;
            padding: 30px;
            background: #fdf8f4;
        }

        .manager-content {
            background: #fffaf6;
        }

        .admin-content {
            background: #f4ebe5;
        }

        .page-role-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .manager-badge {
            background: #f5dfca;
            color: #9c5727;
        }

        .admin-badge {
            background: #3b2922;
            color: #efb06f;
        }

        /* ================= STAFF VERTICAL LAYOUT ================= */

        .staff-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            background: #fdf8f4;
        }

        /* STAFF TOP BAR */

        .staff-topbar {
            min-height: 82px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 15px 30px;
            background: #fffaf5;
            border-bottom: 1px solid #ead8c8;
        }

        .staff-topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .staff-brand-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6dfca;
            color: #c77b3b;
            font-size: 20px;
        }

        .staff-brand-name {
            display: flex;
            flex-direction: column;
            gap: 3px;
            color: #34251f;
            font-size: 18px;
            font-weight: 700;
        }

        .staff-brand-name small {
            color: #c77b3b;
            font-size: 10px;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .staff-topbar-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .staff-employee-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #736356;
        }

        .staff-employee-info > i {
            font-size: 28px;
            color: #c77b3b;
        }

        .staff-employee-info div {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .staff-employee-info span {
            color: #34251f;
            font-size: 13px;
            font-weight: 700;
        }

        .staff-employee-info small {
            color: #9b8879;
            font-size: 11px;
        }

        .staff-topbar-divider {
            width: 1px;
            height: 35px;
            background: #ead8c8;
        }

        .staff-logout {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 13px;
            border-radius: 10px;
            text-decoration: none;
            color: #736356;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .staff-logout:hover {
            background: #f8e5d3;
            color: #bd7137;
        }

        .staff-logout i {
            font-size: 17px;
        }

        /* STAFF PAGE CONTENT */

        .staff-content {
            flex: 1;
            min-width: 0;
            min-height: calc(100vh - 82px);
            padding: 30px;
            background: #fdf8f4;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {
            .cafe-sidebar {
                width: 200px;
                min-width: 200px;
                padding-left: 10px;
                padding-right: 10px;
            }

            .cafe-content {
                padding: 20px;
            }

            .staff-topbar {
                padding: 15px;
                gap: 12px;
            }

            .staff-topbar-right {
                gap: 10px;
            }

            .staff-employee-info span {
                max-width: 110px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .staff-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .staff-brand-name {
                font-size: 15px;
            }

            .staff-employee-info {
                display: none;
            }

            .staff-topbar-divider {
                display: none;
            }

            .staff-logout span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- ================= SHARED LAYOUT ================= -->
    <div class="cafe-layout"
         th:classappend="${session.loggedInUser != null
             and session.loggedInUser.employee_role == 'STAFF'
             ? ' staff-layout' : ''}">

        <!-- STAFF TOPBAR -->
        <th:block th:if="${session.loggedInUser != null
                          and session.loggedInUser.employee_role == 'STAFF'}">
            <div th:replace="~{common/fragments/topbar_staff :: topbar_staff}"></div>
        </th:block>

        <!-- MANAGER SIDEBAR -->
        <th:block th:if="${session.loggedInUser != null
                          and session.loggedInUser.employee_role == 'MANAGER'}">
            <div th:replace="~{common/fragments/sidebar_manager :: sidebar_manager}"></div>
        </th:block>

        <!-- ADMIN SIDEBAR -->
        <th:block th:if="${session.loggedInUser != null
                          and session.loggedInUser.employee_role == 'ADMIN'}">
            <div th:replace="~{common/fragments/sidebar_admin :: sidebar_admin}"></div>
        </th:block>

        <!-- SHARED PAGE CONTENT -->
        <main class="cafe-content"
              th:classappend="${session.loggedInUser != null
                  and session.loggedInUser.employee_role == 'ADMIN'
                  ? ' admin-content'
                  : (session.loggedInUser != null
                     and session.loggedInUser.employee_role == 'STAFF'
                     ? ' staff-content'
                     : ' manager-content')}"
              layout:fragment="content">
        </main>

    </div>

</body>

</html>
