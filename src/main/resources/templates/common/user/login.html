<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login | Café Luft</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Google Fonts: Luxury Editorial Font Pairing (Playfair Display + DM Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           GLOBAL & VARIABLES
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --espresso: #120904;
            --dark-coffee: #1d0d07;
            --coffee: #3a1b0f;
            --coffee-light: #704127;
            --caramel: #c8874a;
            --gold: #e4ad72;
            --cream: #fff8ef;
            --cream-muted: #d7c0ac;
            --input-bg: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 235, 215, 0.13);
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            font-family: 'DM Sans', sans-serif;
            color: var(--cream);
            background:
                linear-gradient(
                    115deg,
                    rgba(20, 9, 4, 0.40),
                    rgba(50, 25, 14, 0.25),
                    rgba(15, 7, 3, 0.40)
                ),
                url('/images/welcome page.png') center / cover no-repeat;
            position: relative;
            overflow: hidden;
        }

        /* Subtle radial spotlight overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 190, 120, 0.08),
                    transparent 60%
                );
            pointer-events: none;
            z-index: 0;
        }

        /* =========================================================
           DECORATIVE LIGHTS
        ========================================================= */
        .glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.13;
            pointer-events: none;
            z-index: 0;
        }

        .glow-one {
            background: #d88a4d;
            top: -180px;
            left: -120px;
        }

        .glow-two {
            background: #7c3f20;
            bottom: -220px;
            right: -120px;
        }

        /* =========================================================
           FALLING COFFEE BEANS ANIMATION
        ========================================================= */
        #coffee-rain {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .coffee-bean {
            position: absolute;
            top: -40px;
            width: 9px;
            height: 14px;
            border-radius: 50% 45% 50% 45%;
            background: linear-gradient(135deg, #160803 0%, #633019 50%, #210a04 100%);
            opacity: 0.35;
            box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.5);
            animation: beanFall var(--duration) linear var(--delay) forwards;
        }

        .coffee-bean::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 1px;
            width: 2px;
            height: 11px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.25);
            transform: translateX(-50%) rotate(10deg);
        }

        @keyframes beanFall {
            0% {
                top: -50px;
                transform: translateX(0) rotate(var(--rot)) scale(.7);
                opacity: 0;
            }
            15% { opacity: .4; }
            50% {
                top: 50vh;
                transform: translateX(var(--drift1)) rotate(190deg);
            }
            100% {
                top: 110vh;
                transform: translateX(var(--drift2)) rotate(430deg) scale(.9);
                opacity: 0;
            }
        }

        /* =========================================================
           LOGIN CARD (GLASSMORPHISM)
        ========================================================= */
        .login-card {
            position: relative;
            z-index: 5;
            width: min(440px, 100%);
            padding: 44px 38px 36px;
            text-align: center;
            border: 1px solid rgba(255, 238, 220, 0.16);
            border-radius: 30px;
            background: rgba(30, 14, 8, 0.24);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
            overflow: hidden;
            animation: cardAppear .7s ease-out;
        }

        .login-card::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(221, 144, 78, 0.28), transparent 70%);
            filter: blur(25px);
            pointer-events: none;
        }

        .login-card::after {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(228, 173, 114, 0.5), transparent);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(22px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* =========================================================
           LOGO
        ========================================================= */
        .coffee-logo {
            position: relative;
            width: 78px;
            height: 78px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(145deg, #754021, #2a0d06);
            border: 1px solid rgba(228, 173, 114, 0.35);
            box-shadow: 0 0 0 7px rgba(216, 139, 77, 0.07), 0 16px 35px rgba(0, 0, 0, 0.42);
            animation: logoFloat 4s ease-in-out infinite;
        }

        .coffee-logo .cup {
            font-size: 32px;
            color: #fff8ef;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            animation: cupSway 3.5s ease-in-out infinite;
        }

        .steam {
            position: absolute;
            top: 10px;
            width: 3px;
            height: 18px;
            border-left: 2px solid rgba(255, 241, 225, 0.65);
            border-radius: 50%;
            animation: steam 2.4s ease-in-out infinite;
        }
        .steam.s1 { left: 28px; }
        .steam.s2 { left: 38px; height: 17px; animation-delay: .45s; }
        .steam.s3 { left: 48px; height: 19px; animation-delay: .9s; }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes cupSway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes steam {
            0% { opacity: 0; transform: translateY(5px) scale(.8); }
            35% { opacity: .8; }
            100% { opacity: 0; transform: translateY(-15px) translateX(4px) scale(1.1); }
        }

        /* =========================================================
           VOGUE EDITORIAL STYLE TYPOGRAPHY
        ========================================================= */
        .vogue-title-box {
            margin: 6px auto 14px;
            text-align: center;
        }

        .vogue-main-title {
            margin: 0;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.05rem, 5.4vw, 2.75rem);
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 5px;
            line-height: 1.15;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
        }

        .vogue-sub-title {
            display: block;
            margin-top: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.70rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--gold);
            opacity: 0.95;
        }

        .login-subtitle {
            margin: 8px 0 24px;
            color: var(--cream-muted);
            font-size: .86rem;
            line-height: 1.5;
        }

        /* =========================================================
           ERROR BANNER
        ========================================================= */
        .error-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-bottom: 18px;
            padding: 11px 14px;
            border-radius: 13px;
            background: rgba(220, 53, 69, .12);
            border: 1px solid rgba(220, 53, 69, .28);
            color: #ffb7bd;
            font-size: .82rem;
            font-weight: 500;
        }

        /* =========================================================
           FORM CONTROLS
        ========================================================= */
        .form-control-wrap {
            position: relative;
            margin-bottom: 15px;
        }

        .form-control-wrap .input-icon {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: .9rem;
            z-index: 2;
            pointer-events: none;
        }

        .form-control-wrap .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9e8979;
            cursor: pointer;
            z-index: 3;
            padding: 7px;
            background: transparent;
            border: none;
            transition: .2s ease;
        }

        .form-control-wrap .toggle-password:hover {
            color: var(--gold);
            transform: translateY(-50%) scale(1.08);
        }

        .form-control-wrap .toggle-password:focus-visible {
            outline: 2px solid var(--gold);
            border-radius: 6px;
        }

        .form-control-wrap .select-arrow {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            pointer-events: none;
            font-size: .75rem;
            z-index: 2;
        }

        .form-control {
            width: 100%;
            height: 54px;
            padding: 0 46px;
            border-radius: 15px;
            border: 1px solid var(--border);
            outline: none;
            color: #fffaf5 !important;
            font-family: 'DM Sans', sans-serif;
            font-size: .9rem;
            background: rgba(7, 3, 2, .42) !important;
            box-shadow: inset 0 1px 7px rgba(0, 0, 0, .2);
            transition:
                border-color .25s ease,
                box-shadow .25s ease,
                background .25s ease,
                transform .2s ease;
        }

        .form-control:hover {
            border-color: rgba(228, 173, 114, .28);
        }

        .form-control:focus {
            border-color: var(--gold);
            background: rgba(7, 3, 2, .58) !important;
            box-shadow:
                0 0 0 3px rgba(228, 173, 114, .10),
                0 8px 20px rgba(0, 0, 0, .18);
            transform: translateY(-1px);
        }

        .form-control::placeholder {
            color: #9f8878;
            opacity: 1;
        }

        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
        }

        select.form-control option {
            background: #1d0d07;
            color: #fff8ef;
            padding: 10px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff8ef !important;
            -webkit-box-shadow: 0 0 0 1000px #1b0c07 inset !important;
            transition: background-color 9999s ease-in-out 0s;
        }

        /* =========================================================
           LOGIN BUTTON
        ========================================================= */
        .btn-primary-login {
            position: relative;
            width: 100%;
            height: 54px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #a85d2d 0%, #d99857 100%);
            color: #fffaf5;
            font-size: .94rem;
            font-weight: 700;
            letter-spacing: .4px;
            box-shadow: 0 12px 25px rgba(160, 79, 31, .25), inset 0 1px 0 rgba(255, 255, 255, .25);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        .btn-primary-login::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .22), transparent);
            transform: skewX(-20deg);
            transition: left .6s ease;
        }

        .btn-primary-login:hover {
            color: white;
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: 0 16px 32px rgba(160, 79, 31, .36);
        }

        .btn-primary-login:hover::before { left: 140%; }
        .btn-primary-login:active { transform: translateY(0); box-shadow: 0 7px 15px rgba(160, 79, 31, .25); }

        .btn-cup {
            display: inline-block;
            margin-right: 7px;
            animation: buttonCup 2s ease-in-out infinite;
        }

        @keyframes buttonCup {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg) translateY(-1px); }
        }

        /* =========================================================
           FOOTER
        ========================================================= */
        .login-footer {
            margin-top: 22px;
            color: #806d5e;
            font-size: .72rem;
            letter-spacing: .2px;
        }

        .login-footer i {
            color: #a66b3d;
            margin-right: 4px;
        }

        /* =========================================================
           RESPONSIVENESS & ACCESSIBILITY
        ========================================================= */
        @media (max-width: 480px) {
            body { padding: 20px 14px; }
            .login-card { padding: 34px 20px 28px; border-radius: 24px; }
            .vogue-main-title { font-size: 1.8rem; letter-spacing: 4px; }
            .form-control, .btn-primary-login { height: 50px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<!-- Decorative glow (hidden from screen readers) -->
<div class="glow glow-one" aria-hidden="true"></div>
<div class="glow glow-two" aria-hidden="true"></div>

<!-- Falling coffee beans animation -->
<div id="coffee-rain" aria-hidden="true"></div>

<!-- =========================================================
     LOGIN CARD
========================================================= -->
<main class="login-card" role="main" aria-labelledby="loginTitle">

    <!-- Coffee Logo -->
    <div class="coffee-logo" role="img" aria-label="Café Luft Logo">
        <span class="steam s1" aria-hidden="true"></span>
        <span class="steam s2" aria-hidden="true"></span>
        <span class="steam s3" aria-hidden="true"></span>
        <i class="fa-solid fa-mug-hot cup" aria-hidden="true"></i>
    </div>

    <!-- Editorial Vogue Typography Title -->
    <div class="vogue-title-box">
        <h1 class="vogue-main-title" id="loginTitle">
            EMPLOYEE LOGIN
        </h1>
        <span class="vogue-sub-title" aria-hidden="true">
            CAFÉ LUFT
        </span>
    </div>

    <!-- Subtitle -->
    <p class="login-subtitle" id="loginDesc">
        Welcome back. Start your shift with a perfect cup of coffee.
    </p>

    <!-- Error Banner (Live region for screen readers) -->
    <div class="error-banner" 
         th:if="${error}" 
         role="alert" 
         aria-live="assertive" 
         aria-atomic="true">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" aria-describedby="loginDesc">

        <!-- Email Field -->
        <div class="form-control-wrap">
            <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
            <input type="text"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="Email address"
                   autocomplete="username"
                   required
                   autofocus
                   aria-required="true"
                   aria-label="Email address">
        </div>

        <!-- Password Field -->
        <div class="form-control-wrap">
            <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Password"
                   autocomplete="current-password"
                   required
                   aria-required="true"
                   aria-label="Password">

            <!-- Password Toggle with ARIA -->
            <button type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false"
                    aria-controls="password"
                    title="Show password">
                <i class="fa-solid fa-eye" id="toggleIcon" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Branch Selector Field -->
        <div class="form-control-wrap">
            <i class="fa-solid fa-store input-icon" aria-hidden="true"></i>
            <select class="form-control"
                    id="branchId"
                    name="branch_id"
                    required
                    aria-required="true"
                    aria-label="Select Branch Location">
                <option value="" disabled selected>Select Branch</option>
                <option th:each="b : ${branches}"
                        th:if="${b.branch_id != 'deleted'}"
                        th:value="${b.branch_id}"
                        th:text="${b.name}">
                </option>
            </select>
            <i class="fa-solid fa-chevron-down select-arrow" aria-hidden="true"></i>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                class="btn btn-primary-login" 
                aria-label="Log in to employee portal">
            <span class="btn-cup" aria-hidden="true">☕</span>
            Login
        </button>
    </form>

    <!-- Footer -->
    <footer class="login-footer" role="contentinfo">
        <i class="fa-solid fa-mug-hot" aria-hidden="true"></i>
        <span>Coffee House Employee Portal</span>
    </footer>

</main>

<!-- =========================================================
     JAVASCRIPT
========================================================= -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        /* Falling Coffee Bean Animation */
        const rain = document.getElementById("coffee-rain");
        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (!prefersReduced && rain) {
            function makeBean(initial = false) {
                if (document.hidden) return;

                const bean = document.createElement("span");
                bean.className = "coffee-bean";
                bean.setAttribute("aria-hidden", "true");

                const size = 6 + Math.random() * 7;
                const duration = 7 + Math.random() * 5;

                bean.style.width = size + "px";
                bean.style.height = (size * 1.45) + "px";
                bean.style.left = (Math.random() * 100) + "vw";

                bean.style.setProperty("--drift1", ((Math.random() * 80) - 40) + "px");
                bean.style.setProperty("--drift2", ((Math.random() * 130) - 65) + "px");
                bean.style.setProperty("--rot", ((Math.random() * 80) - 40) + "deg");
                bean.style.setProperty("--duration", duration + "s");
                bean.style.setProperty("--delay", initial ? (-Math.random() * duration) + "s" : "0s");

                rain.appendChild(bean);

                setTimeout(() => bean.remove(), (duration + .5) * 1000);
            }

            for (let i = 0; i < 18; i++) {
                makeBean(true);
            }

            setInterval(() => makeBean(false), 650);
        }

        /* Password Visibility Toggle with ARIA updates */
        const toggleBtn = document.getElementById("togglePassword");
        const toggleIcon = document.getElementById("toggleIcon");
        const passwordInput = document.getElementById("password");

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener("click", function () {
                const isPassword = passwordInput.type === "password";
                passwordInput.type = isPassword ? "text" : "password";

                toggleIcon.classList.toggle("fa-eye", !isPassword);
                toggleIcon.classList.toggle("fa-eye-slash", isPassword);

                const newLabel = isPassword ? "Hide password" : "Show password";
                toggleBtn.setAttribute("aria-label", newLabel);
                toggleBtn.setAttribute("aria-pressed", isPassword ? "true" : "false");
                toggleBtn.title = newLabel;
            });
        }

    });
</script>

</body>
</html>
