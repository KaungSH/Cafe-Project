<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Employee Login | Coffee House</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet">

<style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --espresso: #120904;
        --dark-coffee: #1d0d07;
        --coffee: #3a1b0f;
        --coffee-light: #704127;

        --caramel: #c8874a;
        --gold: #e4ad72;
        --cream: #fff8ef;
        --cream-muted: #d7c0ac;

        --input-bg: rgba(255, 255, 255, 0.055);
        --border: rgba(255, 235, 215, 0.13);
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

   body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 18px;

    font-family: 'DM Sans', sans-serif;
    color: var(--cream);

    background:
        linear-gradient(
            115deg,
            rgba(20, 9, 4, 0.35),
            rgba(50, 25, 14, 0.20),
            rgba(15, 7, 3, 0.35)
        ),
        url('/images/welcome page.png') center / cover no-repeat;

    position: relative;
    overflow: hidden;
}

    /* Dark cinematic overlay */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 190, 120, 0.08),
            transparent 55%
        );

    pointer-events: none;
    z-index: 0;
}


    /* =========================================================
       DECORATIVE LIGHTS
    ========================================================= */

    .glow {
        position: fixed;
        width: 420px;
        height: 420px;

        border-radius: 50%;

        filter: blur(100px);
        opacity: 0.13;

        pointer-events: none;
        z-index: 0;
    }

    .glow-one {
        background: #d88a4d;
        top: -180px;
        left: -120px;
    }

    .glow-two {
        background: #7c3f20;
        bottom: -220px;
        right: -120px;
    }


    /* =========================================================
       COFFEE BEANS
    ========================================================= */

    #coffee-rain {
        position: fixed;
        inset: 0;

        overflow: hidden;
        pointer-events: none;

        z-index: 1;
    }

    .coffee-bean {
        position: absolute;

        top: -40px;

        width: 9px;
        height: 14px;

        border-radius: 50% 45% 50% 45%;

        background:
            linear-gradient(
                135deg,
                #160803 0%,
                #633019 50%,
                #210a04 100%
            );

        opacity: 0.35;

        box-shadow:
            inset -2px -2px 3px rgba(0, 0, 0, 0.5);

        animation:
            beanFall var(--duration) linear var(--delay) forwards;
    }

    .coffee-bean::after {
        content: "";

        position: absolute;

        left: 50%;
        top: 1px;

        width: 2px;
        height: 11px;

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.25);

        transform: translateX(-50%) rotate(10deg);
    }

    @keyframes beanFall {

        0% {
            top: -50px;
            transform:
                translateX(0)
                rotate(var(--rot))
                scale(.7);

            opacity: 0;
        }

        15% {
            opacity: .4;
        }

        50% {
            top: 50vh;

            transform:
                translateX(var(--drift1))
                rotate(190deg);
        }

        100% {
            top: 110vh;

            transform:
                translateX(var(--drift2))
                rotate(430deg)
                scale(.9);

            opacity: 0;
        }
    }


    /* =========================================================
       LOGIN CARD
    ========================================================= */

    .login-card {
    position: relative;
    z-index: 5;

    width: min(440px, 100%);

    padding: 42px 38px 38px;

    text-align: center;

    border: 1px solid rgba(255, 238, 220, 0.16);

    border-radius: 30px;

    /* Transparent glass background */
    background: rgba(30, 14, 8, 0.22);

    /* Make background visible through the card */
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);

    overflow: hidden;

    animation: cardAppear .7s ease-out;
}

    .login-card::before {

        content: "";

        position: absolute;

        width: 300px;
        height: 300px;

        top: -190px;
        left: 50%;

        transform: translateX(-50%);

        background:
            radial-gradient(
                circle,
                rgba(221, 144, 78, 0.26),
                transparent 70%
            );

        filter: blur(25px);

        pointer-events: none;
    }

    .login-card::after {

        content: "";

        position: absolute;

        left: 12%;
        right: 12%;
        bottom: 0;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(228, 173, 114, 0.5),
                transparent
            );
    }

    @keyframes cardAppear {

        from {
            opacity: 0;
            transform: translateY(22px) scale(.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .coffee-logo {

        position: relative;

        width: 82px;
        height: 82px;

        margin: 0 auto 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background:
            linear-gradient(
                145deg,
                #754021,
                #2a0d06
            );

        border: 1px solid rgba(228, 173, 114, 0.35);

        box-shadow:
            0 0 0 7px rgba(216, 139, 77, 0.07),
            0 16px 35px rgba(0, 0, 0, 0.42);

        animation: logoFloat 4s ease-in-out infinite;
    }

    .coffee-logo .cup {

        font-size: 34px;

        color: #fff8ef;

        filter:
            drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));

        animation: cupSway 3.5s ease-in-out infinite;
    }

    .steam {

        position: absolute;

        top: 12px;

        width: 3px;
        height: 18px;

        border-left: 2px solid rgba(255, 241, 225, 0.65);

        border-radius: 50%;

        animation: steam 2.4s ease-in-out infinite;
    }

    .steam.s1 {
        left: 30px;
    }

    .steam.s2 {
        left: 40px;
        height: 17px;
        animation-delay: .45s;
    }

    .steam.s3 {
        left: 50px;
        height: 19px;
        animation-delay: .9s;
    }

    @keyframes logoFloat {

        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-5px);
        }
    }

    @keyframes cupSway {

        0%, 100% {
            transform: rotate(-3deg);
        }

        50% {
            transform: rotate(3deg);
        }
    }

    @keyframes steam {

        0% {
            opacity: 0;
            transform:
                translateY(5px)
                scale(.8);
        }

        35% {
            opacity: .8;
        }

        100% {
            opacity: 0;
            transform:
                translateY(-15px)
                translateX(4px)
                scale(1.1);
        }
    }


    /* =========================================================
       TITLE
    ========================================================= */

    .brand-small {

        margin-bottom: 7px;

        color: var(--gold);

        font-size: 11px;
        font-weight: 700;

        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .login-title {

        margin: 0;

        font-family: 'Playfair Display', serif;

        font-size: clamp(2rem, 5vw, 2.45rem);

        font-weight: 700;

        line-height: 1.15;

        color: #fffaf5;

        letter-spacing: -.5px;
    }

    .login-subtitle {

        margin: 9px 0 27px;

        color: var(--cream-muted);

        font-size: .88rem;

        line-height: 1.6;
    }


    /* =========================================================
       ERROR
    ========================================================= */

    .error-banner {

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 9px;

        margin-bottom: 18px;

        padding: 11px 14px;

        border-radius: 13px;

        background: rgba(220, 53, 69, .12);

        border: 1px solid rgba(220, 53, 69, .28);

        color: #ffb7bd;

        font-size: .82rem;
        font-weight: 500;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .form-control-wrap {

        position: relative;

        margin-bottom: 15px;
    }

    .form-control-wrap .input-icon {

        position: absolute;

        left: 17px;
        top: 50%;

        transform: translateY(-50%);

        color: var(--gold);

        font-size: .9rem;

        z-index: 2;

        pointer-events: none;
    }

    .form-control-wrap .toggle-password {

        position: absolute;

        right: 16px;
        top: 50%;

        transform: translateY(-50%);

        color: #9e8979;

        cursor: pointer;

        z-index: 3;

        padding: 7px;

        transition: .2s ease;
    }

    .form-control-wrap .toggle-password:hover {

        color: var(--gold);

        transform:
            translateY(-50%)
            scale(1.08);
    }

    .form-control-wrap .select-arrow {

        position: absolute;

        right: 18px;
        top: 50%;

        transform: translateY(-50%);

        color: var(--gold);

        pointer-events: none;

        font-size: .75rem;

        z-index: 2;
    }

    .form-control {

        width: 100%;
        height: 54px;

        padding:
            0 46px;

        border-radius: 15px;

        border: 1px solid var(--border);

        outline: none;

        color: #fffaf5 !important;

        font-family: 'DM Sans', sans-serif;

        font-size: .9rem;

        background:
            rgba(7, 3, 2, .42) !important;

        box-shadow:
            inset 0 1px 7px rgba(0, 0, 0, .2);

        transition:
            border-color .25s ease,
            box-shadow .25s ease,
            background .25s ease,
            transform .2s ease;
    }

    .form-control:hover {

        border-color:
            rgba(228, 173, 114, .28);
    }

    .form-control:focus {

        border-color: var(--gold);

        background:
            rgba(7, 3, 2, .58) !important;

        box-shadow:
            0 0 0 3px rgba(228, 173, 114, .10),
            0 8px 20px rgba(0, 0, 0, .18);

        transform: translateY(-1px);
    }

    .form-control::placeholder {

        color: #9f8878;

        opacity: 1;
    }

    select.form-control {

        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;

        cursor: pointer;
    }

    select.form-control option {

        background: #1d0d07;

        color: #fff8ef;

        padding: 10px;
    }

    /* Chrome autofill */

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {

        -webkit-text-fill-color: #fff8ef !important;

        -webkit-box-shadow:
            0 0 0 1000px #1b0c07 inset !important;

        transition:
            background-color 9999s ease-in-out 0s;
    }


    /* =========================================================
       LOGIN BUTTON
    ========================================================= */

    .btn-primary-login {

        position: relative;

        width: 100%;
        height: 54px;

        margin-top: 10px;

        border: none;

        border-radius: 15px;

        overflow: hidden;

        background:
            linear-gradient(
                135deg,
                #a85d2d 0%,
                #d99857 100%
            );

        color: #fffaf5;

        font-size: .94rem;
        font-weight: 700;

        letter-spacing: .4px;

        box-shadow:
            0 12px 25px rgba(160, 79, 31, .25),
            inset 0 1px 0 rgba(255, 255, 255, .25);

        transition:
            transform .2s ease,
            box-shadow .2s ease,
            filter .2s ease;
    }

    .btn-primary-login::before {

        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 70%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, .22),
                transparent
            );

        transform: skewX(-20deg);

        transition: left .6s ease;
    }

    .btn-primary-login:hover {

        color: white;

        transform: translateY(-2px);

        filter: brightness(1.06);

        box-shadow:
            0 16px 32px rgba(160, 79, 31, .36);
    }

    .btn-primary-login:hover::before {

        left: 140%;
    }

    .btn-primary-login:active {

        transform: translateY(0);

        box-shadow:
            0 7px 15px rgba(160, 79, 31, .25);
    }

    .btn-cup {

        display: inline-block;

        margin-right: 7px;

        animation:
            buttonCup 2s ease-in-out infinite;
    }

    @keyframes buttonCup {

        0%, 100% {
            transform: rotate(-5deg);
        }

        50% {
            transform: rotate(5deg) translateY(-1px);
        }
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .login-footer {

        margin-top: 23px;

        color: #806d5e;

        font-size: .72rem;

        letter-spacing: .2px;
    }

    .login-footer i {

        color: #a66b3d;

        margin-right: 4px;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 480px) {

        body {
            padding: 20px 14px;
        }

        .login-card {

            padding:
                34px 20px 28px;

            border-radius: 24px;
        }

        .coffee-logo {

            width: 74px;
            height: 74px;

            margin-bottom: 18px;
        }

        .coffee-logo .cup {
            font-size: 30px;
        }

        .login-title {
            font-size: 1.9rem;
        }

        .login-subtitle {
            margin-bottom: 23px;
        }

        .form-control,
        .btn-primary-login {
            height: 50px;
        }
    }


    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {

            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;

            scroll-behavior: auto !important;
        }
    }

</style>

</head>

<body>

<!-- Decorative glow -->

<div class="glow glow-one"></div>
<div class="glow glow-two"></div>

<!-- Falling coffee beans -->

<div id="coffee-rain" aria-hidden="true"></div>

<!-- =========================================================
     LOGIN CARD
========================================================= -->

<main class="login-card">

```
<!-- Coffee Logo -->
<div class="coffee-logo" aria-label="Coffee Shop">

    <span class="steam s1"></span>
    <span class="steam s2"></span>
    <span class="steam s3"></span>

    <i class="fa-solid fa-mug-hot cup"></i>

</div>


<!-- Brand -->
<div class="brand-small">
    Coffee House
</div>


<!-- Title -->
<h1 class="login-title">
    Employee Login
</h1>


<!-- Subtitle -->
<p class="login-subtitle">
    Welcome back. Start your shift with a perfect cup of coffee.
</p>


<!-- Error -->
<div class="error-banner"
     th:if="${error}"
     role="alert">

    <i class="fa-solid fa-circle-exclamation"></i>

    <span th:text="${error}"></span>

</div>


<!-- =====================================================
     LOGIN FORM
====================================================== -->

<form th:action="@{/login}" method="post">


    <!-- Email -->

    <div class="form-control-wrap">

        <i class="fa-solid fa-envelope input-icon"></i>

        <input
                type="text"
                class="form-control"
                id="email"
                name="email"
                placeholder="Email address"
                autocomplete="username"
                required
                autofocus>

    </div>


    <!-- Password -->

    <div class="form-control-wrap">

        <i class="fa-solid fa-lock input-icon"></i>

        <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

        <i
                class="fa-solid fa-eye toggle-password"
                id="togglePassword"
                role="button"
                tabindex="0"
                aria-label="Show password"
                title="Show password">
        </i>

    </div>


    <!-- Branch -->

    <div class="form-control-wrap">

        <i class="fa-solid fa-store input-icon"></i>

        <select
                class="form-control"
                id="branchId"
                name="branch_id"
                required>

            <option
                    value=""
                    disabled
                    selected>
                Select Branch
            </option>

            <option
                    th:each="b : ${branches}"
                    th:if="${b.branch_id != 'deleted'}"
                    th:value="${b.branch_id}"
                    th:text="${b.name}">
            </option>

        </select>

        <i class="fa-solid fa-chevron-down select-arrow"></i>

    </div>


    <!-- Login -->

    <button
            type="submit"
            class="btn btn-primary-login">

        <span class="btn-cup">☕</span>

        Login

    </button>

</form>


<!-- Footer -->

<div class="login-footer">

    <i class="fa-solid fa-mug-hot"></i>

    Coffee House Employee Portal

</div>
```

</main>

<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    document.addEventListener("DOMContentLoaded", function () {


        /* =====================================================
           COFFEE BEAN ANIMATION
        ====================================================== */

        const rain =
            document.getElementById("coffee-rain");

        const prefersReduced =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;


        if (!prefersReduced && rain) {

            function makeBean(initial = false) {

                if (document.hidden) return;


                const bean =
                    document.createElement("span");

                bean.className =
                    "coffee-bean";


                const size =
                    6 + Math.random() * 7;

                const duration =
                    7 + Math.random() * 5;


                bean.style.width =
                    size + "px";

                bean.style.height =
                    (size * 1.45) + "px";


                bean.style.left =
                    (Math.random() * 100) + "vw";


                bean.style.setProperty(
                    "--drift1",
                    ((Math.random() * 80) - 40) + "px"
                );


                bean.style.setProperty(
                    "--drift2",
                    ((Math.random() * 130) - 65) + "px"
                );


                bean.style.setProperty(
                    "--rot",
                    ((Math.random() * 80) - 40) + "deg"
                );


                bean.style.setProperty(
                    "--duration",
                    duration + "s"
                );


                bean.style.setProperty(
                    "--delay",
                    initial
                        ? (-Math.random() * duration) + "s"
                        : "0s"
                );


                rain.appendChild(bean);


                setTimeout(
                    () => bean.remove(),
                    (duration + .5) * 1000
                );
            }


            /* Initial beans */

            for (let i = 0; i < 18; i++) {
                makeBean(true);
            }


            /* New beans */

            setInterval(
                () => makeBean(false),
                650
            );
        }


        /* =====================================================
           PASSWORD TOGGLE
        ====================================================== */

        const toggle =
            document.getElementById("togglePassword");

        const password =
            document.getElementById("password");


        if (toggle && password) {

            function togglePassword() {

                const show =
                    password.type === "password";


                password.type =
                    show ? "text" : "password";


                toggle.classList.toggle(
                    "fa-eye",
                    !show
                );

                toggle.classList.toggle(
                    "fa-eye-slash",
                    show
                );


                toggle.title =
                    show
                        ? "Hide password"
                        : "Show password";


                toggle.setAttribute(
                    "aria-label",
                    show
                        ? "Hide password"
                        : "Show password"
                );
            }


            toggle.addEventListener(
                "click",
                togglePassword
            );


            /* Keyboard accessibility */

            toggle.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        togglePassword();
                    }
                }
            );
        }

    });

</script>
