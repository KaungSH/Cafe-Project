<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar_admin" class="cafe-sidebar admin-sidebar">

<!-- ================= BRAND / LOGO ================= -->
<div class="cafe-brand text-center pt-3 pb-2 px-2 d-flex flex-column align-items-center justify-content-center">
    <div class="cafe-brand-name fw-bold fs-4 text-warning text-nowrap d-flex align-items-center justify-content-center">
        <i class="bi bi-cup-hot-fill me-2 fs-5"></i>
        <span>Café Luft</span>
    </div>

    <div class="cafe-role mt-1">
        <span class="badge rounded-pill bg-dark bg-opacity-75 text-warning border border-warning-subtle px-2 py-1" 
              style="font-size: 11px; letter-spacing: 1px;">
            <i class="bi bi-shield-lock-fill me-1"></i>
            <span th:text="${session.employeeRole != null ? session.employeeRole : 'ADMIN'}">ADMIN</span>
        </span>
    </div>
</div>

<!-- ================= USER PROFILE CARD ================= -->
<div class="cafe-profile-card px-3 py-2 mb-2">
    <!-- Manager အတွက် /manager/profile သို့ ညွှန်းပါ -->
    <a th:href="@{/admin/profile}" 
       class="d-flex align-items-center text-decoration-none p-2 rounded-3"
       style="background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.2s ease;">
        
        <div class="position-relative me-2 flex-shrink-0">
            <img th:src="${session.employeeImage != null ? session.employeeImage : '/images/profile.jpg'}" 
                 src="/images/profile.jpg" 
                 alt="Profile Photo"
                 class="rounded-circle border border-warning"
                 style="width: 40px; height: 40px; object-fit: cover;">
            <span class="position-absolute bottom-0 end-0 bg-success border border-dark rounded-circle" 
                  style="width: 10px; height: 10px;"></span>
        </div>

        <div class="overflow-hidden flex-grow-1">
            <div class="fw-semibold text-truncate text-white" style="font-size: 14px;"
                 th:text="${session.employeeName != null ? session.employeeName : 'Admin'}">
                Admin
            </div>
            <small class="text-white-50 d-flex align-items-center" style="font-size: 11px;">
                Edit Profile <i class="bi bi-chevron-right ms-1" style="font-size: 9px;"></i>
            </small>
        </div>
    </a>
</div>

    <!-- ================= MENU ================= -->
    <div class="cafe-menu">
        <!-- HOME -->
        <a th:href="@{/}" class="cafe-menu-item">
            <i class="bi bi-house"></i>
            <span>Home</span>
            
        </a>

        <!-- EMPLOYEES -->
        <a th:href="@{/admin/employee}" class="cafe-menu-item">
            <i class="bi bi-person-badge"></i>
            <span>Employees</span>
        </a>

        <!-- DAILY REGISTERS -->
        <a th:href="@{/admin/daily-registers}" class="cafe-menu-item">
            <i class="bi bi-journal-bookmark"></i>
            <span>Daily Registers</span>
        </a>

        <!-- DISCOUNTS -->
        <a th:href="@{/admin/discounts}" class="cafe-menu-item">
            <i class="bi bi-percent"></i>
            <span>Discounts</span>
        </a>

        <!-- CATEGORIES -->
        <a th:href="@{/admin/categories}" class="cafe-menu-item">
            <i class="bi bi-grid"></i>
            <span>Categories</span>
        </a>

        <!-- BRANCHES -->
        <a th:href="@{/admin/branches}" class="cafe-menu-item">
            <i class="bi bi-shop"></i>
            <span>Branches</span>
        </a>

        <!-- EXPENSES -->
        <a th:href="@{/admin/expenses}" class="cafe-menu-item">
            <i class="bi bi-cash-coin"></i>
            <span>Expenses</span>
        </a>

        <!-- INGREDIENT BATCHES -->
        <a th:href="@{/admin/ingredientBatches}" class="cafe-menu-item">
            <i class="bi bi-boxes"></i>
            <span>IngredientBatches</span>
        </a>

        <!-- AUDIENCE -->
        <a th:href="@{/admin/types/audience}" class="cafe-menu-item">
            <i class="bi bi-people"></i>
            <span>Audience</span>
        </a>

        <!-- PROMO -->
        <a th:href="@{/admin/types/promo}" class="cafe-menu-item">
            <i class="bi bi-megaphone"></i>
            <span>Promo</span>
        </a>

        <!-- EXPENSE CATEGORIES -->
        <a th:href="@{/admin/expensecategories}" class="cafe-menu-item">
            <i class="bi bi-tags"></i>
            <span>Expense Categories</span>
        </a>

        <!-- INGREDIENT TYPE -->
        <a th:href="@{/admin/ingredientType}" class="cafe-menu-item">
            <i class="bi bi-basket3"></i>
            <span>Ingredient Type</span>
        </a>

        <!-- ORDER DETAILS -->
        <a th:href="@{/admin/order-with-details}" class="cafe-menu-item">
            <i class="bi bi-receipt-cutoff"></i>
            <span>Order Details</span>
        </a>

        <!-- PAYMENTS -->
        <a th:href="@{/payments}" class="cafe-menu-item">
            <i class="bi bi-wallet2"></i>
            <span>Payments</span>
        </a>

        <!-- PAY METHOD -->
        <a th:href="@{/admin/paymethod}" class="cafe-menu-item">
            <i class="bi bi-credit-card-2-front"></i>
            <span>PayMethod</span>
        </a>

        <!-- PRODUCTS -->
        <a th:href="@{/admin/products}" class="cafe-menu-item">
            <i class="bi bi-cup-hot"></i>
            <span>Products</span>
        </a>

        <!-- SIZES -->
        <a th:href="@{/admin/sizes}" class="cafe-menu-item">
            <i class="bi bi-aspect-ratio"></i>
            <span>Sizes</span>
        </a>

        <!-- UNITS -->
        <a th:href="@{/admin/units}" class="cafe-menu-item">
            <i class="bi bi-speedometer2"></i>
            <span>Units</span>
        </a>

        <!-- STATUSES -->
        <a th:href="@{/admin/statuses}" class="cafe-menu-item">
            <i class="bi bi-toggle-on"></i>
            <span>Statuses</span>
        </a>

        <!-- SUPPLIERS -->
        <a th:href="@{/admin/suppliers}" class="cafe-menu-item">
            <i class="bi bi-truck"></i>
            <span>Suppliers</span>
        </a>

        <!-- WASTE LOGS -->
        <a th:href="@{/admin/wastelogs}" class="cafe-menu-item">
            <i class="bi bi-trash3"></i>
            <span>Waste Logs</span>
        </a>
    </div>

    <!-- ================= DIVIDER ================= -->
    <div class="cafe-divider"></div>

    <!-- ================= LOGOUT ================= -->
    <div class="cafe-bottom-menu">
        <a style="color:red" th:href="@{/logout}" class="cafe-menu-item logout-item">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log out</span>
        </a>
    </div>
</div>
</body>
</html>
