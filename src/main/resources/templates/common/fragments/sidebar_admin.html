<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar_admin" class="cafe-sidebar admin-sidebar">

<!-- ================= BRAND ================= -->
    <div class="cafe-brand">
        <div class="cafe-brand-icon admin-icon">
            <i class="bi bi-cup-hot-fill"></i>
        </div>
        <div>
             <img th:if="${session.loggedInUser != null}" 
			 th:src="@{'/images/' + ${session.loggedInUser.photopath}}"
			 alt="Thumbnail Error" 
			 style="height: 30px; width: 30px; object-fit: cover; border-radius: 100%;" class = "shadow-lg">
			 <span th:text="${session.loggedInUser != null ? session.loggedInUser.employee_name : 'Staff Name'}" style = "color:#c77b3b"></span>
            
            <div class="cafe-role">
                <i class="bi bi-shield-lock-fill"></i>
               ADMIN
            </div>
            <div class="dropdown">
            <a href="#" class="staff-profile-dropdown dropdown-toggle text-decoration-none d-flex align-items-center gap-2" id="staffUserDropdown" data-bs-toggle="dropdown" aria-expanded="false" style = "color:#c77b3b">
            Profile
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="staffUserDropdown" style="background: #fffaf5;">
                <li><a class="dropdown-item py-2 px-3 text-dark fw-medium" th:href="@{/changeprofile}"><i class="bi bi-person me-2 text-warning"></i> Change Profile</a></li>
                <li><a class="dropdown-item py-2 px-3 text-dark fw-medium" th:href="@{/changepassword}"><i class="bi bi-person me-2 text-warning"></i> Change Password</a></li>
                <li><hr class="dropdown-divider bg-light"></li>
                <li><a class="dropdown-item py-2 px-3 text-danger fw-medium" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
            </ul>
        </div>
        </div>
    </div>

    <!-- ================= MENU ================= -->
    <div class="cafe-menu">
        <!-- HOME -->
        <a th:href="@{/}" class="cafe-menu-item">
            <i class="bi bi-house"></i>
            <span>Home</span>
            
        </a>

        <!-- EMPLOYEES -->
        <a th:href="@{/admin/employee}" class="cafe-menu-item">
            <i class="bi bi-person-badge"></i>
            <span>Employees</span>
        </a>

        <!-- DAILY REGISTERS -->
        <a th:href="@{/admin/daily-registers}" class="cafe-menu-item">
            <i class="bi bi-journal-bookmark"></i>
            <span>Daily Registers</span>
        </a>

        <!-- DISCOUNTS -->
        <a th:href="@{/admin/discounts}" class="cafe-menu-item">
            <i class="bi bi-percent"></i>
            <span>Discounts</span>
        </a>

        <!-- CATEGORIES -->
        <a th:href="@{/admin/categories}" class="cafe-menu-item">
            <i class="bi bi-grid"></i>
            <span>Categories</span>
        </a>

        <!-- BRANCHES -->
        <a th:href="@{/admin/branches}" class="cafe-menu-item">
            <i class="bi bi-shop"></i>
            <span>Branches</span>
        </a>

        <!-- EXPENSES -->
        <a th:href="@{/admin/expenses}" class="cafe-menu-item">
            <i class="bi bi-cash-coin"></i>
            <span>Expenses</span>
        </a>

        <!-- INGREDIENT BATCHES -->
        <a th:href="@{/admin/ingredientBatches}" class="cafe-menu-item">
            <i class="bi bi-boxes"></i>
            <span>IngredientBatches</span>
        </a>

        <!-- AUDIENCE -->
        <a th:href="@{/admin/types/audience}" class="cafe-menu-item">
            <i class="bi bi-people"></i>
            <span>Audience</span>
        </a>

        <!-- PROMO -->
        <a th:href="@{/admin/types/promo}" class="cafe-menu-item">
            <i class="bi bi-megaphone"></i>
            <span>Promo</span>
        </a>

        <!-- EXPENSE CATEGORIES -->
        <a th:href="@{/admin/expensecategories}" class="cafe-menu-item">
            <i class="bi bi-tags"></i>
            <span>Expense Categories</span>
        </a>

        <!-- INGREDIENT TYPE -->
        <a th:href="@{/admin/ingredientType}" class="cafe-menu-item">
            <i class="bi bi-basket3"></i>
            <span>Ingredient Type</span>
        </a>

        <!-- ORDER DETAILS -->
        <a th:href="@{/admin/order-with-details}" class="cafe-menu-item">
            <i class="bi bi-receipt-cutoff"></i>
            <span>Order Details</span>
        </a>

        <!-- PAYMENTS -->
        <a th:href="@{/payments}" class="cafe-menu-item">
            <i class="bi bi-wallet2"></i>
            <span>Payments</span>
        </a>

        <!-- PAY METHOD -->
        <a th:href="@{/admin/paymethod}" class="cafe-menu-item">
            <i class="bi bi-credit-card-2-front"></i>
            <span>PayMethod</span>
        </a>

        <!-- PRODUCTS -->
        <a th:href="@{/admin/products}" class="cafe-menu-item">
            <i class="bi bi-cup-hot"></i>
            <span>Products</span>
        </a>

        <!-- SIZES -->
        <a th:href="@{/admin/sizes}" class="cafe-menu-item">
            <i class="bi bi-aspect-ratio"></i>
            <span>Sizes</span>
        </a>

        <!-- UNITS -->
        <a th:href="@{/admin/units}" class="cafe-menu-item">
            <i class="bi bi-speedometer2"></i>
            <span>Units</span>
        </a>

        <!-- STATUSES -->
        <a th:href="@{/admin/statuses}" class="cafe-menu-item">
            <i class="bi bi-toggle-on"></i>
            <span>Statuses</span>
        </a>

        <!-- SUPPLIERS -->
        <a th:href="@{/admin/suppliers}" class="cafe-menu-item">
            <i class="bi bi-truck"></i>
            <span>Suppliers</span>
        </a>

        <!-- WASTE LOGS -->
        <a th:href="@{/admin/wastelogs}" class="cafe-menu-item">
            <i class="bi bi-trash3"></i>
            <span>Waste Logs</span>
        </a>
    </div>

    <!-- ================= DIVIDER ================= -->
    <div class="cafe-divider"></div>

    <!-- ================= LOGOUT ================= -->
    <div class="cafe-bottom-menu">
        <a style="color:red" th:href="@{/logout}" class="cafe-menu-item logout-item">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log out</span>
        </a>
    </div>
</div>
</body>
</html>
