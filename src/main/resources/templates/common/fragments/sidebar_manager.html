<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="sidebar_manager" class="cafe-sidebar manager-sidebar">

    <!-- ================= BRAND ================= -->
    <div class="cafe-brand">
        <div class="cafe-brand-icon admin-icon">
            <i class="bi bi-cup-hot-fill"></i>
        </div>
        <div>
            <div class="cafe-brand-name">
                Café <span>Shop</span>
            </div>
            <div class="cafe-role">
                <i class="bi bi-shield-lock-fill"></i>
               MANAGER
            </div>
        </div>
    </div>

    <!-- ================= MENU ================= -->
    <div class="cafe-menu">
        <!-- HOME -->
        <a style="color:Orange" th:href="@{/}" class="cafe-menu-item">
            <i class="bi bi-house"></i>
            <span>Home</span>
        </a>

        <!-- AUDIENCE / CUSTOMERS -->
        <a style="color:Orange" th:href="@{/manager-only/types/audience}" class="cafe-menu-item">
            <i class="bi bi-people"></i>
            <span>Audience</span>
        </a>

        <!-- PROMOTIONS -->
        <a style="color:Orange" th:href="@{/manager-only/types/promo}" class="cafe-menu-item">
            <i class="bi bi-megaphone"></i>
            <span>Promo</span>
        </a>

        <!-- EXPENSE CATEGORIES -->
        <a style="color:Orange" th:href="@{/manager-only/expensecategory}" class="cafe-menu-item">
            <i class="bi bi-tags"></i>
            <span>Expense Categories</span>
        </a>

        <!-- SIZES (CUP / PORTION SIZES) -->
        <a style="color:Orange" th:href="@{/manager-only/sizes}" class="cafe-menu-item">
            <i class="bi bi-aspect-ratio"></i>
            <span>Sizes</span>
        </a>

        <!-- PAYMENT METHOD -->
        <a style="color:Orange" th:href="@{/manager-only/paymethod}" class="cafe-menu-item">
            <i class="bi bi-credit-card-2-front"></i>
            <span>Pay Method</span>
        </a>

        <!-- UNITS (KG, G, ML, PIECES) -->
        <a style="color:Orange" th:href="@{/manager-only/units}" class="cafe-menu-item">
            <i class="bi bi-speedometer2"></i>
            <span>Units</span>
        </a>

        <!-- INGREDIENT TYPES -->
        <a style="color:Orange" th:href="@{/manager-only/ingredient-types}" class="cafe-menu-item">
            <i class="bi bi-basket3"></i>
            <span>Ingredient Types</span>
        </a>

        <!-- SUPPLIERS / VENDORS -->
        <a style="color:Orange" th:href="@{/manager-only/suppliers}" class="cafe-menu-item">
            <i class="bi bi-truck"></i>
            <span>Suppliers</span>
        </a>

        <!-- BRANCHES STATS / ANALYTICS -->
        <a style="color:Orange" th:href="@{/manager-only/branches-stats}" class="cafe-menu-item">
            <i class="bi bi-bar-chart-line"></i>
            <span>Branches Stats</span>
        </a>

        <!-- PRODUCT CATEGORIES -->
        <a style="color:Orange" th:href="@{/manager-only/categories}" class="cafe-menu-item">
            <i class="bi bi-grid"></i>
            <span>Categories</span>
        </a>

        <!-- DAILY REGISTER / CASH REGISTER -->
        <a style="color:Orange" th:href="@{/manager-only/daily-register/all}" class="cafe-menu-item">
            <i class="bi bi-journal-bookmark"></i>
            <span>Daily Register</span>
        </a>

        <!-- DISCOUNT -->
        <a style="color:Orange" th:href="@{/manager-only/discount}" class="cafe-menu-item">
            <i class="bi bi-percent"></i>
            <span>Discount</span>
        </a>

        <!-- EMPLOYEE / STAFF -->
        <a style="color:Orange" th:href="@{/manager-only/employee}" class="cafe-menu-item">
            <i class="bi bi-person-badge"></i>
            <span>Employee</span>
        </a>

        <!-- EXPENSE / COSTS -->
        <a style="color:Orange" th:href="@{/manager-only/expense}" class="cafe-menu-item">
            <i class="bi bi-cash-coin"></i>
            <span>Expense</span>
        </a>

        <!-- INGREDIENT BATCHES / INVENTORY LOTS -->
        <a style="color:Orange" th:href="@{/manager-only/ingredient-Batches}" class="cafe-menu-item">
            <i class="bi bi-boxes"></i>
            <span>IngredientBatches</span>
        </a>

        <!-- ORDER WITH DETAILS -->
        <a style="color:Orange" th:href="@{/order-with-details}" class="cafe-menu-item">
            <i class="bi bi-receipt-cutoff"></i>
            <span>Order With Details</span>
        </a>

        <!-- PAYMENTS / TRANSACTIONS -->
        <a style="color:Orange" th:href="@{/payments}" class="cafe-menu-item">
            <i class="bi bi-wallet2"></i>
            <span>Payments</span>
        </a>

        <!-- PRODUCTS / MENU ITEMS -->
        <a style="color:Orange" th:href="@{/manager-only/products}" class="cafe-menu-item">
            <i class="bi bi-cup-straw"></i>
            <span>Products</span>
        </a>

        <!-- STOP IMPORT / CANCELLED SHIPMENTS -->
        <a style="color:Orange" th:href="@{/manager-only/stopimport}" class="cafe-menu-item">
            <i class="bi bi-slash-circle"></i>
            <span>StopImport</span>
        </a>

        <!-- WASTE LOGS -->
        <a style="color:Orange" th:href="@{/manager-only/wasteLogs}" class="cafe-menu-item">
            <i class="bi bi-trash3"></i>
            <span>WasteLogs</span>
        </a>

        <!-- WASTE REASONS -->
        <a style="color:Orange" th:href="@{/manager-only/waste-reasons}" class="cafe-menu-item">
            <i class="bi bi-question-circle"></i>
            <span>WasteReasons</span>
        </a>
    </div>

    <!-- ================= DIVIDER ================= -->
    <div class="cafe-divider"></div>

    <!-- ================= LOGOUT ================= -->
    <div class="cafe-bottom-menu">
        <a style="color:red" th:href="@{/logout}" class="cafe-menu-item logout-item">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log out</span>
        </a>
    </div>
</div>
</body>
</html>
