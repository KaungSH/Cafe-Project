<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Reason Architecture | Coffee Management</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --coffee-main: #5c3d2e;         /* Warm Dark Roast Coffee */
            --coffee-hover: #452b1f;
            --coffee-accent: #b88654;       /* Caramel Cream */
            --coffee-bg: #f9f6f0;           /* Soft Ivory Milk Foam */
            --coffee-card-border: #ebdcd0;
            --coffee-subtle: #f3ece4;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--coffee-bg);
            color: #3b2c24;
            margin: 0;
            padding: 0;
        }

        .lux-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid var(--coffee-card-border);
            box-shadow: 0 12px 35px rgba(92, 61, 46, 0.06);
            width: 100%;
        }

        .btn-coffee {
            background-color: var(--coffee-main);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 10px;
            padding: 9px 20px;
            border: none;
            transition: all 0.25s ease;
        }
        .btn-coffee:hover {
            background-color: var(--coffee-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(92, 61, 46, 0.25);
        }

        .table-coffee thead th {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #8c6f5d;
            font-weight: 700;
            padding: 1.15rem 1.4rem;
            background: #faf7f2;
            border-bottom: 1px solid var(--coffee-card-border);
        }

        .table-coffee tbody td {
            padding: 1.15rem 1.4rem;
            vertical-align: middle;
            border-bottom: 1px solid #f2ece4;
            font-size: 0.92rem;
        }

        .badge-id {
            background-color: var(--coffee-subtle);
            color: var(--coffee-main);
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            border: 1px solid #e3d3c5;
            display: inline-block;
            word-break: break-all;
        }

        .action-circle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e5d8cc;
            background: #ffffff;
            color: #796659;
            transition: all 0.2s ease;
        }
        .action-circle-btn:hover {
            color: var(--coffee-main);
            border-color: var(--coffee-accent);
            background-color: #faf5ee;
            transform: scale(1.05);
        }
        .action-circle-btn.delete-btn:hover {
            color: #c0392b;
            border-color: #f5b7b1;
            background-color: #fdedec;
        }

        .empty-icon-wrapper {
            width: 80px;
            height: 80px;
            background: #fbf5ee;
            border: 1px solid #eadbc9;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- container-fluid သုံးပြီး ဘေးနှင့် အပေါ်ကို မျက်နှာပြင်ပြည့် ဖြန့်ထားပါသည် -->
    <div layout:fragment="content" class="container-fluid px-4 py-4 w-100">
        <!-- Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="fs-4"><i class="bi bi-cup-hot-fill" style="color: var(--coffee-main);"></i></span>
                    <h3 class="fw-bold mb-0" style="color: var(--coffee-main);">Waste Reasons List</h3>
                </div>
                <p class="text-muted small mb-0">Manage and audit coffee waste, calibration, and stock loss.</p>
            </div>
            <a th:href="@{/manager/wastereasons/add}" class="btn btn-coffee mt-2 mt-sm-0">
                <i class="bi bi-plus-lg me-1"></i> Add Waste Reason
            </a>
        </div>

        <!-- Table Card -->
        <div class="lux-card overflow-hidden">
            <div class="table-responsive">
                <table class="table table-coffee table-hover mb-0 w-100">
                    <thead>
                        <tr>
                            <th style="width: 30%;">Reason ID</th>
                            <th>Reason Name</th>
                            <th class="text-end" style="width: 15%;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reasons}">
                            <td>
                                <span class="badge-id" th:text="${r.waste_reason_id}">WR-01</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-tag-fill small" style="color: var(--coffee-accent);"></i>
                                    <span class="fw-semibold text-dark" th:text="${r.reason_name}">Milk Expired</span>
                                </div>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/manager/wastereasons/edit/{id}(id=${r.waste_reason_id})}" 
                                   class="action-circle-btn me-1" 
                                   title="Edit">
                                    <i class="bi bi-pencil-fill fs-6"></i>
                                </a>
                                <a th:href="@{/manager/wastereasons/delete/{id}(id=${r.waste_reason_id})}" 
                                   class="action-circle-btn delete-btn" 
                                   title="Delete"
                                   onclick="return confirm('Are you sure you want to remove this waste reason?');">
                                    <i class="bi bi-trash3-fill fs-6"></i>
                                </a>
                            </td>
                        </tr>

                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(reasons)}">
                            <td colspan="3" class="text-center py-5">
                                <div class="py-4">
                                    <div class="empty-icon-wrapper mb-3">
                                        <i class="bi bi-archive fs-2" style="color: var(--coffee-accent);"></i>
                                    </div>
                                    <h5 class="fw-bold mb-1" style="color: var(--coffee-main);">No Waste Reasons Found</h5>
                                    <p class="text-muted small mx-auto mb-4" style="max-width: 320px;">
                                        There are currently no recorded loss indicators for this outlet.
                                    </p>
                                    <a th:href="@{/manager/wastereasons/add}" class="btn btn-coffee">
                                        <i class="bi bi-plus-circle me-1"></i> Add Waste Reason
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
