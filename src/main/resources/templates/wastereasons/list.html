<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Waste Reasons List</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="py-4 bg-light">
	<div class="container">
		<div class="card p-4 shadow-sm border-0 rounded-3">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h3 class="fw-bold text-secondary mb-0">Waste Reasons List</h3>
				<a th:href="@{/manager/wastereasons/add}" class="btn btn-primary">
					+ Add Waste Reason </a>
			</div>

			<table class="table table-borderless align-middle">
				<thead class="bg-light text-muted">
					<tr class="border-bottom">
						<th>Reason ID</th>
						<th>Reason Name</th>
						<th class="text-center">Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="r : ${reasons}" class="border-bottom">
						<td th:text="${r.waste_reason_id}" class="fw-bold">WR-01</td>
						<td th:text="${r.reason_name}">Expired</td>
						<td class="text-center"><a
							th:href="@{/manager/wastereasons/edit/{id}(id=${r.waste_reason_id})}"
							class="btn btn-sm btn-light border me-1">Edit</a> <a
							th:href="@{/manager/wastereasons/delete/{id}(id=${r.waste_reason_id})}"
							class="btn btn-sm btn-danger"
							onclick="return confirm('Are you sure want to this record?');">Delete</a>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(reasons)}">
						<td colspan="3" class="text-center text-muted py-4">No waste
							reason records found.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
