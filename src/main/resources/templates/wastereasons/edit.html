<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Waste Reason</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="py-4 bg-light">
	<div class="container">
		<div class="card p-4 shadow-sm border-0 rounded-3 mx-auto"
			style="max-width: 500px;">
			<h4 class="fw-bold text-secondary mb-4">Edit Waste Reason</h4>

			<form th:action="@{/manager/wastereasons/edit}" th:object="${reason}"
				method="post">
				<input type="hidden" th:field="*{waste_reason_id}">

				<div class="mb-3">
					<label class="form-label">Reason ID</label> <input type="text"
						class="form-control bg-light" th:value="${reason.waste_reason_id}"
						disabled>
				</div>

				<div class="mb-3">
					<label for="reason_name" class="form-label">Reason Name</label> <input
						type="text" class="form-control" id="reason_name"
						th:field="*{reason_name}" required>
				</div>

				<div class="d-flex justify-content-between align-items-center mt-4">
					<a th:href="@{/manager/wastereasons}" class="btn btn-light border">Cancel</a>
					<button type="submit" class="btn btn-primary px-4">Update</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
