<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Waste Reason | Coffee Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --coffee-main: #5c3d2e;
            --coffee-hover: #452b1f;
            --coffee-accent: #b88654;
            --coffee-bg: #f9f6f0;
            --coffee-card-border: #ebdcd0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--coffee-bg);
            color: #3b2c24;
        }

        .lux-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid var(--coffee-card-border);
            box-shadow: 0 12px 35px rgba(92, 61, 46, 0.06);
        }

        .form-control:focus {
            border-color: var(--coffee-accent);
            box-shadow: 0 0 0 0.25rem rgba(184, 134, 84, 0.2);
        }

        .btn-coffee {
            background-color: var(--coffee-main);
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            padding: 9px 24px;
        }
        .btn-coffee:hover {
            background-color: var(--coffee-hover);
            color: #ffffff;
        }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="card lux-card p-4 p-md-5 mx-auto" style="max-width: 520px;">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="p-2 rounded-3 text-white" style="background-color: var(--coffee-accent);">
                    <i class="bi bi-pencil-square fs-5"></i>
                </div>
                <div>
                    <h5 class="fw-bold mb-0" style="color: var(--coffee-main);">Edit Waste Reason</h5>
                    <p class="text-muted small mb-0">Update classification details.</p>
                </div>
            </div>

            <form th:action="@{/manager/wastereasons/edit}" th:object="${reason}" method="post">
                <input type="hidden" th:field="*{waste_reason_id}">

                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">REASON ID</label>
                    <input type="text" class="form-control bg-light py-2" 
                           th:value="${reason.waste_reason_id}" disabled>
                </div>

                <div class="mb-4">
                    <label for="reason_name" class="form-label fw-bold small text-secondary">REASON NAME</label>
                    <input type="text" class="form-control py-2" id="reason_name"
                           th:field="*{reason_name}" required>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/manager/wastereasons}" class="btn btn-outline-secondary px-3">
                        <i class="bi bi-x-lg me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-coffee">
                        Update Reason
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
