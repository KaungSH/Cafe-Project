<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Discount Products</title>

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	padding: 0;
	background-color: #faf6ef;
	color: #604c3b;
	font-family: Arial, Helvetica, sans-serif;
}

.container {
	padding: 18px 11px 60px 11px;
}

.header {
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	margin-bottom: 28px;
}

.title-section {
	display: flex;
	align-items: flex-start;
	gap: 12px;
}

.title-icon {
	font-size: 30px;
	line-height: 1;
	margin-top: 2px;
}

h1 {
	margin: 0;
	font-size: 30px;
	font-weight: 500;
	color: #3f342c;
}

.description {
	margin-top: 12px;
	font-size: 16px;
	line-height: 1.5;
	color: #795f4b;
	max-width: 720px;
}

.add-button {
	display: inline-block;
	background-color: #8b572a;
	color: white;
	text-decoration: none;
	padding: 16px 25px;
	border-radius: 10px;
	font-size: 15px;
	font-weight: bold;
}

.add-button:hover {
	background-color: #70451f;
}

/* Search */
.search-box {
	margin-bottom: 20px;
}

.search-box input {
	width: 350px;
	height: 50px;
	padding: 0 16px;
	border: 1px solid #e5d4be;
	border-radius: 10px;
	background-color: white;
	color: #604c3b;
	font-size: 16px;
	outline: none;
}

.search-box input:focus {
	border-color: #b98b5f;
}

/* Table */
.table-container {
	width: 100%;
	overflow-x: auto;
	border: 1px solid #eadbc8;
	border-radius: 15px;
	background-color: #fcf9f4;
	overflow: hidden;
}

table {
	width: 100%;
	border-collapse: collapse;
}

thead {
	background-color: #f4eadc;
}

th {
	text-align: left;
	padding: 18px 20px;
	font-size: 13px;
	font-weight: bold;
	color: #987f68;
	text-transform: uppercase;
	letter-spacing: 0.5px;
}

td {
	padding: 18px 20px;
	border-top: 1px solid #eadbc8;
	font-size: 16px;
	color: #604c3b;
}

tbody tr:hover {
	background-color: #faf3e9;
}

/* Product column */
.product-list {
	color: #604c3b;
}

.delete-button {
	background-color: white;
	border: 1px solid #e5d4be;
	color: #3f342c;
	padding: 10px 17px;
	border-radius: 9px;
	font-size: 14px;
	font-weight: bold;
	cursor: pointer;
}

.delete-button:hover {
	background-color: #f7e9dc;
}

.empty-message {
	text-align: center;
	padding: 35px;
	color: #987f68;
}
</style>

</head>


<body>

	<div class="container">

		<div class="header">

			<div>

				<div class="title-section">

					<div class="title-icon">🏷</div>

					<div>

						<h1>Discount Products</h1>

						<div class="description">Products assigned to each discount
							campaign. Add or remove products from discounts.</div>

					</div>

				</div>

			</div>


			<a class="add-button" th:href="@{/discountProducts/add}"> + Add
				discount product </a>

		</div>

		<div class="search-box">

			<input type="text" id="searchInput"
				placeholder="Search discount products..." onkeyup="searchTable()">

		</div>

		<div class="table-container">

			<table id="discountTable">

				<thead>

					<tr>

						<th style="width: 35%;">DISCOUNT</th>

						<th style="width: 50%;">PRODUCTS</th>

						<th style="width: 15%;">ACTION</th>

					</tr>

				</thead>


				<tbody>

					<tr th:each="dp : ${discountProducts}">

						<td th:text="${dp.discount_name}">Discount Name</td>


						<td class="product-list" th:text="${dp.product_name}">
							Product Name</td>


						<td>

							<form th:action="@{/discountProducts/delete}" method="post">

								<input type="hidden" name="discount_id"
									th:value="${dp.discount_id}">

								<button type="submit" class="delete-button"
									onclick="return confirm('Are you sure you want to delete this discount product?');">
									Delete</button>

							</form>

						</td>

					</tr>

					<tr th:if="${#lists.isEmpty(discountProducts)}">

						<td colspan="3" class="empty-message">No discount products
							found.</td>

					</tr>

				</tbody>

			</table>

		</div>

	</div>


	<script>
		function searchTable() {

			let input = document.getElementById("searchInput");

			let filter = input.value.toLowerCase();

			let table = document.getElementById("discountTable");

			let rows = table.getElementsByTagName("tbody")[0]
					.getElementsByTagName("tr");

			for (let i = 0; i < rows.length; i++) {

				let text = rows[i].textContent.toLowerCase();

				if (text.includes(filter)) {
					rows[i].style.display = "";
				} else {
					rows[i].style.display = "none";
				}

			}

		}
	</script>

</body>

</html>
