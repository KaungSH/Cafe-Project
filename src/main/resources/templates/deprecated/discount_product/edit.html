<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Edit Discount Product</title>
</head>

<body>

	<h2>Edit Discount Product</h2>

	<form th:action="@{/discountProducts/edit}" method="post">

		<label>Discount</label> <select name="discount_id" required>

			<option th:each="discount : ${discounts}"
				th:value="${discount.discount_id}" th:text="${discount.name}"
				th:selected="${discount.discount_id == discount_id}"></option>

		</select> <br> <br>

		<label>Products</label>

		<div th:each="product : ${products}">

			<input type="checkbox" name="product_ids"
				th:value="${product.product_id}"
				th:checked="${selectedProducts.contains(product.product_id)}">

			<span th:text="${product.type_name}"> Product Name </span>

		</div>

		<br>

		<button type="submit">Update</button>

		<a th:href="@{/discountProducts}"> Cancel </a>

	</form>

</body>

</html>
