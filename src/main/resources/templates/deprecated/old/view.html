<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Payment Method Detail</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-7">
				<div class="card shadow">

					<div class="card-header bg-info text-white">
						<h4 class="mb-0">Payment Method Detail</h4>
					</div>

					<div class="card-body">

						<div class="text-center mb-4">
							<img
								th:if="${payMethod.logoPath != null and payMethod.logoPath != ''}"
								th:src="${payMethod.logoPath}" alt="logo"
								style="max-width: 120px; max-height: 120px; object-fit: contain;" />
							<p
								th:if="${payMethod.logoPath == null or payMethod.logoPath == ''}"
								class="text-muted">No logo</p>
						</div>

						<ul class="list-group list-group-flush">
							<li class="list-group-item"><strong>Method ID:</strong> <span
								th:text="${payMethod.methodId}"></span></li>
							<li class="list-group-item"><strong>Name:</strong> <span
								th:text="${payMethod.name}"></span></li>
							<li class="list-group-item"><strong>Description:</strong> <span
								th:text="${payMethod.description}"></span></li>
							<li class="list-group-item"><strong>Status:</strong> <span
								th:if="${payMethod.active}" class="badge bg-success">Active</span>
								<span th:unless="${payMethod.active}" class="badge bg-secondary">Inactive</span>
							</li>
							<li class="list-group-item"><strong>Created By:</strong> <span
								th:text="${payMethod.employeeName != null ? payMethod.employeeName : '—'}"></span>
							</li>
							<li class="list-group-item"><strong>Created At:</strong> <span
								th:text="${payMethod.createdAt}"></span></li>
						</ul>

						<div class="d-flex justify-content-end gap-2 mt-4">
							<a th:href="@{/manager/paymethod}" class="btn btn-secondary">Back</a>
							<a
								th:href="@{/manager/paymethod/edit/{id}(id=${payMethod.methodId})}"
								class="btn btn-primary">Edit</a>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
