<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Branch List</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h2>Branch List</h2>
		<a th:href="@{/branches/create}" class="btn btn-primary">+ Add New
			Branch</a>
	</div>

	<table class="table table-hover table-bordered align-middle">
		<thead class="table-dark">
			<tr>
				<th>Name</th>
				<th>Location</th>
				<th>Opening Time</th>
				<th>Closing Time</th>
				<th>Status</th>
				<th style="width: 150px;">Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="branch : ${branches}">
				<td th:text="${branch.name}"></td>
				<td th:text="${branch.location}"></td>
				<td th:text="${branch.opening_time}"></td>
				<td th:text="${branch.closing_time}"></td>
				<td><span class="badge bg-info text-dark"
					th:text="${branch.status_name}"></span></td>
				<td><a th:href="@{/branches/edit/{id}(id=${branch.branch_id})}"
					class="btn btn-warning btn-sm">Edit</a>
					<form th:action="@{/branches/delete/{id}(id=${branch.branch_id})}"
						method="post" class="d-inline">
						<button type="submit" class="btn btn-danger btn-sm"
							onclick="return confirm('Are you sure')">Delete</button>
					</form></td>
			</tr>
			<tr th:if="${#lists.isEmpty(branches)}">
				<td colspan="6" class="text-center text-muted">No branches
					found.</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
