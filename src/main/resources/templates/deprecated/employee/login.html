<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
	
	<style>
	
/* ================================
   COFFEE HOUSE LOGIN DESIGN
================================ */

:root {
    --coffee-dark: #2b160d;
    --coffee: #5a301c;
    --coffee-light: #8b5a3c;
    --caramel: #b9794d;
    --cream: #fff8f0;
    --cream-dark: #ead8c7;
    --text: #4b3327;
}


/* ================================
   BODY
================================ */

body {
    min-height: 100vh;

    margin: 0;

    font-family: "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(205, 145, 93, 0.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #241108 0%,
            #4b2616 50%,
            #8b5636 100%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


/* ================================
   DECORATIVE BACKGROUND
================================ */

body::before {
    content: "☕";

    position: fixed;

    left: -80px;

    bottom: -100px;

    font-size: 420px;

    opacity: 0.06;

    transform: rotate(-15deg);

    pointer-events: none;
}

body::after {
    content: "";

    position: fixed;

    width: 500px;

    height: 500px;

    right: -200px;

    top: -250px;

    border-radius: 50%;

    background: rgba(255, 220, 185, 0.10);

    pointer-events: none;
}


/* ================================
   CONTAINER
================================ */

.container {
    position: relative;

    z-index: 2;
}


/* ================================
   LOGIN ROW
================================ */

.row {
    min-height: 100vh;

    align-items: center;
}


/* ================================
   LOGIN CARD
================================ */

.card {
    border: none !important;

    border-radius: 25px !important;

    overflow: hidden;

    background: rgba(255, 248, 240, 0.97);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.40) !important;

    backdrop-filter: blur(10px);

    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45) !important;
}


/* ================================
   CARD HEADER
================================ */

.card-header {
    border: none !important;

    padding: 35px 25px !important;

    background:
        linear-gradient(
            135deg,
            #3a1b0e,
            #704126
        ) !important;

    position: relative;

    overflow: hidden;
}

.card-header::before {
    content: "☕";

    position: absolute;

    right: 20px;

    top: -35px;

    font-size: 130px;

    opacity: 0.08;

    transform: rotate(-15deg);
}

.card-header::after {
    content: "";

    position: absolute;

    width: 120px;

    height: 120px;

    left: -60px;

    bottom: -70px;

    border-radius: 50%;

    background: rgba(255,255,255,0.08);
}

.card-header h4 {
    position: relative;

    z-index: 2;

    margin: 0;

    font-size: 28px;

    font-weight: 700;

    letter-spacing: 0.5px;

    color: #fff8f0;
}

.card-header h4::before {
    content: "☕";

    margin-right: 10px;

    font-size: 24px;
}


/* ================================
   CARD BODY
================================ */

.card-body {
    padding: 40px !important;

    background: #fffaf5;
}


/* ================================
   FORM LABEL
================================ */

.form-label {
    color: var(--coffee-dark);

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 8px;
}


/* ================================
   INPUT
================================ */

.form-control {
    height: 52px;

    border-radius: 13px !important;

    border: 1px solid #ddcbbd !important;

    background: #fff !important;

    color: var(--text);

    font-size: 14px;

    padding: 12px 16px;

    transition: all 0.25s ease;

    box-shadow: none !important;
}

.form-control::placeholder {
    color: #a8988d;
}

.form-control:hover {
    border-color: var(--caramel) !important;
}

.form-control:focus {
    border-color: var(--caramel) !important;

    box-shadow:
        0 0 0 4px rgba(185, 121, 77, 0.15) !important;

    background: #fff !important;
}


/* ================================
   VALIDATION ERROR
================================ */

.text-danger {
    margin-top: 6px;

    font-size: 12px;

    color: #a43d32 !important;
}

.alert-danger {
    border: none;

    border-radius: 12px;

    background: #f9e5e1;

    color: #923b31;

    font-size: 13px;

    padding: 13px 16px;

    margin-bottom: 22px;
}


/* ================================
   LOGIN BUTTON
================================ */

.btn-primary {
    height: 52px;

    border: none !important;

    border-radius: 13px !important;

    background:
        linear-gradient(
            135deg,
            #542913,
            #8b512e
        ) !important;

    color: #fff !important;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 0.5px;

    box-shadow:
        0 8px 20px rgba(84, 41, 19, 0.25) !important;

    transition: all 0.25s ease;
}

.btn-primary:hover {
    background:
        linear-gradient(
            135deg,
            #3d1d0d,
            #6e3c20
        ) !important;

    transform: translateY(-2px);

    box-shadow:
        0 12px 25px rgba(84, 41, 19, 0.35) !important;
}

.btn-primary:active {
    transform: translateY(0);
}


/* ================================
   FORM SPACING
================================ */

.mb-3 {
    margin-bottom: 22px !important;
}


/* ================================
   INPUT FOCUS ANIMATION
================================ */

.form-control:focus::placeholder {
    opacity: 0.5;
}


/* ================================
   RESPONSIVE
================================ */

@media (max-width: 767px) {

    body {
        overflow-y: auto;
    }

    .row {
        min-height: 100vh;

        padding-top: 30px;

        padding-bottom: 30px;
    }

    .col-md-5 {
        width: 94%;
    }

    .card {
        border-radius: 20px !important;
    }

    .card-header {
        padding: 28px 20px !important;
    }

    .card-header h4 {
        font-size: 24px;
    }

    .card-body {
        padding: 30px 24px !important;
    }
}


@media (max-width: 400px) {

    .card-body {
        padding: 25px 18px !important;
    }

    .card-header h4 {
        font-size: 22px;
    }

    .form-control,
    .btn-primary {
        height: 48px;
    }
}

	
	</style>
</head>
<body class="bg-light">
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card shadow">
					<div class="card-header bg-primary text-white text-center">
						<h4>Employee Login</h4>
					</div>
					<div class="card-body">

						<div th:if="${error}" class="alert alert-danger"
							th:text="${error}"></div>

						<form th:action="@{/employee/login}" th:object="${loginModel}"
							method="post">
							<div class="mb-3">
								<label class="form-label">Email address</label> <input
									type="email" th:field="*{email}" class="form-control"
									placeholder="Enter email" />
								<div class="text-danger" th:if="${#fields.hasErrors('email')}"
									th:errors="*{email}"></div>
							</div>

							<div class="mb-3">
								<label class="form-label">Password</label> <input
									type="password" th:field="*{password}" class="form-control"
									placeholder="Enter password" />
								<div class="text-danger"
									th:if="${#fields.hasErrors('password')}"
									th:errors="*{password}"></div>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-primary">Login</button>
							</div>
						</form>

					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
