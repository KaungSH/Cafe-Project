<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deleted Employees</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="text-danger mb-3">Deleted Employees</h2>
    <a th:href="@{/manager/employee}" class="btn btn-secondary mb-3">← Back to Employee List</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Branch</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.employee_id}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.role_name}"></td>
                <td th:text="${emp.branch_name}"></td>
                <td>
                    <a th:href="@{/manager/employee/recover/{id}(id=${emp.employee_id})}" 
                       class="btn btn-success btn-sm">Recover</a>
                    <a th:href="@{/manager/employee/hard-delete/{id}(id=${emp.employee_id})}" 
                       onclick="return confirm('PERMANENTLY DELETE? This action cannot be undone!')" 
                       class="btn btn-danger btn-sm">Hard Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
