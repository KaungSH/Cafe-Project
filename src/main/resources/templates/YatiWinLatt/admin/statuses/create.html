<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0 fw-bold text-primary" 
                th:text="${statusId != null and !statusId.isEmpty() ? 'Edit Status' : 'Add New Status'}"></h5>
        </div>
        <div class="card-body">

            <form th:action="@{/admin/statuses/save}" method="post">
                <input type="hidden" name="statusType" th:value="${statusType}">
                <input type="hidden" name="id" th:value="${statusId}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Target Type</label>
                    <input type="text" class="form-control text-uppercase bg-light" 
                           th:value="${statusType}" readonly>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Status Name <span class="text-danger">*</span></label>
                    <!-- Pure HTML validation with 'required' attribute -->
                    <input type="text" id="name" name="name" class="form-control" 
                           th:value="${statusName}" 
                           required 
                           placeholder="Enter status name">
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/admin/statuses(type=${statusType})}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
