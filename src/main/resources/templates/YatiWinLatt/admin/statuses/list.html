<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Status List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-primary">Status Management</h3>
        <a th:href="@{/admin/statuses/create(type=${selectedType != null ? selectedType : 'branch'})}" 
           class="btn btn-primary">
            + Add New Status
        </a>
    </div>

    <!-- Dynamic Category Tabs -->
    <ul class="nav nav-tabs fw-semibold mb-3">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'branch'} ? 'active'" th:href="@{/admin/statuses(type='branch')}">Branch</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'employee'} ? 'active'" th:href="@{/admin/statuses(type='employee')}">Employee</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'customer'} ? 'active'" th:href="@{/admin/statuses(type='customer')}">Customer</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'register'} ? 'active'" th:href="@{/admin/statuses(type='register')}">Register</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'order'} ? 'active'" th:href="@{/admin/statuses(type='order')}">Order Type</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'promo'} ? 'active'" th:href="@{/admin/statuses(type='promo')}">Promo Type</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedType == 'audience'} ? 'active'" th:href="@{/admin/statuses(type='audience')}">Audience Type</a>
        </li>
    </ul>

    <!-- Data Display Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 45%;" class="ps-4">ID</th>
                            <th style="width: 35%;">Name</th>
                            <th style="width: 20%;" class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="st : ${statusList}">
                            <td class="ps-4 small text-muted" th:text="${st.id}"></td>
                            <td class="fw-medium" th:text="${st.name}"></td>
                            <td class="text-center">
                                <a th:href="@{/admin/statuses/edit(type=${selectedType}, id=${st.id})}" 
                                   class="btn btn-sm btn-outline-warning me-1">Edit</a>
                                <a th:href="@{/admin/statuses/delete(type=${selectedType}, id=${st.id}, name=${st.name})}" 
                                   class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(statusList)}">
                            <td colspan="3" class="text-center text-muted py-4">No status found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
