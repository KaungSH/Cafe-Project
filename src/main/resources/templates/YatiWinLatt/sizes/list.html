<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Size List</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light py-4">
	<div class="container">
		<div class="card shadow-sm border-0">
			<div class="card-body">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h3 class="card-title text-primary mb-0">
						<i class="fa-solid fa-ruler-combined me-2"></i>Size List
					</h3>
					<a th:href="@{/sizes/create}" class="btn btn-primary"> <i
						class="fa-solid fa-plus me-1"></i> Add New Size
					</a>
				</div>

				<div class="table-responsive">
					<table class="table table-hover table-striped align-middle border">
						<thead class="table-dark">
							<tr>
								<th scope="col">Size Code</th>
								<th scope="col">Size Name</th>
								<th scope="col">Status</th>
								<th scope="col">Created By</th>
								<th scope="col" class="text-center" style="width: 180px;">Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="s : ${sizes}">
								<td><span class="badge bg-light text-dark border"
									th:text="${s.size_code}">SZ-01</span></td>
								<td th:text="${s.name}" class="fw-bold">Large</td>
								<td><span th:if="${s.is_active}" class="badge bg-success">
										<i class="fa-solid fa-check me-1"></i>Active
								</span> <span th:unless="${s.is_active}" class="badge bg-secondary">
										<i class="fa-solid fa-xmark me-1"></i>Inactive
								</span></td>
								<td th:text="${s.employee_name != null ? s.employee_name : '-'}">Admin</td>
								<td class="text-center"><a
									th:href="@{/sizes/edit/{id}(id=${s.size_id})}"
									class="btn btn-sm btn-outline-warning me-1"> <i
										class="fa-solid fa-pen-to-square"></i> Edit
								</a> <a th:href="@{/sizes/delete/{id}(id=${s.size_id})}"
									class="btn btn-sm btn-outline-danger"
									onclick="return confirm('Are you sure?');"> <i
										class="fa-solid fa-trash"></i> Delete
								</a></td>
							</tr>
							<tr th:if="${#lists.isEmpty(sizes)}">
								<td colspan="5" class="text-center text-muted py-4"><i
									class="fa-solid fa-folder-open fa-2x mb-2 d-block"></i> No size
									records found. Click <strong>"Add New Size"</strong> to create
									one.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
