<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Size - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--accent-warm: #E0A96D;
	--accent-hover: #C88E52;
	--bg-main: #FAF7F2;
	--card-bg: #FFFFFF;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.page-container {
	padding: 40px 60px;
}

.page-title {
	color: var(--primary-color);
	font-size: 28px;
	font-weight: 700;
}

.form-card {
	background-color: var(--card-bg);
	border: 1px solid #EAE3DC;
	border-radius: 12px;
	max-width: 700px;
	margin: 20px auto;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
}

.form-header {
	color: var(--primary-color);
	font-size: 20px;
	font-weight: 700;
	padding: 20px 28px;
	border-bottom: 1px solid #EAE3DC;
	background-color: #FCFAF8;
	border-top-left-radius: 12px;
	border-top-right-radius: 12px;
}

.form-body {
	padding: 28px;
}

.form-label {
	font-weight: 600;
	color: #4A3E3D;
}

.required {
	color: #C94A29;
}

.form-control {
	padding: 10px 12px;
	border-radius: 8px;
	border: 1px solid #D6CECE;
}

.form-control:focus {
	border-color: var(--primary-color);
	box-shadow: 0 0 0 0.25rem rgba(92, 61, 46, 0.15);
}

.update-btn {
	background-color: var(--accent-warm);
	border-color: var(--accent-warm);
	color: #3E2723;
	font-weight: 600;
	border-radius: 8px;
	padding: 8px 20px;
}

.update-btn:hover {
	background-color: var(--accent-hover);
	border-color: var(--accent-hover);
	color: #2C1A14;
}

.btn-secondary {
	border-radius: 8px;
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
}

.btn-secondary:hover {
	background-color: #D7CCC8;
	color: #3E2723;
}

.form-check-input:checked {
	background-color: var(--primary-color);
	border-color: var(--primary-color);
}
</style>
</head>
<body>

	<div class="page-container">
		<!-- Title -->
		<h2 class="page-title">Size Management</h2>

		<!-- Form Card -->
		<div class="form-card">
			<div class="form-header">
				<i class="fa-solid fa-pen-to-square me-2"></i>Edit Size
			</div>

			<div class="form-body">
				<form th:action="@{/sizes/edit/{id}(id=*{size_id})}"
					th:object="${sizeDto}" method="post" novalidate>
					<!-- Hidden ID -->
					<input type="hidden" th:field="*{size_id}">


					<div class="mb-3">
						<label for="sizeCode" class="form-label"> Size Code <span
							class="required">*</span>
						</label> <input type="text" id="sizeCode" th:field="*{size_code}"
							class="form-control" placeholder="S, M, L"
							th:classappend="${#fields.hasErrors('size_code')} ? 'is-invalid' : ''">
						<div class="invalid-feedback"
							th:if="${#fields.hasErrors('size_code')}"
							th:errors="*{size_code}"></div>
					</div>


					<div class="mb-3">
						<label for="sizeName" class="form-label"> Size Name <span
							class="required">*</span>
						</label> <input type="text" id="sizeName" th:field="*{name}"
							class="form-control" placeholder="Small, Medium, Large"
							th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
						<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
							th:errors="*{name}"></div>
					</div>


					<div class="mb-4 form-check form-switch">
						<input type="checkbox" th:field="*{is_active}"
							class="form-check-input" id="isActiveCheck" role="switch">
						<label class="form-check-label fw-semibold" for="isActiveCheck">Is
							Active</label>
					</div>


					<div class="d-flex justify-content-end gap-2">
						<a th:href="@{/sizes}" class="btn btn-secondary"> <i
							class="fa-solid fa-xmark me-1"></i>Cancel
						</a>
						<button type="submit" class="btn update-btn">
							<i class="fa-solid fa-pen me-1"></i>Update Size
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>

</body>
</html>
