<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Waste Logs - Luft Cafe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { 
            background-color: #f6f1eb; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #5d534a;
        }
        .container-box {
            background-color: #efe8e0;
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #63584e;
        }
        .btn-add-new {
            background-color: #736356;
            color: #ffffff;
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: 500;
            text-decoration: none;
            border: none;
        }
        .btn-add-new:hover {
            background-color: #5c4e43;
            color: #ffffff;
        }
        .custom-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }
        .custom-table th {
            color: #7a6e65;
            font-weight: 600;
            padding: 12px;
            border-bottom: 1px solid #e0d6cc;
        }
        .custom-table td {
            padding: 14px 12px;
            vertical-align: middle;
            background-color: rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid #e6ded5;
        }
        .btn-action-edit {
            background-color: #e5ded7;
            color: #5d534a;
            border: none;
            border-radius: 6px;
            padding: 4px 14px;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }
        .btn-action-edit:hover {
            background-color: #d8cec5;
            color: #433b34;
        }
        .btn-action-delete {
            background-color: transparent;
            color: #8c7b70;
            border: none;
            padding: 2px 14px;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-action-delete:hover {
            color: #d9534f;
        }
    </style>
</head>
<body class="p-4">
    <div class="container container-box">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title m-0">Waste Logs Management</h2>
            <a th:href="@{/manager/WasteLogs/create}" class="btn btn-add-new">+ Add New Waste Log</a>
        </div>

        <div class="table-responsive">
            <table class="table custom-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Batch ID</th>
                        <th>Reason</th>
                        <th>Quantity Lost</th>
                        <th>Financial Loss</th>
                        <th>Employee</th>
                        <th>Logged At</th>
                        <th>Notes</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${wasteLogs}">
                        <td th:text="${log.waste_id}">1</td>
                        <td th:text="${log.batch_id}">BATCH001</td>
                        <td th:text="${log.reason_name}">Expired</td>
                        <td th:text="${log.quantity_lost}">2.500</td>
                        <td th:text="${log.financial_loss}">15000.00</td>
                        <td th:text="${log.name}">MaMa</td>
                        <td th:text="${#temporals.format(log.logged_at, 'yyyy-MM-dd HH:mm')}">2026-09-18 10:00</td>
                        <td th:text="${log.notes}">Damaged</td>
                        <td class="text-center" style="width: 100px;">
 		<a th:href="@{/manager/WasteLogs/edit/{waste_id}(waste_id=${log.waste_id})}" class="btn-action-edit">Edit</a>
                            <a th:href="@{/manager/WasteLogs/delete/{waste_id}(waste_id=${log.waste_id})}" 
                               class="btn-action-delete" 
                               onclick="return confirm('Are you sure you want to delete this record?');">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(wasteLogs)}">
                        <td colspan="9" class="text-center text-muted py-4">No waste logs record found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
