<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Waste Log - Luft Cafe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { 
            background-color: #f6f1eb; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #5d534a;
        }
        .form-card {
            background-color: #efe8e0;
            border-radius: 16px;
            padding: 35px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #63584e;
            margin-bottom: 25px;
        }
        .form-label {
            font-weight: 600;
            color: #7a6e65;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            background-color: #fdfbf7;
            border: 1px solid #d8ceca;
            border-radius: 8px;
            padding: 10px 14px;
            color: #5d534a;
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #a39387;
            box-shadow: 0 0 0 0.2rem rgba(115, 99, 86, 0.15);
        }
        .btn-submit {
            background-color: #736356;
            color: #ffffff;
            border-radius: 8px;
            padding: 9px 24px;
            font-weight: 500;
            border: none;
        }
        .btn-submit:hover {
            background-color: #5c4e43;
            color: #ffffff;
        }
        .btn-cancel {
            background-color: #e5ded7;
            color: #5d534a;
            border-radius: 8px;
            padding: 9px 20px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }
        .btn-cancel:hover {
            background-color: #d8cec5;
            color: #433b34;
        }
    </style>
</head>
<body class="p-4">
    <div class="form-card">
        <h3 class="page-title">Edit Waste Log</h3>

        <form th:action="@{/manager/WasteLogs/edit}" th:object="${wasteLog}" method="post">
            <input type="hidden" th:field="*{waste_id}" />

            <div class="mb-3">
                <label class="form-label">Ingredient Batch</label>
                <select th:field="*{batch_id}" class="form-select">
                    <option value="">Select Batch</option>
                    <option th:each="b : ${batches}" th:value="${b.batchId}" th:text="${b.batchId}"></option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('batch_id')}" th:errors="*{batch_id}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Waste Reason</label>
                <select th:field="*{waste_reason_id}" class="form-select">
                    <option value="">Select Reason</option>
                    <option th:each="r : ${reasons}" th:value="${r.waste_reason_id}" th:text="${r.reason_name}"></option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('waste_reason_id')}" th:errors="*{waste_reason_id}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity Lost</label>
                    <input type="number" step="0.001" th:field="*{quantity_lost}" class="form-control">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('quantity_lost')}" th:errors="*{quantity_lost}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Financial Loss</label>
                    <input type="number" step="0.01" th:field="*{financial_loss}" class="form-control">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('financial_loss')}" th:errors="*{financial_loss}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Employee</label>
                <select th:field="*{employee_id}" class="form-select">
                    <option value="">Select Employee</option>
                    <option th:each="e : ${employees}" th:value="${e.employeeId}" th:text="${e.name}"></option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea th:field="*{notes}" class="form-control" rows="3"></textarea>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/manager/WasteLogs}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-submit">Update</button>
            </div>
        </form>
    </div>
</body>
</html>
