<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Branch - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--accent-warm: #E0A96D;
	--accent-hover: #C88E52;
	--bg-main: #FAF7F2;
	--card-bg: #FFFFFF;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-card {
	background-color: var(--card-bg);
	border: 1px solid #EAE3DC;
	border-radius: 12px;
	padding: 32px 40px;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
	margin-top: 30px;
	margin-bottom: 30px;
}

.page-title {
	color: var(--primary-color);
	font-weight: 700;
	font-size: 1.6rem;
}

.btn-submit {
	background-color: var(--accent-warm);
	color: #3E2723;
	font-weight: 600;
	border-radius: 8px;
	padding: 9px 24px;
	border: none;
}

.btn-submit:hover {
	background-color: var(--accent-hover);
	color: #2C1A14;
}

.btn-cancel {
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
	border-radius: 8px;
	padding: 9px 24px;
	text-decoration: none;
	font-weight: 600;
}
</style>
</head>

<body>

	<div layout:fragment="content" style="max-width: 650px;">
		<div class="main-card">

		

			<form th:action="@{/manager-only/branches/finance}"
				th:object="${branchDto}" method="post">
				
			<h3 class="page-title mb-4">
				<i class="fa-solid fa-pen-to-square me-2"></i>Update Finances For Branch <span th:text = "${name}"></span>
			</h3>

			<input type="hidden" th:field="*{branch_id}">

				<div class="mb-3">
					<label for="branch_finance" class="form-label fw-bold">
						Branch Finance<span class="text-danger">*</span>
					</label> <input type="number" id="branch_finance" th:field="*{branch_finance}"
						class="form-control" step="0.01" min="0" placeholder="0.000"
						th:classappend="${#fields.hasErrors('branch_finance')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('branch_finance')}"
						th:errors="*{branch_finance}"></div>
				</div>


				<div class="mt-4 d-flex gap-2 justify-content-end">
					<a th:href="@{/manager-only/branchstats}" class="btn btn-cancel"><i
						class="fa-solid fa-xmark me-1"></i>Cancel</a>
					<button type="submit" class="btn btn-submit">
						<i class="fa-solid fa-pen me-1"></i>Update Branch
					</button>
				</div>

			</form>

		</div>
	</div>

</body>
</html>
