<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Branch Status | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .status-center-wrapper {
            max-width: 580px;
            margin: 50px auto;
            padding: 0 15px;
        }

        .luxury-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            padding: 34px 40px;
        }

        .luxury-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #F0E8DC;
        }

        .icon-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            color: #F4E8D8;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .luxury-header h2 {
            font-size: 19px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .luxury-subtitle {
            font-size: 13px;
            color: #8C7B6C;
            margin-top: 3px;
        }

        .badge-branch-tag {
            background-color: #F3EBDD;
            color: #6C441E;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #554133;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom .icon-addon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9C8976;
            font-size: 14px;
        }

        .form-select-luxury {
            width: 100%;
            background-color: #FAF8F5;
            border: 1px solid #DFD5C6;
            border-radius: 11px;
            padding: 11px 14px 11px 38px;
            color: #2D2422;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .form-select-luxury:focus {
            background-color: #FFFFFF;
            border-color: #8B572A;
            box-shadow: 0 0 0 3px rgba(139, 87, 42, 0.12);
            outline: none;
        }

        .btn-luxury-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(88, 55, 24, 0.2);
        }

        .btn-luxury-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
            color: #FFFFFF;
        }

        .btn-luxury-cancel {
            background-color: #EFE8DD;
            color: #5C4533;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-luxury-cancel:hover {
            background-color: #E2D7C7;
            color: #3C2B1D;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="status-center-wrapper">
        <div class="luxury-card">

            <div class="luxury-header">
                <div class="icon-badge">
                    <i class="fa-solid fa-toggle-on"></i>
                </div>
                <div>
                    <h2>Change Branch Status</h2>
                    <p class="luxury-subtitle">
                        Adjust operation state for <span class="badge-branch-tag" th:text="${name}">Branch</span>[cite: 27]
                    </p>
                </div>
            </div>

            <form th:action="@{/manager-only/branches/status}" th:object="${branchDto}" method="post">
                <input type="hidden" th:field="*{branch_id}">

                <div class="mb-4">
                    <label class="form-label">Operation Status <span class="text-danger">*</span></label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-circle-check icon-addon"></i>
                        <select th:field="*{branch_status_id}" class="form-select-luxury"
                                th:classappend="${#fields.hasErrors('branch_status_id')} ? 'is-invalid'">
                            <option value="">-- Select Status --</option>
                            <option th:each="st : ${statuses}" 
                                    th:value="${st.branch_status_id}" 
                                    th:text="${st.name}" 
                                    th:if="${st.name!='BANKRUPT'}">
                            </option>
                        </select>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('branch_status_id')}" th:errors="*{branch_status_id}"></div>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 pt-3 border-top border-light-subtle">
                    <a th:href="@{/manager-only/branchstats}" class="btn-luxury-cancel">
                        <i class="fa-solid fa-xmark"></i> Cancel
                    </a>
                    <button type="submit" class="btn-luxury-primary">
                        <i class="fa-solid fa-check"></i> Update Status
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
