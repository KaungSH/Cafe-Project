<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Management | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF7F2;
            color: #2D2422;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .branch-dashboard-wrapper {
            width: 95%;
            max-width: 1350px;
            margin: 35px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.22);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-title-box p {
            font-size: 13px;
            color: #8C7B6C;
            margin: 2px 0 0 0;
        }

        .btn-add-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF !important;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(88, 55, 24, 0.2);
        }

        .btn-add-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
        }

        /* Luxury Card Table */
        .luxury-table-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #FAF5EE;
            color: #796450;
            padding: 15px 18px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 18px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .id-badge {
            background-color: #F8F4EE;
            color: #7D5127;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid #EADBCC;
            display: inline-block;
        }

        .branch-name {
            font-weight: 700;
            color: #2B1D14;
        }

        .status-badge-opened {
            color: #2D6A4F;
            background-color: #E8F5E9;
            border: 1px solid #C8E6C9;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge-other {
            color: #A33A2D;
            background-color: #FFEBEE;
            border: 1px solid #FFCDD2;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit-action {
            color: #7D5127;
            background-color: #FAF5EE;
            border: 1px solid #DFCDBD;
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit-action:hover {
            background-color: #EFE3D3;
            color: #4E3013;
        }

        .btn-delete-action {
            color: #A33A2D;
            background-color: #FFF5F4;
            border: 1px solid #F0C4BD;
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete-action:hover {
            background-color: #FCE1DF;
            color: #7C2419;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="branch-dashboard-wrapper">
        
        <!-- Header -->
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div>
                    <h2>Branch Management</h2>
                    <p>Overview of active coffee branches, operating hours & capital finances[cite: 17, 26]</p>
                </div>
            </div>

            <a th:href="@{/admin/branches/create}" class="btn-add-primary">
                <i class="fa-solid fa-plus"></i> Add New Branch
            </a>
        </div>

        <!-- Luxury Table -->
        <div class="luxury-table-card">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Opening Time</th>
                        <th>Closing Time</th>
                        <th>Finances</th>
                        <th>Status</th>
                        <th class="text-end" style="width: 180px;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="branch, state : ${branches}">
                        <td><span class="id-badge" th:text="${state.count}">1</span></td>
                        <td><span class="branch-name" th:text="${branch.name}">Café Luft - Main</span></td>
                        <td th:text="${branch.location}">Yangon</td>
                        <td th:text="${branch.opening_time}">09:00:00</td>
                        <td th:text="${branch.closing_time}">19:00:00</td>
                        <td class="fw-bold" th:text="${#numbers.formatDecimal(branch.branch_finance, 1, 'COMMA', 2, 'POINT')} + ' MMK'">1000.00 MMK</td>
                        <td>
                            <span th:if="${branch.status_name == 'OPENED' or branch.status_name == 'Active'}" class="status-badge-opened">
                                <i class="fa-solid fa-check"></i> <span th:text="${branch.status_name}">OPENED</span>
                            </span>
                            <span th:unless="${branch.status_name == 'OPENED' or branch.status_name == 'Active'}" class="status-badge-other">
                                <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${branch.status_name}">CLOSED</span>
                            </span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/branches/edit/{branch_id}(branch_id=${branch.branch_id})}" class="btn-edit-action me-1">
                                <i class="fa-solid fa-pen-to-square"></i> Edit
                            </a>
                            <form th:action="@{/admin/branches/delete/{branch_id}(branch_id=${branch.branch_id})}" method="post" class="d-inline">
                                <button type="submit" class="btn-delete-action" onclick="return confirm('Are you sure you want to delete this branch?')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(branches)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-store-slash fs-2 d-block mb-2 text-secondary opacity-50"></i>
                            No branches found[cite: 26].
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</body>
</html>
