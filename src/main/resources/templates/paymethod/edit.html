<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Payment Method | Cafe Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #f6f2ec;
            --surface: #ffffff;
            --espresso: #1e130c;
            --roast: #3d2618;
            --caramel: #b58356;
            --border-subtle: #ede4d8;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b1d14;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: var(--espresso);
            font-weight: 700;
        }

        .luxury-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.07);
            padding: 40px;
        }

        .form-control {
            border: 1.5px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: var(--caramel);
            box-shadow: 0 0 0 4px rgba(181, 131, 86, 0.15);
        }

        .btn-luxury {
            background: linear-gradient(135deg, var(--caramel) 0%, var(--roast) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 12px 28px;
            transition: all 0.3s ease;
        }
        .btn-luxury:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(61, 38, 24, 0.25);
        }

        .img-preview-box {
            width: 110px;
            height: 110px;
            border-radius: 16px;
            border: 1.5px solid var(--border-subtle);
            padding: 8px;
            object-fit: contain;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="luxury-card">
                <div class="mb-4">
                    <a th:href="@{/admin/paymethod}" class="text-decoration-none text-muted small fw-semibold">
                        <i class="bi bi-arrow-left"></i> Back to Payment List
                    </a>
                    <h2 class="brand-title mt-2 mb-1">Edit Payment Method</h2>
                    <p class="text-muted small">Update method details, logos, or visibility status.</p>
                </div>

                <form th:action="@{/admin/paymethod/edit/{id}(id=${payMethod.methodId})}"
                      th:object="${payMethod}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{logoPath}" />
                    <input type="hidden" th:field="*{createdAt}" />

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase">Method Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required />
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase">Description</label>
                        <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                    </div>

                    <!-- Image Management Section -->
                    <div class="row mb-4 align-items-center">
                        <div class="col-auto">
                            <label class="form-label d-block fw-bold small text-uppercase">Current Logo</label>
                            <img th:if="*{logoPath != null and logoPath != ''}"
                                 th:src="@{'/images/' + *{logoPath}}"
                                 class="img-preview-box shadow-sm" alt="Logo" />
                            <div th:unless="*{logoPath != null and logoPath != ''}"
                                 class="img-preview-box d-flex align-items-center justify-content-center text-muted">
                                <i class="bi bi-image fs-4"></i>
                            </div>
                        </div>
                        <div class="col">
                            <label for="coverImg" class="form-label fw-bold small text-uppercase">Upload New Logo (Optional)</label>
                            <input type="file" id="coverImg" name="coverImgPart" class="form-control" accept="image/*">
                            <div class="form-text">Choose a file only if you want to replace the current logo.</div>
                            <div class="mt-2">
                                <img id="coverPreview" class="img-preview-box" style="display: none;" alt="New Preview">
                            </div>
                        </div>
                    </div>

                    <!-- Active Toggle -->
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" role="switch" th:field="*{active}" id="isActive">
                        <label class="form-check-label fw-semibold ms-2" for="isActive">Enable / Active</label>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/admin/paymethod}" class="btn btn-light px-4" style="border-radius: 12px; font-weight: 600;">Cancel</a>
                        <button type="submit" class="btn btn-luxury">Update Method</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById("coverImg").addEventListener("change", function(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("coverPreview");
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        } else {
            preview.src = "";
            preview.style.display = "none";
        }
    });
</script>
</body>
</html>
