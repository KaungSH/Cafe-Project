<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Payment Method List | Coffee Shop</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Google Fonts -->
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
	rel="stylesheet">

<style>
body {
	background-color: #f9f4ef;
	font-family: 'Nunito', sans-serif;
	color: #4a3018;
}

.custom-container {
	background-color: #ffffff;
	border-radius: 20px;
	padding: 30px;
	box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08);
	margin-top: 50px;
	margin-bottom: 50px;
}

h2 {
	color: #5c3a21;
	font-weight: 700;
}

.btn-coffee-primary {
	background-color: #a87b51;
	color: white;
	border: none;
	border-radius: 12px;
	padding: 10px 20px;
	font-weight: 600;
	transition: all 0.3s ease;
}

.btn-coffee-primary:hover {
	background-color: #8c633e;
	color: white;
	transform: translateY(-2px);
}

.table {
	border-collapse: separate;
	border-spacing: 0;
	margin-top: 15px;
}

.table thead th {
	background-color: #5c3a21;
	color: #f9f4ef;
	border: none;
	padding: 15px;
	font-weight: 600;
}

.table thead th:first-child {
	border-top-left-radius: 15px;
}

.table thead th:last-child {
	border-top-right-radius: 15px;
}

.table tbody tr td {
	vertical-align: middle;
	border-bottom: 1px solid #eee5da;
	color: #5c3a21;
	padding: 12px 15px;
}

.table tbody tr:hover {
	background-color: #fcf9f5;
}

.table tbody tr:last-child td:first-child {
	border-bottom-left-radius: 15px;
}

.table tbody tr:last-child td:last-child {
	border-bottom-right-radius: 15px;
}

/* Action Buttons */
.btn-view {
	background-color: #8fa382;
	color: white;
	border-radius: 8px;
	border: none;
	font-size: 0.875rem;
}

.btn-view:hover {
	background-color: #728566;
	color: white;
}

.btn-edit {
	background-color: #d4a373;
	color: white;
	border-radius: 8px;
	border: none;
	font-size: 0.875rem;
}

.btn-edit:hover {
	background-color: #b58555;
	color: white;
}

.btn-delete {
	background-color: #b07d62;
	color: white;
	border-radius: 8px;
	border: none;
	font-size: 0.875rem;
}

.btn-delete:hover {
	background-color: #94644a;
	color: white;
}

/* Modal Customization */
.modal-content {
	border-radius: 20px;
	border: none;
}

.modal-header {
	background-color: #b07d62;
	color: white;
	border-top-left-radius: 20px;
	border-top-right-radius: 20px;
}

.alert-warning {
	background-color: #fcf9f5;
	border-color: #e6d5c3;
	color: #5c3a21;
	border-radius: 12px;
}
</style>
</head>
<body>

	<div class="container custom-container">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2>💳 Payment Methods</h2>
			<a th:href="@{/manager/paymethod/add}" class="btn btn-coffee-primary">+
				Add New Method</a>
		</div>

		<div class="table-responsive">
			<table class="table table-hover align-middle">
				<thead>
					<tr>
						<th>No.</th>
						<th>Logo</th>
						<th>Name</th>
						<th>Description</th>
						<th>Status</th>
						<th>Created By</th>
						<th class="text-center">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="pm,state : ${payMethods}">
						<td th:text="${state.count}" class="fw-bold"></td>
						<td><img th:if="${pm.logoPath != null and pm.logoPath != ''}"
							th:src="${pm.logoPath}" alt="logo"
							style="width: 40px; height: 40px; object-fit: contain; border-radius: 8px;" />
							<span th:if="${pm.logoPath == null or pm.logoPath == ''}"
							class="text-muted">—</span></td>
						<td th:text="${pm.name}" class="fw-bold"></td>
						<td th:text="${pm.description}"></td>
						<td><span th:if="${pm.active}" class="badge"
							style="background-color: #8fa382;">Active</span> <span
							th:unless="${pm.active}" class="badge bg-secondary">Inactive</span>
						</td>
						<td th:text="${pm.employeeName != null ? pm.employeeName : '—'}"></td>
						<td class="text-center"><a
							th:href="@{/manager/paymethod/view/{id}(id=${pm.methodId})}"
							class="btn btn-sm btn-view px-3">View</a> <a
							th:href="@{/manager/paymethod/edit/{id}(id=${pm.methodId})}"
							class="btn btn-sm btn-edit px-3">Edit</a>
							<button type="button" class="btn btn-sm btn-delete px-3"
								th:attr="data-id=${pm.methodId},data-name=${pm.name}"
								onclick="showDeleteModal(this)">Delete</button></td>
					</tr>
					<tr th:if="${#lists.isEmpty(payMethods)}">
						<td colspan="7" class="text-center text-muted py-4">No
							payment methods found.</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

	<!-- Delete Warning Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">⚠️ သတိပေးချက် (Warning)</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4">
					<p class="fs-6 mb-3">
						Are you sure you want to <strong style="color: #b07d62;">delete</strong>
						this payment method?
					</p>
					<div class="alert alert-warning mb-0">
						<strong>Method Name:</strong> <span id="deleteMethodName"
							class="fw-bold"></span> <br> <strong>Method ID:</strong> <span
							id="deleteMethodId" class="fw-bold"></span>
						<hr class="my-2" style="border-color: #e6d5c3;">
						<small>⚠️ <strong>This action cannot be undone.</strong></small>
					</div>
				</div>
				<div class="modal-footer border-0">
					<button type="button" class="btn"
						style="background-color: #e6d5c3; color: #5c3a21; border-radius: 12px; font-weight: 600;"
						data-bs-dismiss="modal">Cancel</button>
					<a id="confirmDeleteBtn" href="#" class="btn"
						style="background-color: #b07d62; color: white; border-radius: 12px; font-weight: 600;">Yes,
						Delete</a>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Delete Modal Script -->
	<script>
		function showDeleteModal(button) {
			const id = button.getAttribute('data-id');
			const name = button.getAttribute('data-name');

			document.getElementById('deleteMethodName').textContent = name;
			document.getElementById('deleteMethodId').textContent = id;
			document.getElementById('confirmDeleteBtn').href = '/paymethod/delete/'
					+ id;

			const modal = new bootstrap.Modal(document
					.getElementById('deleteModal'));
			modal.show();
		}
	</script>

</body>
</html>
