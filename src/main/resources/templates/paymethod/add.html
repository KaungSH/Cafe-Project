<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Payment Method</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5 mb-5">
		<div class="row justify-content-center">
			<div class="col-md-7">
				<div class="card shadow">

					<div class="card-header bg-success text-white">
						<h4 class="mb-0">Add New Payment Method</h4>
					</div>

					<div class="card-body">
						<form th:action="@{/admin/paymethod/add}"
							th:object="${payMethod}" method="post" enctype="multipart/form-data">

							<!-- Name -->
							<div class="mb-3">
								<label class="form-label fw-bold">Method Name</label> <input
									type="text" class="form-control" th:field="*{name}"
									placeholder="e.g. Cash, KBZ Pay, Wave Money" required /> <small
									class="text-muted">(UNIQUE)။</small>
							</div>

							<!-- Description -->
							<div class="mb-3">
								<label class="form-label fw-bold">Description</label>
								<textarea class="form-control" rows="3"
									th:field="*{description}" placeholder="Example"></textarea>
							</div>

							<!-- Cover Image -->
                            <div class="mb-4">

                                <label for="coverImg" class="form-label fw-semibold">
                                    Logo Image
                                </label>
                                
                                <input type="file" id="coverImg" name="coverImgPart" class="form-control" accept="image/*">
                                <div class="form-text">
                                    Select an image as a Logo for the PayMethod.
                                </div>

                                <div class="mt-3">
                                    <img id="coverPreview" class="img-fluid" style="display: none;" alt="Cover image Error">
                                </div>

                            </div>

							<!-- Active checkbox -->
							<div class="form-check mb-3">
								<input class="form-check-input" type="checkbox"
									th:field="*{active}" id="isActive" checked /> <label
									class="form-check-label fw-bold" for="isActive"> </label>
							</div>

							<!-- Buttons -->
							<div class="d-flex justify-content-end gap-2 mt-4">
								<a th:href="@{/admin/paymethod}" class="btn btn-secondary">Cancel</a>
								<button type="submit" class="btn btn-success px-4">Save
									Method</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<!-- Bootstrap JavaScript -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>


    <!-- Image Preview -->
    <script>
        document.getElementById("coverImg").addEventListener("change", function(event) {

            const file = event.target.files[0];
            const preview = document.getElementById("coverPreview");

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        });
    </script>

</body>
</html>
