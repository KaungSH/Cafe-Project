<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Payment Method | Cafe Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #f8f5f0;
            --surface: #ffffff;
            --espresso-dark: #1a110a;
            --roast-caramel: #b8864e;
            --champagne-gold: #cbb493;
            --border-subtle: #ede4d8;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b1d14;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            color: var(--espresso-dark);
            font-weight: 700;
        }

        .form-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 16px 40px -10px rgba(43, 29, 20, 0.08);
            overflow: hidden;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        /* Expense Category လိုမျိုး အပေါ်ထိပ် ကော်ဖီနောက်ခံ Header */
        .card-header-banner {
            background: linear-gradient(180deg, rgba(26, 17, 10, 0.70) 0%, rgba(26, 17, 10, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            padding: 36px 36px 28px 36px;
            position: relative;
        }

        .logo-glow {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--champagne-gold);
            box-shadow: 0 0 18px rgba(203, 180, 147, 0.5);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .logo-glow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-control, .form-check-input {
            border: 1.5px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--roast-caramel);
            box-shadow: 0 0 0 4px rgba(184, 134, 78, 0.15);
        }

        .upload-dropzone {
            border: 2px dashed var(--border-subtle);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            background: #faf7f2;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .upload-dropzone:hover {
            border-color: var(--roast-caramel);
            background: #fbf5ee;
        }

        .btn-luxury {
            background: linear-gradient(135deg, var(--roast-caramel) 0%, #9c6c39 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 12px 28px;
            transition: all 0.25s ease;
        }
        .btn-luxury:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(61, 38, 24, 0.25);
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="form-card">
                <!-- Top Coffee Banner (Expense Category Style) -->
                <div class="card-header-banner">
                    <div class="logo-glow">
                        <img th:src="@{/images/luft-logo.png}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/924/924514.png'" alt="Logo">
                    </div>
                    <h2 class="brand-title text-white mb-1" style="font-size: 1.85rem;">Café Luft</h2>
                    <p class="text-white-50 small mb-2">Configure and authorize payment channels for seamless guest checkouts.</p>
                    <span class="badge" style="background: rgba(255,255,255,0.12); color: var(--champagne-gold); border: 1px solid rgba(255,255,255,0.2);">
                        <i class="bi bi-shield-check me-1"></i> Admin Privileges
                    </span>
                </div>

                <!-- Form Fields -->
                <div class="p-4 p-md-5">
                    <a th:href="@{/admin/paymethod}" class="text-decoration-none text-muted small fw-semibold d-inline-block mb-3">
                        <i class="bi bi-arrow-left"></i> Back to Payment List
                    </a>
                    <h3 class="brand-title mb-1">Add Payment Method</h3>
                    <p class="text-muted small mb-4">Configure a new transaction method for Cafe Luft guests.</p>

                    <form th:action="@{/admin/paymethod/add}" th:object="${payMethod}" method="post" enctype="multipart/form-data">
                        <!-- Method Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.8px; color: #7f7267;">Method Name</label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. KBZPay, WavePay, Cash" required />
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.8px; color: #7f7267;">Description</label>
                            <textarea class="form-control" rows="3" th:field="*{description}" placeholder="Brief overview of transaction terms..."></textarea>
                        </div>

                        <!-- Logo / Icon -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.8px; color: #7f7267;">Logo / Icon</label>
                            <label for="coverImg" class="upload-dropzone d-block">
                                <i class="bi bi-cloud-arrow-up fs-2" style="color: var(--roast-caramel);"></i>
                                <div class="fw-semibold mt-1">Click to upload method logo</div>
                                <span class="text-muted small">PNG, JPG or SVG formats accepted</span>
                                <input type="file" id="coverImg" name="coverImgPart" class="d-none" accept="image/*">
                            </label>
                            <div class="mt-3 text-center">
                                <img id="coverPreview" class="rounded-3 shadow-sm" style="display: none; max-height: 120px; object-fit: contain; border: 1px solid var(--border-subtle); padding: 6px;" alt="Logo Preview">
                            </div>
                        </div>

                        <!-- Active Toggle -->
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" th:field="*{active}" id="isActive" checked>
                            <label class="form-check-label fw-semibold ms-2" for="isActive">Set as Active instantly</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/admin/paymethod}" class="btn btn-light px-4" style="border-radius: 12px; font-weight: 600;">Cancel</a>
                            <button type="submit" class="btn btn-luxury">Save Payment Method</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById("coverImg").addEventListener("change", function(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("coverPreview");
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "inline-block";
        } else {
            preview.src = "";
            preview.style.display = "none";
        }
    });
</script>
</body>
</html>
