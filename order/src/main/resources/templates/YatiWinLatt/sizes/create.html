<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Size</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light py-4">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow-sm border-0">
					<div class="card-header bg-primary text-white py-3">
						<h4 class="card-title mb-0">
							<i class="fa-solid fa-plus-circle me-2"></i>Create New Size
						</h4>
					</div>
					<div class="card-body p-4">
						<form th:action="@{/sizes/create}" th:object="${sizeDto}"
							method="post" novalidate>


							<div class="mb-3">
								<label for="employee" class="form-label fw-semibold">
									Employee / Created By <span class="text-danger">*</span>
								</label> <select id="employee" th:field="*{employee_id}"
									class="form-select"
									th:classappend="${#fields.hasErrors('employee_id')} ? 'is-invalid' : ''">
									<option value="">-- Select Employee --</option>
									<option th:each="emp : ${employees}"
										th:value="${emp.employee_id}" th:text="${emp.name}">Employee
										Name</option>
								</select>
								<div class="invalid-feedback"
									th:if="${#fields.hasErrors('employee_id')}"
									th:errors="*{employee_id}"></div>
							</div>

							<!-- Size Code Input -->
							<div class="mb-3">
								<label for="sizeCode" class="form-label fw-semibold">
									Size Code <span class="text-danger">*</span>
								</label> <input type="text" id="sizeCode" th:field="*{size_code}"
									class="form-control" placeholder="S, M, L"
									th:classappend="${#fields.hasErrors('size_code')} ? 'is-invalid' : ''">
								<div class="invalid-feedback"
									th:if="${#fields.hasErrors('size_code')}"
									th:errors="*{size_code}"></div>
							</div>

							<div class="mb-3">
								<label for="sizeName" class="form-label fw-semibold">
									Size Name <span class="text-danger">*</span>
								</label> <input type="text" id="sizeName" th:field="*{name}"
									class="form-control" placeholder="Small, Medium, Large"
									th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
								<div class="invalid-feedback"
									th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
							</div>

							<div class="mb-4 form-check form-switch">
								<input type="checkbox" th:field="*{is_active}" th:value="true"
									class="form-check-input" id="isActiveCheck" role="switch">
								<label class="form-check-label fw-semibold" for="isActiveCheck">Is
									Active</label>
							</div>


							<div class="d-flex justify-content-end gap-2">
								<a th:href="@{/sizes}" class="btn btn-secondary"> <i
									class="fa-solid fa-xmark me-1"></i> Cancel
								</a>
								<button type="submit" class="btn btn-primary">
									<i class="fa-solid fa-floppy-disk me-1"></i> Save Size
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
