
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category Management</title>

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	font-family: Arial, sans-serif;
	background: #f5f6fa;
}

.container {
	width: 90%;
	margin: 40px auto;
}

.header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

h1 {
	color: #333;
}

.btn {
	padding: 10px 18px;
	border-radius: 6px;
	text-decoration: none;
	color: white;
	background: #3498db;
}

.btn:hover {
	background: #2980b9;
}

table {
	width: 100%;
	border-collapse: collapse;
	background: white;
	box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}

th, td {
	padding: 14px;
	border-bottom: 1px solid #ddd;
	text-align: left;
}

th {
	background: #34495e;
	color: white;
}

.edit {
	color: #2980b9;
	text-decoration: none;
	margin-right: 10px;
}

.delete {
	color: #e74c3c;
	text-decoration: none;
}

.empty {
	text-align: center;
	padding: 30px;
}
</style>
</head>

<body>

	<div class="container">

		<div class="header">
			<h1>Category Management</h1>

			<a href="/categories/add" class="btn"> + Add Category </a>
		</div>

		<table>

			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Description</th>
					<th>Active</th>
					<th>Action</th>
				</tr>
			</thead>

			<tbody>

				<tr th:each="category : ${categories}">

					<td th:text="${category.category_id}"></td>

					<td th:text="${category.name}"></td>

					<td th:text="${category.description}"></td>

					<td th:text="${category.is_active ? 'Active' : 'Inactive'}"></td>

					<td><a class="edit"
						th:href="@{/categories/edit/{id}(id=${category.category_id})}">
							Edit </a> <a class="delete"
						th:href="@{/categories/delete/{id}(id=${category.category_id})}">
							Delete </a></td>

				</tr>

				<tr th:if="${#lists.isEmpty(categories)}">
					<td colspan="5" class="empty">No categories found.</td>
				</tr>

			</tbody>

		</table>

	</div>

</body>
</html>
