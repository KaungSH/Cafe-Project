<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <title>Add Branch Stats | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #F8F5F0;
            color: #2D241E;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .form-wrapper {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .luxury-card {
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 16px 36px -10px rgba(58, 41, 26, 0.08), 0 0 1px 1px rgba(214, 197, 178, 0.25);
            padding: 34px 40px;
        }

        .luxury-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #F0E8DC;
        }

        .icon-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7D5127, #533314);
            color: #F4E8D8;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 14px rgba(83, 51, 20, 0.25);
        }

        .luxury-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #2B1D14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .luxury-subtitle {
            font-size: 13px;
            color: #8C7B6C;
            margin-top: 3px;
        }

        .badge-pill-coffee {
            background-color: #F3EBDD;
            color: #6C441E;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 12px;
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: #554133;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom .icon-addon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9C8976;
            font-size: 15px;
        }

        .form-control-luxury {
            width: 100%;
            background-color: #FAF8F5;
            border: 1px solid #DFD5C6;
            border-radius: 11px;
            padding: 10px 14px 10px 38px;
            color: #2D241E;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-control-luxury:focus {
            background-color: #FFFFFF;
            border-color: #8B572A;
            box-shadow: 0 0 0 3px rgba(139, 87, 42, 0.12);
            outline: none;
        }

        .btn-luxury-primary {
            background: linear-gradient(135deg, #7D5127 0%, #583718 100%);
            color: #FFFFFF;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 14px rgba(88, 55, 24, 0.2);
        }

        .btn-luxury-primary:hover {
            background: linear-gradient(135deg, #6C441E 0%, #442911 100%);
            transform: translateY(-1px);
            color: #FFFFFF;
        }

        .btn-luxury-cancel {
            background-color: #EFE8DD;
            color: #5C4533;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-luxury-cancel:hover {
            background-color: #E2D7C7;
            color: #3C2B1D;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="form-wrapper">
        <div class="luxury-card">
            <div class="luxury-header">
                <div class="icon-badge">
                    <i class="bi bi-graph-up-arrow"></i>
                </div>
                <div>
                    <h2>Add Branch Stats</h2>
                    <div class="luxury-subtitle">
                        For Branch: <span class="badge-pill-coffee" th:text="${branch_name}">Café Luft</span>
                        &bull; Month: <span class="badge-pill-coffee" th:text="${month_name}">October</span>
                    </div>
                </div>
            </div>

            <form th:action="@{/manager-only/branchstats/add}" th:object="${branchesStats}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Sale Count</label>
                        <div class="input-group-custom">
                            <i class="bi bi-cart-check icon-addon"></i>
                            <input type="number" class="form-control-luxury" th:field="*{salecount}" min="0" placeholder="0" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Sale Amount (MMK)</label>
                        <div class="input-group-custom">
                            <i class="bi bi-cash-stack icon-addon"></i>
                            <input type="number" class="form-control-luxury" th:field="*{saleamount}" min="0" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Employee Cost (MMK)</label>
                        <div class="input-group-custom">
                            <i class="bi bi-wallet2 icon-addon"></i>
                            <input type="number" class="form-control-luxury" th:field="*{employee_cost}" min="0" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 mt-4 pt-3 border-top border-light-subtle">
                    <a th:href="@{/manager-only/branchstats}" class="btn-luxury-cancel">Cancel</a>
                    <button type="submit" class="btn-luxury-primary">
                        <i class="bi bi-check2"></i> Save Statistics
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
