<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Branch Statistics Overview | Café Luft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #F8F5F0;
            color: #2D241E;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .stats-dashboard {
            width: 95%;
            max-width: 1400px;
            margin: 35px auto;
        }

        /* Luxury Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-avatar {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #7D5127, #4E3013);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F4E8D8;
            font-size: 20px;
            box-shadow: 0 6px 14px rgba(78, 48, 19, 0.2);
            flex-shrink: 0;
        }

        .header-title-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #261B14;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .header-title-box p {
            font-size: 13px;
            color: #8C7A68;
            margin: 2px 0 0 0;
        }

        .admin-badge {
            background: #EFE6D8;
            color: #6C441E;
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid #DFD2C0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Glass / Card Table Design */
        .table-container {
            background: #FFFFFF;
            border-radius: 18px;
            border: 1px solid rgba(214, 197, 178, 0.45);
            box-shadow: 0 12px 30px -8px rgba(58, 41, 26, 0.06), 0 0 1px 1px rgba(214, 197, 178, 0.2);
            overflow: hidden;
        }

        .table-luxury {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-luxury thead th {
            background: #FAF5EE;
            color: #796450;
            padding: 15px 20px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #EADBCC;
            white-space: nowrap;
        }

        .table-luxury tbody td {
            padding: 15px 20px;
            color: #49382B;
            font-size: 13.5px;
            border-bottom: 1px solid #F3ECE2;
            vertical-align: middle;
        }

        .table-luxury tbody tr:last-child td {
            border-bottom: none;
        }

        .table-luxury tbody tr:hover {
            background-color: #FAF6EF;
        }

        .badge-branch {
            font-weight: 600;
            color: #2D1D12;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-month {
            background-color: #F1E7D9;
            color: #6C4724;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .val-count {
            background-color: #F8F5F0;
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 700;
            color: #5D3D1E;
            border: 1px solid #EADBCC;
            display: inline-block;
        }

        .val-amount {
            font-weight: 700;
            color: #2D1D12;
        }

        .user-creator {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #6E5B4B;
            font-weight: 500;
        }

        .user-avatar-circle {
            width: 26px;
            height: 26px;
            background: #EFE6D8;
            color: #6C441E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="stats-dashboard">
        <!-- Header Section -->
        <div class="dashboard-header">
            <div class="header-title-box">
                <div class="header-avatar">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div>
                    <h2>Branch Stats Management</h2>
                    <p>Overview and read-only analytical performance records</p>
                </div>
            </div>

            <div>
                <span class="admin-badge">
                    <i class="bi bi-lock-fill"></i> Admin Privilege (Read Only)
                </span>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <table class="table-luxury">
                <thead>
                    <tr>
                        <th style="width: 60px;">No</th>
                        <th>Branch Name</th>
                        <th>Sale Count</th>
                        <th>Sale Amount</th>
                        <th>Month</th>
                        <th>Employee Salaries</th>
                        <th>Created By</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="branchesStats, state : ${branchesStatses}">
                        <td th:text="${state.count}" class="text-muted fw-semibold">1</td>
                        <td>
                            <div class="badge-branch">
                                <i class="bi bi-geo-alt-fill text-muted" style="font-size: 12px;"></i>
                                <span th:text="${branchesStats.branch_name}">Café Luft - Main</span>
                            </div>
                        </td>
                        <td>
                            <span class="val-count" th:text="${branchesStats.salecount}">0</span>
                        </td>
                        <td class="val-amount" th:text="${#numbers.formatDecimal(branchesStats.saleamount, 1, 'COMMA', 2, 'POINT')} + ' MMK'">
                            0.00 MMK
                        </td>
                        <td>
                            <span class="badge-month" th:text="${branchesStats.month}">October</span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(branchesStats.employee_cost, 1, 'COMMA', 2, 'POINT')} + ' MMK'">
                            0.00 MMK
                        </td>
                        <td>
                            <div class="user-creator">
                                <span class="user-avatar-circle">
                                    <i class="bi bi-person-fill"></i>
                                </span>
                                <span th:text="${branchesStats.employee_name}">Admin</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(branchesStatses)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                            No branch statistics recorded yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
