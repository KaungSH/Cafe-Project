<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Café Luft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #eef1f5;
            font-family: Arial, sans-serif;
            color: #303943;
        }

        .profile-card {
            max-width: 680px;
            margin: 35px auto;
            padding: 35px 40px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 35px rgba(0,0,0,.06);
        }

        .back-link {
            color: #414951;
            text-decoration: none;
            font-size: 25px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #000;
        }

        .profile-photo {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #edf0e9;
        }

        .photo-button {
            width: 38px;
            height: 38px;
            position: absolute;
            bottom: 2px;
            right: 0;
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            background: #43cc83;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .photo-button:hover {
            transform: scale(1.08);
        }

        .form-label {
            color: #81878e;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .form-control, .form-select {
            min-height: 56px;
            border: 1px solid #dce0e4;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 16px;
            background-color: #fff;
            color: #303943;
        }

        .form-control:focus, .form-select:focus {
            border-color: #43cdb2;
            box-shadow: 0 0 0 3px rgba(67,205,178,.12);
        }

        .save-btn {
            min-height: 60px;
            border: none;
            border-radius: 40px;
            background: #43cc83;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: #38b673;
            color: white;
        }

        @media (max-width: 576px) {
            .profile-card {
                margin: 15px;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="profile-card">

        <!-- Header & Back Button -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <!-- Role အလိုက် သက်ဆိုင်ရာ စာမျက်နှာဆီ ပြန်လှည့်ပေးခြင်း -->
            <a th:href="${session.employeeRole == 'MANAGER' ? '/manager-only/daily-register/all' : '/'}" 
               class="back-link" 
               title="Back">
                <i class="bi bi-chevron-left"></i>
            </a>
            <h2 class="fs-3 fw-bold mb-0">My Profile</h2>
            <div style="width: 25px;"></div>
        </div>

        <!-- Role အလိုက် သက်ဆိုင်ရာ URL ဆီ post လုပ်ပေးခြင်း -->
        <form th:action="${session.employeeRole == 'MANAGER' ? '/manager/profile' : '/admin/profile'}"
              method="post"
              enctype="multipart/form-data">

            <!-- Profile Photo Upload -->
            <div class="text-center my-4">
                <div class="position-relative d-inline-block">
                    <img id="profilePreview"
                         th:src="${session.employeeImage != null ? session.employeeImage : '/images/profile.jpg'}"
                         src="/images/profile.jpg"
                         alt="Profile Photo"
                         class="profile-photo">

                    <label for="photo" class="photo-button d-flex align-items-center justify-content-center">
                        <i class="bi bi-camera"></i>
                    </label>

                    <input type="file" id="photo" name="photo" accept="image/*" class="d-none">
                </div>
            </div>

            <!-- Name -->
            <div class="mb-4">
                <label class="form-label">Your Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       th:value="${session.employeeName != null ? session.employeeName : ''}"
                       placeholder="Enter your name"
                       required>
            </div>

            <!-- Date of Birth -->
            <div class="mb-4">
                <label class="form-label">Date of Birth</label>
                <input type="date" id="dob" name="dateOfBirth" class="form-control">
            </div>

            <!-- Gender & Age -->
            <div class="row mb-4">
                <div class="col-6">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="col-6">
                    <label class="form-label">Age</label>
                    <input type="number" id="age" name="age" class="form-control" placeholder="Enter age" min="0">
                </div>
            </div>

            <!-- Role (Display Only) -->
            <div class="mb-4">
                <label class="form-label">Role</label>
                <input type="text"
                       class="form-control bg-light"
                       th:value="${session.employeeRole != null ? session.employeeRole : 'EMPLOYEE'}"
                       readonly>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email">
            </div>

            <!-- Save Button -->
            <div class="d-grid mt-4">
                <button type="submit" class="save-btn">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Profile
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    // Photo Preview Logic
    const photoInput = document.getElementById('photo');
    const preview = document.getElementById('profilePreview');

    photoInput.addEventListener('change', function () {
        if (this.files && this.files[0]) {
            preview.src = URL.createObjectURL(this.files[0]);
        }
    });

    // Auto Calculate Age Logic
    const dobInput = document.getElementById('dob');
    const ageInput = document.getElementById('age');

    function calculateAge() {
        if (!dobInput.value) {
            ageInput.value = '';
            return;
        }

        const birth = new Date(dobInput.value);
        const today = new Date();
        let age = today.getFullYear() - birth.getFullYear();

        const monthDiff = today.getMonth() - birth.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
            age--;
        }

        ageInput.value = age >= 0 ? age : '';
    }

    dobInput.addEventListener('input', calculateAge);
    dobInput.addEventListener('change', calculateAge);
</script>

</body>
</html>
