<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deleted Stock Import List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h2>Deleted Stock Import List</h2>
    <a th:href="@{/stock-imports}" class="btn btn-secondary mb-3">Back to Active List</a>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Import ID</th>
                <th>Imported At</th>
                <th>Supplier</th>
                <th>Employee</th>
                <th>Branch</th>
                <th>Total Cost</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="imp : ${imports}">
                <td th:text="${imp.import_id}">SI-001</td>
                <td th:text="${#temporals.format(imp.imported_at, 'yyyy-MM-dd HH:mm')}">2026-10-01</td>
                <td th:text="${imp.supplier_name}">Supplier A</td>
                <td th:text="${imp.employee_name}">Employee A</td>
                <td th:text="${imp.branch_name}">Branch A</td>
                <td th:text="${imp.total_cost}">100.00</td>
                <td>
                    <a th:href="@{/stock-imports/recover/{id}(id=${imp.import_id})}" class="btn btn-sm btn-outline-success">Recover</a>
                    <a th:href="@{/stock-imports/hard-delete/{id}(id=${imp.import_id})}" class="btn btn-sm btn-outline-danger">Hard Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
