<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Stock Import</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
	<div class="card p-4">
		<h3>Add Stock Import</h3>
		<form th:action="@{/stock-import/add}" th:object="${stockImport}"
			method="post">
			<div class="row mb-3">
				<div class="col-md-3">
					<label>Import ID:</label> <input type="text" th:field="*{import_id}"
						class="form-control" readonly />
				</div>
				<div class="col-md-3">
					<label>Imported At:</label> <input type="datetime-local"
						th:field="*{imported_at}" class="form-control" required />
				</div>
				<div class="col-md-3">
					<label>Supplier:</label> <select th:field="*{supplier_id}"
						class="form-select" required>
						<option value="SUP-001">Supplier A</option>
						<option value="SUP-002">Supplier B</option>
					</select>
				</div>
			</div>

			<h5 class="mt-4">Ingredients</h5>
			<table class="table table-bordered align-middle">
				<thead>
					<tr>
						<th>Select</th>
						<th>Ingredient</th>
						<th>Unit</th>
						<th>Quantity</th>
						<th>Unit Cost</th>
						<th>Manufactured</th>
						<th>Expire</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item, stat : *{items}">
						<td><input type="checkbox"
							th:field="*{items[__${stat.index}__].selected}" /> <input
							type="hidden"
							th:field="*{items[__${stat.index}__].ingredientTypeId}" /></td>
						<td th:text="${item.ingredientTypeName}">Sugar</td>
						<td th:text="${item.unitName}">kg</td>
						<td><input type="number" step="0.01"
							th:field="*{items[__${stat.index}__].quantity_ordered}"
							class="form-control" /></td>
						<td><input type="number" step="0.01"
							th:field="*{items[__${stat.index}__].unit_cost}"
							class="form-control" /></td>
						<td><input type="date"
							th:field="*{items[__${stat.index}__].manufactured_date}"
							class="form-control" /></td>
						<td><input type="date"
							th:field="*{items[__${stat.index}__].expire_date}"
							class="form-control" /></td>
					</tr>
				</tbody>
			</table>

			<div class="text-end">
				<button type="submit" class="btn btn-warning">[ Update Stock Import ]</button>
			</div>
		</form>
	</div>


</body>
</html>
