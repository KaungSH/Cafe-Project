<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Luft | Recycle Bin</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #fbf8f5;
  color: #2b1c11;
  padding: 40px 20px;
}

.luxury-container {
  max-width: 1100px;
  margin: auto;
}

.archive-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  border-bottom: 2px solid #ecdac8;
  padding-bottom: 20px;
}

.archive-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
}

.btn-back {
  background: #3b281b;
  color: #f7ede3;
  padding: 10px 20px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-back:hover {
  background: #25180f;
  color: #fff;
}

.table-card {
  background: #ffffff;
  border-radius: 18px;
  border: 1px solid #ebdcd0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.03);
  overflow: hidden;
}

.table thead th {
  background: #f4eae0;
  padding: 16px 20px;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #634731;
  border: none;
}

.table tbody td {
  padding: 16px 20px;
  vertical-align: middle;
  border-bottom: 1px solid #f6eee6;
}

.btn-restore {
  background: #f1f8f3;
  border: 1px solid #b7dcbf;
  color: #2e6939;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  transition: 0.2s;
}

.btn-restore:hover {
  background: #2e6939;
  color: #fff;
}

.btn-permanent {
  background: #fff5f5;
  border: 1px solid #f0baba;
  color: #a82e2e;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  transition: 0.2s;
}

.btn-permanent:hover {
  background: #a82e2e;
  color: #fff;
}
</style>
</head>

<body>
<div layout:fragment="content">
  <div class="archive-header">
    <div>
      <h2><i class="fa-solid fa-trash-can text-muted me-2"></i>Recycle Bin (Deleted Sizes)</h2>
      <p class="text-muted small mb-0 mt-1">Recover soft-deleted cup sizes or remove them permanently.</p>
    </div>
    <a th:href="@{/admin/sizes}" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Back to Size List
    </a>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th style="width: 140px;">Size Code</th>
            <th>Name</th>
            <th>Created By</th>
            <th style="width: 250px;" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(sizes)}">
            <td colspan="4" class="text-center py-5 text-muted">No deleted sizes in recycle bin.</td>
          </tr>
          <tr th:each="s : ${sizes}">
            <td><span class="badge bg-light text-dark border px-2 py-1" th:text="${s.size_code}">SZ-01</span></td>
            <td><strong th:text="${s.name}">Large</strong></td>
            <td class="text-secondary" th:text="${s.employee_name != null ? s.employee_name : '-'}">Admin</td>
            <td class="text-end">
              <a th:href="@{/admin/sizes/recover/{id}(id=${s.size_id})}" class="btn-restore me-1">
                <i class="fa-solid fa-rotate-left me-1"></i> Restore
              </a>
              <a th:href="@{/admin/sizes/hard-delete/{id}(id=${s.size_id})}" class="btn-permanent">
                <i class="fa-solid fa-trash-xmark me-1"></i> Permanent Delete
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
