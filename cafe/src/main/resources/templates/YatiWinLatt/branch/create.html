<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Branch - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--primary-hover: #432B20;
	--bg-main: #FAF7F2;
	--card-bg: #FFFFFF;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-card {
	background-color: var(--card-bg);
	border: 1px solid #EAE3DC;
	border-radius: 12px;
	padding: 32px 40px;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
	margin-top: 30px;
	margin-bottom: 30px;
}

.page-title {
	color: var(--primary-color);
	font-weight: 700;
	font-size: 1.6rem;
}

.form-label {
	color: #4A3E3D;
	font-size: 0.95rem;
}

.form-control, .form-select {
	padding: 10px 12px;
	border-radius: 8px;
	border: 1px solid #D6CECE;
}

.form-control:focus, .form-select:focus {
	border-color: var(--primary-color);
	box-shadow: 0 0 0 0.25rem rgba(92, 61, 46, 0.15);
}

.btn-submit {
	background-color: var(--primary-color);
	color: #ffffff;
	font-weight: 600;
	border-radius: 8px;
	padding: 9px 24px;
	border: none;
	transition: background-color 0.2s;
}

.btn-submit:hover {
	background-color: var(--primary-hover);
	color: #ffffff;
}

.btn-cancel {
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
	border-radius: 8px;
	padding: 9px 24px;
	text-decoration: none;
	font-weight: 600;
	display: inline-block;
	transition: all 0.2s;
}

.btn-cancel:hover {
	background-color: #D7CCC8;
	color: #3E2723;
}
</style>
</head>

<body>

	<div class="container py-4" style="max-width: 650px;">
		<div class="main-card">

			<h3 class="page-title mb-4">
				<i class="fa-solid fa-store me-2"></i>Add New Branch
			</h3>

			<form th:action="@{/branches/create}" th:object="${branchDto}"
				method="post" novalidate>


				<div class="mb-3">
					<label for="name" class="form-label fw-bold">Branch Name <span
						class="text-danger">*</span></label> <input type="text" id="name"
						th:field="*{name}" class="form-control"
						placeholder="e.g. Downtown Branch"
						th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
					<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
						th:errors="*{name}"></div>
				</div>


				<div class="mb-3">
					<label for="location" class="form-label fw-bold"> Location
						<span class="text-danger">*</span>
					</label> <input type="text" id="location" th:field="*{location}"
						class="form-control" placeholder="e.g. Yangon"
						th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
				</div>

				<div class="mb-3">
					<label for="description" class="form-label fw-bold">Description</label>
					<textarea id="description" th:field="*{description}"
						class="form-control" rows="3" placeholder="Branch details..."
						th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('description')}"
						th:errors="*{description}"></div>
				</div>


				<div class="mb-3">
					<label for="branch_status_id" class="form-label fw-bold">
						Status <span class="text-danger">*</span>
					</label> <select id="branch_status_id" th:field="*{branch_status_id}"
						class="form-select"
						th:classappend="${#fields.hasErrors('branch_status_id')} ? 'is-invalid' : ''">
						<option value="">-- Select Status --</option>
						<option th:each="status : ${statuses}"
							th:value="${status.branch_status_id}" th:text="${status.name}"></option>
					</select>
					<div class="invalid-feedback"
						th:if="${#fields. hasErrors('branch_status_id')}"
						th:errors="*{branch_status_id}"></div>
				</div>


				<div class="mb-3">
					<label for="opening_time" class="form-label fw-bold">
						Opening Time <span class="text-danger">*</span>
					</label> <input type="time" id="opening_time" th:field="*{opening_time}"
						class="form-control"
						th:classappend="${#fields.hasErrors('opening_time')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('opening_time')}"
						th:errors="*{opening_time}"></div>
				</div>


				<div class="mb-3">
					<label for="closing_time" class="form-label fw-bold">
						Closing Time <span class="text-danger">*</span>
					</label> <input type="time" id="closing_time" th:field="*{closing_time}"
						class="form-control"
						th:classappend="${#fields.hasErrors('closing_time')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('closing_time')}"
						th:errors="*{closing_time}"></div>
				</div>


				<div class="mt-4 d-flex gap-2 justify-content-end">
					<a th:href="@{/branches}" class="btn btn-cancel"> <i
						class="fa-solid fa-xmark me-1"></i>Cancel
					</a>
					<button type="submit" class="btn btn-submit">
						<i class="fa-solid fa-floppy-disk me-1"></i>Save Branch
					</button>
				</div>

			</form>

		</div>
	</div>

</body>
</html>
