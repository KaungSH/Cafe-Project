<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Size Management - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--primary-hover: #432B20;
	--bg-main: #FAF7F2;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.page-container {
	padding: 40px 60px;
}

.page-title {
	color: var(--primary-color);
	font-size: 28px;
	font-weight: 700;
}

.top-bar {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

.add-btn {
	background-color: var(--primary-color);
	border-color: var(--primary-color);
	color: white;
	padding: 10px 20px;
	font-weight: 600;
	border-radius: 8px;
	box-shadow: 0 2px 6px rgba(92, 61, 46, 0.15);
}

.add-btn:hover {
	background-color: var(--primary-hover);
	border-color: var(--primary-hover);
	color: white;
}

.table-responsive {
	background-color: white;
	border-radius: 12px;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
	border: 1px solid #EAE3DC;
	overflow: hidden;
}

.size-table {
	width: 100%;
	border-collapse: collapse;
}

.size-table thead th {
	font-weight: 700;
	color: var(--primary-color);
	padding: 18px 25px;
	border-bottom: 2px solid #EAE3DC;
	background-color: #FCFAF8;
}

.size-table tbody td {
	padding: 16px 25px;
	border-bottom: 1px solid #F0EAE5;
	vertical-align: middle;
}

.size-table tbody tr:hover {
	background-color: #FAF5F0;
}

.code-badge {
	background-color: #F4EAE1;
	color: #5C3D2E;
	border: 1px solid #E8D5C4;
	padding: 4px 12px;
	border-radius: 6px;
	font-size: 13px;
	font-weight: 600;
}

.edit-btn {
	color: #8C592B;
	border: 1px solid #E0A96D;
	background-color: #FFFDF9;
}

.edit-btn:hover {
	background-color: #E0A96D;
	color: #FFF;
}

.delete-btn {
	color: #B23B2A;
	border: 1px solid #E6B6B0;
	background-color: #FFFDF9;
}

.delete-btn:hover {
	background-color: #B23B2A;
	color: white;
}

.action-btn {
	padding: 6px 14px;
	border-radius: 6px;
	font-size: 13px;
	font-weight: 600;
	margin-right: 4px;
}

.empty-row {
	text-align: center;
	color: #9E8E89;
	padding: 40px !important;
}
</style>
</head>
<body>

	<div class="page-container">
		<!-- Page Header -->
		<div class="top-bar">
			<h2 class="page-title mb-0">Size Management</h2>
			<a th:href="@{/sizes/create}" class="btn add-btn"> <i
				class="fa-solid fa-plus me-1"></i>Add New Size
			</a>
		</div>

		<!-- Size Table -->
		<div class="table-responsive">
			<table class="size-table">
				<thead>
					<tr>
						<th style="width: 30%;">Size Code</th>
						<th style="width: 30%;">Name</th>
						<th style="width: 20%;">Status</th>
						<th style="width: 20%;">Action</th>
					</tr>
				</thead>
				<tbody>
					<!-- Size Records -->
					<tr th:each="s : ${sizes}">
						<td><span class="code-badge" th:text="${s.size_code}">S</span></td>
						<td th:text="${s.name}">Small</td>
						<td><span th:if="${s.is_active}"
							class="text-success fw-semibold"> <i
								class="fa-solid fa-check me-1"></i>Active
						</span> <span th:unless="${s.is_active}"
							class="text-secondary fw-semibold"> <i
								class="fa-solid fa-xmark me-1"></i>Inactive
						</span></td>
						<td><a th:href="@{/sizes/edit/{id}(id=${s.size_id})}"
							class="btn btn-sm action-btn edit-btn">Edit</a> <a
							th:href="@{/sizes/delete/{id}(id=${s.size_id})}"
							class="btn btn-sm action-btn delete-btn"
							onclick="return confirm('Are you sure?');">Delete</a></td>
					</tr>

					<!-- Empty -->
					<tr th:if="${#lists.isEmpty(sizes)}">
						<td colspan="4" class="empty-row"><i
							class="fa-solid fa-folder-open fa-2x mb-2 d-block"></i> No size
							records found. Click <strong>"Add New Size"</strong> to create
							one.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

</body>
</html>
