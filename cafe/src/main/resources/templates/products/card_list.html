<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <title>MENU - Café Луфт</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --cafe-primary: #8C6239;
            --cafe-primary-dark: #5C3D2E;
            --cafe-gold: #C5A059;
            --cafe-gold-light: #F7F3EB;
            --cafe-dark: #1E1A17;
            --cafe-bg: #FDFBF7;
            --cafe-card-bg: #FFFFFF;
            --cafe-text-muted: #827E7A;
            --cafe-border: #EFE9E1;
            --cafe-success: #2E7D32;
            --cafe-warning: #D97706;
            --cafe-danger: #DC2626;
            --shadow-luxury: 0 10px 30px -5px rgba(92, 61, 46, 0.08), 0 4px 12px -2px rgba(92, 61, 46, 0.03);
            --shadow-hover: 0 20px 35px -5px rgba(92, 61, 46, 0.15), 0 8px 16px -4px rgba(92, 61, 46, 0.06);
        }

        body {
            background-color: var(--cafe-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cafe-dark);
        }

        .luxury-title {
            font-family: 'Playfair Display', serif;
            letter-spacing: 1.5px;
            color: var(--cafe-primary-dark);
            position: relative;
            display: inline-block;
        }

        .luxury-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, var(--cafe-gold), transparent);
        }

        /* Search Bar Styling */
        .search-container {
            max-width: 650px;
            margin: 0 auto 2.5rem;
        }

        .luxury-search-input {
            border: 1.5px solid var(--cafe-border);
            border-radius: 50px 0 0 50px;
            padding: 0.85rem 1.6rem;
            background: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .luxury-search-input:focus {
            outline: none;
            border-color: var(--cafe-gold);
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.15);
        }

        .luxury-search-btn {
            border-radius: 0 50px 50px 0;
            background: var(--cafe-primary-dark);
            color: #ffffff;
            border: 1.5px solid var(--cafe-primary-dark);
            padding: 0.85rem 1.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .luxury-search-btn:hover {
            background: var(--cafe-primary);
            border-color: var(--cafe-primary);
            color: #ffffff;
        }

        /* Coffee Product Card */
        .coffee-card {
            background: var(--cafe-card-bg);
            border: 1px solid var(--cafe-border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
            box-shadow: var(--shadow-luxury);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .coffee-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .card-img-wrapper {
            position: relative;
            height: 215px;
            width: 100%;
            background: linear-gradient(135deg, #eee3d5, #f5efe6);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .coffee-card:hover .card-img-wrapper img {
            transform: scale(1.06);
        }

        .no-img-placeholder {
            color: var(--cafe-text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .badge-category {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: var(--cafe-primary-dark);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 12px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            z-index: 2;
        }

        /* Size / Variant Row Styling */
        .variant-item {
            background: #FAFAF7;
            border: 1px solid var(--cafe-border);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
        }

        .variant-item.selected {
            background: #FFFDF9;
            border-color: var(--cafe-gold);
            box-shadow: 0 4px 14px rgba(197, 160, 89, 0.12);
        }

        .variant-item.out-of-stock {
            opacity: 0.6;
            background: #F5F5F5;
        }

        .size-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--cafe-gold-light);
            color: var(--cafe-primary-dark);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .price-text {
            font-weight: 700;
            color: var(--cafe-primary-dark);
            font-size: 1rem;
        }

        /* Luxury Checkbox */
        .custom-checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #D1C7BD;
            cursor: pointer;
            accent-color: var(--cafe-primary-dark);
        }

        /* Quantity Stepper */
        .qty-stepper {
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1px solid var(--cafe-border);
            border-radius: 8px;
            overflow: hidden;
            width: fit-content;
        }

        .qty-stepper button {
            border: none;
            background: transparent;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--cafe-dark);
            transition: background 0.2s;
        }

        .qty-stepper button:hover:not(:disabled) {
            background: var(--cafe-gold-light);
        }

        .qty-stepper input {
            width: 38px;
            border: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0;
            outline: none;
            background: transparent;
        }

        /* Collapsible Ingredient Table */
        .ingredient-box {
            background: #FFFFFF;
            border-radius: 10px;
            border: 1px solid var(--cafe-border);
            padding: 10px 12px;
            margin-top: 10px;
            font-size: 0.78rem;
        }

        /* Floating Order Action Footer */
        .floating-action-bar {
            position: sticky;
            bottom: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 160, 89, 0.25);
            border-radius: 18px;
            padding: 14px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            margin-top: 2.5rem;
        }

        .btn-luxury-clear {
            background: transparent;
            color: var(--cafe-text-muted);
            border: 1px solid var(--cafe-border);
            padding: 0.65rem 1.6rem;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-luxury-clear:hover {
            background: #FFF1F0;
            color: var(--cafe-danger);
            border-color: var(--cafe-danger);
        }

        .btn-luxury-order {
            background: linear-gradient(135deg, var(--cafe-primary) 0%, var(--cafe-primary-dark) 100%);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 2.2rem;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(92, 61, 46, 0.25);
            transition: all 0.3s ease;
        }

        .btn-luxury-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(92, 61, 46, 0.35);
            color: #FFFFFF;
        }
    </style>
</head>

<div layout:fragment="content" class="container py-4">

    <!-- Header Section -->
    <div class="text-center mb-4">
        <h2 class="luxury-title fw-bold">Café Luft</h2>
        <p class="text-muted mt-2" style="font-size: 0.95rem; letter-spacing: 0.5px;">Artisanal Brews & Exquisite Coffee Menu</p>
    </div>

    <!-- Search Section -->
    <div class="search-container">
        <form method="post" th:action="@{/staff/products/search}" th:object="${keywordmodel}" id="search">
            <div class="input-group">
                <input type="text" th:field="*{keyword}" class="form-control luxury-search-input"
                       placeholder="Search products by name or category..." aria-label="Search">
                <button type="submit" class="btn luxury-search-btn">
                    <i class="fa-solid fa-magnifying-glass me-2"></i>Search
                </button>
            </div>
        </form>
    </div>

    <!-- Main Order Form -->
    <form method="post" th:action="@{/staff/products}" th:object="${product_quantities}" id="productTypeForm">

        <div class="row g-4">
         
            <div class="col-lg-4 col-md-6" th:each="p, state : ${product_types}">
                <div class="coffee-card">
                    
                    <div class="card-img-wrapper">
                        <span class="badge-category" th:text="${p.category_name != null ? p.category_name : 'Specialty'}">Coffee</span>
                       
                        <img th:if="${p.coverimgpath != null and p.coverimgpath != ''}"
                             th:src="@{'/images/' + ${p.coverimgpath}}"
                             alt="Product Image" />

                        <th:block th:unless="${p.coverimgpath != null and p.coverimgpath != ''}">
                           
                            <img th:if="${#strings.containsIgnoreCase(p.name, 'Cappuccino')}"
                                 th:src="@{/images/Cappuccino.jpg}"
                                 alt="Cappuccino Image" />

                            
                            <img th:if="${#strings.containsIgnoreCase(p.name, 'Espresso')}"
                                 th:src="@{/images/coffee.jpg}"
                                 alt="Espresso Image" />

                            
                            <img th:unless="${#strings.containsIgnoreCase(p.name, 'Cappuccino') or #strings.containsIgnoreCase(p.name, 'Espresso')}"
                                 th:src="@{/images/cafe.jpg}"
                                 alt="Cafe Default Image" />
                        </th:block>
                    </div>

                    <!-- Card Body -->
                    <div class="p-4 d-flex flex-column flex-grow-1">
                        <div class="mb-3">
                            <h5 class="fw-bold mb-1" style="color: var(--cafe-dark); font-size: 1.15rem;" th:text="${p.name}">Product Name</h5>
                            <p class="text-muted small mb-0" style="min-height: 38px; line-height: 1.4;" th:text="${p.description}">Product Description</p>
                        </div>

                        <!-- Variants / Sizes Section -->
                        <div class="mt-auto">
                            <label class="form-label text-uppercase fw-semibold mb-2" style="font-size: 0.72rem; letter-spacing: 0.6px; color: var(--cafe-text-muted);">
                                Available Sizes & Pricing
                            </label>

                            <div class="variants-container">
                                <th:block th:each="p2, state2 : ${p.products}">
                                    <div class="variant-item" th:classappend="${!p2.available} ? 'out-of-stock' : ''">
                                        
                                        <!-- Top Row: Checkbox, Size Code, Price -->
                                        <div class="d-flex align-items-center justify-content-between mb-2">
                                            <div class="d-flex align-items-center gap-2">
                                                <div class="custom-checkbox-wrapper">
                                                    <input type="checkbox"
                                                           class="form-check-input product-checkbox"
                                                           name="product_ids"
                                                           th:value="${p2.product_id}"
                                                           th:id="'product-' + ${state.index} + '-' + ${state2.index}"
                                                           th:disabled="${!p2.available}">
                                                </div>
                                                <span class="size-badge" th:text="${p2.size_code}">L</span>
                                                <div>
                                                    <div class="price-text"
                                                         th:text="${#numbers.formatDecimal(p2.price, 1, 'COMMA', 2, 'POINT')} + ' MMK'">
                                                        10,000.00 MMK
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Stock Status Badge -->
                                            <div>
                                                <span th:if="${p2.available and p2.remainingServings > 5}"
                                                      class="badge rounded-pill" style="background: rgba(46, 125, 50, 0.12); color: var(--cafe-success); font-size: 0.72rem; font-weight: 600;">
                                                    In Stock (<span th:text="${p2.remainingServings}"></span>)
                                                </span>
                                                <span th:if="${p2.available and p2.remainingServings > 0 and p2.remainingServings <= 5}"
                                                      class="badge rounded-pill" style="background: rgba(217, 119, 6, 0.12); color: var(--cafe-warning); font-size: 0.72rem; font-weight: 600;">
                                                    Low (<span th:text="${p2.remainingServings}"></span>)
                                                </span>
                                                <span th:if="${!p2.available}"
                                                      class="badge rounded-pill" style="background: rgba(220, 38, 38, 0.12); color: var(--cafe-danger); font-size: 0.72rem; font-weight: 600;">
                                                    Sold Out
                                                </span>
                                            </div>
                                        </div>

                                        <!-- Discount Tags (If Any) -->
                                        <div th:if="${p2.discount_names != null and !p2.discount_names.empty}" class="mb-2 ps-4 ms-2">
                                            <div th:each="discountName, discountState : ${p2.discount_names}" class="d-inline-flex align-items-center gap-1 me-1 mb-1">
                                                <span class="badge" style="background: #FFF7ED; color: #C2410C; border: 1px solid #FFEDD5; font-size: 0.68rem;">
                                                    <i class="fa-solid fa-tag me-1"></i>
                                                    <span th:text="${discountName}">Discount</span>
                                                    <span th:if="${p2.discount_values != null and discountState.index < p2.discount_values.size()}"
                                                          th:text="'-' + ${#numbers.formatDecimal(p2.discount_values[discountState.index], 1, 'COMMA', 0, 'POINT')} + '%'"></span>
                                                </span>
                                            </div>
                                        </div>

                                        <!-- Bottom Control: Stepper + Recipe Collapse -->
                                        <div class="d-flex align-items-center justify-content-between pt-2 border-top" style="border-color: rgba(0,0,0,0.05) !important;">
                                            <!-- Recipe Toggle -->
                                            <button class="btn btn-link p-0 text-decoration-none"
                                                    type="button"
                                                    data-bs-toggle="collapse"
                                                    th:data-bs-target="'#ingredientRow-' + ${state.index} + '-' + ${state2.index}"
                                                    aria-expanded="false"
                                                    style="color: var(--cafe-text-muted); font-size: 0.74rem;">
                                                <i class="fa-solid fa-list-check me-1"></i>Ingredients
                                            </button>

                                            <!-- Quantity Stepper -->
                                            <div class="qty-stepper">
                                                <button type="button" class="btn-qty-minus" disabled>
                                                    <i class="fa-solid fa-minus"></i>
                                                </button>
                                                <input type="number"
                                                       class="product-quantity"
                                                       name="quantities"
                                                       value="1" min="1" step="1"
                                                       th:max="${p2.remainingServings}"
                                                       disabled>
                                                <button type="button" class="btn-qty-plus" disabled>
                                                    <i class="fa-solid fa-plus"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Collapsible Ingredient Details -->
                                        <div class="collapse mt-2" th:id="'ingredientRow-' + ${state.index} + '-' + ${state2.index}">
                                            <div class="ingredient-box">
                                                <div class="fw-semibold text-muted mb-1" style="font-size: 0.72rem;">REQUIRED INGREDIENTS:</div>
                                                <div th:if="${p2.ingredient_names != null and !p2.ingredient_names.empty}">
                                                    <div th:each="ingName, ingState : ${p2.ingredient_names}" class="d-flex justify-content-between py-1 border-bottom border-light">
                                                        <span th:text="${ingName}">Milk</span>
                                                        <span class="text-muted">
                                                            <span th:if="${p2.quantity_required != null and ingState.index < p2.quantity_required.size()}"
                                                                  th:text="${p2.quantity_required[ingState.index]}"></span>
                                                            <span th:if="${p2.unit_code != null and ingState.index < p2.unit_code.size()}"
                                                                  th:text="${p2.unit_code[ingState.index]}"></span>
                                                        </span>
                                                    </div>
                                                </div>
                                                <div th:unless="${p2.ingredient_names != null and !p2.ingredient_names.empty}" class="text-muted fst-italic">
                                                    No ingredients mapped.
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </th:block>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Bottom Sticky Bar -->
        <div class="floating-action-bar d-flex justify-content-between align-items-center">
            <button type="reset" class="btn btn-luxury-clear" id="resetBtn">
                <i class="fa-solid fa-rotate-left me-2"></i>Clear Selection
            </button>

            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-sm-block">
                    <span class="text-muted small">Items selected:</span>
                    <span id="selectedCountBadge" class="fw-bold ms-1" style="color: var(--cafe-primary-dark);">0</span>
                </div>
                <button type="submit" class="btn btn-luxury-order">
                    <i class="fa-solid fa-mug-saucer me-2"></i>Go to Order
                </button>
            </div>
        </div>

    </form>

    <!-- Interactive Logic Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const checkboxes = document.querySelectorAll(".product-checkbox");
            const selectedCountBadge = document.getElementById("selectedCountBadge");

            function updateCount() {
                const checkedBoxes = document.querySelectorAll(".product-checkbox:checked");
                if (selectedCountBadge) {
                    selectedCountBadge.textContent = checkedBoxes.length;
                }
            }

            checkboxes.forEach(function (checkbox) {
                checkbox.addEventListener("change", function () {
                    const variantItem = checkbox.closest(".variant-item");
                    const qtyInput = variantItem.querySelector(".product-quantity");
                    const minusBtn = variantItem.querySelector(".btn-qty-minus");
                    const plusBtn = variantItem.querySelector(".btn-qty-plus");

                    if (checkbox.checked) {
                        variantItem.classList.add("selected");
                        qtyInput.disabled = false;
                        if (minusBtn) minusBtn.disabled = false;
                        if (plusBtn) plusBtn.disabled = false;
                    } else {
                        variantItem.classList.remove("selected");
                        qtyInput.disabled = true;
                        qtyInput.value = 1;
                        if (minusBtn) minusBtn.disabled = true;
                        if (plusBtn) plusBtn.disabled = true;
                    }
                    updateCount();
                });
            });

            // Quantity Stepper Controls (+ / -)
            document.querySelectorAll(".btn-qty-plus").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const input = btn.closest(".qty-stepper").querySelector(".product-quantity");
                    const max = parseInt(input.getAttribute("max")) || 999;
                    let val = parseInt(input.value) || 1;
                    if (val < max) {
                        input.value = val + 1;
                    }
                });
            });

            document.querySelectorAll(".btn-qty-minus").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const input = btn.closest(".qty-stepper").querySelector(".product-quantity");
                    const min = parseInt(input.getAttribute("min")) || 1;
                    let val = parseInt(input.value) || 1;
                    if (val > min) {
                        input.value = val - 1;
                    }
                });
            });

            // Clear Button Handler
            const resetBtn = document.getElementById("resetBtn");
            if (resetBtn) {
                resetBtn.addEventListener("click", function () {
                    setTimeout(() => {
                        checkboxes.forEach(cb => {
                            const variantItem = cb.closest(".variant-item");
                            variantItem.classList.remove("selected");
                            const qtyInput = variantItem.querySelector(".product-quantity");
                            const minusBtn = variantItem.querySelector(".btn-qty-minus");
                            const plusBtn = variantItem.querySelector(".btn-qty-plus");

                            qtyInput.disabled = true;
                            qtyInput.value = 1;
                            if (minusBtn) minusBtn.disabled = true;
                            if (plusBtn) plusBtn.disabled = true;
                        });
                        updateCount();
                    }, 50);
                });
            }
        });
    </script>
</div>
</html>
