<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Edit Ingredient Batch</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
:root {
	--coffee-dark: #5a351f;
	--coffee-brown: #6b4026;
	--coffee-light: #ead3a3;
	--coffee-cream: #fff8e8;
	--coffee-bg: #f5dfb0;
}

body {
	background-color: var(--coffee-bg);
	color: var(--coffee-dark);
}

.form-container {
	max-width: 850px;
	margin: 50px auto;
}

.form-card {
	background-color: var(--coffee-cream);
	padding: 40px;
	border-radius: 18px;
	box-shadow: 0 5px 15px rgba(90, 53, 31, 0.20);
}

.form-title {
	text-align: center;
	color: var(--coffee-dark);
	font-weight: bold;
	margin-bottom: 35px;
}

.form-label {
	color: var(--coffee-dark);
	font-weight: 600;
}

.form-control, .form-select {
	border: 1px solid var(--coffee-light);
	border-radius: 8px;
}

.form-control:focus, .form-select:focus {
	border-color: var(--coffee-brown);
	box-shadow: 0 0 0 0.2rem rgba(107, 64, 38, 0.15);
}

.error {
	color: #9b2c2c;
	font-size: 14px;
	margin-top: 5px;
}

.btn-coffee {
	background-color: var(--coffee-brown);
	color: white;
	border: none;
}

.btn-coffee:hover {
	background-color: var(--coffee-dark);
	color: white;
}
</style>

</head>


<body>

	<div class="container form-container">

		<div class="form-card">

			<h2 class="form-title">Edit Ingredient Batch</h2>


			<form th:action="@{/manager/ingredientBatch/edit}"
				th:object="${ingredientBatches}" method="post">

				<div class="mb-3">

					<label class="form-label"> Batch ID </label> <input type="text"
						class="form-control" th:field="*{batchId}" readonly>

					<div class="error" th:if="${#fields.hasErrors('batchId')}"
						th:errors="*{batchId}"></div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Remaining Quantity </label> <input
						type="number" step="0.001" class="form-control"
						th:field="*{remainingQuantity}">

					<div class="error"
						th:if="${#fields.hasErrors('remainingQuantity')}"
						th:errors="*{remainingQuantity}"></div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Manufactured Date </label> <input
						type="date" class="form-control" th:field="*{manufacturedDate}">

					<div class="error" th:if="${#fields.hasErrors('manufacturedDate')}"
						th:errors="*{manufacturedDate}"></div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Expire Date </label> <input type="date"
						class="form-control" th:field="*{expireDate}">

					<div class="error" th:if="${#fields.hasErrors('expireDate')}"
						th:errors="*{expireDate}"></div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Branch </label> <select
						class="form-select" th:field="*{branchId}">

						<option value="">-- Select Branch --</option>

						<option th:each="branch : ${branches}"
							th:value="${branch.branch_id}" th:text="${branch.name}">
						</option>

					</select>

					<div class="error" th:if="${#fields.hasErrors('branchId')}"
						th:errors="*{branchId}"></div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Batch ID </label> <input type="text"
						class="form-control" th:field="*{importDetailId}"
						placeholder="Enter Batch ID">

					<div class="error" th:if="${#fields.hasErrors('importDetailId')}"
						th:errors="*{importDetailId}"></div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Ingredient Type </label> <select
						class="form-select" th:field="*{ingredientTypeId}">

						<option value="">-- Select Ingredient Type --</option>

						<option th:each="type : ${ingredientTypes}"
							th:value="${type.ingredientTypeId}" th:text="${type.name}">
						</option>

					</select>

					<div class="error" th:if="${#fields.hasErrors('ingredientTypeId')}"
						th:errors="*{ingredientTypeId}"></div>

				</div>

				<div class="mb-4">

					<label class="form-label"> Unit Cost </label> <input type="number"
						step="0.01" class="form-control" th:field="*{unitCost}">

					<div class="error" th:if="${#fields.hasErrors('unitCost')}"
						th:errors="*{unitCost}"></div>

				</div>

				<div class="text-center">

					<button type="submit" class="btn btn-coffee px-4">Update</button>

					<a th:href="@{/manager/ingredientBatch}"
						class="btn btn-outline-secondary px-4"> Cancel </a>

				</div>


			</form>

		</div>

	</div>

</body>

</html>
