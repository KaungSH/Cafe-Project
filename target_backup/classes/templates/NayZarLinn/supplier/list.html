<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Supplier List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	background-color: #FFF8E8;
	font-family: Arial, sans-serif;
	color: #3E2416;
}

.supplier-container {
	width: 92%;
	max-width: 1200px;
	margin: 50px auto;
}

.supplier-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

.supplier-title h2 {
	font-weight: 700;
	color: #5A351F;
	margin-bottom: 5px;
}

.supplier-title p {
	color: #8A6A50;
	margin: 0;
}

.btn-add {
	background-color: #5A351F;
	color: white;
	border: none;
	padding: 10px 20px;
	border-radius: 8px;
	text-decoration: none;
}

.btn-add:hover {
	background-color: #3E2416;
	color: white;
}

.btn-deleted {
	background-color: #D9B892;
	color: #3E2416;
	border: none;
	padding: 10px 20px;
	border-radius: 8px;
	text-decoration: none;
	margin-left: 8px;
}

.btn-deleted:hover {
	background-color: #C9A477;
	color: #3E2416;
}

.table-card {
	background-color: white;
	border-radius: 14px;
	overflow: hidden;
	box-shadow: 0 5px 20px rgba(90, 53, 31, 0.10);
	border: 1px solid #E8D5BA;
}

.supplier-table {
	margin: 0;
}

.supplier-table thead {
	background-color: #5A351F;
	color: white;
}

.supplier-table th {
	padding: 16px;
	font-size: 13px;
	font-weight: 600;
	border: none;
}

.supplier-table td {
	padding: 16px;
	vertical-align: middle;
	color: #5A351F;
	border-bottom: 1px solid #F0E2CF;
}

.supplier-table tbody tr:hover {
	background-color: #FFF5E5;
}

.active-status {
	color: #6B8E23;
	font-weight: 600;
}

.btn-edit {
	color: #5A351F;
	border: 1px solid #5A351F;
	padding: 5px 12px;
	border-radius: 6px;
	text-decoration: none;
	font-size: 13px;
}

.btn-edit:hover {
	background-color: #5A351F;
	color: white;
}

.btn-delete {
	color: #9B3A2E;
	border: 1px solid #9B3A2E;
	padding: 5px 12px;
	border-radius: 6px;
	text-decoration: none;
	font-size: 13px;
	margin-left: 5px;
}

.btn-delete:hover {
	background-color: #9B3A2E;
	color: white;
}
</style>
</head>
<body>
	<div class="supplier-container">
		<div class="supplier-header">
			<div class="supplier-title">
				<h2>
					<i class="bi bi-cup-hot"></i> Supplier List
				</h2>
				<p>Manage your coffee shop suppliers</p>
			</div>
			<div>
				<a th:href="@{/manager/supplier/add}" class="btn-add"> <i
					class="bi bi-plus-lg"></i> Add
				</a> <a th:href="@{/manager/supplier/deleted}" class="btn-deleted"> <i
					class="bi bi-trash"></i> Deleted Suppliers List
				</a>
			</div>
		</div>

		<table class="table">
			<thead>
				<tr>
					<th>Supplier_id</th>
					<th>Name</th>
					<th>Contact_Info</th>
					<th>Created_at</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="s, state: ${supplier}">
					<td th:text="${s.supplier_id}"></td>
					<td th:text="${s.name}"></td>
					<td th:text="${s.contact_info}"></td>
					<td th:text="${#temporals.format(s.created_at, 'MM.dd.yyyy HH:mm')}"></td>
					<td><a
						th:href="@{/manager/supplier/edit/{supplier_id}(supplier_id=${s.supplier_id})}"
						class="btn-edit">Edit</a> <a
						th:href="@{/manager/supplier/delete/{supplier_id}(supplier_id=${s.supplier_id})}"
						class="btn-delete">Delete</a></td>
				</tr>

			</tbody>
		</table>
	</div>
</body>
</html>
