<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<title layout:title-pattern = "$CONTENT_TITLE - Café Луфт"></title>
<script th:src = "@{/js/bootstrap.bundle.min.js}"></script>
<link rel = "stylesheet" th:href = "@{/css/bootstrap.min.css}">
<style>
	html, body {
		height: 100%;
	}
	
	.row {
		min-height: calc(100vh - 112px);
	}
	
	.list-group-item {
		border-radius: 0;
	}
	
	footer {
		width: 100%;
	}
	
	.table-striped > tbody > tr:nth-of-type(odd) > * {
        --bs-table-bg-type: #e3f2fd;
    }
</style>
</head>
<body>
	<div th:replace = "~{common/fragments/header :: header}"></div>
	<div class = "container-fluid" th:if = "${session.loggedInUser.employee_role == 'MANAGER' || session.loggedInUser.employee_role == 'ADMIN'}">
		<div class = "row">
			<div class = "col-md-1 p-0">
				<div th:replace = "~{common/fragments/sidebar::sidebar}"></div>
			</div>
			<div class = "col-md-11 p-4"  layout:fragment="content">
			</div>
		</div>
	</div>
	<div layout:fragment = "content" class="px-4 my-5" th:if = "${session.loggedInUser.employee_role == 'STAFF'}"></div>
	<div th:replace = "~{common/fragments/footer :: footer}"></div>
</body>
</html>
