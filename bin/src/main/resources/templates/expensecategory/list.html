<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Expense Category List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f8f9fa;
}

.container-box {
	width: 90%;
	margin: 50px auto;
	background: white;
	padding: 30px;
	border-radius: 15px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.title {
	font-size: 28px;
	font-weight: 600;
}

.add-btn {
	background-color: #8b7373;
	color: white;
	border: none;
	padding: 10px 20px;
	border-radius: 8px;
	text-decoration: none;
}

.add-btn:hover {
	background-color: #765f5f;
	color: white;
}

table {
	margin-top: 25px;
}

th {
	background-color: #f3f3f3 !important;
}

.edit-btn {
	background-color: #6c757d;
	color: white;
	border: none;
	padding: 6px 14px;
	border-radius: 6px;
	text-decoration: none;
}

.delete-btn {
	background-color: #dc3545;
	color: white;
	border: none;
	padding: 6px 14px;
	border-radius: 6px;
	text-decoration: none;
}
</style>
</head>

<body>

	<div class="container-box">

		<div class="d-flex justify-content-between align-items-center">

			<div class="title">Expense Categories</div>

			<a th:href="@{/manager/expensecategory/add}" class="add-btn"> +
				Add Category </a>

		</div>


		<table class="table table-bordered table-hover">

			<thead>

				<tr>
					<th>No</th>
					<th>Category ID</th>
					<th>Category Name</th>
					<th width="180">Action</th>
				</tr>

			</thead>


			<tbody>

				<tr th:each="category, stat : ${expense}">

					<td th:text="${stat.count}">1</td>

					<td th:text="${category.expense_category_id}"></td>

					<td th:text="${category.category_name}"></td>

					<td><a
						th:href="@{/manager/expensecategory/edit/{id}
                        (id=${category.expense_category_id})}"
						class="edit-btn"> Edit </a>

						<form th:action="@{/manager/expensecategory/delete/{id} (id=${category.expense_category_id})}"
							method="post" style="display: inline;"
							onsubmit="return confirm('Are you sure you want to delete this expense category?');">

							<button type="submit" class="delete-btn">Delete</button>

						</form>
				</tr>

				<tr th:if="${#lists.isEmpty(expense)}">

					<td colspan="4" class="text-center text-muted">No Expense
						Categories Found</td>

				</tr>

			</tbody>

		</table>

	</div>

</body>
</html>
