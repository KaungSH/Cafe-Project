<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Expense List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	margin: 0;
	padding: 30px;
	font-family: Arial, sans-serif;
	background-color: #faf7f2;
	color: #5b4636;
}

.container {
	width: 95%;
	margin: auto;
}

.expense-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 10px;
}

.expense-title h2 {
	margin: 0;
	font-size: 32px;
	color: #3f2d20;
}

.expense-title p {
	margin-top: 10px;
	margin-bottom: 30px;
	color: #806c5b;
	font-size: 16px;
}

.add-button {
	background-color: #95612e;
	color: white;
	text-decoration: none;
	padding: 14px 22px;
	border-radius: 10px;
	font-weight: bold;
	display: inline-block;
}

.add-button:hover {
	background-color: #75491f;
	color: white;
}

.deleted-button {
	background-color: white;
	color: #3f2d20;
	text-decoration: none;
	padding: 14px 22px;
	border-radius: 10px;
	border: 1px solid #e4cdb2;
	font-weight: bold;
	display: inline-block;
	margin-left: 5px;
}

.deleted-button:hover {
	background-color: #f4eadc;
	color: #3f2d20;
}

table {
	width: 100%;
	border-collapse: separate;
	border-spacing: 0;
	background-color: #fcf9f4;
	border: 1px solid #eadbc9;
	border-radius: 14px;
	overflow: hidden;
}

thead {
	background-color: #f4eadc;
}

th {
	padding: 18px 12px;
	text-align: left;
	font-size: 14px;
	color: #927b65;
	text-transform: uppercase;
	letter-spacing: 1px;
	border-bottom: 1px solid #eadbc9;
}

td {
	padding: 18px 12px;
	border-bottom: 1px solid #eadbc9;
	font-size: 16px;
}

tbody tr:last-child td {
	border-bottom: none;
}

tbody tr:hover {
	background-color: #f7efe4;
}

.actions {
	white-space: nowrap;
}

.edit-button {
	display: inline-block;
	padding: 7px 14px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	text-decoration: none;
	background-color: white;
	font-weight: bold;
	margin-right: 6px;
}

.edit-button:hover {
	background-color: #f4eadc;
	color: #3f2d20;
}

.delete-button {
	display: inline-block;
	padding: 7px 14px;
	border: 1px solid #e4cdb2;
	border-radius: 9px;
	color: #3f2d20;
	text-decoration: none;
	background-color: white;
	font-weight: bold;
}

.delete-button:hover {
	background-color: #f4eadc;
	color: #3f2d20;
}

.empty-message {
	text-align: center;
	padding: 30px;
	color: #806c5b;
}

.date-column {
	min-width: 150px;
	white-space: nowrap;
}
</style>

</head>


<body>

	<div class="container">

		<div class="expense-header">

			<div class="expense-title">

				<h2>
					 Expense List
				</h2>

				<p>Manage Expenses</p>

			</div>


			<div>

				<a th:href="@{/manager/expense/add}" class="add-button"> Add </a> <a
					th:href="@{/manager/expense/deleted}" class="deleted-button">
					Deleted Expenses List </a>

			</div>

		</div>


		<table>

			<thead>

				<tr>

					<th>Date</th>

					<th>Branch</th>

					<th>Category</th>

					<th>Description</th>

					<th>Amount</th>

					<th>Action</th>

				</tr>

			</thead>


			<tbody>

				<tr th:if="${#lists.isEmpty(expense)}">

					<td colspan="6" class="empty-message">No expense found.</td>

				</tr>

				<tr th:each="e : ${expense}">

					<td th:text="${#temporals.format(e.expense_date, 'MMM dd, yyyy')}">Date</td>

					<td th:text="${e.branch_name}">Branch</td>

					<td th:text="${e.category_name}">Category</td>

					<td th:text="${e.description}">Description</td>


					<td th:text="${e.amount}">Amount</td>

					<td class="actions"><a
						th:href="@{/manager/expense/edit/{expense_id}(expense_id=${e.expense_id})}"
						class="edit-button"> Edit </a>
						<form th:action="@{/manager/expense/delete}" method="post"
							style="display: inline;"
							onsubmit="return confirm('Are you sure you want to delete this expense?');">

							<input type="hidden" name="expense_id" th:value="${e.expense_id}">

							<button type="submit" class="delete-button">Delete</button>

						</form></td>
				</tr>
			</tbody>

		</table>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
