
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Order Detail</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3 class="mb-0">Add Order Detail</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/order-details/add}"
                  th:object="${orderDetail}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Order Detail ID
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{order_detail_id}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Product ID
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{product_id}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Order ID
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{order_id}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Quantity
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{quantity}"
                           min="1"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Remark
                    </label>

                    <textarea class="form-control"
                              th:field="*{remark}"
                              rows="3">
                    </textarea>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-success">
                        Save
                    </button>

                    <a th:href="@{/order-details}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
