
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Details</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body>

	<div class="container mt-5">

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h2>Order Details</h2>

			<a th:href="@{/order-details/add}" class="btn btn-primary"> + Add
				Order Detail </a>

		</div>

		<div class="card shadow-sm">

			<div class="card-body">

				<table class="table table-bordered table-hover">

					<thead class="table-dark">

						<tr>
							<th>Detail ID</th>
							<th>Product ID</th>
							<th>Order ID</th>
							<th>Quantity</th>
							<th>Remark</th>
							<th width="180">Action</th>
						</tr>

					</thead>

					<tbody>

						<tr th:each="detail : ${orderDetails}">

							<td th:text="${detail.order_detail_id}"></td>

							<td th:text="${detail.product_id}"></td>

							<td th:text="${detail.order_id}"></td>

							<td th:text="${detail.quantity}"></td>

							<td th:text="${detail.remark}"></td>

							<td><a
								th:href="@{/order-details/edit/{id}(id=${detail.order_detail_id})}"
								class="btn btn-warning btn-sm"> Edit </a> <a
								th:href="@{/order-details/delete/{id}(id=${detail.order_detail_id})}"
								class="btn btn-danger btn-sm"
								onclick="return confirm('Are you sure you want to delete this order detail?');">
									Delete </a></td>

						</tr>

						<tr th:if="${#lists.isEmpty(orderDetails)}">

							<td colspan="6" class="text-center text-muted">No order
								details found.</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>
</html>
