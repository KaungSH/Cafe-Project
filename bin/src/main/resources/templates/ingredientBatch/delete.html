<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Delete Ingredient Batch</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
:root {
	--coffee-dark: #5a351f;
	--coffee-brown: #6b4026;
	--coffee-light: #ead3a3;
	--coffee-cream: #fff8e8;
	--coffee-bg: #f5dfb0;
}

body {
	background-color: var(--coffee-bg);
}

.delete-container {
	max-width: 600px;
	margin: 100px auto;
}

.delete-card {
	background-color: var(--coffee-cream);
	padding: 40px;
	border-radius: 18px;
	box-shadow: 0 5px 15px rgba(90, 53, 31, 0.20);
}

.delete-title {
	color: var(--coffee-dark);
	text-align: center;
	margin-bottom: 30px;
}

.info-box {
	background-color: #f5e5c5;
	padding: 20px;
	border-radius: 10px;
	margin-bottom: 25px;
}

.btn-delete {
	background-color: #8b4a32;
	color: white;
	border: none;
}

.btn-delete:hover {
	background-color: var(--coffee-dark);
	color: white;
}
</style>

</head>


<body>

	<div class="container delete-container">

		<div class="delete-card">

			<h2 class="delete-title">Delete Ingredient Batch</h2>


			<p class="text-center">Are you sure you want to delete this
				batch?</p>


			<div class="info-box">

				<p>
					<strong>Batch ID:</strong> <span
						th:text="${ingredientBatch.batchId}"></span>
				</p>

				<p>
					<strong>Remaining Quantity:</strong> <span
						th:text="${ingredientBatch.remainingQuantity}"></span>
				</p>

				<p>
					<strong>Manufactured Date:</strong> <span
						th:text="${ingredientBatch.manufacturedDate}"></span>
				</p>

				<p class="mb-0">
					<strong>Expire Date:</strong> <span
						th:text="${ingredientBatch.expireDate}"></span>
				</p>

			</div>


			<div class="text-center">

				<form th:action="@{/manager/ingredientBatch/delete}"
					th:object="${ingredientBatch}" method="post"
					style="display: inline;">

					<input type="hidden" th:field="*{batchId}">

					<button type="submit" class="btn btn-delete px-4">Delete</button>

				</form>

				<a th:href="@{/manager/ingredientBatch}"
					class="btn btn-outline-secondary px-4"> Cancel </a>

			</div>
		</div>

	</div>

</body>

</html>
