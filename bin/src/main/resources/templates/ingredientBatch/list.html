<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Ingredient Batch List</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
:root {
	--coffee-dark: #5a351f;
	--coffee-brown: #6b4026;
	--coffee-light: #ead3a3;
	--coffee-cream: #fff8e8;
	--coffee-bg: #f5dfb0;
}

body {
	background-color: var(--coffee-bg);
	color: var(--coffee-dark);
}

.main-container {
	margin-top: 50px;
	margin-bottom: 50px;
}

.page-card {
	background-color: var(--coffee-cream);
	border-radius: 18px;
	padding: 30px;
	box-shadow: 0 5px 15px rgba(90, 53, 31, 0.20);
}

.page-title {
	color: var(--coffee-dark);
	font-weight: bold;
}

.btn-coffee {
	background-color: var(--coffee-brown);
	color: white;
	border: none;
}

.btn-coffee:hover {
	background-color: var(--coffee-dark);
	color: white;
}

.btn-delete {
	background-color: #8b4a32;
	color: white;
	border: none;
}

.btn-delete:hover {
	background-color: var(--coffee-dark);
	color: white;
}

.btn-edit {
	background-color: var(--coffee-light);
	color: var(--coffee-dark);
	border: none;
}

.btn-edit:hover {
	background-color: #d9bc80;
	color: var(--coffee-dark);
}

.btn-expiredlist {
	background-color: var(--coffee-light);
	color: var(--coffee-dark);
	border: none;
}

.btn-expiredlist:hover {
	background-color: #d9bc80;
	color: var(--coffee-dark);
}

.table thead {
	background-color: var(--coffee-dark);
	color: white;
}

.table thead th {
	background-color: var(--coffee-dark);
	color: white;
}

.table tbody tr:hover {
	background-color: #f8ead0;
}

.btn-deleted {
    color: #b56f6f;
    border: 1px solid #b56f6f;
    background-color: transparent;
}

.btn-deleted:hover {
    background-color: #b56f6f;
    color: white;
}
</style>

</head>


<body>

	<div class="container main-container">

		<div class="page-card">

			<div class="d-flex justify-content-between align-items-center mb-4">

				<h2 class="page-title">Ingredient Batch List</h2>

				<div>

					<a th:href="@{/manager/ingredientBatch/add}" class="btn btn-coffee">Add </a>
					 
					<a th:href="@{/manager/ingredientBatch/expired}"
						class="btn btn-expiredlist"> Expired List </a> 
						
					<a th:href="@{/manager/ingredientBatch/deleted}"
						class="btn btn-deleted"> Deleted List </a>

				</div>

			</div>

			<div class="table-responsive">

				<table class="table table-bordered align-middle">

					<thead>

						<tr>

							<th>No.</th>
							<th>Batch</th>
							<th>Remaining Qty</th>
							<th>Manufactured Date</th>
							<th>Expire Date</th>
							<th>Branch</th>
							<th>Import Detail</th>
							<th>Ingredient Type</th>
							<th>Unit Cost</th>
							<th>Action</th>

						</tr>

					</thead>


					<tbody>

						<tr th:each="ingredientBatch, stat : ${ingredientBatch}"
							th:classappend="${ingredientBatch.expireDate.isBefore(T(java.time.LocalDate).now()) 
    								? 'table-danger' 
    								: (!ingredientBatch.expireDate.isAfter(T(java.time.LocalDate).now().plusDays(4)) 
    								? 'table-warning' : '')}">

							<td th:text="${stat.count}"></td>

							<td th:text="${ingredientBatch.batchId}"></td>

							<td th:text="${ingredientBatch.remainingQuantity}"></td>

							<td
								th:text="${#temporals.format(ingredientBatch.manufacturedDate, 'dd-MM-yyyy')}"></td>

							<td><span
								th:text="${#temporals.format(ingredientBatch.expireDate, 'dd-MM-yyyy')}">
							</span> <span
								th:if="${ingredientBatch.expireDate.isBefore(T(java.time.LocalDate).now())}"
								class="text-danger fw-bold"> 🔴 EXPIRED </span> <span
								th:if="${!ingredientBatch.expireDate.isBefore(T(java.time.LocalDate).now())
					  				and !ingredientBatch.expireDate.isAfter(T(java.time.LocalDate).now().plusDays(4))}"
								class="text-warning fw-bold"> 🟡 EXPIRING SOON </span></td>

							<td th:text="${ingredientBatch.branchId}"></td>

							<td th:text="${ingredientBatch.importDetailId}"></td>

							<td th:text="${ingredientBatch.ingredientTypeId}"></td>

							<td th:text="${ingredientBatch.unitCost}"></td>


							<td>

								<div
									th:if="${!ingredientBatch.expireDate.isBefore(T(java.time.LocalDate).now())}">

									<a
										th:href="@{/manager/ingredientBatch/edit/{batchId}(batchId=${ingredientBatch.batchId})}"
										class="btn btn-edit btn-sm"> Edit </a> <a
										th:href="@{/manager/ingredientBatch/delete/{batchId}(batchId=${ingredientBatch.batchId})}"
										class="btn btn-delete btn-sm"> Delete </a>

								</div>
							</td>
						<tr th:if="${#lists.isEmpty(ingredientBatch)}">

							<td colspan="10" class="text-center">No ingredient batches
								found.</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>

</html>
