<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Expired Ingredient Batch List</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
:root {
	--coffee-dark: #5a351f;
	--coffee-cream: #fff8e8;
	--coffee-bg: #f5dfb0;
}

body {
	background-color: var(--coffee-bg);
	color: var(--coffee-dark);
}

.main-container {
	margin-top: 50px;
	margin-bottom: 50px;
}

.page-card {
	background-color: var(--coffee-cream);
	border-radius: 18px;
	padding: 30px;
	box-shadow: 0 5px 15px rgba(90, 53, 31, 0.20);
}

.page-title {
	color: var(--coffee-dark);
	font-weight: bold;
}

.table thead th {
	background-color: var(--coffee-dark);
	color: white;
}

.btn-expired {
	color: #b56f6f;
	border: 1px solid #b56f6f;
	background-color: transparent;
}

.btn-expired:hover {
	background-color: #b56f6f;
	color: white;
}

.btn-coffee {
	background-color: #6b4026;
	color: white;
	border: none;
}

.btn-coffee:hover {
	background-color: #5a351f;
	color: white;
}
</style>

</head>

<body>

	<div class="container main-container">

		<div class="page-card">

			<div class="d-flex justify-content-between align-items-center mb-4">

				<h2 class="page-title">Expired Ingredient Batches</h2>

				<a th:href="@{/manager/ingredientBatch}"
					class="btn btn-coffee"> Back to List </a>

			</div>

			<div class="table-responsive">

				<table class="table table-bordered align-middle">

					<thead>

						<tr>

							<th>No.</th>
							<th>Batch ID</th>
							<th>Remaining Qty</th>
							<th>Manufactured Date</th>
							<th>Expire Date</th>
							<th>Branch</th>
							<th>Import Detail</th>
							<th>Ingredient Type</th>
							<th>Unit Cost</th>
							<th>Status</th>
							<th>Action</th>


						</tr>

					</thead>

					<tbody>

						<tr th:each="ingredientBatch, stat : ${ingredientBatch}"
							class="table-danger">

							<td th:text="${stat.count}"></td>

							<td th:text="${ingredientBatch.batchId}"></td>

							<td th:text="${ingredientBatch.remainingQuantity}"></td>

							<td
								th:text="${#temporals.format(ingredientBatch.manufacturedDate, 'dd-MM-yyyy')}">
							</td>

							<td
								th:text="${#temporals.format(ingredientBatch.expireDate, 'dd-MM-yyyy')}">
							</td>

							<td th:text="${ingredientBatch.branchId}"></td>

							<td th:text="${ingredientBatch.importDetailId}"></td>

							<td th:text="${ingredientBatch.ingredientTypeId}"></td>

							<td th:text="${ingredientBatch.unitCost}"></td>

							<td><span class="text-danger fw-bold"> 🔴 EXPIRED </span></td>

							<td>

								<form th:action="@{/manager/ingredientBatch/expired/delete}"
									method="post">

									<input type="hidden" name="batchId"
										th:value="${ingredientBatch.batchId}">

									<button type="submit" class="btn btn-expired">
										Delete</button>

								</form>

							</td>

						</tr>


						<tr th:if="${#lists.isEmpty(ingredientBatch)}">

							<td colspan="10" class="text-center">No expired ingredient
								batches found.</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</div>

</body>

</html>
