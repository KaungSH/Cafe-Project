<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Deleted Stock Imports</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container mt-5">
		<h2>Deleted Stock Imports</h2>
		<a th:href="@{/manager/stock_imports}" class="btn btn-secondary mb-3">Back
			to List</a>

		<table class="table table-bordered table-striped">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>Date</th>
					<th>Supplier</th>
					<th>Employee</th>
					<th>Branch</th>
					<th>Total Amount</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${imports}">
					<td th:text="${item.import_id}"></td>
					<td
						th:text="${#temporals.format(item.import_date, 'yyyy-MM-dd HH:mm')}"></td>
					<td th:text="${item.supplier_name}"></td>
					<td th:text="${item.employee_name}"></td>
					<td th:text="${item.branch_name}"></td>
					<td th:text="${item.total_amount}"></td>
					<td><a
						th:href="@{/manager/stock_imports/recover/{id}(id=${item.import_id})}"
						class="btn btn-success btn-sm"
						onclick="return confirm('Recover this record?');">Recover</a></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
