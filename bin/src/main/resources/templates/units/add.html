
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Unit</title>

<style>
body {
	margin: 0;
	font-family: Arial, sans-serif;
	background: #f5f6fa;
}

.form-box {
	width: 500px;
	margin: 70px auto;
	background: white;
	padding: 30px;
	border-radius: 10px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

h1 {
	text-align: center;
	margin-bottom: 25px;
}

label {
	display: block;
	margin-bottom: 7px;
	font-weight: bold;
}

input {
	width: 100%;
	padding: 11px;
	margin-bottom: 18px;
	border: 1px solid #ccc;
	border-radius: 6px;
}

.buttons {
	display: flex;
	gap: 10px;
}

button, .cancel {
	padding: 11px 20px;
	border: none;
	border-radius: 6px;
	text-decoration: none;
	cursor: pointer;
}

button {
	background: #3498db;
	color: white;
}

.cancel {
	background: #777;
	color: white;
}
</style>
</head>

<body>

	<div class="form-box">

		<h1>Add Unit</h1>

		<form th:action="@{/units/add}" th:object="${unit}" method="post">

			<label>Unit Name</label> <input type="text" th:field="*{name}"
				placeholder="Example: Kilogram" required> <label>Abbreviation</label>

			<input type="text" th:field="*{abbreviation}"
				placeholder="Example: kg" required> <label> <input
				type="checkbox" th:field="*{is_active}"> Active
			</label>

			<div class="buttons">

				<button type="submit">Save Unit</button>

				<a href="/units" class="cancel"> Cancel </a>

			</div>

		</form>

	</div>

</body>
</html>
