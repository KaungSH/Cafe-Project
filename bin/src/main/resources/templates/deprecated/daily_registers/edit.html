 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Register - Luft Cafe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #5C3D2E;
      --accent-warm: #E0A96D;
      --accent-hover: #C88E52;
      --bg-main: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-color: #2D2422;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-card {
      background-color: var(--card-bg);
      border: 1px solid #EAE3DC;
      border-radius: 12px;
      padding: 32px 40px;
      box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .page-title {
      color: var(--primary-color);
      font-weight: 700;
      font-size: 1.6rem;
    }

    .form-control, .form-select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #D6CECE;
    }

    .btn-submit {
      background-color: var(--accent-warm);
      color: #3E2723;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 24px;
      border: none;
    }

    .btn-cancel {
      background-color: #EFEBE9;
      color: #5D4037;
      border: 1px solid #D7CCC8;
      border-radius: 8px;
      padding: 9px 24px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="container py-4" style="max-width: 650px;">
  <div class="main-card">

    <h3 class="page-title mb-4">
      <i class="fa-solid fa-pen-to-square me-2"></i>Edit Daily Register
    </h3>

    <form th:action="@{/manager/daily-registers/update}" th:object="${registerDto}" method="post" novalidate>

     
      <input type="hidden" th:field="*{register_id}" />

   
      <div class="mb-3">
        <label for="branch_id" class="form-label fw-bold">Branch</label>
        <select id="branch_id" th:field="*{branch_id}" class="form-select">
          <option value="">-- Select Branch --</option>
          <option th:each="branch : ${branches}"
                  th:value="${branch.branch_id}"
                  th:text="${branch.name}">
          </option>
        </select>
      </div>

      <!-- Employee Dropdown -->
      <div class="mb-3">
        <label for="employee_id" class="form-label fw-bold">Employee</label>
        <select id="employee_id" th:field="*{employee_id}" class="form-select">
          <option value="">-- Select Employee --</option>
          <option th:each="employee : ${employees}"
                  th:value="${employee.employeeId}"
                  th:text="${employee.name}">
          </option>
        </select>
      </div>

     
      <div class="mb-3">
        <label for="register_status_id" class="form-label fw-bold">Status</label>
        <select id="register_status_id" th:field="*{register_status_id}" class="form-select">
          <option value="">-- Select Status --</option>
          <option th:each="status : ${statuses}"
                  th:value="${status.id}"
                  th:text="${status.name}">
          </option>
        </select>
      </div>

      <!-- Date -->
      <div class="mb-3">
        <label for="date" class="form-label fw-bold">Date</label>
        <input type="date" id="date" th:field="*{date}" class="form-control">
      </div>

      <!-- Opened At -->
      <div class="mb-3">
        <label for="opened_at" class="form-label fw-bold">Opened At</label>
        <input type="time" step="1" id="opened_at" th:field="*{opened_at}" class="form-control">
      </div>

      <!-- Closed At -->
      <div class="mb-3">
        <label for="closed_at" class="form-label fw-bold">Closed At</label>
 <input type="time" step="1" id="closed_at" th:field="*{closed_at}" class="form-control">
      </div>

      <!-- Action Buttons -->
      <div class="mt-4 d-flex gap-2 justify-content-end">
        <a th:href="@{/manager/daily-registers}" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-submit">Update Register</button>
      </div>

    </form>

  </div>
</div>

</body>
</html>
