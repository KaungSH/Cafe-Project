<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Registers - Luft Cafe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #5C3D2E;
      --accent-warm: #E0A96D;
      --bg-main: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-color: #2D2422;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-card {
      background-color: var(--card-bg);
      border: 1px solid #EAE3DC;
      border-radius: 12px;
      padding: 32px 40px;
      box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
      margin-top: 30px;
    }

    .btn-create {
      background-color: var(--primary-color);
      color: #FFF;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 18px;
      text-decoration: none;
    }

    .btn-create:hover {
      background-color: #4A3024;
      color: #FFF;
    }
  </style>
</head>

<body>

<div class="container py-4">
  <div class="main-card">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold" style="color: var(--primary-color);">
        <i class="fa-solid fa-list me-2"></i>Daily Register List
      </h3>
      <a th:href="@{/manager/daily-registers/openshift}" class="btn btn-create">
        <i class="fa-solid fa-plus me-1"></i> Open Shift
      </a>
        <a th:href="@{/manager/daily-registers/closeshift}" class="btn btn-create">
        <i class="fa-solid fa-plus me-1"></i> Close Shift
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle border">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Branch</th>
            <th>Employee</th>
            <th>Status</th>
            <th>Open time</th>
            <th>Closed time</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reg : ${registers}">
            <td th:text="${reg.date}">2026-09-16</td>
            <td th:text="${reg.branch_name}">Main Branch</td>
            <td th:text="${reg.employee_name}">John Doe</td>
            <td>
              <span class="badge bg-secondary" th:text="${reg.status_name}">Open</span>
            </td>
            <td th:text="${reg.opened_at}">08:00:00</td>
            <td th:text="${reg.status_name == 'CLOSED' ? reg.closed_at : 'Not Closed Yet'}">17:00:00</td>
            <td class="text-center">
              <a th:href="@{/manager/daily-registers/edit/{register_id}(register_id=${reg.register_id})}" 
                 class="btn btn-sm btn-outline-warning me-1">
                <i class="fa-solid fa-pen-to-square"></i>
              </a>
              <a th:href="@{/manager/daily-registers/all/delete/{register_id}(register_id=${reg.register_id})}" 
                 class="btn btn-sm btn-outline-danger"
                 onclick="return confirm('Are you sure you want to delete this record?');">
                <i class="fa-solid fa-trash"></i>
              </a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(registers)}">
            <td colspan="7" class="text-center text-muted py-4">No daily register records found.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

</body>
</html>
