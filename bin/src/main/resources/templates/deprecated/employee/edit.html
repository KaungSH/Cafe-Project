<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Employee</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-8">
				<div class="card shadow">
					<div class="card-header bg-primary text-white">
						<h4 class="mb-0">Edit Employee</h4>
					</div>
					<div class="card-body">
						<form
							th:action="@{/employee/edit/{id}(id=${employee.employeeId})}"
							th:object="${employee}" method="post">
							<div class="row mb-3">
								<div class="col-md-6">
									<label class="form-label">Full Name</label> <input type="text"
										class="form-control" th:field="*{name}" required />
								</div>
								<div class="col-md-6">
									<label class="form-label">Email</label> <input type="email"
										class="form-control" th:field="*{email}" required />
								</div>
							</div>
							<div class="mb-3">
								<label class="form-label">Phone Number</label> <input
									type="text" class="form-control" th:field="*{phone}" />
							</div>
							<div class="row mb-3">
								<div class="col-md-6">
									<label class="form-label">Salary</label> <input type="number"
										step="0.01" class="form-control" th:field="*{salary}" />
								</div>
								<div class="col-md-6">
									<label class="form-label">Date of Birth</label> <input
										type="date" class="form-control" th:field="*{dob}" />
								</div>
							</div>
							<div class="mb-3">
								<label class="form-label">Address</label>
								<textarea class="form-control" th:field="*{address}" rows="3"></textarea>
							</div>
							<div class="d-flex justify-content-end gap-2 mt-4">
								<a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
								<button type="submit" class="btn btn-primary">Update
									Employee</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
