<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee List | Coffee Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body { background-color: #f9f4ef; font-family: 'Nunito', sans-serif; color: #4a3018; }
    .custom-container {
        background-color: #ffffff; border-radius: 20px; padding: 30px;
        box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08); margin-top: 50px; margin-bottom: 50px;
    }
    h2 { color: #5c3a21; font-weight: 700; }
    .btn-coffee-primary { background-color: #a87b51; color: white; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 600; transition: all 0.3s ease; }
    .btn-coffee-primary:hover { background-color: #8c633e; color: white; transform: translateY(-2px); }
    .table { border-collapse: separate; border-spacing: 0; margin-top: 15px; }
    .table thead th { background-color: #5c3a21; color: #f9f4ef; border: none; padding: 15px; font-weight: 600; }
    .table thead th:first-child { border-top-left-radius: 15px; }
    .table thead th:last-child { border-top-right-radius: 15px; }
    .table tbody tr td { vertical-align: middle; border-bottom: 1px solid #eee5da; color: #5c3a21; padding: 12px 15px; }
    .table tbody tr:hover { background-color: #fcf9f5; }
    .table tbody tr:last-child td:first-child { border-bottom-left-radius: 15px; }
    .table tbody tr:last-child td:last-child { border-bottom-right-radius: 15px; }
    .btn-edit { background-color: #d4a373; color: white; border-radius: 8px; border: none; font-size: 0.875rem; }
    .btn-edit:hover { background-color: #b58555; color: white; }
    .btn-delete { background-color: #b07d62; color: white; border-radius: 8px; border: none; font-size: 0.875rem; }
    .btn-delete:hover { background-color: #94644a; color: white; }
</style>
</head>
<body>
	<div class="container custom-container">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2>☕ Employee Management</h2>
			<a th:href="@{/manager/employee/add}" class="btn btn-coffee-primary">+ Add New Employee</a>
		</div>

		<div class="table-responsive">
			<table class="table table-hover">
				<thead>
					<tr>
						<th>Name</th>
						<th>Email</th>
						<th>Phone</th>
						<th>Gender</th>
						<th>Status</th>
						<th>Role</th>
						<th class="text-center">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="emp : ${employee}">
						<td th:text="${emp.name}" class="fw-bold"></td>
						<td th:text="${emp.email}"></td>
						<td th:text="${emp.phone}"></td>
						<td th:text="${emp.gender}"></td>
						<td th:text="${emp.employeeStatusId}"></td>
						<td th:text="${emp.employeeRoleId}"></td>
						<td class="text-center">
							<a th:href="@{/manager/employee/edit/{id}(id=${emp.employeeId})}" class="btn btn-edit btn-sm px-3">Edit</a> 
							<a th:href="@{/manager/employee/delete/{id}(id=${emp.employeeId})}" class="btn btn-delete btn-sm px-3" onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(employee)}">
						<td colspan="7" class="text-center py-4 text-muted">No employees found.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
