<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title
	th:text="${employee.employeeId == null} ? 'Add Employee | Coffee Shop' : 'Edit Employee | Coffee Shop'"></title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Google Fonts -->
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
	rel="stylesheet">

<style>
body {
	background-color: #f9f4ef;
	font-family: 'Nunito', sans-serif;
	color: #4a3018;
}

.form-container {
	background-color: #ffffff;
	border-radius: 20px;
	padding: 40px;
	box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08);
	max-width: 800px;
	margin: 50px auto;
}

h2 {
	color: #5c3a21;
	font-weight: 700;
	text-align: center;
	margin-bottom: 30px;
}

.form-label {
	font-weight: 600;
	color: #6d4c41;
	margin-bottom: 8px;
}

.form-control, .form-select {
	border-radius: 12px;
	border: 1px solid #e6d5c3;
	padding: 12px 15px;
	transition: all 0.3s ease;
	background-color: #fcf9f5;
}

.form-control:focus, .form-select:focus {
	border-color: #a87b51;
	box-shadow: 0 0 0 4px rgba(168, 123, 81, 0.15);
	background-color: #ffffff;
}

.btn-coffee-primary {
	background-color: #a87b51;
	color: white;
	border: none;
	border-radius: 12px;
	padding: 12px;
	font-weight: 700;
	transition: all 0.3s ease;
}

.btn-coffee-primary:hover {
	background-color: #8c633e;
	color: white;
	transform: translateY(-2px);
}

.btn-coffee-secondary {
	background-color: #e6d5c3;
	color: #5c3a21;
	border: none;
	border-radius: 12px;
	padding: 12px;
	font-weight: 700;
	text-decoration: none;
	transition: all 0.3s ease;
}

.btn-coffee-secondary:hover {
	background-color: #d4bda5;
	color: #4a3018;
}
</style>
</head>
<body>
	<div class="container">
		<div class="form-container">
			<h2>
				☕ <span
					th:text="${employee.employeeId == null} ? 'Add New Employee' : 'Edit Employee'"></span>
			</h2>

			<form
				th:action="${employee.employeeId == null} ? @{/manager/employee/add} : @{/manager/employee/edit/{id}(id=${employee.employeeId})}"
				th:object="${employee}" method="post">

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label">Full Name</label> <input type="text"
							class="form-control" th:field="*{name}" required />
					</div>
					<div class="col-md-6">
						<label class="form-label">Email</label> <input type="email"
							class="form-control" th:field="*{email}" required />
					</div>
				</div>

				<div class="row mb-3" th:if="${employee.employeeId == null}">
					<div class="col-md-6">
						<label class="form-label">Password</label> <input type="password"
							class="form-control" th:field="*{password}" required />
					</div>
					<div class="col-md-6">
						<label class="form-label">Phone</label> <input type="text"
							class="form-control" th:field="*{phone}" required />
					</div>
				</div>

				<div class="row mb-3" th:unless="${employee.employeeId == null}">
					<div class="col-md-12">
						<label class="form-label">Phone</label> <input type="text"
							class="form-control" th:field="*{phone}" required />
					</div>
				</div>

				<div class="mb-3 border p-3 rounded"
					style="background-color: #fcf9f5; border-color: #e6d5c3 !important;">
					<label class="form-label">Employee Role</label>
					<div class="d-flex gap-4 mt-2">
						<div class="form-check">
							<input class="form-check-input" type="radio"
								th:field="*{employeeRoleId}" id="roleManager" value="MANAGER"
								required> <label class="form-check-label"
								for="roleManager">Manager</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio"
								th:field="*{employeeRoleId}" id="roleCashier" value="CASHIER">
							<label class="form-check-label" for="roleCashier">Cashier</label>
						</div>
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label">Branch ID</label> <input type="text"
							class="form-control" th:field="*{branchId}" placeholder="e.g. 1"
							required />
					</div>
					<div class="col-md-6">
						<label class="form-label">Status</label> <select
							class="form-select" th:field="*{employeeStatusId}" required>
							<option value="">-- Select Status --</option>
							<option th:each="s : ${statuses}"
								th:value="${s.employeeStatusId}" th:text="${s.name}"></option>
						</select>
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-4">
						<label class="form-label">Salary</label> <input type="number"
							step="0.01" class="form-control" th:field="*{salary}" required />
					</div>
					<div class="col-md-4">
						<label class="form-label">Gender</label> <select
							class="form-select" th:field="*{gender}" required>
							<option value="">-- Select Gender --</option>
							<option th:each="g : ${genders}" th:value="${g.value}"
								th:text="${g.displayName}"></option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Date of Birth</label> <input type="date"
							class="form-control" th:field="*{dob}" required />
					</div>
				</div>

				<div class="mb-4">
					<label class="form-label">Address</label>
					<textarea class="form-control" th:field="*{address}" rows="3"
						required></textarea>
				</div>

				<div class="d-flex justify-content-end gap-2">
					<a th:href="@{/manager/employee}"
						class="btn btn-coffee-secondary px-4">Cancel</a>
					<button type="submit" class="btn btn-coffee-primary px-4">
						<span
							th:text="${employee.employeeId == null} ? 'Save Employee' : 'Update Employee'"></span>
					</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
