<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Branch</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
	<div class="row justify-content-center">
		<div class="col-md-8">
			<h2 class="mb-4">Edit Branch</h2>

			<form th:action="@{/branches/edit/{id}(id=${branchDto.branch_id})}"
				th:object="${branchDto}" method="post" novalidate>

				<input type="hidden" th:field="*{branch_id}" />

				<div class="mb-3">
					<label class="form-label">Branch Name <span
						class="text-danger">*</span></label> <input type="text" th:field="*{name}"
						class="form-control"
						th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
					<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
						th:errors="*{name}"></div>
				</div>

				<div class="mb-3">
					<label class="form-label">Location <span
						class="text-danger">*</span></label> <input type="text"
						th:field="*{location}" class="form-control"
						th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
				</div>

				<div class="mb-3">
					<label class="form-label">Description</label>
					<textarea th:field="*{description}" class="form-control" rows="3"
						th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('description')}"
						th:errors="*{description}"></div>
				</div>

				<div class="mb-3">
					<label class="form-label">Status <span class="text-danger">*</span></label>
					<select th:field="*{branch_status_id}" class="form-select"
						th:classappend="${#fields.hasErrors('branch_status_id')} ? 'is-invalid' : ''">
						<option value="">-- Select Status --</option>
						<option th:each="status : ${statuses}"
							th:value="${status.branch_status_id}" th:text="${status.name}"></option>
					</select>
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('branch_status_id')}"
						th:errors="*{branch_status_id}"></div>
				</div>

				<div class="row">
					<div class="col-md-6 mb-3">
						<label class="form-label">Opening Time <span
							class="text-danger">*</span></label> <input type="time"
							th:field="*{opening_time}" class="form-control"
							th:classappend="${#fields.hasErrors('opening_time')} ? 'is-invalid' : ''">
						<div class="invalid-feedback"
							th:if="${#fields.hasErrors('opening_time')}"
							th:errors="*{opening_time}"></div>
					</div>

					<div class="col-md-6 mb-3">
						<label class="form-label">Closing Time <span
							class="text-danger">*</span></label> <input type="time"
							th:field="*{closing_time}" class="form-control"
							th:classappend="${#fields.hasErrors('closing_time')} ? 'is-invalid' : ''">
						<div class="invalid-feedback"
							th:if="${#fields.hasErrors('closing_time')}"
							th:errors="*{closing_time}"></div>
					</div>
				</div>

				<button type="submit" class="btn btn-primary">Update Branch</button>
				<a th:href="@{/branches}" class="btn btn-secondary">Cancel</a>
			</form>
		</div>
	</div>
</body>
</html>
