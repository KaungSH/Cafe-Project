<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Delete - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
body {
	background-color: #FAF7F2;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.confirm-card {
	background-color: #FFFFFF;
	border-radius: 12px;
	border: 1px solid #EAE3DC;
	box-shadow: 0 4px 20px rgba(92, 61, 46, 0.08);
}

.icon-box {
	color: #B23B2A;
	background-color: #FDF2F0;
	width: 80px;
	height: 80px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	margin: 0 auto;
}

.btn-cancel {
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
	border-radius: 8px;
	font-weight: 600;
}

.btn-cancel:hover {
	background-color: #D7CCC8;
	color: #3E2723;
}

.btn-delete {
	background-color: #B23B2A;
	border-color: #B23B2A;
	color: white;
	border-radius: 8px;
	font-weight: 600;
}

.btn-delete:hover {
	background-color: #8C2B1D;
	border-color: #8C2B1D;
}
</style>
</head>
<body>

	<div class="container py-5" style="max-width: 480px;">
		<div class="confirm-card text-center p-4">
			<div class="card-body">
				<div class="icon-box mb-3">
					<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44"
						fill="currentColor" class="bi bi-exclamation-triangle-fill"
						viewBox="0 0 16 16">
                    <path
							d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
                </svg>
				</div>

				<h4 class="fw-bold mb-2" style="color: #5C3D2E;">Delete
					Confirmation</h4>
				<p class="text-muted">
					"<strong><span th:text="${statusName}"></span></strong>"
				</p>

				<!-- Direct Delete Form Submission -->
				<form th:action="@{/admin/statuses/delete-confirm}" method="post"
					class="mt-4">
					<input type="hidden" name="type" th:value="${statusType}">
					<input type="hidden" name="id" th:value="${statusId}">

					<div class="d-flex justify-content-center gap-2">
						<a th:href="@{/admin/statuses(type=${statusType})}"
							class="btn btn-cancel px-4 py-2">Cancel</a>
						<button type="submit" class="btn btn-delete px-4 py-2">Delete</button>
					</div>
				</form>
			</div>
		</div>
	</div>

</body>
</html>
