
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Register - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--accent-warm: #E0A96D;
	--accent-hover: #C88E52;
	--bg-main: #FAF7F2;
	--card-bg: #FFFFFF;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-card {
	background-color: var(--card-bg);
	border: 1px solid #EAE3DC;
	border-radius: 12px;
	padding: 32px 40px;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
	margin-top: 30px;
	margin-bottom: 30px;
}

.page-title {
	color: var(--primary-color);
	font-weight: 700;
	font-size: 1.6rem;
}

.form-label {
	color: #4A3E3D;
	font-size: 0.95rem;
}

.form-control, .form-select {
	padding: 10px 12px;
	border-radius: 8px;
	border: 1px solid #D6CECE;
}

.form-control:focus, .form-select:focus {
	border-color: var(--primary-color);
	box-shadow: 0 0 0 0.25rem rgba(92, 61, 46, 0.15);
}

.btn-submit {
	background-color: var(--accent-warm);
	color: #3E2723;
	font-weight: 600;
	border-radius: 8px;
	padding: 9px 24px;
	border: none;
	transition: background-color 0.2s;
}

.btn-submit:hover {
	background-color: var(--accent-hover);
	color: #2C1A14;
}

.btn-cancel {
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
	border-radius: 8px;
	padding: 9px 24px;
	text-decoration: none;
	font-weight: 600;
	display: inline-block;
	transition: all 0.2s;
}

.btn-cancel:hover {
	background-color: #D7CCC8;
	color: #3E2723;
}
</style>
</head>

<body>

	<div class="container py-4" style="max-width: 650px;">
		<div class="main-card">

			<h3 class="page-title mb-4">
				<i class="fa-solid fa-cash-register me-2"></i>Open Daily Register
			</h3>

			<form th:action="@{/manager/daily-registers/save}"
				th:object="${registerDto}" method="post" novalidate>

				<div class="mb-3">
					<label for="branch_id" class="form-label fw-bold"> Branch <span
						class="text-danger">*</span>
					</label> <select id="branch_id" th:field="*{branch_id}" class="form-select"
						th:classappend="${#fields.hasErrors('branch_id')} ? 'is-invalid' : ''">
						<option value="">-- Select Branch --</option>
						<option th:each="branch : ${branches}"
							th:value="${branch.branch_id}" th:text="${branch.name}">
						</option>
					</select>
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('branch_id')}" th:errors="*{branch_id}"></div>
				</div>

				<div class="mb-3">
					<label for="employee_id" class="form-label fw-bold">
						Employee <span class="text-danger">*</span>
					</label> <select id="employee_id" th:field="*{employee_id}"
						class="form-select"
						th:classappend="${#fields.hasErrors('employee_id')} ? 'is-invalid' : ''">
						<option value="">-- Select Employee --</option>
						<option th:each="emp : ${employees}" th:value="${emp.employee_id}"
							th:text="${emp.name}"></option>
					</select>
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('employee_id')}"
						th:errors="*{employee_id}"></div>
				</div>

				<div class="mb-3">
					<label for="register_status_id" class="form-label fw-bold">
						Status <span class="text-danger">*</span>
					</label> <select id="register_status_id" th:field="*{register_status_id}"
						class="form-select"
						th:classappend="${#fields.hasErrors('register_status_id')} ? 'is-invalid' : ''">
						<option value="">-- Select Status --</option>
						<option th:each="status : ${statuses}"
							th:value="${status.register_status_id}" th:text="${status.name}">
						</option>
					</select>
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('register_status_id')}"
						th:errors="*{register_status_id}"></div>
				</div>

				<div class="mb-3">
					<label for="date" class="form-label fw-bold"> Date <span
						class="text-danger">*</span>
					</label> <input type="date" id="date" th:field="*{date}"
						class="form-control"
						th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.
 hasErrors('date')}"
						th:errors="*{date}"></div>
				</div>

				<div class="mb-3">
					<label for="opened_at" class="form-label fw-bold"> Open
						time <span class="text-danger">*</span>
					</label> <input type="time" step="1" id="opened_at" th:field="*{opened_at}"
						class="form-control"
						th:classappend="${#fields.hasErrors('opened_at')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('opened_at')}" th:errors="*{opened_at}"></div>
				</div>

				<div class="mb-3">
					<label for="closed_at" class="form-label fw-bold"> Close
						time <span class="text-danger">*</span>
					</label> <input type="time" step="1" id="closed_at" th:field="*{closed_at}"
						class="form-control"
						th:classappend="${#fields.hasErrors('closed_at')} ? 'is-invalid' : ''">
					<div class="invalid-feedback"
						th:if="${#fields.hasErrors('closed_at')}" th:errors="*{closed_at}"></div>
				</div>

				<div class="mt-4 d-flex gap-2 justify-content-end">
					<a th:href="@{/manager/daily-registers}" class="btn btn-cancel">
						<i class="fa-solid fa-xmark me-1"></i>Cancel
					</a>
					<button type="submit" class="btn btn-submit">
						<i class="fa-solid fa-floppy-disk me-1"></i>Save Register
					</button>
				</div>

			</form>

		</div>
	</div>

</body>
</html>
