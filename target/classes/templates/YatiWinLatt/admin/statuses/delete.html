<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">
            
            <div class="text-danger mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
            </div>

            <h4 class="fw-bold mb-2">Delete Confirmation</h4>
            <p class="text-muted">
                "<strong><span th:text="${statusName}"></span></strong>" ကို ဖျက်ရန် သေချာပါသလား?
            </p>

            <!-- Direct Delete Form Submission -->
            <form th:action="@{/admin/statuses/delete-confirm}" method="post" class="mt-4">
                <input type="hidden" name="type" th:value="${statusType}">
                <input type="hidden" name="id" th:value="${statusId}">

                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/admin/statuses(type=${statusType})}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
