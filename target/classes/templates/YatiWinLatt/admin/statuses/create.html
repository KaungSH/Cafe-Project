<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Status - Luft Cafe shop</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--primary-hover: #432B20;
	--bg-main: #FAF7F2;
	--card-bg: #FFFFFF;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-card {
	background-color: var(--card-bg);
	border-radius: 12px;
	border: 1px solid #EAE3DC;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
}

.card-header {
	background-color: #FCFAF8 !important;
	border-bottom: 1px solid #EAE3DC !important;
	border-top-left-radius: 12px !important;
	border-top-right-radius: 12px !important;
	padding: 20px 28px;
}

.card-title {
	color: var(--primary-color) !important;
	font-size: 1.25rem;
}

.form-label {
	color: #4A3E3D;
	font-size: 0.95rem;
}

.form-control {
	padding: 10px 12px;
	border-radius: 8px;
	border: 1px solid #D6CECE;
}

.form-control:focus {
	border-color: var(--primary-color);
	box-shadow: 0 0 0 0.25rem rgba(92, 61, 46, 0.15);
}

.readonly-input {
	background-color: #F4EAE1 !important;
	color: #5C3D2E !important;
	font-weight: 600;
	border-color: #E8D5C4 !important;
}

.btn-submit {
	background-color: var(--primary-color);
	color: #ffffff;
	font-weight: 600;
	border-radius: 8px;
	padding: 8px 24px;
	border: none;
	transition: background-color 0.2s;
}

.btn-submit:hover {
	background-color: var(--primary-hover);
	color: #ffffff;
}

.btn-cancel {
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
	border-radius: 8px;
	padding: 8px 20px;
	text-decoration: none;
	font-weight: 600;
	display: inline-block;
	transition: all 0.2s;
}

.btn-cancel:hover {
	background-color: #D7CCC8;
	color: #3E2723;
}
</style>
</head>
<body>

	<div class="container py-5" style="max-width: 600px;">
		<div class="main-card">
			<div class="card-header py-3">
				<h5 class="card-title mb-0 fw-bold"
					th:text="${statusId != null and !statusId.isEmpty() ? 'Edit Status' : 'Add New Status'}"></h5>
			</div>
			<div class="card-body p-4">

				<form th:action="@{/admin/statuses/save}" method="post">
					<input type="hidden" name="statusType" th:value="${statusType}">
					<input type="hidden" name="id" th:value="${statusId}">

					<div class="mb-3">
						<label class="form-label fw-bold">Target Type</label> 
							<input type="text" class="form-control text-uppercase readonly-input"
							th:value="${statusType}" readonly>
					</div>

					<div class="mb-3">
						<label for="name" class="form-label fw-bold">Status Name <span
							class="text-danger">*</span></label> <input type="text" id="name"
							name="name" class="form-control" th:value="${statusName}"
							required placeholder="Enter status name">
					</div>

					<div class="d-flex justify-content-end gap-2 mt-4">
						<a th:href="@{/admin/statuses(type=${statusType})}"
							class="btn btn-cancel">Cancel</a>
						<button type="submit" class="btn btn-submit">
						<i class="fa-solid fa-floppy-disk me-1"></i>Save Status
					</button>
					</div>
				</form>

			</div>
		</div>
	</div>

</body>
</html>
