<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Product - Cafe Project</title>

<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

<style>
#coverPreview {
	max-width: 100%;
	max-height: 300px;
	object-fit: contain;
	border-radius: 8px;
	margin-top: 10px;
}
</style>
</head>
<div layout:fragment="content">
	<div class="bg-light">

		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-lg-10 col-xl-9">
					<div class="card shadow-sm">

						<div class="card-header bg-secondary text-white">
							<h2 class="mb-0">Add Product Type</h2>
						</div>

						<div class="card-body p-4">

							<form method="post" th:action="@{/manager/products/type/add}"
								th:object="${product_type}" enctype="multipart/form-data">

								<!-- Name -->
								<div class="mb-4">
									<label for="name" class="form-label fw-semibold"> Name
									</label> <input type="text" id="name" class="form-control"
										th:field="*{name}" placeholder="Enter Product Type Name"
										required>
								</div>


								<!-- Description -->
								<div class="mb-4">
									<label for="description" class="form-label fw-semibold">
										Description </label>
									<textarea id="description" class="form-control"
										th:field="*{description}" rows="8"
										placeholder="Write your description here..."></textarea>
								</div>


								<!-- Cover Image -->
								<div class="mb-4">

									<label for="coverImg" class="form-label fw-semibold">
										Cover Image </label> <input type="file" id="coverImg"
										name="coverImgPart" class="form-control" accept="image/*">
									<div class="form-text">Select an image to use as the
										cover of your post.</div>

									<div class="mt-3">
										<img id="coverPreview" class="img-fluid"
											style="display: none;" alt="Cover image Error">
									</div>

								</div>


								<!-- Category -->
								<div class="mb-4">

									<label for="category" class="form-label fw-semibold">
										Category </label> <select id="category" class="form-select"
										th:field="*{category_id}">
										<option value="0" disabled>--- Select One ---</option>
										<option th:each="c : ${categories}"
											th:value="${c.category_id}" th:text="${c.name}"></option>
									</select>
								</div>



								<!-- Price -->
								<div class="mb-4">

									<label for="priceDisplay" class="form-label fw-semibold">
										Default Price </label>

									<!-- What the user sees -->
									<input type="text" id="priceDisplay" class="form-control"
										placeholder="Enter Default Price" required>

									<!-- What Spring receives -->
									<input type="hidden" id="price" th:field="*{price}">

								</div>


								<!-- NEW: Product Sizes & Ingredients Configuration Table -->
								<!-- Product Sizes & Ingredients Configuration Table -->
								<div class="mb-4 border-top pt-4">
									<label class="form-label fw-semibold fs-5 mb-2">
										Product Sizes And Ingredients Setup </label>
									<p class="text-muted small">Select the sizes you want to
										enable for this product type, define their variant price,
										active state, and required ingredients.</p>
									<div class="table-responsive">
										<table class="table table-bordered align-middle">
											<thead class="table-light">
												<tr>
													<th style="width: 8%;" class="text-center">Enable</th>
													<th style="width: 17%;">Size</th>
													<th style="width: 20%;">Variant Price</th>
													<th style="width: 15%;" class="text-center">Is Active</th>
													<th style="width: 40%;">Required Ingredients</th>
												</tr>
											</thead>
											<tbody>
												<tr th:each="s, sStat : ${sizes}">
													<!-- Enable Size -->
													<td class="text-center"><input type="checkbox"
														class="form-check-input"
														th:name="${'products[' + sStat.index + '].size_id'}"
														th:value="${s.size_id}"></td>
													<!-- Size -->
													<td><span class="fw-bold"
														th:text="${s.size_code != null ? s.size_code : s.name}">
															Size </span></td>
													<!-- Variant Price -->
													<td><input type="number" step="0.01" min="0"
														class="form-control form-control-sm"
														th:name="${'products[' + sStat.index + '].price'}"
														placeholder="Price"></td>
													<!-- Is Active -->
													<td class="text-center"><input type="checkbox"
														class="form-check-input"
														th:name="${'products[' + sStat.index + '].is_active'}"
														value="true" checked></td>
													<!-- Required Ingredients -->
													<td>
														<div class="row g-2 align-items-center">
															<!-- Ingredient -->
															<div class="col-7">
																<select class="form-select form-select-sm"
																	th:name="${'products[' + sStat.index + '].ingredients_ids[0]'}">
																	<option value="" disabled selected>-- Select
																		Ingredient --</option>
																	<option th:each="ing : ${ingredients}"
																		th:value="${ing.ingredient_type_id}"
																		th:text="${ing.name}"></option>
																</select>
															</div>
															<!-- Quantity -->
															<div class="col-5">
																<input type="number" step="0.01" min="0"
																	class="form-control form-control-sm"
																	th:name="${'products[' + sStat.index + '].quantity_required[0]'}"
																	placeholder="Qty">
															</div>
														</div>
													</td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>


								<!-- Buttons -->
								<div
									class="d-flex justify-content-between align-items-center pt-3 border-top">

									<a th:href="@{/manager/products/type}"
										class="btn btn-outline-secondary"> Cancel </a>
									<button type="submit" class="btn btn-secondary">
										Create Product</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>


		<!-- Bootstrap JavaScript -->
		<script th:src="@{/js/bootstrap.bundle.min.js}"></script>


		<!-- Image Preview -->
		<script>
			document.getElementById("coverImg")
					.addEventListener(
							"change",
							function(event) {

								const file = event.target.files[0];
								const preview = document
										.getElementById("coverPreview");

								if (file) {
									preview.src = URL.createObjectURL(file);
									preview.style.display = "block";
								} else {
									preview.src = "";
									preview.style.display = "none";
								}
							});
		</script>
		<script>
			const priceDisplay = document.getElementById("priceDisplay");
			const price = document.getElementById("price");

			priceDisplay.addEventListener("input", function() {

				// Remove everything except numbers and decimal point
				let value = this.value.replace(/[^0-9.]/g, "");

				// Prevent multiple decimal points
				const parts = value.split(".");
				if (parts.length > 2) {
					value = parts[0] + "." + parts.slice(1).join("");
				}

				// Update what the user sees
				if (value) {
					const number = parseFloat(value);

					this.value = number.toLocaleString("en-US");

					// Update the hidden field with the raw number
					price.value = number.toFixed(2);
				} else {
					this.value = "";
					price.value = "";
				}
			});
		</script>

	</div>
</div>
</html>
