<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Login | Coffee Shop</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Google Fonts -->
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
	rel="stylesheet">

<style>
body {
	background-color: #f9f4ef;
	font-family: 'Nunito', sans-serif;
	color: #4a3018;
	display: flex;
	align-items: center;
	min-height: 100vh;
	margin: 0;
}

.login-container {
	background-color: #ffffff;
	border-radius: 20px;
	padding: 40px;
	box-shadow: 0 10px 30px rgba(92, 58, 33, 0.08);
	max-width: 450px;
	width: 100%;
	margin: auto;
}

h2 {
	color: #5c3a21;
	font-weight: 700;
	text-align: center;
	margin-bottom: 30px;
}

.form-label {
	font-weight: 600;
	color: #6d4c41;
	margin-bottom: 8px;
}

.form-control {
	border-radius: 12px;
	border: 1px solid #e6d5c3;
	padding: 12px 15px;
	transition: all 0.3s ease;
	background-color: #fcf9f5;
}

.form-control:focus {
	border-color: #a87b51;
	box-shadow: 0 0 0 4px rgba(168, 123, 81, 0.15);
	background-color: #ffffff;
}

.btn-coffee-primary {
	background-color: #a87b51;
	color: white;
	border: none;
	border-radius: 12px;
	padding: 12px;
	font-weight: 700;
	width: 100%;
	transition: all 0.3s ease;
	margin-top: 15px;
}

.btn-coffee-primary:hover {
	background-color: #8c633e;
	color: white;
	transform: translateY(-2px);
}
</style>
</head>
<body>
	<div class="container">
		<div class="login-container">
			<h2>☕ Employee Login</h2>

			<div th:if="${error}" class="alert alert-danger" th:text="${error}"
				style="border-radius: 12px;"></div>

			<form th:action="@{/manager/employee/login}"
				th:object="${loginModel}" method="post">
				<div class="mb-3">
					<label class="form-label">Email address</label> <input type="email"
						th:field="*{email}" class="form-control" placeholder="Enter email" />
					<div class="text-danger mt-1 small"
						th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
				</div>

				<div class="mb-3">
					<label class="form-label">Password</label> <input type="password"
						th:field="*{password}" class="form-control"
						placeholder="Enter password" />
					<div class="text-danger mt-1 small"
						th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
				</div>

				<button type="submit" class="btn btn-coffee-primary">Login</button>
			</form>
		</div>
	</div>
</body>
</html>
