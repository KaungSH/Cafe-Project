<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div th:fragment="sidebar">
<div class="bg-light border-end min-vh-100 d-flex flex-column">
	<div class="list-group rounded-0">
		<a href="/"  class="list-group-item list-group-item-action">
			Home
		</a>
		<a href="/posts"  class="list-group-item list-group-item-action">
			Post
		</a>
		<a href="/categories"  class="list-group-item list-group-item-action">
			Category
		</a>
		<a href="/tags"  class="list-group-item list-group-item-action">
			Tag
		</a>
		<a th:if = "${session.loggedInUser.role == T(ai.blogapp.model.Role).SUPERADMIN}" href="/users"  class="list-group-item list-group-item-action">
			User
		</a>
	</div>
</div>
</div>
</body>
</html>
