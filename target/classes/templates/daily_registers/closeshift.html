
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Register - Luft Cafe</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
	--primary-color: #5C3D2E;
	--accent-warm: #E0A96D;
	--accent-hover: #C88E52;
	--bg-main: #FAF7F2;
	--card-bg: #FFFFFF;
	--text-color: #2D2422;
}

body {
	background-color: var(--bg-main);
	color: var(--text-color);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-card {
	background-color: var(--card-bg);
	border: 1px solid #EAE3DC;
	border-radius: 12px;
	padding: 32px 40px;
	box-shadow: 0 4px 15px rgba(92, 61, 46, 0.05);
	margin-top: 30px;
	margin-bottom: 30px;
}

.page-title {
	color: var(--primary-color);
	font-weight: 700;
	font-size: 1.6rem;
}

.form-label {
	color: #4A3E3D;
	font-size: 0.95rem;
}

.form-control, .form-select {
	padding: 10px 12px;
	border-radius: 8px;
	border: 1px solid #D6CECE;
}

.form-control:focus, .form-select:focus {
	border-color: var(--primary-color);
	box-shadow: 0 0 0 0.25rem rgba(92, 61, 46, 0.15);
}

.btn-submit {
	background-color: var(--accent-warm);
	color: #3E2723;
	font-weight: 600;
	border-radius: 8px;
	padding: 9px 24px;
	border: none;
	transition: background-color 0.2s;
}

.btn-submit:hover {
	background-color: var(--accent-hover);
	color: #2C1A14;
}

.btn-cancel {
	background-color: #EFEBE9;
	color: #5D4037;
	border: 1px solid #D7CCC8;
	border-radius: 8px;
	padding: 9px 24px;
	text-decoration: none;
	font-weight: 600;
	display: inline-block;
	transition: all 0.2s;
}

.btn-cancel:hover {
	background-color: #D7CCC8;
	color: #3E2723;
}
</style>
</head>

<body>

<div class="container py-4" style="max-width: 650px;">

<div class="main-card">

	<h3 class="page-title mb-4">
		<i class="fa-solid fa-cash-register me-2"></i>Open Daily Register
	</h3>

	<form th:action="@{/closeshift}"
		  th:object="${registerDto}"
		  method="post"
		  novalidate>
	<input type="hidden" th:field="*{register_id}" />

		<!-- Branch: Display only -->
		<div class="mb-3">
			<label class="form-label fw-bold">
				Branch
			</label>
			<div class="display-field"
				 th:text="${branch}">
				Branch Name
			</div>
			<input type="hidden"
				   th:field="*{branch_id}">
		</div>


		<!-- Employee: Display only -->
		<div class="mb-3">
			<label class="form-label fw-bold">
				Employee
			</label>
			<div class="display-field"
				 th:text="${employee}">
				Employee Name
			</div>
			<input type="hidden"
				   th:field="*{employee_id}">
		</div>


		<!-- Status: Display only -->
		<div class="mb-3">
			<label class="form-label fw-bold">
				Status
			</label>
			<div class="display-field"
				 th:text="${status}">
				Status Name
			</div>
			<input type="hidden"
				   th:field="*{register_status_id}">
		</div>


		<!-- Date: Display only -->
		<div class="mb-3">

			<label class="form-label fw-bold">
				Date
			</label>

			<div class="display-field"
				 th:text="${registerDto.date}">
			</div>

			<input type="hidden"
				   th:field="*{date}">

		</div>


		<!-- Open time: Display only -->
		<div class="mb-3">

			<label class="form-label fw-bold">
				Open time
			</label>

			<div class="display-field"
				 th:text="${registerDto.opened_at}">
			</div>

			<input type="hidden"
				   th:field="*{opened_at}">

		</div>
		
		<!-- Close time: Display only -->
		<div class="mb-3">

			<label class="form-label fw-bold">
				Close time
			</label>

			<div class="display-field"
				 th:text="${registerDto.closed_at}">
			</div>

			<input type="hidden"
				   th:field="*{closed_at}">

		</div>


		<!-- Buttons -->
		<div class="mt-4 d-flex gap-2 justify-content-end">

			<a th:href="@{/manager/daily-registers}"
			   class="btn btn-cancel">

				<i class="fa-solid fa-xmark me-1"></i>Cancel

			</a>

			<button type="submit" class="btn btn-submit">

				<i class="fa-solid fa-floppy-disk me-1"></i>Save Register

			</button>

		</div>

	</form>

</div>
</div>

</body>
</html>
