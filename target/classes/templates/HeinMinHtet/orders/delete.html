<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Delete Order</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">

	<div class="container bg-white p-4 rounded shadow-sm"
		style="max-width: 500px;">
		<h3 class="text-danger mb-3">Delete Confirmation</h3>
		<p>Are you sure you want to delete this order?</p>

		<div class="card mb-4 bg-light">
			<div class="card-body">
				<p class="mb-1">
					<strong>Order ID:</strong> <span th:text="${order.order_id}"></span>
				</p>
				<p class="mb-1">
					<strong>Customer ID:</strong> <span th:text="${order.customer_id}"></span>
				</p>
				<p class="mb-0">
					<strong>Total Amount:</strong> <span
						th:text="${order.total_amount}"></span>
				</p>
			</div>
		</div>

		<form th:action="@{/orders/delete}" th:object="${order}" method="post">
			<input type="hidden" th:field="*{order_id}" />
			<div class="d-flex justify-content-between">
				<a th:href="@{/orders}" class="btn btn-secondary">Cancel</a>
				<button type="submit" class="btn btn-danger">Confirm Delete</button>
			</div>
		</form>
	</div>

</body>
</html>
