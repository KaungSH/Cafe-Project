<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add New Supplier</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #FFF8E8;
	font-family: Arial, sans-serif;
	color: #5A351F;
}

.form-container {
	width: 90%;
	max-width: 750px;
	margin: 60px auto;
}

.form-card {
	background-color: white;
	border-radius: 14px;
	border: 1px solid #E5D2B8;
	box-shadow: 0 8px 25px rgba(74, 44, 26, 0.10);
	overflow: hidden;
}

/* Header */
.form-header {
	padding: 25px 30px;
	border-bottom: 1px solid #EADBC8;
}

.form-header h2 {
	margin: 0;
	color: #5A351F;
	font-weight: 700;
}

.form-header p {
	margin: 5px 0 0;
	color: #8A6A50;
	font-size: 14px;
}

.form-body {
	padding: 30px;
}

.form-row {
	display: flex;
	align-items: center;
	margin-bottom: 22px;
}

.form-label-box {
	width: 150px;
	font-weight: 600;
	color: #5A351F;
}

.dash {
	width: 25px;
	text-align: center;
	color: #8A6A50;
	font-weight: bold;
}

.input-box {
	flex: 1;
}

.form-control {
	height: 45px;
	border: 1px solid #DCC8AE;
	border-radius: 8px;
	font-size: 14px;
}

.form-control:focus {
	border-color: #6B4226;
	box-shadow: 0 0 0 2px rgba(107, 66, 38, 0.10);
}

.error {
	color: #B23A2E;
	font-size: 12px;
	margin-top: 5px;
}

.form-footer {
	padding: 20px 30px;
	border-top: 1px solid #EADBC8;
	display: flex;
	justify-content: flex-end;
	gap: 10px;
}

.btn-cancel {
	color: #5A351F;
	border: 1px solid #5A351F;
	background: white;
	padding: 9px 20px;
	border-radius: 7px;
	text-decoration: none;
}

.btn-add {
	color: white;
	background: #5A351F;
	border: 1px solid #5A351F;
	padding: 9px 20px;
	border-radius: 7px;
}

.btn-add:hover {
	background: #3E2416;
	color: white;
}

@media ( max-width : 600px) {
	.form-row {
		display: block;
	}
	.form-label-box {
		width: 100%;
		margin-bottom: 7px;
	}
	.dash {
		display: none;
	}
}
</style>

</head>


<body>

	<div class="form-container">

		<div class="form-card">

			<div class="form-header">

				<h2>Add New Supplier</h2>

			</div>


			<form method="post" th:action="@{/manager/supplier/add}"
				th:object="${supplier}">

				<div class="form-body">

					<div class="form-row">

						<div class="form-label-box">Supplier ID</div>

						<div class="dash">-</div>

						<div class="input-box">

							<input type="text" class="form-control" th:field="*{supplier_id}"
								placeholder="Enter supplier ID">

							<div class="error" th:if="${#fields.hasErrors('supplier_id')}"
								th:errors="*{supplier_id}"></div>

						</div>

					</div>

					<div class="form-row">

						<div class="form-label-box">Name</div>

						<div class="dash">-</div>

						<div class="input-box">

							<input type="text" class="form-control" th:field="*{name}"
								placeholder="Enter supplier name">

							<div class="error" th:if="${#fields.hasErrors('name')}"
								th:errors="*{name}"></div>

						</div>

					</div>
					<div class="form-row">

						<div class="form-label-box">Contact Info</div>

						<div class="dash">-</div>

						<div class="input-box">

							<input type="text" class="form-control"
								th:field="*{contact_info}"
								placeholder="Enter contact information">

							<div class="error" th:if="${#fields.hasErrors('contact_info')}"
								th:errors="*{contact_info}"></div>

						</div>

					</div>

				</div>

				<div class="form-footer">

					<a th:href="@{/manager/supplier}" class="btn-cancel"> Cancel </a>

					<button type="submit" class="btn-add">Add Supplier</button>

				</div>

			</form>

		</div>

	</div>

</body>

</html>
