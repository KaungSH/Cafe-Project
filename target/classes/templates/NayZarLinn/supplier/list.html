<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Supplier List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body {
	margin: 0;
	background-color: #faf7f1;
	color: #241c16;
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.supplier-container {
	width: 95%;
	max-width: 1450px;
	margin: 25px auto;
}

.supplier-header {
	display: flex;
	justify-content: space-between;
	align-items: flex-start;
	margin-bottom: 28px;
}

.supplier-title h2 {
	margin: 0 0 6px 0;
	color: #241c16;
	font-size: 27px;
	font-weight: 700;
	line-height: 1.2;
}

.supplier-title h2 i {
	color: #875522;
	font-size: 22px;
	margin-right: 7px;
}

.supplier-title p {
	margin: 0;
	color: #806b56;
	font-size: 14px;
	line-height: 1.5;
}

.btn-add {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #925d2b;
	color: #ffffff;
	border: none;
	border-radius: 9px;
	padding: 10px 18px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	transition: 0.2s;
}

.btn-add:hover {
	background-color: #75451f;
	color: #ffffff;
}

.btn-deleted {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background-color: #eadbc7;
	color: #624522;
	border: none;
	border-radius: 9px;
	padding: 10px 18px;
	font-size: 14px;
	font-weight: 600;
	text-decoration: none;
	margin-left: 7px;
	transition: 0.2s;
}

.btn-deleted:hover {
	background-color: #ddc9ae;
	color: #4f351c;
}

.supplier-container .table {
	width: 100%;
	margin: 0;
	background-color: #fffaf4;
	border: 1px solid #eadcca;
	border-radius: 14px;
	overflow: hidden;
	border-collapse: separate;
	border-spacing: 0;
	box-shadow: 0 2px 8px rgba(80, 50, 20, 0.04);
}

.supplier-container .table thead th {
	background-color: #f5ecdf;
	color: #9a8067;
	padding: 13px 20px;
	font-size: 12px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.4px;
	border: none;
	border-bottom: 1px solid #eadcca;
	white-space: nowrap;
}

.supplier-container .table tbody td {
	padding: 14px 20px;
	color: #705a45;
	font-size: 14px;
	vertical-align: middle;
	border: none;
	border-bottom: 1px solid #eadcca;
}

.supplier-container .table tbody tr:last-child td {
	border-bottom: none;
}

.supplier-container .table tbody tr:hover {
	background-color: #fcf5eb;
}

.supplier-container .table tbody td:nth-child(2) {
	color: #211a15;
	font-weight: 500;
}

.supplier-container .table tbody td:nth-child(3) {
	color: #745d47;
}

.supplier-container .table tbody td:nth-child(4) {
	color: #806b56;
	white-space: nowrap;
}

.btn-edit {
	display: inline-block;
	color: #5f401f;
	background-color: #ffffff;
	border: 1px solid #ddcbb4;
	border-radius: 8px;
	padding: 6px 13px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	transition: 0.2s;
}

.btn-edit:hover {
	background-color: #f1e4d1;
	color: #5f401f;
	border-color: #cdb391;
}

.btn-delete {
	display: inline-block;
	color: #8f3e2e;
	background-color: #ffffff;
	border: 1px solid #e2c9bf;
	border-radius: 8px;
	padding: 6px 13px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	margin-left: 5px;
	transition: 0.2s;
}

.btn-delete:hover {
	background-color: #f2d8d0;
	color: #8f3e2e;
	border-color: #d6afa3;
}

@media ( max-width : 768px) {
	.supplier-container {
		width: 94%;
		margin: 20px auto;
	}
	.supplier-header {
		flex-direction: column;
		gap: 15px;
	}
	.supplier-title h2 {
		font-size: 24px;
	}
	.supplier-container .table {
		min-width: 850px;
	}
	.supplier-container {
		overflow-x: auto;
	}

	.search-box {
		width: 350px;
		height: 48px;
		display: flex;
		align-items: center;
		background-color: #ffffff;
		border: 1px solid #ddcbb4;
		border-radius: 10px;
		margin-bottom: 20px;
		padding: 0 14px;
	}
	.search-box i {
		color: #9a8067;
		font-size: 16px;
		margin-right: 9px;
	}
	.search-box input {
		width: 100%;
		border: none;
		outline: none;
		background: transparent;
		color: #4f3928;
		font-size: 14px;
	}
	.search-box input::placeholder {
		color: #9a8067;
	}
}
</style>
</head>
<body>
	<div class="supplier-container">
		<div class="supplier-header">
			<div class="supplier-title">
				<h2>
					<i class="bi bi-cup-hot"></i> Supplier List
				</h2>
				<p>Manage your coffee shop suppliers</p>
			</div>
			<div class="search-box">

				<i class="bi bi-search"></i> <input type="text" id="supplierSearch"
					placeholder="Search suppliers...">

			</div>
			<div>
				<a th:href="@{/manager/supplier/add}" class="btn-add"> <i
					class="bi bi-plus-lg"></i> Add
				</a> <a th:href="@{/manager/supplier/deleted}" class="btn-deleted">
					<i class="bi bi-trash"></i> Deleted Suppliers List
				</a>
			</div>
		</div>

		<table class="table">
			<thead>
				<tr>
					<th>Supplier_id</th>
					<th>Name</th>
					<th>Contact_Info</th>
					<th>Created_at</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="s, state: ${supplier}">
					<td th:text="${s.supplier_id}"></td>
					<td th:text="${s.name}"></td>
					<td th:text="${s.contact_info}"></td>
					<td
						th:text="${#temporals.format(s.created_at, 'MM.dd.yyyy HH:mm')}"></td>
					<td><a
						th:href="@{/manager/supplier/edit/{supplier_id}(supplier_id=${s.supplier_id})}"
						class="btn-edit">Edit</a> <a
						th:href="@{/manager/supplier/delete/{supplier_id}(supplier_id=${s.supplier_id})}"
						class="btn-delete">Delete</a></td>
				</tr>

			</tbody>
		</table>
	</div>
	<script>
		document
				.getElementById("supplierSearch")
				.addEventListener("keyup",function() {

							let searchValue = this.value.toLowerCase();

							let rows = document.querySelectorAll(".supplier-container .table tbody tr");

							rows.forEach(function(row) {
										let supplierName = row.querySelector("td:nth-child(2)").textContent.toLowerCase();
										let contactInfo = row.querySelector("td:nth-child(3)").textContent.toLowerCase();
										if (supplierName.includes(searchValue) || contactInfo.includes(searchValue)) {
											row.style.display = "";
										} else {
											row.style.display = "none";
										}});
							});
	</script>
</body>
</html>
