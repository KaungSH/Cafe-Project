<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Deleted Ingredient Type List</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
	background-color: #FFF8E8;
	font-family: Arial, sans-serif;
	color: #3E2416;
}

.supplier-container {
	width: 92%;
	max-width: 1500px;
	margin: 50px auto;
}

.supplier-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

.supplier-title h2 {
	font-weight: 700;
	color: #5A351F;
	margin: 0 0 5px 0;
}

.supplier-title p {
	color: #8A6A50;
	margin: 0;
}

.btn-back {
	background-color: #D9B892;
	color: #3E2416;
	border: none;
	padding: 10px 20px;
	border-radius: 8px;
	text-decoration: none;
}

.btn-back:hover {
	background-color: #C9A477;
	color: #3E2416;
}

.table-card {
	background-color: white;
	border-radius: 14px;
	overflow: hidden;
	box-shadow: 0 5px 20px rgba(90, 53, 31, 0.10);
	border: 1px solid #E8D5BA;
}

.supplier-table {
	width: 100%;
	margin: 0;
	border-collapse: collapse;
}

.supplier-table thead {
	background-color: #5A351F;
	color: white;
}

.supplier-table th {
	padding: 16px;
	font-size: 13px;
	font-weight: 600;
	border: none;
	text-align: left;
}

.supplier-table td {
	padding: 16px;
	vertical-align: middle;
	color: #5A351F;
	border-bottom: 1px solid #F0E2CF;
}

.supplier-table tbody tr:hover {
	background-color: #FFF5E5;
}

.deleted-status {
	color: #9B3A2E;
	font-weight: 600;
}

.btn-restore {
	color: #6B8E23;
	border: 1px solid #6B8E23;
	padding: 5px 12px;
	border-radius: 6px;
	font-size: 13px;
	background: white;
}

.btn-restore:hover {
	background-color: #6B8E23;
	color: white;
}

.btn-hard-delete {
	color: #9B3A2E;
	border: 1px solid #9B3A2E;
	padding: 5px 12px;
	border-radius: 6px;
	font-size: 13px;
	background: white;
	margin-left: 5px;
	cursor: pointer;
}

.btn-hard-delete:hover {
	background-color: #9B3A2E;
	color: white;
}
</style>
</head>
<body>
	<div class="ingredient_type-container">
		<div class="ingredient_type-header">
			<div class="ingredient_type-title">
				<h2>
					<i class="bi bi-trash"></i> Deleted ingredient_type
				</h2>
				<p>Manage deleted coffee shop ingredient_type</p>
			</div>
			<div>
				<a th:href="@{/ingredientType}" class="btn-back"> <i
					class="bi bi-arrow-left"></i> Ingredient Type List
				</a>
			</div>
		</div>
	</div>
	<div class="table-card">
		<table class="table ingredient_type-table">
			<thead>
				<tr>
					<th>No.</th>
					<th>Id</th>
					<th>Name</th>
					<th>Description</th>
					<th>Unit_id</th>
					<th>Unit Name</th>
					<th>CreatedAt</th>
				</tr>
			</thead>

			<tbody>

				<tr th:each="i,state:${ingredientType}">
					<td th:text="${state.count}"></td>
					<td th:text="${i.ingredient_type_id}"></td>
					<td th:text="${i.name}"></td>
					<td th:text="${i.description}"></td>
					<td th:text="${i.unit_id}"></td>
					<td th:text="${i.unit_name}"></td>
					<td th:text="${i.created_at}"></td>

					<td>
						<form method="post" th:action="@{/ingredientType/restore}"
							style="display: inline;">

							<input type="hidden" name="ingredient_type_id"
								th:value="${ingredientType.ingredient_type_id}">

							<button type="submit">Restore</button>
						</form>
						<form method="post" th:action="@{/ingredientType/real-delete}"
							style="display: inline;">

							<input type="hidden" name="ingredient_type_id"
								th:value="${ingredientType.ingredient_type_id}">

							<button type="submit"
								onclick="return confirm('Are you sure you want to delete this Ingredient Type?');">
								Delete</button>
						</form>
					</td>

				</tr>
			</tbody>

		</table>
	</div>
</body>
</html>
