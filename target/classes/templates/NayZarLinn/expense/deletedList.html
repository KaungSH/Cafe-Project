<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Deleted Expense List</title>
<style>
body {
	font-family: Arial, sans-serif;
	background: #f7f2eb;
	margin: 0;
	padding: 30px;
	color: #3d3025;
}

.container {
	max-width: 1200px;
	margin: auto;
}

.header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
}

h2 {
	color: #3d3025;
	margin: 0;
	font-size: 28px;
}

.back-btn {
	background: #8b5e34;
	color: white;
	text-decoration: none;
	padding: 10px 18px;
	border-radius: 8px;
	font-weight: 600;
}

.back-btn:hover {
	background: #704924;
}

.table-box {
	background: white;
	border-radius: 15px;
	overflow: hidden;
	box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

table {
	width: 100%;
	border-collapse: collapse;
}

th {
	background: #8b5e34;
	color: white;
	padding: 15px;
	text-align: left;
	font-size: 15px;
}

td {
	padding: 14px 15px;
	border-bottom: 1px solid #eee3d7;
	font-size: 14px;
}

tr:hover {
	background: #faf7f2;
}

.action-cell {
	white-space: nowrap;
	text-align: center;
}

.restore-btn {
	background: #f7f1e8;
	color: #5f765c;
	border: 1px solid #a8b69f;
	border-radius: 7px;
	padding: 7px 13px;
	font-size: 14px;
	font-weight: 600;
	cursor: pointer;
	margin-right: 4px;
}

.restore-btn:hover {
	background: #dfe8d9;
	color: #4d6349;
}

.delete-btn {
	background: #8b5e34;
	color: white;
	border: 1px solid #8b5e34;
	border-radius: 7px;
	padding: 7px 13px;
	font-size: 14px;
	font-weight: 600;
	cursor: pointer;
}

.delete-btn:hover {
	background: #704924;
	border-color: #704924;
}

.empty {
	text-align: center;
	padding: 30px;
	color: #777;
	font-size: 15px;
}

@media ( max-width : 900px) {
	body {
		padding: 15px;
	}
	.table-box {
		overflow-x: auto;
	}
	table {
		min-width: 900px;
	}
	.header {
		flex-direction: column;
		align-items: flex-start;
		gap: 15px;
	}
}
</style>

</head>


<body>

	<div class="container">


		<div class="header">

			<h2>Deleted Expenses</h2>

			<a th:href="@{/manager/expense}" class="back-btn"> Back to
				Expenses </a>

		</div>


		<div class="table-box">

			<table>

				<thead>

					<tr>

						<th>Branch</th>

						<th>Category</th>

						<th>Amount</th>

						<th>Date & Time</th>

						<th>Description</th>

						<th>Action</th>

					</tr>

				</thead>

				<tbody>

					<tr th:each="e : ${expense}">

						<td th:text="${e.branch_name}">Branch</td>

						<td th:text="${e.category_name}">Category</td>

						<td th:text="${e.amount}">0</td>

						<td
							th:text="${#temporals.format(e.expense_date, 'dd-MM-yyyy HH:mm')}">
							Date</td>

						<td th:text="${e.description}">Description</td>


						<td class="action-cell">

							<form th:action="@{/manager/expense/restore}" method="post"
								style="display: inline;">

								<input type="hidden" name="expense_id"
									th:value="${e.expense_id}">

								<button type="submit" class="restore-btn">Restore</button>

							</form>
							<form th:action="@{/manager/expense/real-delete}" method="post"
								style="display: inline;"
								onsubmit="return confirm('Are you sure you want to permanently delete this expense?');">


								<input type="hidden" name="expense_id"
									th:value="${e.expense_id}">


								<button type="submit" class="delete-btn">Delete
									Permanently</button>


							</form>


						</td>


					</tr>


					<tr th:if="${#lists.isEmpty(expense)}">

						<td colspan="6" class="empty">No deleted expenses found.</td>

					</tr>


				</tbody>

			</table>

		</div>

	</div>

</body>

</html>
