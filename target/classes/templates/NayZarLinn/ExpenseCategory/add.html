<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Expense Category</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f8f9fa;
}

.form-box {
	width: 600px;
	max-width: 95%;
	margin: 60px auto;
	background-color: white;
	padding: 35px;
	border-radius: 15px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.title {
	font-size: 27px;
	font-weight: 600;
	margin-bottom: 30px;
}

.form-label {
	font-weight: 500;
}

.form-control {
	height: 48px;
	border-radius: 8px;
}

.error {
	color: #dc3545;
	font-size: 13px;
	margin-top: 5px;
}

.cancel-btn {
	border: 1px solid #ddd;
	background-color: white;
	color: #555;
	padding: 10px 22px;
	border-radius: 8px;
	text-decoration: none;
}

.save-btn {
	background-color: #8b7373;
	color: white;
	border: none;
	padding: 10px 25px;
	border-radius: 8px;
}

.save-btn:hover {
	background-color: #765f5f;
	color: white;
}
</style>

</head>

<body>

	<div class="form-box">

		<div class="title">Add Expense Category</div>


		<form th:action="@{/manager/expensecategory/add}"
			th:object="${expensecategory}" method="post">

			<div class="mb-4">

				<label class="form-label"> Category Name </label> <input type="text"
					class="form-control" th:field="*{category_name}"
					placeholder="Example: Cleaning & Consumables">

				<div class="error" th:if="${#fields.hasErrors('category_name')}"
					th:errors="*{category_name}"></div>

			</div>

			<div class="d-flex justify-content-end gap-2">

				<a th:href="@{/manager/expensecategory}" class="cancel-btn"> Cancel </a>

				<button type="submit" class="save-btn">Save</button>

			</div>

		</form>

	</div>

</body>
</html>
