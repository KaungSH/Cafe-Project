<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Deleted Ingredient Batch List</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background-color: #f5dfb0;
	color: #5a351f;
}

.main-container {
	margin-top: 50px;
	margin-bottom: 50px;
}

.page-card {
	background-color: #fff8e8;
	padding: 30px;
	border-radius: 18px;
	box-shadow: 0 5px 15px rgba(90, 53, 31, 0.20);
}

.page-title {
	color: #5a351f;
	font-weight: bold;
}

.table thead th {
	background-color: #5a351f;
	color: white;
}

.table tbody tr:hover {
	background-color: #f8ead0;
}

.btn-coffee {
	background-color: #6b4026;
	color: white;
	border: none;
}

.btn-coffee:hover {
	background-color: #5a351f;
	color: white;
}

.btn-restore {
	background-color: #ead3a3;
	color: #5a351f;
	border: none;
}

.btn-restore:hover {
	background-color: #d9bc80;
	color: #5a351f;
}

.btn-hard-delete {
	background-color: #8b4a32;
	color: white;
	border: none;
}

.btn-hard-delete:hover {
	background-color: #5a351f;
	color: white;
}

.btn-restore {
	color: #b56f6f;
	border: 1px solid #b56f6f;
	background-color: transparent;
}

.btn-restore:hover {
	background-color: #b56f6f;
	color: white;
}
</style>

</head>


<body>

	<div class="container main-container">

		<div class="page-card">

			<div class="d-flex justify-content-between align-items-center mb-4">

				<h2 class="page-title">Deleted Ingredient Batch List</h2>

				<a th:href="@{/manager/ingredientBatch}" class="btn btn-coffee">
					Back to List </a>

			</div>

			<div class="table-responsive">

				<table class="table table-bordered table-hover align-middle">

					<thead>

						<tr>

							<th>No.</th>

							<th>Batch ID</th>

							<th>Remaining Quantity</th>

							<th>Manufactured Date</th>

							<th>Expire Date</th>

							<th>Branch ID</th>

							<th>Import Detail ID</th>

							<th>Ingredient Type ID</th>

							<th>Unit Cost</th>

							<th>Action</th>
							
							<th></th>

						</tr>

					</thead>


					<tbody>

						<tr th:each="ingredientBatch, stat : ${ingredientBatch}">

							<td th:text="${stat.count}"></td>

							<td th:text="${ingredientBatch.batchId}"></td>

							<td th:text="${ingredientBatch.remainingQuantity}"></td>

							<td th:text="${ingredientBatch.manufacturedDate}"></td>

							<td th:text="${ingredientBatch.expireDate}"></td>

							<td th:text="${ingredientBatch.branchId}"></td>

							<td th:text="${ingredientBatch.importDetailId}"></td>

							<td th:text="${ingredientBatch.ingredientTypeId}"></td>

							<td th:text="${ingredientBatch.unitCost}"></td>

							<td>

								<div th:if="${!ingredientBatch.isExpired}">

									<form th:action="@{/manager/ingredientBatch/restore}"
										method="post" style="display: inline;">

										<input type="hidden" name="batchId"
											th:value="${ingredientBatch.batchId}">

										<button type="submit" class="btn-restore">Restore</button>

									</form>

								</div>
								<div th:if="${ingredientBatch.isExpired}">

									<span class="text-danger fw-bold"> 🔴 EXPIRED - NO
										RESTORE </span>

								</div>

							</td>
							<td>

								<form th:action="@{/manager/ingredientBatch/real-delete}"
									method="post">

									<input type="hidden" name="batchId"
										th:value="${ingredientBatch.batchId}">

									<button type="submit" class="btn-hard-delete">
										Delete</button>

								</form>

							</td>

						</tr>

						<tr th:if="${#lists.isEmpty(ingredientBatch)}">

							<td colspan="10" class="text-center">No deleted ingredient
								batches found.</td>

						</tr>


					</tbody>

				</table>

			</div>

		</div>

	</div>


</body>

</html>
