
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Category</title>

<style>
body {
	margin: 0;
	font-family: Arial, sans-serif;
	background: #f5f6fa;
}

.form-box {
	width: 500px;
	margin: 70px auto;
	background: white;
	padding: 30px;
	border-radius: 10px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

h1 {
	text-align: center;
	margin-bottom: 25px;
}

label {
	display: block;
	margin-bottom: 7px;
	font-weight: bold;
}

input, textarea {
	width: 100%;
	padding: 11px;
	margin-bottom: 18px;
	border: 1px solid #ccc;
	border-radius: 6px;
}

textarea {
	height: 100px;
	resize: vertical;
}

.buttons {
	display: flex;
	gap: 10px;
}

button, .cancel {
	padding: 11px 20px;
	border: none;
	border-radius: 6px;
	text-decoration: none;
	cursor: pointer;
}

button {
	background: #3498db;
	color: white;
}

.cancel {
	background: #777;
	color: white;
}
</style>
</head>

<body>

	<div class="form-box">

		<h1>Add Category</h1>

		<form th:action="@{/categories/add}" th:object="${category}"
			method="post">

			<label>Category Name</label> <input type="text" th:field="*{name}"
				placeholder="Enter category name" required> <label>Description</label>

			<textarea th:field="*{description}" placeholder="Enter description"></textarea>

			<label> <input type="checkbox" th:field="*{is_active}">
				Active
			</label>

			<div class="buttons">

				<button type="submit">Save Category</button>

				<a href="/categories" class="cancel"> Cancel </a>

			</div>

		</form>

	</div>

</body>
</html>
